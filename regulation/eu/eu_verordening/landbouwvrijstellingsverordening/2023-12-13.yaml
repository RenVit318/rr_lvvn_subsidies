    **Beperkte steunbedragen voor CLLD-projecten**

    1.    Steun voor ondernemingen die deelnemen aan of profiteren van CLLD-projecten als bedoeld in artikel 60, lid 1, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening. Steun voor gemeenten die deelnemen aan of profiteren van CLLD-projecten als bedoeld in artikel 60, lid 1, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.
    2.   De in lid 1 bedoelde kosten van gemeenten die aan CLLD-projecten deelnemen, komen voor steun op grond van dit artikel in aanmerking als zij betrekking hebben op een van de volgende gebieden:
    a) onderzoek, ontwikkeling en innovatie;
    b) milieu;
    c) werkgelegenheid en opleiding;
    d) cultuur en instandhouding van het culturele erfgoed;
    e) bosbouw;
    f) afzetbevordering van niet in bijlage I bij het Verdrag genoemde levensmiddelen;
    g) sport.
    3.   Het totale steunbedrag per CLLD-project krachtens dit artikel bedraagt hoogstens 200 000 EUR.
