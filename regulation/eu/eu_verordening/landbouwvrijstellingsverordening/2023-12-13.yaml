  text: |-
    Steun voor de kosten van preventie, bestrijding en uitroeiing van dierziekten of plantenplagen en steun voor het herstel van schade als gevolg van dierziekten of plantenplagen

    1.    Steun voor de kosten van preventie, bestrijding en uitroeiing van dierziekten of plantenplagen en steun voor het herstel van schade als gevolg van die dierziekten of plantenplagen zijn verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De steun kan slechts worden verleend als wordt voldaan aan de volgende voorwaarden:

    a) de steun wordt uitsluitend betaald met betrekking tot dierziekten of plantenplagen waarvoor wettelijk, bestuursrechtelijk of administratief vastgestelde uniale of nationale voorschriften gelden;

    b) de steun is onderdeel van het volgende programma of van een van de volgende maatregelen:

    i) een uniaal, nationaal of regionaal openbaar programma ter preventie, bestrijding of uitroeiing van de betrokken dierziekte of plantenplaag,

    ii) door de bevoegde          autoriteit van     de   lidstaat opgelegde noodmaatregelen,

    iii) overeenkomstig artikel 18, artikel 28, leden 1 en 2, artikel 29, leden 1 en 2, artikel 30, lid 1, en artikel 33, lid 1, van Verordening (EU) 2016/2031 uitgevoerde maatregelen om een plantenplaag uit te roeien of in te dammen,

    iv) maatregelen ter voorkoming, bestrijding en uitroeiing van dierziekten overeenkomstig Verordening (EU) 2016/429.

    Het programma en de maatregelen als bedoeld in punt b) moeten een beschrijving bevatten van de betrokken preventie-, bestrijdings- of uitroeiingsmaatregelen.

    3.    Wat dierziekten betreft, wordt de steun verleend voor dierziekten die zijn opgenomen in de lijst van dierziekten als bedoeld in artikel 5, lid 1, van Verordening (EU) 2016/429, in de lijst van zoönosen van bijlage III bij Verordening (EU) 2021/690 van het Europees Parlement en de Raad (26) of in de lijst van dierziekten, besmettingen en plagen van de Gezondheidscode voor landdieren van de Wereldorganisatie voor diergezondheid.

    4.   De steun kan ook worden toegekend voor nieuwe ziekten die voldoen aan de criteria van artikel 6, lid 2, van Verordening (EU) 2016/429.

    (26) Verordening (EU) 2021/690 van het Europees Parlement en de Raad van 28 april 2021 tot vaststelling van een programma voor de interne markt, het concurrentievermogen van ondernemingen, met inbegrip van kleine en middelgrote ondernemingen, het gebied van planten, dieren, levensmiddelen en diervoeders, en Europese statistieken (programma voor de interne markt), en tot intrekking van de Verordeningen (EU) nr. 99/2013, (EU) nr. 1287/2013, (EU) nr. 254/2014, en (EU) nr. 652/2014 (PB L 153 van 3.5.2021, blz. 1).

    ▼B
    5.   De steun mag geen betrekking hebben op maatregelen waarvoor in de wetgeving van de Unie is bepaald dat de kosten daarvan door de begunstigde moeten worden gedragen, tenzij deze maatregelen volledig worden bekostigd uit de opbrengsten van aan de begunstigden opgelegde verplichte heffingen.

    6.   De steun wordt rechtstreeks betaald aan de betrokken onderneming of aan een producentengroepering of -organisatie waarvan de onderneming lid is.

    Wanneer de steun aan een producentengroepering of -organisatie wordt betaald, mag het steunbedrag niet hoger zijn dan het steunbedrag waarvoor die onderneming in aanmerking komt.

    7.    Steunregelingen in verband met dierziekten of plantenplagen worden ingesteld binnen drie jaar na de datum waarop de door de dierziekte of plantenplaag veroorzaakte kosten of schade zijn ontstaan, en de steun wordt binnen vier jaar na die datum betaald.

    8.    Bij maatregelen met betrekking tot een dierziekte, een plantenplaag of een invasieve uitheemse soort in de zin van een voor de Unie zorgwekkende invasieve uitheemse soort als gedefinieerd in artikel 3, punt 3, van Verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad (27) of een voor een lidstaat zorgwekkende invasieve uitheemse soort als gedefinieerd in artikel 3, punt 4, van Verordening (EU) nr. 1143/2014, die zich nog niet heeft voorgedaan of nog niet geïntroduceerd is (“preventiemaatregelen”), dekt de steun de volgende in aanmerking komende kosten:

    a) gezondheidscontroles;

    b) analyses, waaronder in-vitrodiagnostiek;

    c) tests en andere screeningmaatregelen, waaronder TSE- en BSE-tests;

    d) de aankoop, opslag, verdeling en toediening van vaccins, geneesmiddelen, stoffen voor de behandeling van dieren, gewasbeschermingsmiddelen en biociden;

    e) de slacht of ruiming van dieren of de vernietiging van dierlijke producten en planten en de reiniging, ontsmetting of desinfestatie van het bedrijf en de uitrusting;

    f) de invoering of verbetering van biobeveiligingsmaatregelen.

    9.  Bij bestrijdings- en uitroeiingsmaatregelen dekt de steun de in aanmerking komende kosten van:

    a) in het geval van dierziekten, tests en andere screeningmaatregelen, waaronder TSE- en BSE-tests;

    b) de aankoop, opslag, verdeling en toediening van vaccins, geneesmiddelen, stoffen voor de behandeling van dieren, gewasbeschermingsmiddelen en biociden;

    c) de slacht of ruiming en vernietiging van dieren en de vernietiging van met die dieren verband houdende producten of de vernietiging van planten, met inbegrip van die welke sterven of worden vernietigd als gevolg van vaccinaties of andere maatregelen die door de bevoegde overheidsinstanties zijn opgelegd;

    d) de reiniging, ontsmetting of desinfestatie van het bedrijf en de uitrusting, op basis van de epidemiologie en de kenmerken van de ziekteverwekker of de vector.

    (27) Verordening (EU) nr. 1143/2014 van het Europees Parlement en de Raad van 22 oktober 2014 betreffende de preventie en beheersing van de introductie en verspreiding van invasieve uitheemse soorten (PB L 317 van 4.11.2014, blz. 35).

    ▼B
    10.    Bij steun voor het herstel van schade als gevolg van dierziekten of plantenplagen wordt de vergoeding uitsluitend berekend op basis van:

    a) de marktwaarde van de dieren die zijn geslacht of geruimd of zijn gestorven of van de met die dieren verband houdende producten of van de planten die zijn vernietigd:

    i) als gevolg van de dierziekte of plantenplaag,

    ii) als onderdeel van een openbaar programma of een maatregel als bedoeld in lid 2, punt b);

    b) het inkomensverlies als gevolg van quarantaineverplichtingen, moeilijkheden bij het herbevolken of heraanplanten en de verplichte vruchtwisseling die zijn opgelegd als onderdeel van een openbaar programma of een maatregel als bedoeld in lid 2, punt b);

    c) de kosten van de vervanging van uitrusting die op bevel van de bevoegde autoriteiten van de lidstaat is vernietigd.

    Voor de toepassing van de eerste alinea, punt a), wordt de marktwaarde vastgesteld op basis van de waarde die de dieren, producten en planten hadden net voordat het vermoeden van de dierziekte of plantenplaag ontstond of werd bevestigd.

    11.   Op de overeenkomstig lid 10 berekende vergoeding wordt het volgende in mindering gebracht:

    a) kosten die als gevolg van de dierziekte of de plantenplaag niet zijn gemaakt en anders wel door de begunstigde zouden zijn gemaakt;

    b) inkomsten uit de verkoop van producten die verband houden met dieren of planten die met het oog op preventie of uitroeiing op bevel van de bevoegde autoriteiten zijn geslacht of geruimd, respectievelijk vernietigd.

    12.    De steun voor het herstel van schade als gevolg van dierziekten of plantenplagen blijft beperkt tot de kosten en de schade als gevolg van dierziekten en plantenplagen ten aanzien waarvan de bevoegde autoriteit van de lidstaat:

    a) in het geval van een dierziekte, formeel heeft erkend dat zich een uitbraak heeft voorgedaan;

    b) in het geval van een plantenplaag, formeel de aanwezigheid ervan heeft bevestigd.

    13.   Steun in verband met de in de leden 8 en 9 bedoelde in aanmerking komende kosten wordt verleend in natura en wordt betaald aan de aanbieder van de preventie-, bestrijdings- en uitroeiingsmaatregelen.

    In afwijking van de eerste alinea mag steun in verband met de in de volgende bepalingen bedoelde in aanmerking komende kosten rechtstreeks aan de begunstigde worden toegekend als vergoeding van de kosten die de begunstigde werkelijk heeft gemaakt:

    ▼B
    a) lid 8, punten d) en e), en lid 9, punt b), in geval van dierziekten of plantenplagen;

    b) lid 8, punt e), en lid 9, punt c), in geval van plantenplagen en voor het reinigen en ontsmetten van het bedrijf en de uitrusting.

    14.    Er mag geen individuele steun worden toegekend als wordt geconstateerd dat de dierziekte of de besmetting met de plantenplaag met opzet of door nalatigheid van de begunstigde werd veroorzaakt.

    15.    De steun en eventuele andere door de begunstigde ontvangen betalingen, waaronder betalingen op grond van andere nationale of uniale maatregelen of in het kader van een verzekeringspolis of onderlinge fondsen voor dezelfde in aanmerking komende kosten als bedoeld in de leden 8, 9 en 10, mogen niet meer bedragen dan 100 % van de in aanmerking komende kosten.
