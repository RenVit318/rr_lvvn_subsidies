  text: |-
    **Steun voor boslandbouwsystemen**

    1.    Steun voor boslandbouwsystemen is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De steun voor boslandbouwsystemen dekt de invoerings-, regeneratie- of renovatiekosten en een jaarlijkse premie per hectare.

    3.    Steun voor boslandbouwsystemen kan betrekking hebben op investeringsverrichtingen.

    4.    De steun voor boslandbouwsystemen in het kader van investeringsverrichtingen dekt, behalve wanneer deze in de vorm van financieringsinstrumenten wordt verstrekt, de volgende in aanmerking komende kosten:

    a) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de totale in aanmerking komende kosten van de betrokken verrichting, met uitzondering van de aankoop van grond indien de steun wordt verleend in het kader van een strategisch GLB-plan;

    b) de kosten van de koop of huurkoop van machines en uitrusting, tot maximaal de marktwaarde van de activa;

    c) algemene kosten in verband met de in de punten a) en b) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs en voor advies over ecologische en economische duurzaamheid, met inbegrip van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer geen uitgaven uit hoofde van de punten a) en b) worden gedaan;

    d) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken;

    ▼B
    e) de kosten van de opstelling van bosbeheerplannen of gelijkwaardige instrumenten.

    Behalve wanneer de steun in het kader van een strategisch GLB-plan in de vorm van financieringsinstrumenten wordt verleend, wordt werkkapitaal niet beschouwd als in aanmerking komende kosten.

    5.    Steun voor investeringsverrichtingen waarvoor krachtens Richtlijn 2011/92/EU een milieueffectbeoordeling moet worden uitgevoerd, mag slechts worden toegekend op voorwaarde dat die beoordeling is uitgevoerd en de vergunning voor het betrokken investeringsproject is verleend vóór de datum van de toekenning van de individuele steun.

    De eerste alinea is niet van toepassing op steun die wordt verstrekt in de vorm van financieringsinstrumenten.

    6.   De volgende kosten van invoering, regeneratie of renovatie van het boslandbouwsysteem komen in aanmerking:

    a) de kosten van het aanplanten van bomen, waaronder de kosten van het plantmateriaal, de aanplanting, de opslag en de behandeling van zaailingen met de nodige preventie- en beschermingsmaterialen;

    b) de kosten van de omzetting van bestaande bossen of andere beboste gronden, waaronder de kosten van het kappen van bomen, uitdunnen en snoeien en de bescherming tegen graasdieren;

    c) andere kosten die rechtstreeks met de invoering, regeneratie of renovatie van een boslandbouwsysteem verband houden, zoals de kosten van haalbaarheidsstudies, aanlegplannen, bodemonderzoek en -voorbereiding en bescherming van de grond;

    d) de kosten van bosbegrazing, watertoevoer en beschermende voorzieningen;

    e) de kosten van de voor de invoering, regeneratie of renovatie van een boslandbouwsysteem noodzakelijke behandelingen, waaronder watertoevoer en snoeien;

    f) de kosten van herbeplanting in het eerste jaar na de invoering, regeneratie of renovatie van een boslandbouwsysteem.

    7.   De jaarlijkse premie per hectare dekt de kosten van het onderhoud van het boslandbouwsysteem en wordt gedurende maximaal twaalf jaar na de datum van de toekenning van de steun verleend.

    De in aanmerking komende kosten van het onderhoud kunnen betrekking hebben op de aangelegde boomgordels, op het wieden, snoeien en uitdunnen en op beschermende maatregelen en investeringen zoals het plaatsen van omheiningen of het aanbrengen van individuele beschermingskokers.

    8.   De lidstaten bepalen de structuur en de samenstelling van het boslandbouwsysteem, met inachtneming van:

    a) de     plaatselijke   bodem-         en     klimaatgesteldheid      en milieuomstandigheden;

    b) de bosbouwgewassoorten;

    c) de noodzaak te garanderen dat de grond op duurzame wijze voor landbouwdoeleinden wordt gebruikt.

    ▼B
    9.   De steunintensiteit bedraagt ten hoogste 100 % van de in aanmerking komende kosten.
