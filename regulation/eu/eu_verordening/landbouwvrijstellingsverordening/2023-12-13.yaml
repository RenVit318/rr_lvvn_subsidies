    **Steun voor de veeteeltsector en steun voor gestorven dieren**

    1.    De volgende steun voor veehouders is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun dient voor de financiering van:

    a) de administratieve kosten van het opstellen en bijhouden van stamboeken;

    b) de kosten van door of in opdracht van derden uitgevoerde tests om de genetische kwaliteit of het genetische rendement van dieren te bepalen, behalve de kosten van controles die door de eigenaar van de dieren worden verricht en van routinematige controles van de melkkwaliteit;

    c) de kosten van het afvoeren van gestorven dieren;

    d) de kosten van het vernietigen van gestorven dieren;

    e) de kosten van het afvoeren en vernietigen van gestorven dieren wanneer de steun wordt gefinancierd uit heffingen of verplichte bijdragen voor de financiering van het vernietigen van dergelijke gestorven dieren, mits die heffingen of bijdragen beperkt zijn tot de vleessector en rechtstreeks aan de vleessector worden opgelegd;

    f) de kosten van het afvoeren en vernietigen van gestorven dieren wanneer op de gestorven dieren TSE-tests moeten worden uitgevoerd of in het geval van een uitbraak van een in artikel 26, lid 3, bedoelde dierziekte.

    3.    De in lid 2, punten c), d), e) en f), bedoelde steun wordt enkel toegekend wanneer er een consistent monitoringprogramma is dat garandeert dat alle gestorven dieren in de lidstaat op veilige wijze worden verwijderd.

    Steun voor de kosten van door landbouwers betaalde verzekeringspremies ter dekking van de kosten van het afvoeren en vernietigen van gestorven dieren, als bedoeld in lid 2, punt e), van dit artikel moet aan de voorwaarden van artikel 28, lid 2, voldoen.

    ▼B
    4.    De steun wordt in natura verleend en niet in de vorm van rechtstreekse betalingen aan de begunstigden.

    Om het beheer van de in lid 2, punten c), d), e) en f), bedoelde steun te vergemakkelijken, mag deze steun worden uitgekeerd aan marktdeelnemers of organisaties die aan de volgende voorwaarden voldoen:

    a) zij zijn actief in het stadium volgend op dat van de ondernemingen die in de veelteeltsector actief zijn;

    b) zij verlenen diensten in verband met het afvoeren en vernietigen van gestorven dieren.

    5.   De steunintensiteit bedraagt ten hoogste:

    a) 70 % van de kosten van tests als bedoeld in lid 2, punt b);

    ▼M1
    b) 75 % van de kosten in verband met vernietiging zoals bedoeld in lid 2, punt d);

    c) 100 % van de in lid 2, punt a), bedoelde administratieve kosten en van de kosten in verband met het afvoeren en vernietigen zoals bedoeld in lid 2, punten c), e) en f).

    ▼B
