  text: |-
    **Transparantie van de steun**

    1.    Deze verordening is uitsluitend van toepassing op transparante steun.

    2.   Steun     wordt    geacht    transparant   te zijn   als  het brutosubsidie-equivalent vooraf precies kan worden berekend zonder dat een risicoanalyse hoeft te worden uitgevoerd.

    ▼B
    3.   Voor de toepassing van deze verordening wordt steun die in een van de volgende vormen wordt verleend, geacht transparant te zijn:

    a) steun in de vorm van subsidies, rentesubsidies en gesubsidieerde diensten;

    b) steun in de vorm van leningen indien voor het berekenen van het brutosubsidie-equivalent het op het tijdstip van de steunverlening geldende referentiepercentage is gebruikt;

    c) steun in de vorm van garanties in een van de volgende situaties:

    i) het brutosubsidie-equivalent is berekend op basis van de safe-harbour-premies die in een mededeling van de Commissie zijn vastgesteld,

    ii) de methode voor het berekenen van het brutosubsidie-equivalent van de garantie is voorafgaand aan de uitvoering van de steunmaatregel aanvaard op grond van de mededeling over garanties, na aanmelding van die methode bij de Commissie op grond van een door de Commissie vastgestelde verordening inzake staatssteun die op dat moment van toepassing is, en de goedgekeurde methode is uitdrukkelijk toegespitst op het soort garanties en het soort onderliggende transacties die in het kader van de toepassing van deze verordening in het geding zijn;

    d) steun in de vorm van belastingvoordelen wanneer de maatregel voorziet in een maximum dat garandeert dat de toepasselijke drempel niet wordt overschreden;

    e) steun in de vorm van terugbetaalbare voorschotten als het totale nominale bedrag van het terugbetaalbare voorschot niet groter is dan de krachtens deze verordening toepasselijke drempels of als, vóór de uitvoering van de maatregel, de methode voor het berekenen van het brutosubsidie-equivalent van het terugbetaalbare voorschot na aanmelding bij de Commissie is aanvaard;

    f) steun in de vorm van de verkoop of de verhuring/leasing van materiële activa onder het markttarief wanneer de waarde is vastgesteld door een taxatie van een onafhankelijke deskundige vóór de transactie of aan de hand van een publiek beschikbare, regelmatig bijgewerkte en algemeen aanvaarde benchmark.

    4.   Voor de toepassing van deze verordening wordt steun die in een van de volgende vormen wordt verleend, niet als transparant beschouwd:

    a) steun in de vorm van kapitaalinjecties;

    b) steun in de vorm van risicofinancieringsmaatregelen.
