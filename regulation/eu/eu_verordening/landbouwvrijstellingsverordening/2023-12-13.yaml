- number: '6'
  text: |-
    **Stimulerend effect**

    1.   Deze verordening is uitsluitend van toepassing op steun die een stimulerend effect heeft.

    2.    Steun wordt geacht een stimulerend effect te hebben als de begunstigde ervan, voordat de werkzaamheden in het kader van het project of de activiteit zijn gestart, bij de betrokken lidstaat een schriftelijke steunaanvraag heeft ingediend. De steunaanvraag moet ten minste de volgende gegevens bevatten:

    a) de naam en de omvang van de onderneming;

    ▼B
    b) een beschrijving van het project of de activiteit, met inbegrip van de start- en einddatum;

    c) de plaats van het project of de activiteit;

    d) een lijst van de in aanmerking komende kosten;

    e) soort overheidsfinanciering (subsidie, lening, garantie, terugbetaalbaar voorschot of een andere vorm) en bedrag daarvan die nodig zijn voor het project of de activiteit.

    3.   Ad-hocsteun voor grote ondernemingen wordt geacht een stimulerend effect te hebben als de lidstaat er niet alleen op heeft toegezien dat aan de in lid 2 vastgestelde voorwaarde is voldaan, maar zich er ook, voordat hij de betrokken ad-hocsteun heeft toegekend, van heeft vergewist dat uit door de begunstigde opgestelde documentatie blijkt dat de steun zal leiden tot een of meer van het onderstaande:

    a) een wezenlijke toename van de reikwijdte van het project of de activiteit als gevolg van de steun;

    b) een wezenlijke toename, als gevolg van de steun, van het totale bedrag dat de begunstigde aan het project of de activiteit besteedt;

    c) een wezenlijke toename van de snelheid waarmee het betrokken project of de betrokken activiteit wordt voltooid;

    d) in het geval van ad-hocinvesteringssteun, dat, zonder de steun, het project of de activiteit niet als dusdanig in het betrokken plattelandsgebied zou zijn uitgevoerd of voor de begunstigde in het betrokken plattelandsgebied onvoldoende winstgevend zou zijn geweest.

    Deze vereisten gelden niet voor gemeenten die autonome lokale autoriteiten zijn met een jaarlijkse begroting van minder dan 10 miljoen EUR en met minder dan 5 000 inwoners.

    4.   In afwijking van de leden 2 en 3 worden maatregelen in de vorm van belastingvoordelen geacht een stimulerend effect te hebben als de volgende twee voorwaarden zijn vervuld:

    a) de maatregel geeft overeenkomstig objectieve criteria recht op steun zonder dat de lidstaat nog een beoordelingsbevoegdheid uitoefent;

    b) de maatregel is goedgekeurd en is in werking getreden voordat de werkzaamheden in het kader van het gesteunde project of de gesteunde activiteit zijn gestart, behalve in het geval van fiscale vervolgregelingen, wanneer de activiteit al onder de vroegere regelingen in de vorm van belastingvoordelen viel.

    5.    Voorts hoeven, in afwijking van de leden 2, 3 en 4, de volgende categorieën steun geen stimulerend effect te hebben of wordt ervan uitgegaan dat zij een stimulerend effect hebben:

    a) steunregelingen voor ruilverkaveling voor zover aan de voorwaarden van artikel 15 of artikel 53 is voldaan en:

    ▼B
    i) de steunregeling overeenkomstig objectieve criteria recht geeft op steun zonder dat de lidstaat nog een beoordelingsbevoegdheid uitoefent, en

    ii) de steunregeling goedgekeurd is en in werking is getreden voordat de begunstigde de in aanmerking komende kosten op grond van artikel 15 of artikel 53 heeft gemaakt;

    b) steun voor voorlichtingsacties in de landbouwsector overeenkomstig de artikelen 21 en 22 waarbij informatie ter beschikking wordt gesteld aan een onbepaald aantal begunstigden;

    c) steun voor afzetbevorderingsmaatregelen in de vorm van publicaties om landbouwproducten beter bekend te maken bij het brede publiek, mits aan artikel 24, lid 2, punt b), is voldaan;

    d) steun voor het herstel van schade als gevolg van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, mits aan artikel 25 is voldaan;

    e) steun voor de kosten van preventie, bestrijding en uitroeiing van dierziekten of plantenplagen en voor het herstel van schade als gevolg van die dierziekten of plantenplagen, mits aan artikel 26 is voldaan;

    ▼M1
    f) steun voor de kosten van het afvoeren en vernietigen van gestorven dieren, mits aan de voorwaarden van artikel 27, lid 2, punten c), d),
    e) en f), en artikel 28, lid 3, punt d), is voldaan;

    ▼B
    g) steun voor het herstel van door beschermde dieren veroorzaakte schade, mits aan artikel 29 is voldaan;

    h) steun voor het opvangen van nadelen in verband met Natura 2000- gebieden, als bedoeld in artikel 33;

    i) steun voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed op landbouwbedrijven of in bossen, mits aan artikel 36 is voldaan;

    j) steun voor het herstel van schade als gevolg van natuurrampen in de landbouwsector, mits aan artikel 37 is voldaan;

    k) steun voor onderzoek, ontwikkeling en innovatie in de landbouw- en de bosbouwsector, mits aan artikel 38 is voldaan;

    l) steun voor het herstel van schade aan bossen overeenkomstig artikel 43, lid 2, punt d), mits aan artikel 43 is voldaan;

    m) steun voor voorlichtingsacties in de bosbouwsector overeenkomstig de artikelen 47 en 48 waarbij informatie ter beschikking wordt gesteld aan een onbepaald aantal begunstigden;

    n) steun voor de instandhouding van genetische hulpbronnen in de bosbouw, mits aan artikel 51 is voldaan;

    ▼B
    o) steun voor landbouwers die aan een kwaliteitsregeling voor katoen of levensmiddelen deelnemen, mits aan artikel 58 is voldaan;

    p) steun voor ondernemingen die deelnemen aan of profiteren van CLLD-projecten of projecten van operationele groepen in het kader van het EIP, mits aan de toepasselijke voorwaarden van de artikelen 39, 40, 60 en 61 is voldaan.
