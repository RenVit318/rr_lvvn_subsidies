    **Vervanging      en    verdere    toepassing van        Verordening       (EU) nr. 702/2014**

    1.   In artikel 52 van Verordening (EU) nr. 702/2014 is bepaald dat die verordening van toepassing is tot en met 31 december 2022. Verordening (EU) nr. 702/2014 wordt na het verstrijken ervan vervangen door de onderhavige verordening.
    2.    De voorschriften van Verordening (EU) nr. 702/2014 blijven evenwel tot en met 31 december 2025 van toepassing op steun die wordt verleend op grond van Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad (33).

    (33) Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van 17 december 2013 inzake steun voor plattelandsontwikkeling uit het Europees Landbouwfonds voor plattelandsontwikkeling (Elfpo) en tot intrekking van Verordening (EG) nr. 1698/2005 van de Raad (PB L 347 van 20.12.2013, blz. 487).

