# HOOFDSTUK I — Gemeenschappelijke bepalingen
- number: '1'
  text: |-
    **Toepassingsgebied**

    1.    Deze verordening is van toepassing op de volgende categorieën steun:
    a) steun voor kleine, middelgrote en micro-ondernemingen (kmo’s):
    i) die actief zijn in de landbouwsector, met name de primaire landbouwproductie, de verwerking van landbouwproducten en de afzet van landbouwproducten, met uitzondering van de artikelen 14, 15, 16, 18, 23 en 25 tot en met 31, die alleen van toepassing zijn op kmo’s die in de primaire landbouwproductie actief zijn;
    ii) die in plattelandsgebieden niet-agrarische activiteiten verrichten die buiten het toepassingsgebied van artikel 42 van het Verdrag vallen, voor zover die steun overeenkomstig Verordening (EU) 2021/2115 wordt toegekend en hetzij uit het Europees Landbouwfonds voor plattelandsontwikkeling (“Elfpo”) wordt gecofinancierd, hetzij in de vorm van aanvullende nationale financiering bij dergelijke gecofinancierde maatregelen wordt toegekend. In afwijking hiervan is deze verordening van toepassing op steun voor gemeenten die direct of indirect van CLLD-projecten profiteren op grond van de artikelen 60 en 61 van deze verordening;

    ▼B
    b) steun voor milieubescherming in de landbouw als bedoeld in de artikelen 33, 34 en 35, die alleen van toepassing is op ondernemingen die actief zijn in de primaire productie;

    c) steun voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed op landbouwbedrijven en in bossen;

    d) steun voor het herstel van schade als gevolg van natuurrampen in de landbouwsector;

    e) steun voor onderzoek, ontwikkeling en innovatie in de landbouw- en de bosbouwsector;

    f) steun voor de bosbouw.

    2.   Indien de lidstaten dat passend vinden, kunnen zij ervoor kiezen om steun als bedoeld in lid 1, punten a), e), en f), te verlenen overeenkomstig Verordening (EU) nr. 651/2014 van de Commissie (1).

    3.    Deze verordening is niet van toepassing op:

    a) steunregelingen als bedoeld in de artikelen 14 en 17, de artikelen 41 tot en met 44 en artikel 46 en steunregelingen als bedoeld in de artikelen 49 en 50 indien deze voldoen aan artikel 12, vanaf zes maanden na de inwerkingtreding van die regelingen. De Commissie kan evenwel, na beoordeling van het betrokken evaluatieplan dat de lidstaat bij haar heeft aangemeld, besluiten dat deze verordening langer dan zes maanden op een steunregeling van toepassing blijft. Bij de indiening van de evaluatieplannen verstrekken de lidstaten ook alle informatie die de Commissie nodig heeft om de evaluatieplannen te beoordelen en een besluit te nemen;

    b) aanpassingen van de in punt a) bedoelde regelingen, andere dan wijzigingen die geen invloed hebben op de verenigbaarheid van de steunregeling krachtens deze verordening of die de inhoud van het goedgekeurde evaluatieplan niet ingrijpend veranderen;

    c) steun voor activiteiten die verband houden met de uitvoer naar derde landen of lidstaten, namelijk rechtstreeks aan uitgevoerde hoeveelheden gekoppelde steun, steun voor de oprichting en exploitatie van een distributienet of steun voor andere lopende kosten in verband met exportactiviteiten;

    d) steun die afhangt van het gebruik van binnenlandse goederen in plaats van ingevoerde goederen.

    4.    Deze verordening is niet van toepassing op:

    a) steunregelingen die niet uitdrukkelijk voorzien in uitsluiting van betaling van individuele steun aan ondernemingen ten aanzien waarvan er een bevel tot terugvordering uitstaat als gevolg van een eerder besluit van de Commissie waarbij door dezelfde lidstaat toegekende steun onrechtmatig en onverenigbaar met de interne markt is verklaard, met uitzondering van:

    i) steunregelingen voor het herstel van door natuurrampen veroorzaakte schade overeenkomstig artikel 37;

    ▼B
    ii) steunregelingen voor projecten voor vanuit de gemeenschap geleide lokale ontwikkeling (“CLLD”) of projecten van operationele groepen in het kader van het Europees Innovatiepartnerschap voor productiviteit en duurzaamheid in de landbouw (“EIP”) overeenkomstig de artikelen 40 en 61;

    b) ad-hocsteun aan een in punt a) bedoelde onderneming.

    5.   Deze verordening is niet van toepassing op steun voor ondernemingen in moeilijkheden, met uitzondering van steun die wordt verleend:

    a) voor voorlichtingsacties in de landbouw- en de bosbouwsector overeenkomstig de artikelen 21 en 47;

    b) voor afzetbevorderingsmaatregelen in de vorm van publicaties om landbouwproducten beter bekend te maken bij het brede publiek overeenkomstig artikel 24, lid 2, punt b);

    c) om de kosten van preventie, bestrijding en uitroeiing van dierziekten en plantenplagen te vergoeden overeenkomstig artikel 26, leden 8 en 9;

    ▼M1
    d) om de kosten van het afvoeren en vernietigen van gestorven dieren te dekken overeenkomstig artikel 27, lid 2, punten c), d) en e), en artikel 28, lid 3, punt d);

    ▼B
    e) voor het opvangen van nadelen die verband houden met Natura 2000-gebieden overeenkomstig artikel 33;

    f) voor het herstel van door natuurrampen veroorzaakte schade overeenkomstig artikel 37;

    g) voor ondernemingen die deelnemen aan of profiteren van CLLD-projecten of projecten van operationele groepen in het kader van het EIP overeenkomstig de artikelen 40 en 61;

    h) in de volgende gevallen voor zover de onderneming een onderneming in moeilijkheden is geworden door verliezen of schade als gevolg van de gebeurtenis in kwestie:

    i) voor het herstel van schade als gevolg van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld overeenkomstig artikel 25;

    ii) voor het herstel van schade als gevolg van dierziekten en plantenplagen overeenkomstig artikel 26, leden 9 en 10;

    iii) voor het herstel van door beschermde dieren veroorzaakte schade overeenkomstig artikel 29;

    iv) voor het herstel van schade aan bossen overeenkomstig artikel 43, lid 2, punt d).

    6.   Deze verordening is niet van toepassing op steun die, op zich, door de daaraan verbonden voorwaarden of de toegepaste financieringswijze tot een daaraan onlosmakelijk verbonden schending van het recht van de Unie leidt, met name:

    a) steun waarbij aan de steunverlening de verplichting voor de begunstigde is verbonden om binnenlands geproduceerde goederen of binnenlandse diensten te gebruiken;

    ▼B
    b) steun die beperkingen stelt aan de mogelijkheden voor de begunstigden om de resultaten van onderzoek, ontwikkeling en innovatie in andere lidstaten te exploiteren.
    7.    Deze verordening is niet van toepassing op steun voor landbouwproducten in de zin van bijlage 1 bij de Landbouwovereenkomst van de WTO (2) die een uitvoersubsidie in de zin van die overeenkomst vormt. Zij is evenmin van toepassing op steun voor dergelijke producten die door een regering of overheidsinstantie verleende uitvoerfinancieringssteun vormt in het kader van het Ministerieel Besluit van de WTO inzake uitvoerconcurrentie van 19 december 2015 (3), indien die steun niet voldoet aan de toepasselijke vereisten van punt 15 van dat besluit betreffende de maximale krediettermijn en zelffinanciering.

    (1) Verordening (EU) nr. 651/2014 van de Commissie van 17 juni 2014 waarbij bepaalde categorieën steun op grond van de artikelen 107 en 108 van het Verdrag met de interne markt verenigbaar worden verklaard (PB L 187 van 26.6.2014, blz. 1).
    (2) PB L 336 van 23.12.1994, blz. 22.
    (3) WT/MIN(15)/45 — WT/L/980.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_1
  machine_readable:
    endpoint: valt_binnen_toepassingsgebied
    untranslatables:
      - construct: artikel-afhankelijke kmo-beperking binnen punt a) i)
        reason: >-
          De uitzondering geldt per inroepend artikel (14, 15, 16, 18, 23, 25-31
          alleen voor kmo's in de primaire landbouwproductie); het
          toepassingsgebied-eindpunt kent het inroepende artikel niet. De
          beperking wordt gehandhaafd door de voorwaarden van die artikelen zelf.
        legal_text_excerpt: >-
          met uitzondering van de artikelen 14, 15, 16, 18, 23 en 25 tot en met
          31, die alleen van toepassing zijn op kmo's die in de primaire
          landbouwproductie actief zijn
        accepted: false
      - construct: verlengingsbesluit van de Commissie bij de zesmaandstermijn (lid 3, punt a)
        reason: >-
          Afhankelijk van een individueel Commissiebesluit na beoordeling van het
          evaluatieplan; niet afleidbaar uit de maatregel zelf. Verdisconteerd in
          de parameter is_evaluatieplichtige_steunregeling_na_zes_maanden.
        legal_text_excerpt: >-
          De Commissie kan evenwel, na beoordeling van het betrokken
          evaluatieplan dat de lidstaat bij haar heeft aangemeld, besluiten dat
          deze verordening langer dan zes maanden op een steunregeling van
          toepassing blijft.
        accepted: false
      - construct: eis van een uitdrukkelijke uitsluitingsclausule in de steunregeling (lid 4, punt a)
        reason: >-
          Lid 4 stelt een eis aan de tekst van de steunregeling (uitdrukkelijk
          voorzien in uitsluiting); gemodelleerd op begunstigdeniveau via de
          parameter heeft_openstaand_terugvorderingsbevel, met de uitzonderingen
          van punt a) i) en ii).
        legal_text_excerpt: >-
          steunregelingen die niet uitdrukkelijk voorzien in uitsluiting van
          betaling van individuele steun aan ondernemingen ten aanzien waarvan er
          een bevel tot terugvordering uitstaat
        accepted: false
      - construct: onlosmakelijk verbonden schending van het recht van de Unie (lid 6)
        reason: >-
          Open norm; vergt juridische beoordeling van de maatregel als geheel.
          Als parameter voorgelegd; de met name genoemde gevallen a) en b) zijn
          wel als afzonderlijke voorwaarden gemodelleerd.
        legal_text_excerpt: >-
          steun die, op zich, door de daaraan verbonden voorwaarden of de
          toegepaste financieringswijze tot een daaraan onlosmakelijk verbonden
          schending van het recht van de Unie leidt
        accepted: false
      - construct: vereisten van punt 15 van het WTO-besluit inzake uitvoerconcurrentie (lid 7)
        reason: >-
          Verwijzing naar vereisten (maximale krediettermijn, zelffinanciering)
          in een extern WTO-besluit; als parameter voorgelegd.
        legal_text_excerpt: >-
          indien die steun niet voldoet aan de toepasselijke vereisten van punt
          15 van dat besluit betreffende de maximale krediettermijn en
          zelffinanciering
        accepted: false
    execution:
      parameters:
        - name: actief_in_primaire_landbouwproductie
          type: boolean
          required: true
          description: Begunstigde is actief in de primaire landbouwproductie (lid 1, punt a, i)
        - name: actief_in_verwerking_landbouwproducten
          type: boolean
          required: true
          description: Begunstigde is actief in de verwerking van landbouwproducten (lid 1, punt a, i)
        - name: actief_in_afzet_landbouwproducten
          type: boolean
          required: true
          description: Begunstigde is actief in de afzet van landbouwproducten (lid 1, punt a, i)
        - name: in_plattelandsgebied
          type: boolean
          required: true
          description: Activiteit/begunstigde bevindt zich in een plattelandsgebied (lid 1, punt a, ii)
        - name: verricht_niet_agrarische_activiteiten
          type: boolean
          required: true
          description: >-
            Begunstigde verricht niet-agrarische activiteiten die buiten het
            toepassingsgebied van artikel 42 van het Verdrag vallen (lid 1, punt a, ii)
        - name: steun_in_kader_strategisch_glb_plan
          type: boolean
          required: true
          description: >-
            Steun wordt overeenkomstig Verordening (EU) 2021/2115 toegekend en
            hetzij uit het Elfpo gecofinancierd, hetzij als aanvullende nationale
            financiering bij zulke gecofinancierde maatregelen (lid 1, punt a,
            ii; begrip art. 2, punt 11)
        - name: is_gemeente_die_profiteert_van_clld_project
          type: boolean
          required: true
          description: >-
            Begunstigde is een gemeente die direct of indirect van CLLD-projecten
            profiteert op grond van de artikelen 60 en 61 (lid 1, punt a, ii,
            afwijking)
        - name: betreft_milieubescherming_in_de_landbouw
          type: boolean
          required: true
          description: Steun voor milieubescherming in de landbouw als bedoeld in de artikelen 33, 34 en 35 (lid 1, punt b)
        - name: betreft_instandhouding_cultureel_en_natuurlijk_erfgoed
          type: boolean
          required: true
          description: >-
            Steun voor investeringen voor de instandhouding van cultureel en
            natuurlijk erfgoed op landbouwbedrijven en in bossen (lid 1, punt c)
        - name: betreft_herstel_schade_natuurrampen_in_de_landbouwsector
          type: boolean
          required: true
          description: >-
            Steun voor het herstel van schade als gevolg van natuurrampen in de
            landbouwsector (lid 1, punt d; tevens uitzondering in lid 4, punt a,
            i, en lid 5, punt f, overeenkomstig artikel 37)
        - name: betreft_onderzoek_ontwikkeling_en_innovatie
          type: boolean
          required: true
          description: >-
            Steun voor onderzoek, ontwikkeling en innovatie in de landbouw- en de
            bosbouwsector (lid 1, punt e)
        - name: betreft_steun_voor_de_bosbouw
          type: boolean
          required: true
          description: Steun voor de bosbouw (lid 1, punt f)
        - name: is_evaluatieplichtige_steunregeling_na_zes_maanden
          type: boolean
          required: true
          description: >-
            Steunregeling als bedoeld in de artikelen 14 en 17, 41 tot en met 44
            en 46, of in de artikelen 49 en 50 indien die aan artikel 12 voldoen,
            vanaf zes maanden na de inwerkingtreding van die regeling, zonder
            Commissiebesluit tot langere toepassing (lid 3, punt a)
        - name: is_ingrijpende_aanpassing_van_evaluatieplichtige_steunregeling
          type: boolean
          required: true
          description: >-
            Aanpassing van een in lid 3, punt a, bedoelde regeling, anders dan
            een wijziging die geen invloed heeft op de verenigbaarheid of de
            inhoud van het goedgekeurde evaluatieplan niet ingrijpend verandert
            (lid 3, punt b)
        - name: betreft_steun_voor_exportactiviteiten
          type: boolean
          required: true
          description: >-
            Steun voor activiteiten die verband houden met de uitvoer naar derde
            landen of lidstaten: rechtstreeks aan uitgevoerde hoeveelheden
            gekoppelde steun, steun voor oprichting en exploitatie van een
            distributienet of steun voor andere lopende kosten in verband met
            exportactiviteiten (lid 3, punt c)
        - name: steun_afhankelijk_van_gebruik_binnenlandse_goederen
          type: boolean
          required: true
          description: >-
            Steun die afhangt van het gebruik van binnenlandse goederen in plaats
            van ingevoerde goederen (lid 3, punt d)
        - name: heeft_openstaand_terugvorderingsbevel
          type: boolean
          required: true
          description: >-
            Ten aanzien van de onderneming staat een bevel tot terugvordering uit
            als gevolg van een eerder Commissiebesluit waarbij door dezelfde
            lidstaat toegekende steun onrechtmatig en onverenigbaar met de
            interne markt is verklaard (lid 4)
        - name: betreft_clld_of_eip_project
          type: boolean
          required: true
          description: >-
            Steun voor CLLD-projecten of projecten van operationele groepen in
            het kader van het EIP overeenkomstig de artikelen 40 en 61 (lid 4,
            punt a, ii, en lid 5, punt g)
        - name: is_onderneming_in_moeilijkheden
          type: boolean
          required: true
          description: >-
            Begunstigde is een onderneming in moeilijkheden; afleidbaar uit art. 2
            punt 59 (criteria van artikel 2, punt 18, van Verordening (EU) nr.
            651/2014); verdieping gepland (lid 5)
        - name: betreft_voorlichting_in_landbouw_of_bosbouwsector
          type: boolean
          required: true
          description: >-
            Steun voor voorlichtingsacties in de landbouw- en de bosbouwsector
            overeenkomstig de artikelen 21 en 47 (lid 5, punt a)
        - name: betreft_afzetbevordering_via_publicaties
          type: boolean
          required: true
          description: >-
            Steun voor afzetbevorderingsmaatregelen in de vorm van publicaties om
            landbouwproducten beter bekend te maken bij het brede publiek
            overeenkomstig artikel 24, lid 2, punt b (lid 5, punt b)
        - name: betreft_vergoeding_kosten_dierziekten_en_plantenplagen
          type: boolean
          required: true
          description: >-
            Steun om de kosten van preventie, bestrijding en uitroeiing van
            dierziekten en plantenplagen te vergoeden overeenkomstig artikel 26,
            leden 8 en 9 (lid 5, punt c)
        - name: betreft_afvoeren_en_vernietigen_gestorven_dieren
          type: boolean
          required: true
          description: >-
            Steun om de kosten van het afvoeren en vernietigen van gestorven
            dieren te dekken overeenkomstig artikel 27, lid 2, punten c, d en e,
            en artikel 28, lid 3, punt d (lid 5, punt d)
        - name: betreft_opvangen_nadelen_natura_2000
          type: boolean
          required: true
          description: >-
            Steun voor het opvangen van nadelen die verband houden met Natura
            2000-gebieden overeenkomstig artikel 33 (lid 5, punt e)
        - name: in_moeilijkheden_geworden_door_de_gebeurtenis
          type: boolean
          required: true
          description: >-
            De onderneming is een onderneming in moeilijkheden geworden door
            verliezen of schade als gevolg van de gebeurtenis in kwestie (lid 5,
            punt h, aanhef)
        - name: betreft_herstel_schade_gelijkgestelde_weersomstandigheden
          type: boolean
          required: true
          description: >-
            Steun voor het herstel van schade als gevolg van ongunstige
            weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld
            overeenkomstig artikel 25 (lid 5, punt h, i)
        - name: betreft_herstel_schade_dierziekten_of_plantenplagen
          type: boolean
          required: true
          description: >-
            Steun voor het herstel van schade als gevolg van dierziekten en
            plantenplagen overeenkomstig artikel 26, leden 9 en 10 (lid 5, punt
            h, ii)
        - name: betreft_herstel_schade_door_beschermde_dieren
          type: boolean
          required: true
          description: >-
            Steun voor het herstel van door beschermde dieren veroorzaakte schade
            overeenkomstig artikel 29 (lid 5, punt h, iii)
        - name: betreft_herstel_schade_aan_bossen
          type: boolean
          required: true
          description: >-
            Steun voor het herstel van schade aan bossen overeenkomstig artikel
            43, lid 2, punt d (lid 5, punt h, iv)
        - name: steun_leidt_tot_schending_van_unierecht
          type: boolean
          required: true
          description: >-
            Steun die, op zich, door de daaraan verbonden voorwaarden of de
            toegepaste financieringswijze tot een daaraan onlosmakelijk verbonden
            schending van het recht van de Unie leidt (lid 6, aanhef; open norm,
            juridische beoordeling vereist)
        - name: verplichting_tot_gebruik_binnenlandse_goederen_of_diensten
          type: boolean
          required: true
          description: >-
            Aan de steunverlening is voor de begunstigde de verplichting
            verbonden om binnenlands geproduceerde goederen of binnenlandse
            diensten te gebruiken (lid 6, punt a)
        - name: beperkt_exploitatie_van_ooi_resultaten_in_andere_lidstaten
          type: boolean
          required: true
          description: >-
            De steun stelt beperkingen aan de mogelijkheden voor de begunstigden
            om de resultaten van onderzoek, ontwikkeling en innovatie in andere
            lidstaten te exploiteren (lid 6, punt b)
        - name: vormt_uitvoersubsidie_wto
          type: boolean
          required: true
          description: >-
            Steun voor landbouwproducten in de zin van bijlage 1 bij de
            Landbouwovereenkomst van de WTO die een uitvoersubsidie in de zin van
            die overeenkomst vormt (lid 7)
        - name: vormt_niet_conforme_uitvoerfinancieringssteun_wto
          type: boolean
          required: true
          description: >-
            Door een regering of overheidsinstantie verleende
            uitvoerfinancieringssteun in het kader van het WTO-besluit inzake
            uitvoerconcurrentie van 19 december 2015 die niet voldoet aan de
            vereisten van punt 15 van dat besluit (lid 7)
      input:
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: Begunstigde voldoet aan de kmo-criteria van bijlage I (lid 1, punt a)
      output:
        - name: valt_binnen_toepassingsgebied
          type: boolean
          description: >-
            De voorgenomen steunmaatregel valt binnen het toepassingsgebied van
            deze verordening (artikel 1)
      actions:
        # Lid 1: de categorieën steun waarop de verordening van toepassing is
        - output: valt_onder_categorie_lid_1
          value:
            operation: OR
            conditions:
              # punt a) i): kmo's actief in de landbouwsector
              - operation: AND
                conditions:
                  - $is_kmo
                  - operation: OR
                    conditions:
                      - $actief_in_primaire_landbouwproductie
                      - $actief_in_verwerking_landbouwproducten
                      - $actief_in_afzet_landbouwproducten
              # punt a) ii): kmo's met niet-agrarische activiteiten in
              # plattelandsgebieden, mits steun in het kader van een strategisch
              # GLB-plan (Vo. 2021/2115, Elfpo-cofinanciering of aanvullende
              # nationale financiering)
              - operation: AND
                conditions:
                  - $is_kmo
                  - $in_plattelandsgebied
                  - $verricht_niet_agrarische_activiteiten
                  - $steun_in_kader_strategisch_glb_plan
              # punt a) ii), afwijking: gemeenten die van CLLD-projecten
              # profiteren op grond van de artikelen 60 en 61
              - $is_gemeente_die_profiteert_van_clld_project
              # punt b): milieubescherming in de landbouw, alleen ondernemingen
              # actief in de primaire productie
              - operation: AND
                conditions:
                  - $betreft_milieubescherming_in_de_landbouw
                  - $actief_in_primaire_landbouwproductie
              # punt c)
              - $betreft_instandhouding_cultureel_en_natuurlijk_erfgoed
              # punt d)
              - $betreft_herstel_schade_natuurrampen_in_de_landbouwsector
              # punt e)
              - $betreft_onderzoek_ontwikkeling_en_innovatie
              # punt f)
              - $betreft_steun_voor_de_bosbouw
        # Lid 3: uitsluitingen (evaluatieplichtige regelingen na zes maanden,
        # exportsteun, binnenlandse-goederensteun)
        - output: uitgesloten_op_grond_van_lid_3
          value:
            operation: OR
            conditions:
              - $is_evaluatieplichtige_steunregeling_na_zes_maanden
              - $is_ingrijpende_aanpassing_van_evaluatieplichtige_steunregeling
              - $betreft_steun_voor_exportactiviteiten
              - $steun_afhankelijk_van_gebruik_binnenlandse_goederen
        # Lid 4: Deggendorf — geen steun bij een openstaand
        # terugvorderingsbevel, behoudens de uitzonderingen van punt a) i) en ii)
        - output: voldoet_aan_lid_4
          value:
            operation: OR
            conditions:
              - operation: NOT
                value: $heeft_openstaand_terugvorderingsbevel
              - $betreft_herstel_schade_natuurrampen_in_de_landbouwsector
              - $betreft_clld_of_eip_project
        # Lid 5: geen steun aan ondernemingen in moeilijkheden, behoudens de
        # uitzonderingen van de punten a) tot en met h)
        - output: voldoet_aan_lid_5
          value:
            operation: OR
            conditions:
              - operation: NOT
                value: $is_onderneming_in_moeilijkheden
              - $betreft_voorlichting_in_landbouw_of_bosbouwsector
              - $betreft_afzetbevordering_via_publicaties
              - $betreft_vergoeding_kosten_dierziekten_en_plantenplagen
              - $betreft_afvoeren_en_vernietigen_gestorven_dieren
              - $betreft_opvangen_nadelen_natura_2000
              - $betreft_herstel_schade_natuurrampen_in_de_landbouwsector
              - $betreft_clld_of_eip_project
              # punt h): alleen voor zover in moeilijkheden geraakt door de
              # gebeurtenis in kwestie
              - operation: AND
                conditions:
                  - $in_moeilijkheden_geworden_door_de_gebeurtenis
                  - operation: OR
                    conditions:
                      - $betreft_herstel_schade_gelijkgestelde_weersomstandigheden
                      - $betreft_herstel_schade_dierziekten_of_plantenplagen
                      - $betreft_herstel_schade_door_beschermde_dieren
                      - $betreft_herstel_schade_aan_bossen
        # Lid 6: uitsluiting bij onlosmakelijke schending van Unierecht
        - output: uitgesloten_op_grond_van_lid_6
          value:
            operation: OR
            conditions:
              - $steun_leidt_tot_schending_van_unierecht
              - $verplichting_tot_gebruik_binnenlandse_goederen_of_diensten
              - $beperkt_exploitatie_van_ooi_resultaten_in_andere_lidstaten
        # Lid 7: WTO-uitvoersubsidies en niet-conforme uitvoerfinancieringssteun
        - output: uitgesloten_op_grond_van_lid_7
          value:
            operation: OR
            conditions:
              - $vormt_uitvoersubsidie_wto
              - $vormt_niet_conforme_uitvoerfinancieringssteun_wto
        - output: valt_binnen_toepassingsgebied
          value:
            operation: AND
            conditions:
              - $valt_onder_categorie_lid_1
              - operation: NOT
                value: $uitgesloten_op_grond_van_lid_3
              - $voldoet_aan_lid_4
              - $voldoet_aan_lid_5
              - operation: NOT
                value: $uitgesloten_op_grond_van_lid_6
              - operation: NOT
                value: $uitgesloten_op_grond_van_lid_7
- number: '2'
  text: |-
    **Definities**

    Voor de toepassing van deze verordening wordt verstaan onder:
    1) “ad-hocsteun”: steun die niet op grond van een steunregeling wordt toegekend; ▼M1
    2) “ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld”: ongunstige weersomstandigheden zoals vorst, storm, hagel, ijs, hevige of aanhoudende regen of ernstige droogte die, als het om landbouw gaat, leiden tot een verlies van meer dan 30 % van de gemiddelde productie, berekend hetzij op basis van de productie van de voorafgaande drie of vier jaren, hetzij op basis van de productie van de voorafgaande vijf of acht jaren, de hoogste en de laagste productie niet meegerekend; gaat het om bosbouw, dan moet het verlies meer dan 20 % van het bosbouwpotentieel bedragen; ▼B
    3) “advies”: de volledige advisering in het kader van een en hetzelfde contract;
    4) “landbouwactiviteit”: een activiteit zoals gedefinieerd door een lidstaat in zijn strategisch GLB-plan overeenkomstig artikel 4, lid 2, van Verordening (EU) 2021/2115;
    5) “landbouwareaal”: areaal zoals gedefinieerd door een lidstaat in zijn strategisch GLB-plan overeenkomstig artikel 4, lid 3, van Verordening (EU) 2021/2115;
    6) “landbouwbedrijf”: een eenheid die grond, gebouwen en voorzieningen omvat die voor de primaire landbouwproductie worden gebruikt;
    7) “landbouwproduct”: de in bijlage I bij het Verdrag vermelde producten, met uitzondering van de visserij- en aquacultuurproducten die zijn vermeld in bijlage I bij Verordening (EU) nr. 1379/2013 van het Europees Parlement en de Raad (4);
    8) “landbouwsector”: alle ondernemingen die actief zijn in de primaire landbouwproductie en in de verwerking en de afzet van landbouwproducten;
    9) “boslandbouwsystemen”: systemen voor grondgebruik waarbij de teelt van bomen wordt gecombineerd met landbouw op dezelfde grond;

    ▼B
    10) “steun” of “steunmaatregel”: elke maatregel die aan alle criteria van artikel 107, lid 1, van het Verdrag voldoet;

    11) “in het kader van een strategisch GLB-plan verleende steun”: steun die overeenkomstig Verordening (EU) 2021/2115 wordt verleend als uit het Elfpo gecofinancierde steun of als aanvullende nationale financiering bij dergelijke gecofinancierde steun;

    12) “steunintensiteit”: het brutosteunbedrag, uitgedrukt als een percentage van de in aanmerking komende kosten, vóór aftrek van belastingen of andere heffingen;

    13) “steunregeling”: elk besluit op grond waarvan aan ondernemingen die in het besluit op algemene en abstracte wijze zijn omschreven, individuele steun kan worden toegekend zonder dat hiervoor nog uitvoeringsmaatregelen vereist zijn, alsmede elk besluit op grond waarvan steun die niet aan een specifiek project is gebonden, voor onbepaalde tijd en voor een onbepaald bedrag aan een of meer ondernemingen kan worden toegekend;

    14) “arm’s length”: de situatie waarbij de voorwaarden van de transactie tussen de contractpartijen niet afwijken van die welke tussen onafhankelijke ondernemingen zouden worden overeengekomen en geen enkele vorm van heimelijke verstandhouding behelzen. Iedere transactie die voortvloeit uit een open, transparante en onvoorwaardelijke procedure wordt geacht te voldoen aan het arm’s length-beginsel;

    15) “biobeveiligingsmaatregelen”: beheers- en fysieke maatregelen die bedoeld zijn om het risico te verminderen dat ziekten worden geïntroduceerd, zich ontwikkelen en zich verspreiden naar, uit of in:

    a) een dierenpopulatie,

    b) een inrichting, zone, compartiment, vervoermiddel of enige andere voorziening, ruimte of locatie;

    16) “stamboek”: stamboek als bedoeld in artikel 2, punt 12, van Verordening (EU) 2016/1012 van het Europees Parlement en de Raad (5);

    17) “strategisch GLB-plan”: strategisch GLB-plan als bedoeld in artikel 1, lid 1, punt c), van Verordening (EU) 2021/2115;

    18) “gekapitaliseerde werkzaamheden”: werkzaamheden die door een landbouwer zelf of door de werknemers van de landbouwer op het landbouwbedrijf worden uitgevoerd en activa creëren;

    19) “regelingen voor koolstoflandbouw”: steunregelingen voor landbeheerpraktijken die zorgen voor een grotere koolstofopslag in levende biomassa, dood organisch materiaal en de bodem doordat er meer koolstof wordt afgevangen en/of minder koolstof vrijkomt in de atmosfeer;

    20) “rampzalige gebeurtenis”: een door menselijke activiteit veroorzaakte onvoorziene gebeurtenis van biotische of abiotische aard die tot belangrijke verstoringen van de bosstructuren leidt, en uiteindelijk belangrijke economische schade aan de bosbouwsector veroorzaakt;

    ▼B
    21) “datum van de toekenning van de steun”: de datum waarop de begunstigde krachtens de toepasselijke nationale wet- en regelgeving een wettelijke aanspraak op de steun verwerft;

    22) “bestrijdings- en uitroeiingsmaatregelen”: maatregelen in verband met dierziekten waarvoor een bevoegde autoriteit van de lidstaat formeel heeft erkend dat zich een uitbraak heeft voorgedaan, of in verband met plantenplagen of invasieve uitheemse soorten waarvan de aanwezigheid formeel is bevestigd door een bevoegde autoriteit;

    23) “evaluatieplan”: een document dat een of meer steunregelingen bestrijkt en ten minste de volgende elementen bevat: de te evalueren doelstellingen, de evaluatievragen, de resultaatindicatoren, de geplande methode voor de uitvoering van de evaluatie, de vereisten inzake gegevensverzameling, het voorgestelde tijdschema voor de evaluatie, met inbegrip van de datum van indiening van de tussentijdse en de eindevaluatieverslagen, de beschrijving van de onafhankelijke instantie die de evaluatie zal uitvoeren of de criteria voor de selectie van die instantie, en nadere bepalingen inzake de bekendmaking van de evaluatie;

    24) “gestorven dieren”: dieren die op een landbouwbedrijf of bedrijfslocatie of tijdens transport zijn gedood door euthanasie met of zonder definitieve diagnose of die daar zijn gestorven, met inbegrip van doodgeboren en ongeboren dieren, maar niet voor menselijke consumptie zijn geslacht;

    25) “snelgroeiende bomen”: bos met korte omlooptijd waarvoor de minimumperiode voordat de bomen mogen worden geveld, minstens acht jaar bedraagt en de maximumperiode ten hoogste twintig jaar bedraagt;

    26) “fiscale vervolgregeling”: een regeling in de vorm van belastingvoordelen die een gewijzigde versie is van een reeds bestaande regeling in de vorm van belastingvoordelen en die deze vervangt;

    27) “vaste kosten die voortvloeien uit de deelname aan kwaliteitsregelingen”: de kosten die worden gemaakt om tot een kwaliteitsregeling waarvoor steun wordt verleend, toe te treden en de jaarlijkse bijdrage voor deelname aan die kwaliteitsregeling, inclusief, in voorkomend geval, de kosten van de controles die nodig zijn om te verifiëren of het productdossier wordt nageleefd;

    28) “biobrandstof op basis van voedingsgewassen”: biobrandstof geproduceerd uit voedsel- en voedergewassen als gedefinieerd in Richtlijn (EU) 2018/2001;

    29) “levensmiddelen”: levensmiddelen die geen landbouwproducten zijn en die zijn vermeld in bijlage I bij Verordening (EU) nr. 1151/2012 van het Europees Parlement en de Raad (6);

    30) “brutosubsidie-equivalent”: het bedrag van de steun indien die in de vorm van een subsidie aan de begunstigde was toegekend, vóór aftrek van belastingen of andere heffingen;

    31) “individuele steun”:

    a) ad-hocsteun,

    b) steun die op grond van een steunregeling aan individuele begunstigden wordt toegekend;

    ▼B
    32) “immateriële activa”: fysiek of financieel niet-tastbare activa, zoals octrooien, licenties, knowhow of andere intellectuele-eigendomsrechten;

    33) “investeringen om aan een norm van de Unie te voldoen”: investeringen die worden gedaan om na het verstrijken van de in de wetgeving van de Unie vastgestelde overgangsperiode aan een norm van de Unie te voldoen;

    34) “grote ondernemingen”: ondernemingen die niet aan de in bijlage I vastgestelde criteria voldoen;

    35) “afzet van landbouwproducten”: het in voorraad hebben of uitstallen met het oog op het verkopen, te koop aanbieden, leveren of op enige andere wijze verhandelen, met uitzondering van de eerste verkoop door een landbouwer aan wederverkopers of verwerkingsbedrijven en alle activiteiten waarmee een product voor een dergelijke eerste verkoop wordt voorbereid; verkoop door een landbouwer aan eindverbruikers wordt als afzet van landbouwproducten beschouwd indien die verkoop plaatsvindt in daarvoor bestemde afzonderlijke lokalen of voorzieningen;

    36) “onderling fonds”: een door een lidstaat overeenkomstig zijn nationaal recht geaccrediteerd systeem dat de aangesloten landbouwers in de gelegenheid stelt zich te verzekeren en compensatiebetalingen aan hen uitkeert voor economische verliezen;

    37) “Natura 2000-gebieden”: bijzondere landbouw- of bosgebieden als bedoeld in artikel 3 van Richtlijn 92/43/EEG en artikel 3 van Richtlijn 2009/147/EG;

    38) “natuurrampen”: aardbevingen, lawines, grondverschuivingen en overstromingen, tornado’s, orkanen, vulkaanuitbarstingen en natuurbranden van natuurlijke oorsprong;

    39) “niet-productieve investering”: investering die niet leidt tot een aanzienlijke stijging van de waarde of de rentabiliteit van het bedrijf;

    40) “handelingen die aan de industriële verwerking voorafgaan”: vellen, afbreken, ontschorsen, versnijden, opslaan, beschermend behandelen en drogen van hout en alle andere bewerkingen voorafgaand aan het industrieel zagen van hout in een zagerij, alsmede zagen in zagerijen met een verwerkingscapaciteit van hoogstens 20 000 m3 rondhoutinput per jaar;

    41) “andere ongunstige weersomstandigheden”: ongunstige weersomstandigheden die niet onder de definitie vallen van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld;

    42) “ultraperifere gebieden”: de in artikel 349, eerste alinea, van het Verdrag genoemde gebieden;

    43) “plantenplagen”: alle soorten, stammen en biotypen van planten, dieren of ziekteverwekkers die schadelijk zijn voor planten of plantaardige producten;

    44) “primaire landbouwproductie”: de productie van in bijlage I bij het Verdrag vermelde producten van de bodem en van de veehouderij die geen verdere bewerking hebben ondergaan die de aard van die producten wijzigt;

    45) “verwerking van landbouwproducten”: elke bewerking van een landbouwproduct die een product oplevert dat nog steeds een landbouwproduct is, met uitzondering van activiteiten op het landbouwbedrijf die nodig zijn om een dierlijk of plantaardig product klaar te maken voor de eerste verkoop;

    ▼B
    46) “producentengroepering of -organisatie”: een groepering of organisatie die is opgericht voor een van de volgende doeleinden:
    a) de productie en de output van de producenten die bij die groepering of organisatie zijn aangesloten, aanpassen aan de markteisen,
    b) goederen gezamenlijk op de markt brengen, met inbegrip van de voorbereiding voor de verkoop, de centralisatie van de verkoop en de levering aan bulkkopers,
    c) gemeenschappelijke regels vaststellen voor de verstrekking van informatie over de productie, en vooral over de oogst en de beschikbaarheid van producten,
    d) uitvoeren van andere activiteiten die door producentengroeperingen of -organisaties kunnen worden verricht, zoals de ontwikkeling van bedrijfsvoerings- en marketingvaardigheden, de organisatie en vergemakkelijking van innovatieprocessen, het gezamenlijk beheren van de grond van de leden, het hanteren van milieuvriendelijke teeltmethoden en productietechnieken en het toepassen van goede praktijken en technieken op het gebied van dierenwelzijn;
    47) “beschermd dier”: elk dier dat bij wetgeving van de Unie of nationale wetgeving beschermd is, met inbegrip van diersoorten waarvoor de nationale wetgeving voorziet in specifieke voorschriften voor de instandhouding van de populatie;
    48) “regionalesteunkaart”: de lijst met gebieden die een lidstaat heeft aangewezen volgens de in de richtsnoeren inzake regionale staatssteun (7) vastgestelde voorwaarden en die door de Commissie is goedgekeurd;
    49) “terugbetaalbaar voorschot”: een lening voor een project die in een of meer tranches wordt betaald en waarbij de voorwaarden voor terugbetaling afhangen van de uitkomst van het project;
    50) “organisatie voor onderzoek en kennisverspreiding”: een entiteit, ongeacht haar rechtsvorm of financieringswijze, die zich in hoofdzaak bezighoudt met het onafhankelijk verrichten van fundamenteel onderzoek, industrieel onderzoek of experimentele ontwikkeling, of met het breed verspreiden van de resultaten van die activiteiten door middel van onderwijs, publicaties of kennisoverdracht;
    51) “kleinere eilanden in de Egeïsche Zee”: de kleinere eilanden als bedoeld in artikel 1, lid 2, van Verordening (EU) nr. 229/2013 van het Europees Parlement en de Raad (8);
    52) “kmo’s” of “kleine, middelgrote en micro-ondernemingen”: bedrijven die voldoen aan de criteria van bijlage I;
    53) “start van de werkzaamheden in het kader van het project of de activiteit”: afhankelijk van wat als eerste plaatsvindt, hetzij de start van de activiteiten of de bouwwerkzaamheden met betrekking tot de investering, hetzij de eerste juridisch bindende toezegging om uitrusting te bestellen of een beroep op diensten te doen, hetzij een andere toezegging die het project of de activiteit onomkeerbaar maakt; de aankoop van gronden en voorbereidende werkzaamheden zoals het verkrijgen van vergunningen en de uitvoering van haalbaarheidsstudies worden niet als start van de werkzaamheden of activiteiten beschouwd;

    ▼B
    54) “gesubsidieerde diensten”: een vorm van steun waarbij de steun indirect, in natura, aan de eindbegunstigde wordt verleend en aan de aanbieder van de betrokken dienst of activiteit wordt betaald;

    55) “materiële activa”: activa bestaande uit gronden, gebouwen en installaties, machines en uitrusting;

    56) “transactiekosten”: extra kosten die verband houden met het nakomen van een verbintenis, maar niet rechtstreeks kunnen worden toegeschreven aan de uitvoering van die verbintenis, noch vervat zijn in de kosten of gederfde inkomsten die rechtstreeks worden gecompenseerd, en die op basis van standaardkosten berekend kunnen worden;

    57) “kosten van TSE- en BSE-tests (TSE = overdraagbare spongiforme encefalopathie; BSE = boviene spongiforme encefalopathie)”: alle kosten, met inbegrip van die van testkits en van het nemen, vervoeren, testen, opslaan en vernietigen van monsters, die noodzakelijk zijn voor bemonstering en laboratoriumonderzoek overeenkomstig hoofdstuk C van bijlage X bij Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad (9);

    58) “bomen voor hakhout met korte omlooptijd”: door de lidstaten te bepalen boomsoorten van GN-code 06 02 9041, bestaande uit meerjarige houtgewassen waarvan de wortelstokken of stronken na de oogst in de grond blijven en die in het daaropvolgende seizoen nieuwe scheuten vormen en waarvan de maximale omlooptijd door de lidstaten wordt vastgesteld;

    59) “onderneming in moeilijkheden”: een onderneming die beantwoordt aan de criteria van artikel 2, punt 18, van Verordening (EU) nr. 651/2014;

    60) “norm van de Unie”: verplichte, in de wetgeving van de Unie vastgestelde norm die het niveau aangeeft dat de individuele ondernemingen moeten halen, met name wat milieu, hygiëne en dierenwelzijn betreft; op het niveau van de Unie vastgestelde normen of streefdoelen die bindend zijn voor de lidstaten, maar niet voor individuele ondernemingen, worden evenwel niet als normen van de Unie beschouwd;

    61) “jonge landbouwer”: een landbouwer zoals gedefinieerd door een lidstaat in zijn strategisch GLB-plan overeenkomstig artikel 4, lid 6, van Verordening (EU) 2021/2115.

    (4) Verordening (EU) nr. 1379/2013 van het Europees Parlement en de Raad van 11 december 2013 houdende een gemeenschappelijke marktordening voor visserijproducten   en    aquacultuurproducten,   tot   wijziging    van Verordeningen (EG) nr. 1184/2006 en (EG) nr. 1224/2009 van de Raad en tot intrekking van Verordening (EG) nr. 104/2000 van de Raad (PB L 354 van 28.12.2013, blz. 1).
    (5) Verordening (EU) 2016/1012 van het Europees Parlement en de Raad van 8 juni 2016 betreffende de zoötechnische en genealogische voorwaarden voor het fokken van, de handel in en de binnenkomst in de Unie van raszuivere fokdieren, hybride fokvarkens en levende producten daarvan en tot wijziging van Verordening (EU) nr. 652/2014, de Richtlijnen 89/608/EEG en 90/425/EEG van de Raad en tot intrekking van bepaalde handelingen op het gebied van dierfokkerij (“Fokkerijverordening”) (PB L 171 van 29.6.2016, blz. 66).
    (6) Verordening (EU) nr. 1151/2012 van het Europees Parlement en de Raad van 21 november 2012 inzake kwaliteitsregelingen voor landbouwproducten en levensmiddelen (PB L 343 van 14.12.2012, blz. 1).
    (7) Richtsnoeren inzake regionale steunmaatregelen (PB C 153 van 29.4.2021, blz. 1).
    (8) Verordening (EU) nr. 229/2013 van het Europees Parlement en de Raad van 13 maart 2013 houdende specifieke maatregelen op landbouwgebied ten be­ hoeve van de kleinere eilanden in de Egeïsche Zee en tot intrekking van Verordening (EG) nr. 1405/2006 van de Raad (PB L 78 van 20.3.2013, blz. 41).
    (9) Verordening (EG) nr. 999/2001 van het Europees Parlement en de Raad van 22 mei 2001 houdende vaststelling van voorschriften inzake preventie, be­ strijding en uitroeiing van bepaalde overdraagbare spongiforme encefalopa­ thieën (PB L 147 van 31.5.2001, blz. 1).
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_2
- number: '3'
  text: |-
    **Vrijstellingsvoorwaarden**

    Steunregelingen, individuele steun die in het kader van steunregelingen wordt toegekend, en ad-hocsteun zijn verenigbaar met de interne markt in de zin van artikel 107, lid 2 of lid 3, van het Verdrag en zijn vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag mits dergelijke steun voldoet aan alle voorwaarden van hoofdstuk I van deze verordening en aan de specifieke voorwaarden die voor de desbetreffende steuncategorie in hoofdstuk III van deze verordening zijn vastgesteld.

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_3
  machine_readable:
    endpoint: voldoet_aan_gemeenschappelijke_voorwaarden
    execution:
      input:
        - name: valt_binnen_toepassingsgebied
          type: boolean
          source:
            output: valt_binnen_toepassingsgebied
          description: Toepassingsgebied van de verordening (artikel 1)
        - name: is_transparante_steun
          type: boolean
          source:
            output: is_transparante_steun
          description: De steunvorm is transparant (artikel 5)
        - name: heeft_stimulerend_effect
          type: boolean
          source:
            output: heeft_stimulerend_effect
          description: De steun heeft een stimulerend effect (artikel 6)
        - name: voldoet_aan_cumuleringsregels
          type: boolean
          source:
            output: voldoet_aan_cumuleringsregels
          description: De steun voldoet aan de cumuleringsregels (artikel 8)
        - name: voldoet_aan_publicatievereisten
          type: boolean
          source:
            output: voldoet_aan_publicatievereisten
          description: De steun voldoet aan de publicatievereisten (artikel 9)
      output:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          description: >-
            De steun voldoet aan alle voorwaarden van hoofdstuk I van deze
            verordening (artikel 3). De artikelspecifieke voorwaarden van
            hoofdstuk III worden getoetst door het eindpunt van het
            desbetreffende artikel; de aanmeldingsdrempels van artikel 4 worden
            eveneens per hoofdstuk-III-artikel getoetst.
      actions:
        # "mits dergelijke steun voldoet aan alle voorwaarden van hoofdstuk I
        # van deze verordening": de AND over de hoofdstuk-I-poorten
        - output: voldoet_aan_gemeenschappelijke_voorwaarden
          value:
            operation: AND
            conditions:
              - $valt_binnen_toepassingsgebied
              - $is_transparante_steun
              - $heeft_stimulerend_effect
              - $voldoet_aan_cumuleringsregels
              - $voldoet_aan_publicatievereisten
- number: '4'
  text: |-
    **Aanmeldingsdrempels**

    1.   Deze verordening geldt niet voor individuele steun waarvan het brutosubsidie-equivalent de volgende drempels overschrijdt:

    a) steun voor met de primaire landbouwproductie verband houdende investeringen op landbouwbedrijven, als bedoeld in artikel 14: 600 000 EUR per onderneming per investeringsproject;

    b) investeringssteun voor de verplaatsing van een landbouwbedrijfsgebouw die leidt tot een modernisering van de voorzieningen of een verhoging van de productiecapaciteit, als bedoeld in artikel 16, lid 4: 600 000 EUR per onderneming per investeringsproject;

    c) steun voor investeringen in verband met de verwerking en de afzet van landbouwproducten, als bedoeld in artikel 17: 7,5 miljoen EUR per onderneming per investeringsproject;

    d) steun voor dierenwelzijnsverbintenissen, als bedoeld in artikel 31: 500 EUR per grootvee-eenheid per jaar;

    e) steun voor het opvangen van nadelen in verband met Natura 2000- gebieden, als bedoeld in artikel 33: 500 EUR per hectare per jaar in de eerste periode van ten hoogste vijf jaar en daarna 200 EUR per hectare per jaar;

    f) steun voor agromilieuklimaatverbintenissen, als bedoeld in artikel 34: 600 EUR per hectare per jaar voor eenjarige teelten, 900 EUR per hectare per jaar voor gespecialiseerde blijvende teelten en 450 EUR per hectare per jaar voor andere vormen van landgebruik;

    g) steun voor biologische landbouw, als bedoeld in artikel 35: 600 EUR per hectare per jaar voor eenjarige teelten, 900 EUR per hectare per jaar voor gespecialiseerde blijvende teelten en 450 EUR per hectare per jaar voor andere vormen van landgebruik;

    h) steun voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed op landbouwbedrijven of in bossen, als bedoeld in artikel 36: 600 000 EUR per onderneming per investeringsproject;

    i) steun voor onderzoek en ontwikkeling in de landbouw- en de bosbouwsector, als bedoeld in artikel 38: 7,5 miljoen EUR per project;

    j) steun voor kosten van ondernemingen die deelnemen aan projecten van operationele groepen in het kader van het EIP, als bedoeld in artikel 39: 2 miljoen EUR per onderneming per project;

    k) beperkte steunbedragen voor ondernemingen die profiteren van projecten van operationele groepen in het kader van het EIP, als bedoeld in artikel 40: 500 000 EUR per project van een operationele groep in het kader van het EIP;

    ▼B
    l) steun voor bebossing en de aanleg van beboste gronden, als bedoeld in artikel 41: 7,5 miljoen EUR per aanlegproject;

    m) steun voor boslandbouwsystemen, als bedoeld in artikel 42: 7,5 miljoen EUR per project voor de aanleg van een boslandbouwsysteem;

    n) steun voor investeringen ter verbetering van de veerkracht en de milieuwaarde van bosecosystemen, als bedoeld in artikel 44: 7,5 miljoen EUR per investeringsproject;

    o) steun voor het opvangen van gebiedsspecifieke nadelen die het gevolg zijn van bepaalde verplichte vereisten, als bedoeld in artikel 45: 500 EUR per hectare per jaar in de eerste periode van ten hoogste vijf jaar en daarna 200 EUR per hectare per jaar;

    p) steun voor bosmilieuklimaatdiensten en bosinstandhouding, als bedoeld in artikel 46: 200 EUR per hectare per jaar, behalve voor steun als bedoeld in artikel 46, lid 8;

    q) steun voor adviesdiensten in de bosbouwsector, als bedoeld in artikel 48: 200 000 EUR per onderneming per jaar;

    r) steun voor investeringen in infrastructuur voor de ontwikkeling, modernisering of aanpassing van de bosbouwsector, als bedoeld in artikel 49: 7,5 miljoen EUR per investeringsproject;

    s) steun voor investeringen in bosbouwtechnologieën en in de verwerking, mobilisering en afzet van bosbouwproducten, als bedoeld in artikel 50: 7,5 miljoen EUR per investeringsproject;

    t) steun voor investeringen in basisdiensten en infrastructuur in plattelandsgebieden, als bedoeld in artikel 55: 10 miljoen EUR per investeringsproject;

    u) steun voor kosten van kmo’s die deelnemen aan CLLD-projecten, die in het kader van het Elfpo Leader-projecten worden genoemd, als bedoeld in artikel 60: 2 miljoen EUR per onderneming per project;

    v) beperkte steunbedragen voor kmo’s die profiteren van deelname aan CLLD-projecten, als bedoeld in artikel 61: 200 000 EUR per CLLD-project.

    2.     De in lid 1 bedoelde drempels mogen niet door kunstmatige opsplitsing van de steunregelingen of steunprojecten worden omzeild.
