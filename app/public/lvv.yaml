        - name: steunvorm
          type: string
          required: true
          description: >-
            Vorm waarin de steun wordt verleend (gedeeld vocabulaire): SUBSIDIE,
            RENTESUBSIDIE, GESUBSIDIEERDE_DIENST, LENING, GARANTIE,
            FISCAAL_VOORDEEL, TERUGBETAALBAAR_VOORSCHOT, VERKOOP_VERHUUR_ACTIVA,
            KAPITAALINJECTIE, RISICOKAPITAAL, ANDERS. Lid 4 vereist
            GESUBSIDIEERDE_DIENST.
        - name: aanbieder_gekwalificeerd_ervaren_en_betrouwbaar
          type: boolean
          required: true
          description: >-
            De organisatie die is geselecteerd om adviesdiensten te verstrekken,
            beschikt over daartoe gekwalificeerd en geregeld opgeleid personeel,
            alsmede over ervaring op het gebied van adviesverstrekking, en is
            betrouwbaar gebleken op de gebieden waarover zij advies verstrekt
            (lid 4, tweede alinea).
        - name: aanbieder_onpartijdig_en_zonder_belangenconflict
          type: boolean
          required: true
          description: >-
            De verstrekker van de adviesdiensten is onpartijdig en heeft geen
            belangenconflict (lid 5).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten. Gedeelde parameter.
        - name: steunbedrag_over_drie_jaar
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun per onderneming over een periode van drie jaar
            (lid 7).
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun per onderneming per jaar, zoals artikel 4, lid 1,
            punt q), de drempel voor dit artikel meet. Gedeelde parameter.
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3).
        - name: aanmeldingsdrempel_art_48
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_48
          description: >-
            Aanmeldingsdrempel voor steun voor adviesdiensten in de
            bosbouwsector: 200 000 EUR per onderneming per jaar (artikel 4,
            lid 1, punt q).
      output:
        - name: voldoet_aan_voorwaarden_art_48
          type: boolean
          description: >-
            De steun voor adviesdiensten in de bosbouwsector voldoet aan
            artikel 48, aan de aanmeldingsdrempel van artikel 4 en aan
            hoofdstuk I van deze verordening (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_48
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt q: "steun voor adviesdiensten in de
              # bosbouwsector, als bedoeld in artikel 48: 200 000 EUR per
              # onderneming per jaar"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_48
              # lid 1: "Steun voor adviesdiensten in de bosbouwsector"
              - $betreft_adviesdiensten_in_de_bosbouwsector
              # lid 2: "De betrokken diensten mogen niet van permanente of
              # periodieke aard zijn"
              - operation: NOT
                value: $dienst_is_van_permanente_of_periodieke_aard
              # lid 2: "en evenmin verband houden met de exploitatiekosten van
              # de onderneming"
              - operation: NOT
                value: $dienst_houdt_verband_met_exploitatiekosten_onderneming
              # lid 2: "De adviesdiensten bestrijken de economische, ecologische
              # en sociale dimensies"
              - $advies_bestrijkt_economische_ecologische_en_sociale_dimensies
              # lid 2: "en verstrekken actuele technologische en
              # wetenschappelijke informatie die tot stand is gekomen in het
              # kader van onderzoek en innovatie"
              - $advies_verstrekt_actuele_technologische_en_wetenschappelijke_informatie
              # lid 2, tweede alinea: "consistent ... met de in hun strategisch
              # GLB-plan opgenomen beschrijving van AKIS"
              - $consistent_met_akis_beschrijving_glb_plan
              # lid 3: "het systeem van de adviesdiensten [heeft] minstens
              # betrekking ... op kwesties in verband met de uitvoering van
              # [de genoemde richtlijnen en verordeningen]"
              - $adviessysteem_dekt_verplichte_uniewetgeving
              # lid 4: "De steun wordt verleend in de vorm van een
              # gesubsidieerde dienst."
              - operation: EQUALS
                subject: $steunvorm
                value: GESUBSIDIEERDE_DIENST
              # lid 4, tweede alinea: "beschikken over daartoe gekwalificeerd en
              # geregeld opgeleid personeel, alsmede over ervaring ... en zijn
              # betrouwbaar gebleken"
              - $aanbieder_gekwalificeerd_ervaren_en_betrouwbaar
              # lid 5: "dat de verstrekker van de adviesdiensten onpartijdig is
              # en geen belangenconflict heeft"
              - $aanbieder_onpartijdig_en_zonder_belangenconflict
              # lid 7: "De steun blijft beperkt tot 100 % van de in aanmerking
              # komende kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
              # lid 7: "en mag over een periode van drie jaar niet meer bedragen
              # dan 200 000 EUR per onderneming"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag_over_drie_jaar
                value: 20000000
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '48'
- number: '49'
  text: |-
    **Steun voor investeringen in infrastructuur voor de ontwikkeling, modernisering of aanpassing van de bosbouwsector**

    1.    Steun voor investeringen in infrastructuur voor de ontwikkeling, modernisering of aanpassing van de bosbouwsector is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    Steun voor investeringen waarvoor krachtens Richtlijn 2011/92/EU een milieueffectbeoordeling moet worden uitgevoerd, mag slechts worden toegekend op voorwaarde dat die beoordeling is uitgevoerd en de vergunning voor het betrokken investeringsproject is verleend vóór de datum van de toekenning van de individuele steun.

    De eerste alinea is niet van toepassing op steun die wordt verstrekt in de vorm van financieringsinstrumenten.

    3.   Steun voor grote ondernemingen is afhankelijk van de overlegging van toepasselijke informatie uit een bosbeheerplan of gelijkwaardig instrument dat in overeenstemming is met de algemene richtsnoeren voor het duurzame beheer van de bossen in Europa.

    Deze vereiste geldt niet voor gemeenten die autonome lokale autoriteiten zijn met een jaarlijkse begroting van minder dan 10 miljoen EUR en met minder dan 5 000 inwoners.

    4.    De steun kan worden verleend voor infrastructuurinvesteringen voor de ontwikkeling, modernisering of aanpassing van bossen. Indien de steun buiten het kader van een strategisch GLB-plan wordt verleend, omvat hij uitsluitend het volgende:

    a) de ontsluiting van bosgrond;

    b) ruilverkaveling en bodemverbetering;

    ▼B
    c) de levering van duurzame energie, energie-efficiëntie, watervoorziening en -besparing;

    d) het gebruik van dieren in plaats van machines;

    e) de bouw van tijdelijke opslagfaciliteiten.

    5.   De steun dekt de volgende in aanmerking komende kosten:

    a) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de andere totale in aanmerking komende uitgaven voor de betrokken verrichting, met uitzondering van de aankoop van grond voor milieubehoud indien de steun wordt verleend in het kader van een strategisch GLB-plan;

    b) de kosten van de koop of huurkoop van machines en uitrusting, met inbegrip van het gebruik van dieren in plaats van machines, tot maximaal de marktwaarde van de activa;

    c) algemene kosten in verband met de in de punten a) en b) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs en voor advies over ecologische en economische duurzaamheid, met inbegrip van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer op basis van de resultaten daarvan geen uitgaven uit hoofde van de punten a) en b) worden verricht;

    d) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken;

    e) de kosten van de opstelling van bosbeheerplannen of gelijkwaardige instrumenten.

    6.   Behalve wanneer de steun in het kader van een strategisch GLB-plan in de vorm van financieringsinstrumenten wordt verleend, worden de volgende kosten niet geacht in aanmerking te komen:

    a) andere dan de in lid 5, punten a) en b), bedoelde kosten in verband met een leasingcontract, zoals de marge voor de leasinggever, kosten van de herfinanciering van rente, overheadkosten en verzekeringspremies en

    b) werkkapitaal.

    7.   De steunintensiteit bedraagt ten hoogste 65 % van de in aanmerking komende kosten.

    De steunintensiteit kan tot maximaal 80 % worden verhoogd voor de volgende investeringen:

    a) investeringen die verband houden met een of meer specifieke milieu- en klimaatgerelateerde doelstellingen als vermeld in artikel 14, lid 3, punten e), f) en g);

    b) investeringen in de ultraperifere gebieden of de kleinere eilanden in de Egeïsche Zee.

    8.    De steunintensiteit kan worden verhoogd tot 100 % voor niet-productieve investeringen, ruilverkaveling, bodemverbetering en investeringen in boswegen die gratis voor het publiek toegankelijk zijn en ten dienste staan van de multifunctionaliteit van het bos.

    ▼B
