        - name: aanmeldingsdrempel_art_38
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_38
          description: >-
            Aanmeldingsdrempel voor steun voor onderzoek en ontwikkeling in de
            landbouw- en de bosbouwsector (artikel 4, lid 1, punt i): 7,5 miljoen
            EUR per project.
      output:
        - name: voldoet_aan_voorwaarden_art_38
          type: boolean
          description: >-
            De steun voor onderzoeks- en ontwikkelingsprojecten in de landbouw- en
            de bosbouwsector of subsectoren daarvan voldoet aan artikel 38 en aan
            hoofdstuk I van deze verordening (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_38
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt i: drempel 7,5 miljoen EUR per project
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_38
              # lid 2: "Het gesteunde project moet van algemeen belang zijn voor
              # alle ondernemingen die actief zijn in de betrokken sector of
              # subsector"
              - $project_van_algemeen_belang_voor_sector
              # lid 3: "Vóór de begindatum van het gesteunde project wordt op een
              # openbaar toegankelijke website ... de volgende informatie
              # bekendgemaakt"
              - $projectinformatie_vooraf_bekendgemaakt
              # lid 4: "De resultaten ... worden op een openbaar toegankelijke
              # website beschikbaar gesteld ... blijven ... ten minste vijf jaar
              # ... beschikbaar"
              - $resultaten_openbaar_beschikbaar_ten_minste_vijf_jaar
              # lid 5: "De steun wordt rechtstreeks aan de organisatie voor
              # onderzoek en/of kennisverspreiding toegekend."
              - $steun_rechtstreeks_aan_onderzoeksorganisatie_toegekend
              # lid 6: "De steun wordt niet toegekend in de vorm van op de prijs
              # van de land- of bosbouwproducten gebaseerde betalingen"
              - operation: NOT
                value: $steun_in_vorm_van_prijsgebaseerde_betalingen
              # lid 8: "Wanneer een organisatie ... ook economische activiteiten
              # uitoefent, moet ... een gescheiden boekhouding worden gevoerd."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $organisatie_oefent_economische_activiteiten_uit
                      value: true
                    then: $gescheiden_boekhouding_economische_activiteiten
                default: true
              # lid 9: "mogen geen preferente toegang ... genieten"
              - operation: NOT
                value: $invloedhebbende_ondernemingen_hebben_preferente_toegang
              # lid 10: "De steunintensiteit bedraagt ten hoogste 100 % van de in
              # aanmerking komende kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '38'
