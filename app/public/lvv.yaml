                      - operation: NOT
                        value: $lidmaatschap_is_toegangsvoorwaarde
                      - $bijdragen_niet_leden_beperkt_tot_advieskosten
              # leden 8 en 9: "beperkt tot 100 % van de in aanmerking komende
              # kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
              # lid 8: begunstigde actief in de primaire landbouwproductie →
              # "maximumbedrag van 25 000 EUR per drie jaar"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $actief_in_primaire_landbouwproductie
                  - operation: LESS_THAN_OR_EQUAL
                    subject: $steunbedrag
                    value: 2500000
              # lid 9: begunstigde "actief ... in de verwerking en de afzet van
              # landbouwproducten" → "maximumbedrag van 200 000 EUR per drie
              # jaar" (gelezen als: actief in verwerking en/of afzet; zie notes)
              - operation: OR
                conditions:
                  - operation: NOT
                    value:
                      operation: OR
                      conditions:
                        - $actief_in_verwerking_landbouwproducten
                        - $actief_in_afzet_landbouwproducten
                  - operation: LESS_THAN_OR_EQUAL
                    subject: $steunbedrag
                    value: 20000000
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '22'
            explanation: >-
              AND over de leden 1 tot en met 3 en 5 tot en met 9; maxima: 25 000
              EUR (2500000 eurocent) per drie jaar bij primaire
              landbouwproductie (lid 8) en 200 000 EUR (20000000 eurocent) per
              drie jaar bij verwerking en afzet (lid 9), telkens behalve voor
              kosten op grond van lid 4 (untranslatable).
- number: '23'
  text: |-
    **Steun voor bedrijfsvervangingsdiensten in de landbouw**

    1.   Steun voor bedrijfsvervangingsdiensten in de landbouw is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun moet dienen voor de werkelijke kosten van de vervanging van een landbouwer, een natuurlijke persoon die lid is van het landbouwhuishouden of een werknemer in de landbouw, tijdens hun afwezigheid van het werk als gevolg van ziekte, waaronder ziekte van een van hun kinderen en ernstige ziekte van een samenwonende persoon voor wie constante zorg vereist is, vakantie, moederschaps- en ouderschapsverlof, verplichte militaire dienst, bij overlijden of in het in artikel 21, lid 3, punt c), bedoelde geval.

    3.     De totale duur van de vervanging blijft beperkt tot drie maanden per jaar per begunstigde, met uitzondering van de vervanging voor moederschaps- en ouderschapsverlof en van de vervanging tijdens de verplichte militaire dienst. Voor moederschaps- en ouderschapsverlof blijft de duur van de vervanging telkens beperkt tot zes maanden. Voor de verplichte militaire dienst blijft de duur van de vervanging beperkt tot de duur van de dienst.

    ▼B
    4.    De steun wordt verleend in de vorm van een gesubsidieerde dienst.

    De bedrijfsvervangingsdiensten in de landbouw mogen worden verstrekt door producentengroeperingen en -organisaties, ongeacht hun omvang. In dat geval mag lidmaatschap van die groeperingen of organisaties geen voorwaarde zijn om toegang tot die diensten te krijgen.

    5.  De steunintensiteit bedraagt ten hoogste 100 % van de werkelijk gemaakte kosten.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_23
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_23
    execution:
      parameters:
        - name: steun_dekt_werkelijke_kosten_vervanging
          type: boolean
          required: true
          description: >-
            De steun dient voor de werkelijke kosten van de vervanging (lid 2).
        - name: vervangen_persoon
          type: string
          required: true
          description: >-
            Wie wordt vervangen (lid 2): LANDBOUWER,
            LID_LANDBOUWHUISHOUDEN (een natuurlijke persoon die lid is van het
            landbouwhuishouden) of WERKNEMER_LANDBOUW (een werknemer in de
            landbouw).
        - name: reden_afwezigheid
          type: string
          required: true
          description: >-
            Reden van de afwezigheid van het werk (lid 2): ZIEKTE,
            ZIEKTE_KIND (ziekte van een van hun kinderen),
            ERNSTIGE_ZIEKTE_SAMENWONENDE (ernstige ziekte van een samenwonende
            persoon voor wie constante zorg vereist is), VAKANTIE,
            MOEDERSCHAPS_OF_OUDERSCHAPSVERLOF, MILITAIRE_DIENST (verplichte
            militaire dienst), OVERLIJDEN, of GEVAL_ART_21_LID_3_PUNT_C (het in
            artikel 21, lid 3, punt c), bedoelde geval).
        - name: vervangingsduur_maanden
          type: number
          required: true
          description: >-
            Duur van de vervanging in maanden, gemeten zoals lid 3 haar meet:
            per jaar per begunstigde (hoofdregel), per keer ("telkens") bij
            moederschaps- en ouderschapsverlof, en de totale duur bij verplichte
            militaire dienst.
        - name: duur_militaire_dienst_maanden
          type: number
          required: false
          description: >-
            De duur van de verplichte militaire dienst in maanden (lid 3, derde
            zin); alleen relevant bij reden_afwezigheid MILITAIRE_DIENST.
        - name: steunvorm
          type: string
          required: true
          description: >-
            Vorm van de steun; lid 4 eist GESUBSIDIEERDE_DIENST.
        - name: verricht_door_producentengroepering_of_organisatie
          type: boolean
          required: true
          description: >-
            De bedrijfsvervangingsdiensten worden verstrekt door
            producentengroeperingen en -organisaties (lid 4, tweede alinea).
        - name: lidmaatschap_is_toegangsvoorwaarde
          type: boolean
          required: false
          description: >-
            Lidmaatschap van die groeperingen of organisaties is een voorwaarde
            om toegang tot de diensten te krijgen (lid 4, tweede alinea; mag
            niet). Alleen relevant wanneer de diensten door
            producentengroeperingen of -organisaties worden verstrekt.
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in procenten van de werkelijk gemaakte
            kosten (lid 5).
        - name: actief_in_primaire_landbouwproductie
          type: boolean
          required: true
          description: >-
            Begunstigde is actief in de primaire landbouwproductie (artikel 1,
            lid 1, punt a, i: artikel 23 is alleen van toepassing op kmo's die in
            de primaire landbouwproductie actief zijn; handhaving van die
            artikel-afhankelijke beperking ligt bij dit artikel, zie
            untranslatable bij artikel 1)
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3). Artikel 4 kent voor artikel 23 geen aanmeldingsdrempel.
        # artikel 1, lid 1, punt a, i: alleen kmo's die in de primaire
        # landbouwproductie actief zijn; handhaving van die artikel-afhankelijke
        # beperking ligt bij dit artikel (zie untranslatable bij artikel 1)
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: De begunstigde is een kleine, middelgrote of micro-onderneming (Bijlage I)
      output:
        - name: voldoet_aan_voorwaarden_art_23
          type: boolean
          description: >-
            De steun voor bedrijfsvervangingsdiensten in de landbouw voldoet aan
            artikel 23 en aan hoofdstuk I van deze verordening (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_23
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 1, lid 1, punt a, i: "alleen van toepassing ... op kmo's
              # die in de primaire landbouwproductie actief zijn" (handhaving
              # bij dit artikel)
              - $is_kmo
              - $actief_in_primaire_landbouwproductie
              # lid 2: "De steun moet dienen voor de werkelijke kosten van de
              # vervanging"
              - $steun_dekt_werkelijke_kosten_vervanging
              # lid 2: "van een landbouwer, een natuurlijke persoon die lid is
              # van het landbouwhuishouden of een werknemer in de landbouw"
              - operation: IN
                subject: $vervangen_persoon
                values:
                  - LANDBOUWER
                  - LID_LANDBOUWHUISHOUDEN
                  - WERKNEMER_LANDBOUW
              # lid 2: "tijdens hun afwezigheid van het werk als gevolg van
              # ziekte, waaronder ziekte van een van hun kinderen en ernstige
              # ziekte van een samenwonende persoon voor wie constante zorg
              # vereist is, vakantie, moederschaps- en ouderschapsverlof,
              # verplichte militaire dienst, bij overlijden of in het in artikel
              # 21, lid 3, punt c), bedoelde geval"
              - operation: IN
                subject: $reden_afwezigheid
                values:
                  - ZIEKTE
                  - ZIEKTE_KIND
                  - ERNSTIGE_ZIEKTE_SAMENWONENDE
                  - VAKANTIE
                  - MOEDERSCHAPS_OF_OUDERSCHAPSVERLOF
                  - MILITAIRE_DIENST
                  - OVERLIJDEN
                  - GEVAL_ART_21_LID_3_PUNT_C
              # lid 3: "De totale duur van de vervanging blijft beperkt tot drie
              # maanden per jaar per begunstigde, met uitzondering van de
              # vervanging voor moederschaps- en ouderschapsverlof en van de
              # vervanging tijdens de verplichte militaire dienst. Voor
              # moederschaps- en ouderschapsverlof blijft de duur van de
              # vervanging telkens beperkt tot zes maanden. Voor de verplichte
              # militaire dienst blijft de duur van de vervanging beperkt tot de
              # duur van de dienst."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $reden_afwezigheid
                      value: MOEDERSCHAPS_OF_OUDERSCHAPSVERLOF
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $vervangingsduur_maanden
                      value: 6
                  - when:
                      operation: EQUALS
                      subject: $reden_afwezigheid
                      value: MILITAIRE_DIENST
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $vervangingsduur_maanden
                      value: $duur_militaire_dienst_maanden
                default:
                  operation: LESS_THAN_OR_EQUAL
                  subject: $vervangingsduur_maanden
                  value: 3
              # lid 4, eerste alinea: "De steun wordt verleend in de vorm van
              # een gesubsidieerde dienst."
              - operation: EQUALS
                subject: $steunvorm
                value: GESUBSIDIEERDE_DIENST
              # lid 4, tweede alinea: "In dat geval mag lidmaatschap van die
              # groeperingen of organisaties geen voorwaarde zijn om toegang tot
              # die diensten te krijgen."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $verricht_door_producentengroepering_of_organisatie
                      value: true
                    then:
                      operation: NOT
                      value: $lidmaatschap_is_toegangsvoorwaarde
                default: true
              # lid 5: "De steunintensiteit bedraagt ten hoogste 100 % van de
              # werkelijk gemaakte kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '23'
- number: '24'
  text: |-
    **Steun voor afzetbevorderingsmaatregelen voor landbouwproducten**

    1.    Steun voor afzetbevorderingsmaatregelen voor landbouwproducten is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De steun dient voor de financiering van de kosten van:

    a) het organiseren van en deelnemen aan wedstrijden, handelsbeurzen en tentoonstellingen;

    b) publicaties om landbouwproducten beter bekend te maken bij het brede publiek.

    3.   In de in lid 2, punt b), bedoelde publicaties mag niet worden verwezen naar een specifieke onderneming, merknaam of oorsprong.

    De eerste alinea is evenwel niet van toepassing op een verwijzing naar de oorsprong van landbouwproducten die vallen onder:

    a) kwaliteitsregelingen als bedoeld in artikel 20, lid 2, punt a), mits die verwijzing exact overeenkomt met de door de Unie beschermde benaming;

    b) kwaliteitsregelingen als bedoeld in artikel 20, lid 2, punten b) en c), op voorwaarde dat de verwijzing in de boodschap van ondergeschikt belang is.

    4.    De steun dekt de volgende in aanmerking komende kosten van het organiseren van en deelnemen aan wedstrijden, beurzen en tentoonstellingen:

    a) deelnamekosten;

    b) reiskosten, kosten van het vervoer van dieren en van producten die onder de afzetbevorderingsactie vallen;

    c) kosten van publicaties en websites die het evenement aankondigen;

    d) de huur van tentoonstellingsruimten en -stands en de kosten van het opzetten en afbreken daarvan;

    e) symbolische prijzen tot een waarde van 3 000 EUR per prijs en per winnaar van een wedstrijd.

    ▼B
    5.   De steun geldt voor de volgende in aanmerking komende kosten van publicaties om landbouwproducten beter bekend te maken bij het brede publiek:

    a) de kosten van publicaties in de gedrukte en elektronische media, websites en spots in de elektronische media, op radio of televisie, waarmee feitelijke informatie wordt verstrekt over begunstigden die uit een bepaald gebied afkomstig zijn of een bepaald landbouwproduct produceren, mits de informatie neutraal is en alle betrokken begunstigden gelijke kansen hebben om in de publicatie aan bod te komen;

    b) kosten van de verspreiding van wetenschappelijke kennis en feitelijke informatie over:

    i) kwaliteitsregelingen als bedoeld in artikel 20, lid 2, die open staan voor landbouwproducten uit andere lidstaten en derde landen,

    ii) generieke landbouwproducten en hun voedingswaarde en tips voor het gebruik ervan.

    6.     De steun wordt verleend in een van de hierna genoemde vormen:

    a) in natura;

    b) als vergoeding van de kosten die de begunstigde werkelijk heeft gemaakt;

    c) met betrekking tot steun voor symbolische prijzen, ook in cash.

    Wanneer de steun in natura wordt verleend, gebeurt dat in de vorm van een gesubsidieerde dienst.

    De afzetbevorderingsmaatregelen mogen worden uitgevoerd door producentengroeperingen of andere organisaties, ongeacht hun omvang.

    De steun voor symbolische prijzen als bedoeld in lid 4, punt e), wordt slechts aan de aanbieder van de afzetbevorderingsmaatregelen betaald als de prijs werkelijk is uitgereikt en na voorlegging van een bewijs van die uitreiking.

    7.   De steun voor afzetbevorderingsmaatregelen is onder objectief vastgestelde voorwaarden toegankelijk voor alle ondernemingen die daarvoor in het betrokken gebied in aanmerking komen.

    Als de afzetbevorderingsmaatregel door producentengroeperingen en -organisaties wordt uitgevoerd, mag lidmaatschap van die groeperingen of organisaties geen voorwaarde voor deelname zijn. Eventuele bijdragen van niet-leden in de administratiekosten van de betrokken producentengroepering of -organisatie zijn beperkt tot de kosten van de uitvoering van de afzetbevorderingsmaatregelen.

    8.   De steunintensiteit bedraagt ten hoogste 100 % van de in aanmerking komende kosten.
