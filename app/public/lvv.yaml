          type: boolean
          description: >-
            De steun voor investeringen in bosbouwtechnologieën en in de
            verwerking, mobilisering en afzet van bosbouwproducten voldoet aan
            artikel 50, aan de aanmeldingsdrempel van artikel 4 en aan
            hoofdstuk I van deze verordening (lid 1).
      actions:
        - output: maximale_steunintensiteit_art_50_pct
          value:
            operation: IF
            cases:
              # lid 9: "De steunintensiteit kan tot maximaal 80 % worden
              # verhoogd voor de volgende investeringen: a) ... artikel 14,
              # lid 3, punten e), f) en g); b) investeringen in de
              # ultraperifere gebieden of de kleinere eilanden in de Egeïsche
              # Zee."
              - when:
                  operation: OR
                  conditions:
                    - $investering_met_milieu_klimaatdoelstellingen_art_14_lid_3
                    - $investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
                then: 80
            # lid 8: "De steunintensiteit bedraagt ten hoogste 65 % van de in
            # aanmerking komende kosten."
            default: 65
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '50'
        - output: voldoet_aan_voorwaarden_art_50
          value:
            operation: AND
            conditions:
              # lid 1: "Steun voor investeringen in bosbouwtechnologieën en in de
              # verwerking, mobilisering en afzet van bosbouwproducten"
              - $betreft_investering_bosbouwtechnologie_of_verwerking_afzet
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt s: "7,5 miljoen EUR per
              # investeringsproject"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_50
              # lid 2: "mag slechts worden toegekend op voorwaarde dat die
              # beoordeling is uitgevoerd en de vergunning voor het betrokken
              # investeringsproject is verleend vóór de datum van de toekenning
              # van de individuele steun"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $milieueffectbeoordeling_vereist
                  - $milieueffectbeoordeling_uitgevoerd_en_vergunning_vooraf_verleend
              # lid 3: "Steun voor grote ondernemingen is afhankelijk van de
              # overlegging van toepasselijke informatie uit een bosbeheerplan
              # of gelijkwaardig instrument dat in overeenstemming is met de
              # algemene richtsnoeren voor het duurzame beheer van de bossen in
              # Europa."
              - operation: OR
                conditions:
                  - $is_kmo
                  - $informatie_uit_bosbeheerplan_overgelegd
              # lid 6: "Investeringen om de economische waarde van bossen te
              # vergroten moeten worden gemotiveerd op basis van de te
              # verwachten verbeteringen in bossen op een of meer bedrijven"
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $investering_ter_vergroting_economische_waarde_bossen
                      value: true
                    then: $motivering_op_basis_van_verwachte_verbeteringen
                default: true
              # lid 7: "Investeringen met betrekking tot het gebruik van hout
              # als grondstof of energiebron blijven beperkt tot handelingen die
              # aan de industriële verwerking voorafgaan."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $investering_betreft_hout_als_grondstof_of_energiebron
                      value: true
                    then: $beperkt_tot_handelingen_voor_industriele_verwerking
                default: true
              # leden 8 en 9: de voorgenomen intensiteit blijft binnen het
              # toepasselijke maximum
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: $maximale_steunintensiteit_art_50_pct
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '50'
- number: '51'
  text: |-
    **Steun voor de instandhouding van genetische hulpbronnen in de bosbouw**

    1.    Steun voor de instandhouding van genetische hulpbronnen in de bosbouw in het kader van bosmilieuklimaatdiensten en bosinstandhouding is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   Voor de toepassing van dit artikel wordt verstaan onder:

    a) “instandhouding in situ”: instandhouding van genetisch materiaal in ecosystemen en natuurlijke habitats en het behoud en herstel van levensvatbare populaties van soorten in hun natuurlijke omgeving;

    b) “instandhouding op het bosbouwbedrijf”: instandhouding in situ en ontwikkeling op het bosbouwbedrijf;

    c) “instandhouding ex situ”: instandhouding van genetisch materiaal voor de bosbouw buiten de natuurlijke habitat;

    d) “verzameling ex situ”: verzameling genetisch materiaal voor de bosbouw die buiten de natuurlijke habitat wordt bewaard.

    3.   De steun dekt de kosten van de volgende verrichtingen:

    a) gerichte acties: acties ter bevordering van de instandhouding, de karakterisering, de verzameling en het gebruik van genetische hulpbronnen in de bosbouw in situ en ex situ, met inbegrip van de opstelling van webgebaseerde inventarissen van de genetische hulpbronnen die momenteel in situ worden bewaard, inclusief de instandhouding op het bosbouwbedrijf, van verzamelingen ex situ en databases;

    b) gecoördineerde acties: acties ter bevordering van de uitwisseling van informatie tussen de bevoegde organisaties van de lidstaten ten behoeve van de instandhouding, de karakterisering, de verzameling en het gebruik van genetische hulpbronnen in de bosbouw in de Unie;

    ▼B
    c) begeleidende acties: voorlichtings-, verspreidings- en adviseringsacties waarbij niet-gouvernementele organisaties en andere relevante belanghebbenden worden betrokken, opleidingen en de opstelling van technische verslagen.

    4.  De steun bedraagt ten hoogste 100 % van de in aanmerking komende kosten.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_51
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_51
    execution:
      parameters:
        - name: in_kader_van_bosmilieuklimaatdiensten_en_bosinstandhouding
          type: boolean
          required: true
          description: >-
            De instandhouding van genetische hulpbronnen in de bosbouw vindt
            plaats in het kader van bosmilieuklimaatdiensten en
            bosinstandhouding (lid 1).
        - name: soort_verrichting
          type: string
          required: true
          description: >-
            Soort verrichting waarvan de steun de kosten dekt (lid 3). Waarden:
            GERICHTE_ACTIE (bevordering van de instandhouding, de
            karakterisering, de verzameling en het gebruik van genetische
            hulpbronnen in de bosbouw in situ en ex situ, met inbegrip van
            webgebaseerde inventarissen, verzamelingen ex situ en databases),
            GECOORDINEERDE_ACTIE (bevordering van de uitwisseling van
            informatie tussen de bevoegde organisaties van de lidstaten),
            BEGELEIDENDE_ACTIE (voorlichtings-, verspreidings- en
            adviseringsacties, opleidingen en de opstelling van technische
            verslagen).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten. Gedeelde parameter.
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3). Artikel 4 kent voor artikel 51 geen aanmeldingsdrempel.
      output:
        - name: voldoet_aan_voorwaarden_art_51
          type: boolean
          description: >-
            De steun voor de instandhouding van genetische hulpbronnen in de
            bosbouw voldoet aan artikel 51 en aan hoofdstuk I van deze
            verordening (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_51
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 1: "Steun voor de instandhouding van genetische hulpbronnen
              # in de bosbouw in het kader van bosmilieuklimaatdiensten en
              # bosinstandhouding"
              - $in_kader_van_bosmilieuklimaatdiensten_en_bosinstandhouding
              # lid 3: "De steun dekt de kosten van de volgende verrichtingen:
              # a) gerichte acties ... b) gecoördineerde acties ...
              # c) begeleidende acties ..."
              - operation: IN
                subject: $soort_verrichting
                values:
                  - GERICHTE_ACTIE
                  - GECOORDINEERDE_ACTIE
                  - BEGELEIDENDE_ACTIE
              # lid 4: "De steun bedraagt ten hoogste 100 % van de in aanmerking
              # komende kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '51'
- number: '52'
  text: |-
    **Aanloopsteun voor producentengroeperingen en -organisaties in de bosbouwsector**

    1.    Aanloopsteun voor producentengroeperingen en -organisaties in de bosbouwsector is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening. De leden van de producentengroepering of -organisatie mogen geen grote ondernemingen zijn, met uitzondering van gemeenten.

    2.    Als alternatief voor de verlening van steun aan producentengroeperingen of -organisaties mag in de eerste vijf jaar na de oprichting van de groepering of organisatie steun ten belope van het totaalbedrag waarop de producentengroepering of -organisatie krachtens dit artikel recht zou hebben, rechtstreeks aan de producenten worden verleend ter compensatie van hun bijdragen aan de exploitatiekosten van de groepering of organisatie.

    3.   De steun dekt de volgende kosten:

    a) de kosten van het huren van geschikte panden tegen markttarieven;

    b) de kosten van de aankoop van kantooruitrusting;

    c) de kosten van administratief personeel en van een gekwalificeerd bosbeheerder;

    d) overheadkosten en vergoedingen voor juridische en ambtelijke handelingen;

    e) de kosten van aankoop van computerapparatuur en van aankoop of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen;

    f) bij aankoop van panden, een bedrag dat overeenstemt met de huurkosten tegen markttarieven.

    4.    Er wordt geen steun betaald voor kosten die worden gemaakt na het vijfde jaar nadat de bevoegde autoriteit van de lidstaat de producentengroepering of -organisatie officieel heeft erkend op basis van haar bedrijfsplan, behalve voor collectieve milieu- en klimaatacties met het oog op de doelstellingen van artikel 6 van Verordening (EU) 2021/2115.

    5.    Als de steun in jaarlijkse tranches wordt betaald, mogen de lidstaten de laatste tranche pas betalen nadat zij hebben geverifieerd dat het bedrijfsplan correct is uitgevoerd.

    6.   De steunintensiteit bedraagt ten hoogste 100 % van de in aanmerking komende kosten.

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_52
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_52
    untranslatables:
      - construct: alternatieve rechtstreekse steun aan de producenten ten belope van het totaalbedrag waarop de groepering of organisatie recht zou hebben (lid 2)
        reason: >-
          Het alternatief vergt de berekening van "het totaalbedrag waarop de
          producentengroepering of -organisatie krachtens dit artikel recht zou
          hebben" en de verdeling daarvan over de producenten ter compensatie
          van hun bijdragen aan de exploitatiekosten, binnen de eerste vijf jaar
          na de oprichting. Dat is aggregatie over de leden en een
          bedragsberekening, niet uitdrukbaar in de beschikbare operaties. Het
          model toetst de hoofdroute (steun aan de groepering of organisatie).
        legal_text_excerpt: >-
          Als alternatief voor de verlening van steun aan producentengroeperingen
          of -organisaties mag in de eerste vijf jaar na de oprichting van de
          groepering of organisatie steun ten belope van het totaalbedrag waarop
          de producentengroepering of -organisatie krachtens dit artikel recht
          zou hebben, rechtstreeks aan de producenten worden verleend ter
          compensatie van hun bijdragen aan de exploitatiekosten van de
          groepering of organisatie.
        accepted: false
    execution:
      parameters:
        - name: begunstigde_is_producentengroepering_of_organisatie_in_bosbouwsector
          type: boolean
          required: true
          description: >-
            De begunstigde is een producentengroepering of -organisatie in de
            bosbouwsector (lid 1). Voor het alternatief van lid 2
            (rechtstreekse steun aan de producenten) zie de untranslatable.
        - name: leden_geen_grote_ondernemingen_behalve_gemeenten
          type: boolean
          required: true
          description: >-
            Geen van de leden van de producentengroepering of -organisatie is
            een grote onderneming, met uitzondering van gemeenten (lid 1,
            tweede zin). Vaststelling over de ledenlijst; hier als feit
            aangeleverd.
        - name: kosten_binnen_subsidiabele_kostencategorieen
          type: boolean
          required: true
          description: >-
            De gedekte kosten vallen binnen lid 3, punten a-f: huur van
            geschikte panden tegen markttarieven, aankoop van kantooruitrusting,
            kosten van administratief personeel en van een gekwalificeerd
            bosbeheerder, overheadkosten en vergoedingen voor juridische en
            ambtelijke handelingen, aankoop van computerapparatuur en aankoop of
            gebruik van computersoftware, cloudoplossingen of soortgelijke
            oplossingen, en bij aankoop van panden een bedrag dat overeenstemt
            met de huurkosten tegen markttarieven.
        - name: kosten_gemaakt_na_vijfde_jaar_na_officiele_erkenning
          type: boolean
          required: true
          description: >-
            De steun betreft kosten die worden gemaakt na het vijfde jaar nadat
            de bevoegde autoriteit van de lidstaat de producentengroepering of
            -organisatie officieel heeft erkend op basis van haar bedrijfsplan
            (lid 4).
        - name: betreft_collectieve_milieu_en_klimaatacties
          type: boolean
          required: true
          description: >-
            De kosten betreffen collectieve milieu- en klimaatacties met het
            oog op de doelstellingen van artikel 6 van Verordening (EU)
            2021/2115 (lid 4, uitzondering).
        - name: steun_in_jaarlijkse_tranches
          type: boolean
          required: true
          description: De steun wordt in jaarlijkse tranches betaald (lid 5).
        - name: laatste_tranche_na_verificatie_bedrijfsplan
          type: boolean
          required: true
          description: >-
            De laatste tranche wordt pas betaald nadat is geverifieerd dat het
            bedrijfsplan correct is uitgevoerd (lid 5). Alleen getoetst als de
            steun in jaarlijkse tranches wordt betaald.
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten. Gedeelde parameter.
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3). Artikel 4 kent voor artikel 52 geen aanmeldingsdrempel.
      output:
        - name: voldoet_aan_voorwaarden_art_52
          type: boolean
          description: >-
            De aanloopsteun voor producentengroeperingen en -organisaties in de
            bosbouwsector voldoet aan artikel 52 en aan hoofdstuk I van deze
            verordening (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_52
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 1: "Aanloopsteun voor producentengroeperingen en
              # -organisaties in de bosbouwsector"
              - $begunstigde_is_producentengroepering_of_organisatie_in_bosbouwsector
              # lid 1, tweede zin: "De leden van de producentengroepering of
              # -organisatie mogen geen grote ondernemingen zijn, met
              # uitzondering van gemeenten."
              - $leden_geen_grote_ondernemingen_behalve_gemeenten
              # lid 3: "De steun dekt de volgende kosten: a) ... f)"
              - $kosten_binnen_subsidiabele_kostencategorieen
              # lid 4: "Er wordt geen steun betaald voor kosten die worden
              # gemaakt na het vijfde jaar nadat de bevoegde autoriteit van de
              # lidstaat de producentengroepering of -organisatie officieel
              # heeft erkend op basis van haar bedrijfsplan, behalve voor
              # collectieve milieu- en klimaatacties met het oog op de
              # doelstellingen van artikel 6 van Verordening (EU) 2021/2115."
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $kosten_gemaakt_na_vijfde_jaar_na_officiele_erkenning
                  - $betreft_collectieve_milieu_en_klimaatacties
              # lid 5: "Als de steun in jaarlijkse tranches wordt betaald, mogen
              # de lidstaten de laatste tranche pas betalen nadat zij hebben
              # geverifieerd dat het bedrijfsplan correct is uitgevoerd."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steun_in_jaarlijkse_tranches
                      value: true
                    then: $laatste_tranche_na_verificatie_bedrijfsplan
                default: true
              # lid 6: "De steunintensiteit bedraagt ten hoogste 100 % van de in
              # aanmerking komende kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '52'
- number: '53'
  text: |-
    **Steun voor ruilverkaveling van bosbouwgrond**

    1.    Steun voor ruilverkaveling van bosbouwgrond is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun wordt uitsluitend toegekend voor juridische en administratieve kosten, inclusief opmetingskosten.

    3.   De steun bedraagt ten hoogste 100 % van de werkelijk gemaakte kosten.
