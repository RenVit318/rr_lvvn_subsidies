        # leden 5 en 6: duur
        - name: steunduur_jaren
          type: number
          required: true
          description: Voorgenomen duur van de steunverlening in jaren (leden 5 en 6)
        - name: jaren_tussen_eerste_deelname_en_aanvraag
          type: number
          required: true
          description: >-
            Aantal jaren dat is verlopen tussen de eerste deelname aan de
            kwaliteitsregeling en het tijdstip van de steunaanvraag; 0 als de
            deelname niet voor de steunaanvraag is gestart (lid 6)
        # lid 7: maximumbedrag per begunstigde per jaar
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: Voorgenomen steunbedrag per begunstigde per jaar (lid 7)
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (lid 1; artikel 3)
      output:
        - name: voldoet_aan_voorwaarden_art_57
          type: boolean
          description: >-
            De voorgenomen steun voor landbouwers die tot een
            kwaliteitsregeling voor katoen of levensmiddelen toetreden voldoet
            aan artikel 57 en aan hoofdstuk I van deze verordening
      actions:
        - output: voldoet_aan_voorwaarden_art_57
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 1: "landbouwers"
              - $is_landbouwer
              # lid 1: "die toetreden, of in de voorgaande vijf jaar zijn
              # toegetreden"
              - $treedt_toe_of_toegetreden_voorgaande_vijf_jaar
              # lid 2, punt a
              - $steun_in_kader_strategisch_glb_plan
              # lid 2, punt b
              - $steun_identiek_aan_glb_plan_maatregel
              # lid 3: toetreding tot een van de genoemde soorten regelingen
              - operation: IN
                subject: $soort_kwaliteitsregeling_art_57
                values:
                  - KWALITEITSREGELING_VO_1151_2012
                  - DOOR_LIDSTAAT_ERKENDE_REGELING
                  - VRIJWILLIGE_CERTIFICERINGSREGELING
              # lid 4: vorm van een jaarlijkse financiele stimulans
              - $steun_in_vorm_jaarlijkse_financiele_stimulans
              # leden 5 en 6: hoogstens zeven jaar, verminderd met de jaren
              # tussen de eerste deelname en de steunaanvraag
              - operation: LESS_THAN_OR_EQUAL
