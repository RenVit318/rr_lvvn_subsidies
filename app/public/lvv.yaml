      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3). Artikel 4 kent voor artikel 26 geen aanmeldingsdrempel.
        # artikel 1, lid 1, punt a, i: alleen kmo's die in de primaire
        # landbouwproductie actief zijn; handhaving van die artikel-afhankelijke
        # beperking ligt bij dit artikel (zie untranslatable bij artikel 1)
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: De begunstigde is een kleine, middelgrote of micro-onderneming (Bijlage I)
      output:
        - name: voldoet_aan_voorwaarden_art_26
          type: boolean
          description: >-
            De steun voor de kosten van preventie, bestrijding en uitroeiing
            van dierziekten of plantenplagen dan wel voor het herstel van schade
            als gevolg daarvan voldoet aan artikel 26 en aan hoofdstuk I van
            deze verordening (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_26
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 1, lid 1, punt a, i: "alleen van toepassing ... op kmo's
              # die in de primaire landbouwproductie actief zijn" (handhaving
              # bij dit artikel)
              - $is_kmo
              - $actief_in_primaire_landbouwproductie
              # lid 1 jo. leden 8 t/m 12: het artikel kent drie steunsoorten
              - operation: IN
                subject: $soort_steun
                values:
                  - PREVENTIE
                  - BESTRIJDING_OF_UITROEIING
                  - HERSTEL_SCHADE
              # lid 1 ("dierziekten of plantenplagen") jo. lid 8: een invasieve
              # uitheemse soort telt alleen mee bij preventiemaatregelen ("die
              # zich nog niet heeft voorgedaan of nog niet geïntroduceerd is")
              - operation: OR
                conditions:
                  - operation: IN
                    subject: $soort_gebeurtenis
                    values:
                      - DIERZIEKTE
                      - PLANTENPLAAG
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $soort_gebeurtenis
                        value: INVASIEVE_UITHEEMSE_SOORT
                      - operation: EQUALS
                        subject: $soort_steun
                        value: PREVENTIE
              # lid 2, punt a: "de steun wordt uitsluitend betaald met
              # betrekking tot dierziekten of plantenplagen waarvoor wettelijk,
              # bestuursrechtelijk of administratief vastgestelde uniale of
              # nationale voorschriften gelden"
              - $voorschriften_gelden_voor_ziekte_of_plaag
              # lid 2, punt b: "de steun is onderdeel van het volgende programma
              # of van een van de volgende maatregelen: i) ... iv)"
              - $onderdeel_van_programma_of_maatregel
              # lid 2, slotalinea: "Het programma en de maatregelen ... moeten
              # een beschrijving bevatten van de betrokken preventie-,
              # bestrijdings- of uitroeiingsmaatregelen."
              - $programma_bevat_beschrijving_maatregelen
              # lid 3: "wordt de steun verleend voor dierziekten die zijn
              # opgenomen in de lijst ..." / lid 4: "De steun kan ook worden
              # toegekend voor nieuwe ziekten die voldoen aan de criteria van
              # artikel 6, lid 2, van Verordening (EU) 2016/429."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $soort_gebeurtenis
                      value: DIERZIEKTE
                    then:
                      operation: OR
                      conditions:
                        - operation: EQUALS
                          subject: $dierziekte_op_lijst
                          value: true
                        - operation: EQUALS
                          subject: $nieuwe_ziekte_voldoet_aan_criteria
                          value: true
                default: true
              # lid 5: "De steun mag geen betrekking hebben op maatregelen
              # waarvoor in de wetgeving van de Unie is bepaald dat de kosten
              # daarvan door de begunstigde moeten worden gedragen, tenzij deze
              # maatregelen volledig worden bekostigd uit de opbrengsten van aan
              # de begunstigden opgelegde verplichte heffingen."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $kosten_wettelijk_voor_rekening_begunstigde
                      value: true
                    then:
                      operation: EQUALS
                      subject: $volledig_bekostigd_uit_verplichte_heffingen
                      value: true
                default: true
              # lid 6, eerste alinea: "De steun wordt rechtstreeks betaald aan
              # de betrokken onderneming of aan een producentengroepering of
              # -organisatie waarvan de onderneming lid is."
              - operation: OR
                conditions:
                  - $steun_rechtstreeks_aan_onderneming_betaald
                  - $steun_betaald_aan_producentengroepering_waarvan_onderneming_lid
              # lid 6, tweede alinea: "Wanneer de steun aan een
              # producentengroepering of -organisatie wordt betaald, mag het
              # steunbedrag niet hoger zijn dan het steunbedrag waarvoor die
              # onderneming in aanmerking komt."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steun_betaald_aan_producentengroepering_waarvan_onderneming_lid
                      value: true
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $steunbedrag
                      value: $steunbedrag_waarvoor_onderneming_in_aanmerking_komt
                default: true
              # lid 7: "Steunregelingen ... worden ingesteld binnen drie jaar na
              # de datum waarop de door de dierziekte of plantenplaag
              # veroorzaakte kosten of schade zijn ontstaan"
              - operation: LESS_THAN_OR_EQUAL
                subject: $datum_instelling_steunregeling
                value:
                  operation: DATE_ADD
                  date: $datum_ontstaan_kosten_of_schade
                  years: 3
              # lid 7: "en de steun wordt binnen vier jaar na die datum betaald"
              - operation: LESS_THAN_OR_EQUAL
                subject: $datum_betaling_steun
                value:
                  operation: DATE_ADD
                  date: $datum_ontstaan_kosten_of_schade
                  years: 4
              # leden 8 en 9: "dekt de steun de volgende in aanmerking komende
              # kosten" (tussenstand, zie untranslatable)
              - operation: IF
                cases:
                  - when:
                      operation: IN
                      subject: $soort_steun
                      values:
                        - PREVENTIE
                        - BESTRIJDING_OF_UITROEIING
                    then:
                      operation: EQUALS
                      subject: $kosten_binnen_in_aanmerking_komende_categorieen
                      value: true
                default: true
              # lid 12: "De steun voor het herstel van schade ... blijft beperkt
              # tot de kosten en de schade als gevolg van dierziekten en
              # plantenplagen ten aanzien waarvan de bevoegde autoriteit van de
              # lidstaat: a) ... formeel heeft erkend dat zich een uitbraak
              # heeft voorgedaan; b) ... formeel de aanwezigheid ervan heeft
              # bevestigd."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $soort_steun
                      value: HERSTEL_SCHADE
                    then:
                      operation: EQUALS
                      subject: $uitbraak_formeel_erkend_of_aanwezigheid_bevestigd
                      value: true
                default: true
              # lid 13: "Steun in verband met de in de leden 8 en 9 bedoelde in
              # aanmerking komende kosten wordt verleend in natura en wordt
              # betaald aan de aanbieder van de preventie-, bestrijdings- en
              # uitroeiingsmaatregelen. In afwijking van de eerste alinea mag
              # steun ... rechtstreeks aan de begunstigde worden toegekend ..."
              - operation: IF
                cases:
                  - when:
                      operation: IN
                      subject: $soort_steun
                      values:
                        - PREVENTIE
                        - BESTRIJDING_OF_UITROEIING
                    then:
                      operation: OR
                      conditions:
                        - operation: EQUALS
                          subject: $steun_in_natura_aan_aanbieder
                          value: true
                        - operation: EQUALS
                          subject: $betaling_valt_onder_afwijking_lid_13
                          value: true
                default: true
              # lid 14: "Er mag geen individuele steun worden toegekend als
              # wordt geconstateerd dat de dierziekte of de besmetting met de
              # plantenplaag met opzet of door nalatigheid van de begunstigde
              # werd veroorzaakt."
              - operation: NOT
                value: $veroorzaakt_door_opzet_of_nalatigheid_begunstigde
              # lid 15: "De steun en eventuele andere door de begunstigde
              # ontvangen betalingen ... voor dezelfde in aanmerking komende
              # kosten als bedoeld in de leden 8, 9 en 10, mogen niet meer
              # bedragen dan 100 % van de in aanmerking komende kosten."
              # (100 % van de kosten = de kosten zelf)
              - operation: LESS_THAN_OR_EQUAL
                subject: $totale_betalingen_voor_dezelfde_kosten
                value: $subsidiabele_kosten
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '26'
- number: '27'
  text: |-
    **Steun voor de veeteeltsector en steun voor gestorven dieren**

    1.    De volgende steun voor veehouders is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun dient voor de financiering van:

    a) de administratieve kosten van het opstellen en bijhouden van stamboeken;

    b) de kosten van door of in opdracht van derden uitgevoerde tests om de genetische kwaliteit of het genetische rendement van dieren te bepalen, behalve de kosten van controles die door de eigenaar van de dieren worden verricht en van routinematige controles van de melkkwaliteit;

    c) de kosten van het afvoeren van gestorven dieren;

    d) de kosten van het vernietigen van gestorven dieren;

    e) de kosten van het afvoeren en vernietigen van gestorven dieren wanneer de steun wordt gefinancierd uit heffingen of verplichte bijdragen voor de financiering van het vernietigen van dergelijke gestorven dieren, mits die heffingen of bijdragen beperkt zijn tot de vleessector en rechtstreeks aan de vleessector worden opgelegd;

    f) de kosten van het afvoeren en vernietigen van gestorven dieren wanneer op de gestorven dieren TSE-tests moeten worden uitgevoerd of in het geval van een uitbraak van een in artikel 26, lid 3, bedoelde dierziekte.

    3.    De in lid 2, punten c), d), e) en f), bedoelde steun wordt enkel toegekend wanneer er een consistent monitoringprogramma is dat garandeert dat alle gestorven dieren in de lidstaat op veilige wijze worden verwijderd.

    Steun voor de kosten van door landbouwers betaalde verzekeringspremies ter dekking van de kosten van het afvoeren en vernietigen van gestorven dieren, als bedoeld in lid 2, punt e), van dit artikel moet aan de voorwaarden van artikel 28, lid 2, voldoen.

    ▼B
    4.    De steun wordt in natura verleend en niet in de vorm van rechtstreekse betalingen aan de begunstigden.

    Om het beheer van de in lid 2, punten c), d), e) en f), bedoelde steun te vergemakkelijken, mag deze steun worden uitgekeerd aan marktdeelnemers of organisaties die aan de volgende voorwaarden voldoen:

    a) zij zijn actief in het stadium volgend op dat van de ondernemingen die in de veelteeltsector actief zijn;

    b) zij verlenen diensten in verband met het afvoeren en vernietigen van gestorven dieren.

    5.   De steunintensiteit bedraagt ten hoogste:

    a) 70 % van de kosten van tests als bedoeld in lid 2, punt b);

    ▼M1
    b) 75 % van de kosten in verband met vernietiging zoals bedoeld in lid 2, punt d);

    c) 100 % van de in lid 2, punt a), bedoelde administratieve kosten en van de kosten in verband met het afvoeren en vernietigen zoals bedoeld in lid 2, punten c), e) en f).

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_27
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_27
    untranslatables:
      - construct: beoordeling "consistent monitoringprogramma" (lid 3, eerste alinea)
        reason: >-
          Open norm: of een monitoringprogramma "consistent" is en "garandeert dat
          alle gestorven dieren in de lidstaat op veilige wijze worden verwijderd"
          vergt een beoordeling van dat programma. Het bestaan ervan is als
          boolean-parameter gemodelleerd; de beoordeling zelf niet.
        legal_text_excerpt: >-
          De in lid 2, punten c), d), e) en f), bedoelde steun wordt enkel
          toegekend wanneer er een consistent monitoringprogramma is dat
          garandeert dat alle gestorven dieren in de lidstaat op veilige wijze
          worden verwijderd.
        accepted: false
      - construct: TSE-testplicht en uitbraak van een in artikel 26, lid 3, bedoelde dierziekte (lid 2, punt f)
        reason: >-
          Of op de gestorven dieren TSE-tests "moeten" worden uitgevoerd, dan wel
          sprake is van een uitbraak van een in artikel 26, lid 3, bedoelde
          dierziekte, vergt een opzoeking in externe (veterinaire) regelgeving en
          vaststellingen. Dit feit zit besloten in de keuze van de
          kostencategorie AFVOEREN_EN_VERNIETIGEN_TSE_OF_DIERZIEKTE en wordt hier
          niet zelf afgeleid.
        legal_text_excerpt: >-
          de kosten van het afvoeren en vernietigen van gestorven dieren wanneer
          op de gestorven dieren TSE-tests moeten worden uitgevoerd of in het
          geval van een uitbraak van een in artikel 26, lid 3, bedoelde dierziekte
        accepted: false
    execution:
      parameters:
        - name: begunstigde_is_veehouder
          type: boolean
          required: true
          description: >-
            De begunstigde is een veehouder (lid 1: "De volgende steun voor
            veehouders").
        - name: kostencategorie_art_27
          type: string
          required: true
          description: >-
            Welke kosten de steun financiert (lid 2). Waarden: STAMBOEKEN (punt a,
            administratieve kosten van het opstellen en bijhouden van stamboeken),
            GENETISCHE_TESTS (punt b, door of in opdracht van derden uitgevoerde
            tests om de genetische kwaliteit of het genetische rendement van
            dieren te bepalen), AFVOEREN_GESTORVEN_DIEREN (punt c),
            VERNIETIGEN_GESTORVEN_DIEREN (punt d),
            AFVOEREN_EN_VERNIETIGEN_HEFFINGSGEFINANCIERD (punt e, gefinancierd
            uit heffingen of verplichte bijdragen),
            AFVOEREN_EN_VERNIETIGEN_TSE_OF_DIERZIEKTE (punt f).
        - name: betreft_eigenaarcontroles_of_routinematige_melkcontrole
          type: boolean
          required: false
          description: >-
            Alleen bij GENETISCHE_TESTS: de kosten betreffen controles die door
            de eigenaar van de dieren worden verricht of routinematige controles
            van de melkkwaliteit (lid 2, punt b: "behalve..."). Die kosten zijn
            uitgesloten.
        - name: heffingen_beperkt_tot_en_rechtstreeks_opgelegd_aan_vleessector
          type: boolean
          required: false
          description: >-
            Alleen bij AFVOEREN_EN_VERNIETIGEN_HEFFINGSGEFINANCIERD: de heffingen
            of verplichte bijdragen zijn beperkt tot de vleessector en worden
            rechtstreeks aan de vleessector opgelegd (lid 2, punt e, "mits...").
        - name: consistent_monitoringprogramma_gestorven_dieren
          type: boolean
          required: false
          description: >-
            Er is een consistent monitoringprogramma dat garandeert dat alle
            gestorven dieren in de lidstaat op veilige wijze worden verwijderd
            (lid 3, eerste alinea; vereist bij de categorieën van lid 2, punten
            c, d, e en f). Beoordeling van het programma: zie untranslatable.
        - name: steun_betreft_verzekeringspremies_afvoer_vernietiging
          type: boolean
          required: false
          description: >-
            De steun betreft kosten van door landbouwers betaalde
            verzekeringspremies ter dekking van de kosten van het afvoeren en
            vernietigen van gestorven dieren, als bedoeld in lid 2, punt e
            (lid 3, tweede alinea). Dan gelden de voorwaarden van artikel 28,
            lid 2 (gebonden input).
        - name: steun_in_natura
          type: boolean
          required: true
          description: >-
            De steun wordt in natura verleend en niet in de vorm van
            rechtstreekse betalingen aan de begunstigden (lid 4, eerste alinea).
        - name: steun_uitgekeerd_aan_marktdeelnemer_of_organisatie
          type: boolean
          required: false
          description: >-
            De steun wordt uitgekeerd aan marktdeelnemers of organisaties in
            plaats van aan de begunstigden (lid 4, tweede alinea; alleen
            toegestaan voor de steun van lid 2, punten c, d, e en f).
        - name: marktdeelnemer_actief_in_stadium_na_veeteeltsector
          type: boolean
          required: false
          description: >-
            De marktdeelnemer/organisatie is actief in het stadium volgend op dat
            van de ondernemingen die in de veeteeltsector actief zijn (lid 4,
            tweede alinea, punt a).
        - name: marktdeelnemer_verleent_afvoer_vernietigingsdiensten
          type: boolean
          required: false
          description: >-
            De marktdeelnemer/organisatie verleent diensten in verband met het
            afvoeren en vernietigen van gestorven dieren (lid 4, tweede alinea,
            punt b).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de kosten (lid 5; gedeeld
            vocabulaire).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            Hoofdstuk I is nageleefd (artikel 3); lid 1 eist "als wordt voldaan
            aan dit artikel en aan hoofdstuk I van deze verordening".
        - name: voldoet_aan_voorwaarden_verzekeringspremiesteun_art_28_lid_2
          type: boolean
          source:
            output: voldoet_aan_voorwaarden_verzekeringspremiesteun_art_28_lid_2
          description: >-
            De voorwaarden van artikel 28, lid 2 voor steun voor de betaling van
            verzekeringspremies (lid 3, tweede alinea verwijst daarnaar).
      output:
        - name: voldoet_aan_voorwaarden_art_27
          type: boolean
          description: >-
            De voorgenomen steun voor de veeteeltsector of voor gestorven dieren
            voldoet aan de voorwaarden van artikel 27 en aan hoofdstuk I
            (artikel 4 kent voor artikel 27 geen aanmeldingsdrempel).
      actions:
        - output: voldoet_aan_voorwaarden_art_27
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 1: "De volgende steun voor veehouders"
              - $begunstigde_is_veehouder
              # lid 2: "De steun dient voor de financiering van" a) t/m f)
              - operation: IN
                subject: $kostencategorie_art_27
                values:
                  - STAMBOEKEN
                  - GENETISCHE_TESTS
                  - AFVOEREN_GESTORVEN_DIEREN
                  - VERNIETIGEN_GESTORVEN_DIEREN
                  - AFVOEREN_EN_VERNIETIGEN_HEFFINGSGEFINANCIERD
                  - AFVOEREN_EN_VERNIETIGEN_TSE_OF_DIERZIEKTE
              # lid 2, punt b: "behalve de kosten van controles die door de
              # eigenaar van de dieren worden verricht en van routinematige
              # controles van de melkkwaliteit"
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $kostencategorie_art_27
                      value: GENETISCHE_TESTS
                    then:
                      operation: NOT
                      value: $betreft_eigenaarcontroles_of_routinematige_melkcontrole
                default: true
              # lid 2, punt e: "mits die heffingen of bijdragen beperkt zijn tot
              # de vleessector en rechtstreeks aan de vleessector worden opgelegd"
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $kostencategorie_art_27
                      value: AFVOEREN_EN_VERNIETIGEN_HEFFINGSGEFINANCIERD
                    then: $heffingen_beperkt_tot_en_rechtstreeks_opgelegd_aan_vleessector
                default: true
              # lid 3, eerste alinea: monitoringprogramma vereist voor de steun
              # van lid 2, punten c), d), e) en f)
              - operation: IF
                cases:
                  - when:
                      operation: IN
                      subject: $kostencategorie_art_27
                      values:
                        - AFVOEREN_GESTORVEN_DIEREN
                        - VERNIETIGEN_GESTORVEN_DIEREN
                        - AFVOEREN_EN_VERNIETIGEN_HEFFINGSGEFINANCIERD
                        - AFVOEREN_EN_VERNIETIGEN_TSE_OF_DIERZIEKTE
                    then: $consistent_monitoringprogramma_gestorven_dieren
                default: true
              # lid 3, tweede alinea: premiesteun "moet aan de voorwaarden van
              # artikel 28, lid 2, voldoen"
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steun_betreft_verzekeringspremies_afvoer_vernietiging
                      value: true
                    then: $voldoet_aan_voorwaarden_verzekeringspremiesteun_art_28_lid_2
                default: true
              # lid 4, eerste alinea: "De steun wordt in natura verleend en niet
              # in de vorm van rechtstreekse betalingen aan de begunstigden."
              - $steun_in_natura
              # lid 4, tweede alinea: uitkering aan marktdeelnemers/organisaties
              # mag alleen voor de steun van lid 2, punten c-f, en alleen als zij
              # aan de voorwaarden a) en b) voldoen
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steun_uitgekeerd_aan_marktdeelnemer_of_organisatie
                      value: true
                    then:
                      operation: AND
                      conditions:
                        - operation: IN
                          subject: $kostencategorie_art_27
                          values:
                            - AFVOEREN_GESTORVEN_DIEREN
                            - VERNIETIGEN_GESTORVEN_DIEREN
                            - AFVOEREN_EN_VERNIETIGEN_HEFFINGSGEFINANCIERD
                            - AFVOEREN_EN_VERNIETIGEN_TSE_OF_DIERZIEKTE
                        - $marktdeelnemer_actief_in_stadium_na_veeteeltsector
                        - $marktdeelnemer_verleent_afvoer_vernietigingsdiensten
                default: true
              # lid 5: "De steunintensiteit bedraagt ten hoogste": a) 70 % voor
              # tests (lid 2, punt b); b) 75 % voor vernietiging (lid 2, punt d);
              # c) 100 % voor de punten a), c), e) en f)
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value:
                  operation: IF
                  cases:
                    - when:
                        operation: EQUALS
                        subject: $kostencategorie_art_27
                        value: GENETISCHE_TESTS
                      then: 70
                    - when:
                        operation: EQUALS
                        subject: $kostencategorie_art_27
                        value: VERNIETIGEN_GESTORVEN_DIEREN
                      then: 75
                  default: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '27'
- number: '28'
  text: |-
    **Steun voor de betaling van verzekeringspremies en voor financiële bijdragen aan onderlinge fondsen**

    1.    Steun voor de betaling van verzekeringspremies en voor financiële bijdragen aan onderlinge fondsen is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   Steun voor de betaling van verzekeringspremies:

    a) mag de werking van de interne markt voor verzekeringsdiensten niet belemmeren;

    b) mag niet worden beperkt tot verzekeringen van een enkele verzekeringsmaatschappij of groep verzekeringsmaatschappijen;

    c) mag niet worden gekoppeld aan de voorwaarde dat het verzekeringscontract wordt gesloten met een in de betrokken lidstaat gevestigde maatschappij.

    3.   De verzekering of bijdrage aan het onderlinge fonds is bestemd voor de dekking van verliezen door:

    a) natuurrampen;

    b) ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld en andere ongunstige weersomstandigheden;

    c) dierziekten, plantenplagen of beschermde dieren;

    d) en biedt compensatie voor verzekeringspremies waarmee de kosten van het afvoeren en vernietigen van gestorven dieren worden gedekt.

    ▼B
    4.   De verzekering of bijdrage aan het onderlinge fonds:

    a) vergoedt uitsluitend de kosten van het herstel van de in lid 3 bedoelde verliezen;

    b) omvat geen voorwaarden of bepalingen wat betreft het type of de omvang van de toekomstige landbouwproductie.

    5.    De lidstaten mogen het bedrag van de verzekeringspremie dat voor steun in aanmerking komt, beperken door passende plafonds in te stellen.

    6.    Het betrokken onderlinge fonds voldoet aan de volgende cumulatieve voorwaarden:

    a) het moet door de bevoegde autoriteit van de lidstaat zijn geaccrediteerd overeenkomstig de nationale wetgeving;

    b) het moet een transpart beleid voeren ten aanzien van de betalingen aan en afboekingen van het betrokken fonds;

    c) het moet beschikken over duidelijke voorschriften inzake de toewijzing van verantwoordelijkheid voor schulden.

    7.    De lidstaten stellen voorschriften vast voor de oprichting en het beheer van de onderlinge fondsen, met name met betrekking tot de verlening van compensatiebetalingen en met betrekking tot het beheer en de monitoring van de naleving van die voorschriften. De lidstaten zien erop toe dat de regelingen van de fondsen voorzien in sancties in geval van nalatigheid van de begunstigde.

    8.   De steunintensiteit bedraagt ten hoogste 70 % van de kosten van de verzekeringspremie of van de financiële bijdrage aan het onderling fonds.
