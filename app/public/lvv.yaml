            artikel 57 (lid 5)
        # lid 7: oorsprong als koopmotief alleen bij titel II Vo 1151/2012
        - name: zet_aan_tot_kopen_wegens_oorsprong
          type: boolean
          required: true
          description: >-
            De acties zetten de consument ertoe aan katoen of een levensmiddel
            te kopen wegens de bijzondere oorsprong ervan (lid 7)
        - name: valt_onder_titel_ii_vo_1151_2012
          type: boolean
          required: false
          description: >-
            De katoen of het levensmiddel valt onder kwaliteitsregelingen als
