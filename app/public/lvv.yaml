        - name: aanmeldingsdrempel_art_45_na_eerste_periode
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_45_na_eerste_periode
          description: >-
            Aanmeldingsdrempel van artikel 4, lid 1, punt o, voor de periode na
            de eerste periode (200 EUR per hectare per jaar).
      output:
        - name: voldoet_aan_voorwaarden_art_45
          type: boolean
          description: >-
            De voorgenomen steun voor het opvangen van gebiedsspecifieke nadelen
            die het gevolg zijn van bepaalde verplichte vereisten voldoet aan
            artikel 45 en aan hoofdstuk I van deze verordening (lid 1), binnen
            de aanmeldingsdrempel van artikel 4.
      actions:
        - output: voldoet_aan_voorwaarden_art_45
          value:
            operation: AND
            conditions:
              # lid 1/4: begunstigde is bosbezitter, bosbeheerder of vereniging
              - $is_bosbezitter_bosbeheerder_of_vereniging
              # lid 1/2: nadelen uit de uitvoering van Richtlijn 92/43/EEG of
              # Richtlijn 2009/147/EG
              - $nadelen_uit_richtlijn_92_43_of_richtlijn_2009_147
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2: jaarlijks per hectare bosareaal
              - $steun_jaarlijks_per_hectare_bosareaal
              # lid 3: alleen Natura 2000-bosgebieden of landschapselementen
              # (artikel 10 Richtlijn 92/43/EEG, ten hoogste 5 % van het netwerk)
              - operation: OR
                conditions:
                  - $is_natura_2000_bosgebied
                  - operation: AND
                    conditions:
                      - $is_landschapselement_artikel_10_richtlijn_92_43
                      - $landschapselementen_ten_hoogste_5_pct_natura_2000_netwerk
              # artikel 4, lid 1, punt o: drempel per hectare per jaar,
              # afhankelijk van de periode
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value:
                  operation: IF
                  cases:
                    - when: $binnen_eerste_periode_van_ten_hoogste_vijf_jaar
                      then: $aanmeldingsdrempel_art_45
                  default: $aanmeldingsdrempel_art_45_na_eerste_periode
              # lid 5: maximum 500 EUR per hectare per jaar in de eerste periode
              # van ten hoogste vijf jaar, 200 EUR per hectare per jaar daarna
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value:
                  operation: IF
                  cases:
                    - when: $binnen_eerste_periode_van_ten_hoogste_vijf_jaar
                      then: 50000
                  default: 20000
              # lid 5: steunintensiteit beperkt tot 100 % van de kosten
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
