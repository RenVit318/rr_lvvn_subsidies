  text: |-
    **Steun voor basisdiensten en infrastructuur in plattelandsgebieden**

    1.    Steun die in het kader van een strategisch GLB-plan wordt verleend voor basisdiensten en infrastructuur in plattelandsgebieden is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als deze pas ten uitvoer wordt gelegd nadat de Commissie het betrokken strategisch GLB-plan heeft goedgekeurd, en voldoet aan dit artikel en aan hoofdstuk I van deze verordening.

    ▼B
    2.     De steun moet aan de twee onderstaande voorwaarden voldoen:

    a) hij wordt in een van de volgende vormen verleend in het kader van een strategisch GLB-plan overeenkomstig Verordening (EU) 2021/2115:

    i) als steun die uit het Elfpo wordt gecofinancierd,

    ii) als aanvullende nationale financiering bij uit het Elfpo gecofinancierde steun;

    b) hij is identiek aan de desbetreffende maatregel van het in punt a) bedoelde strategisch GLB-plan.

    3.     De steun dekt:

    a) investeringen in de aanleg, verbetering of uitbreiding van allerhande soorten infrastructuur waarvan de in aanmerking komende kosten hoogstens 2 miljoen EUR bedragen (“kleinschalige infrastructuur”), met uitzondering van investeringen in hernieuwbare energie, energie-efficiëntie en breedbandinfrastructuur, die niet in aanmerking komen;

    b) investeringen in het opzetten, verbeteren of uitbreiden van lokale basisdiensten voor de plattelandsbevolking, waarbij het kan gaan om sociale diensten, vrijetijdsbesteding en cultuurbeleving, en de daarbij horende infrastructuur;

    c) investeringen voor publiek gebruik in recreatie-infrastructuur, toeristische informatie en kleinschalige toeristische infrastructuur;

    d) investeringen met betrekking tot de instandhouding, het herstel en de opwaardering van het culturele en natuurlijke erfgoed van dorpen, rurale landschappen en locaties met hoge natuurwaarde, met inbegrip van de daarmee verbonden sociaaleconomische aspecten, alsmede acties gericht op milieubewustzijn;

    e) investeringen voor het verplaatsen van activiteiten en het verbouwen van gebouwen of andere voorzieningen die in of dicht bij rurale woongebieden gelegen zijn, met als doel de levenskwaliteit te verbeteren of de milieuprestatie van die woongebieden te verbeteren.

    4.   De verrichtingen in het kader van de in lid 3 bedoelde investeringen moeten worden uitgevoerd volgens de ontwikkelingsplannen voor de gemeenten en dorpen in de plattelandsgebieden en hun basisdiensten, voor zover dergelijke plannen voorhanden zijn, en moeten stroken met de toepasselijke strategieën voor lokale ontwikkeling. Dergelijke plannen zijn niet vereist voor investeringen waarvoor steun wordt verleend in de vorm van financieringsinstrumenten.

    5.     De steun dekt de volgende in aanmerking komende kosten:

    a) kosten van het opstellen en bijwerken van ontwikkelings- en beheerplannen voor plattelandsgebieden en hun basisdiensten en voor locaties met hoge natuurwaarde;

    b) kosten van het verrichten van studies in verband met cultureel en natuurlijk erfgoed, rurale landschappen en locaties met hoge natuurwaarde;

    c) kosten van investeringen in materiële en immateriële activa;

    d) kosten in verband met acties om het milieubewustzijn te vergroten.

    De kosten van gekapitaliseerde werkzaamheden kunnen ook in aanmerking komen voor de in lid 3, punt d) bedoelde steun.

    ▼B Werkkapitaal wordt niet beschouwd als in aanmerking komende kosten. De steun mag niet worden verleend in de vorm van exploitatiesteun.

    6.   Voor de in lid 3, punten a) tot en met d), bedoelde activiteiten bedraagt de steunintensiteit ten hoogste 100 % van de in aanmerking komende kosten.

    Om de maximale steunintensiteit niet te overschrijden worden voor de in lid 3, punten b), c) en d), bedoelde activiteiten de netto-inkomsten in mindering gebracht op de in aanmerking komende kosten, hetzij vooraf op basis van redelijke prognoses, hetzij via een terugvorderingsmechanisme. Bij wijze van alternatief kan voor steun van hoogstens 1 miljoen EUR de maximale steunintensiteit worden vastgesteld op 80 % van de in aanmerking komende kosten.

    7.    Wat de in lid 3, punt e), bedoelde investeringen betreft, bedraagt de steunintensiteit niet meer dan 100 % van de reële kosten van dergelijke activiteiten wanneer de verplaatsing van de activiteiten of de verbouwing van gebouwen of andere voorzieningen bestaat uit het demonteren, verhuizen en weer opbouwen van bestaande voorzieningen.

    Wanneer de verplaatsing van de activiteiten of de verbouwing van gebouwen of andere voorzieningen, naast het in de eerste alinea bedoelde demonteren, verhuizen en weer opbouwen van bestaande voorzieningen, leidt tot een modernisering van die voorzieningen of tot een verhoging van de productiecapaciteit, mogen de steunintensiteiten niet hoger zijn dan de maximale steunintensiteit die voor de kosten in verband met de modernisering van voorzieningen of de verhoging van de productiecapaciteit is vastgesteld op de regionalesteunkaart die van kracht is op het tijdstip waarop de steun in het betrokken gebied wordt verleend. De loutere vervanging van een bestaand gebouw of van bestaande voorzieningen door een nieuw, modern gebouw of nieuwe, moderne voorzieningen waarbij de betrokken productie of technologie niet fundamenteel wordt gewijzigd, wordt niet geacht met modernisering gepaard te gaan.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_55
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_55
    untranslatables:
      - construct: netto-inkomsten-aftrek en 80%-alternatief (lid 6, tweede alinea)
        reason: >-
          Het in mindering brengen van netto-inkomsten op de in aanmerking
          komende kosten ("hetzij vooraf op basis van redelijke prognoses,
          hetzij via een terugvorderingsmechanisme") is een berekening over de
          kostenbasis met een keuze uit twee mechanismen; het alternatief
          (80% bij steun tot 1 miljoen EUR) is een keuze van de lidstaat.
          Beide zijn geen toetsbare voorwaarde op de voorgenomen maatregel.
        legal_text_excerpt: >-
          worden voor de in lid 3, punten b), c) en d), bedoelde activiteiten
          de netto-inkomsten in mindering gebracht op de in aanmerking komende
          kosten, hetzij vooraf op basis van redelijke prognoses, hetzij via
          een terugvorderingsmechanisme. Bij wijze van alternatief kan voor
          steun van hoogstens 1 miljoen EUR de maximale steunintensiteit
          worden vastgesteld op 80 % van de in aanmerking komende kosten.
        accepted: false
      - construct: regionalesteunkaart-toets bij modernisering of capaciteitsverhoging (lid 7, tweede alinea)
        reason: >-
          Bij verplaatsing/verbouwing die tot modernisering of verhoging van de
          productiecapaciteit leidt, geldt de maximale steunintensiteit van de
          regionale steunkaart die op het tijdstip van toekenning van kracht is:
          een tabel-opzoeking in een extern, tijdsafhankelijk instrument.
        legal_text_excerpt: >-
          mogen de steunintensiteiten niet hoger zijn dan de maximale
          steunintensiteit die ... is vastgesteld op de regionalesteunkaart die
          van kracht is op het tijdstip waarop de steun in het betrokken gebied
          wordt verleend.
        accepted: false
      - construct: uitsluiting van werkkapitaal als in aanmerking komende kosten (lid 5, slotalinea)
        reason: >-
          Regel over de samenstelling van de in aanmerking komende kosten; de
          berekening van de kostenbasis zelf wordt in deze breedte-eerst-fase
          niet gemodelleerd.
        legal_text_excerpt: Werkkapitaal wordt niet beschouwd als in aanmerking komende kosten.
        accepted: false
    execution:
      parameters:
        # lid 1: "pas ten uitvoer wordt gelegd nadat de Commissie het betrokken
        # strategisch GLB-plan heeft goedgekeurd"
        - name: glb_plan_goedgekeurd_voor_tenuitvoerlegging
          type: boolean
          required: true
          description: >-
            De steun wordt pas ten uitvoer gelegd nadat de Commissie het
            betrokken strategisch GLB-plan heeft goedgekeurd (lid 1)
        # lid 2, punt a: Elfpo-cofinanciering of aanvullende nationale financiering
        - name: steun_in_kader_strategisch_glb_plan
          type: boolean
          required: true
          description: >-
            De steun wordt in het kader van een strategisch GLB-plan
            overeenkomstig Verordening (EU) 2021/2115 verleend als uit het
            Elfpo gecofinancierde steun of als aanvullende nationale
            financiering daarbij (lid 2, punt a)
        # lid 2, punt b
        - name: steun_identiek_aan_glb_plan_maatregel
          type: boolean
          required: true
          description: >-
            De steun is identiek aan de desbetreffende maatregel van het
            strategisch GLB-plan (lid 2, punt b)
        # opschrift + lid 1: "in plattelandsgebieden"
        - name: basisdiensten_en_infrastructuur_in_plattelandsgebied
          type: boolean
          required: true
          description: >-
            De basisdiensten en infrastructuur waarvoor steun wordt verleend
            liggen in plattelandsgebieden (lid 1)
        # lid 3: de vijf gedekte investeringscategorieen
        - name: soort_investering_art_55
          type: string
          required: true
          description: >-
            Investeringscategorie van lid 3: KLEINSCHALIGE_INFRASTRUCTUUR
            (punt a), LOKALE_BASISDIENSTEN (punt b), RECREATIE_EN_TOERISME
            (punt c), ERFGOED_EN_MILIEUBEWUSTZIJN (punt d),
            VERPLAATSING_EN_VERBOUWING (punt e)
        # lid 3, punt a: kostengrens kleinschalige infrastructuur
        - name: subsidiabele_kosten
          type: amount
          required: false
          type_spec:
            unit: eurocent
          description: >-
            In aanmerking komende kosten van de investering; voor
            kleinschalige infrastructuur hoogstens 2 miljoen EUR (lid 3,
            punt a). Alleen vereist bij KLEINSCHALIGE_INFRASTRUCTUUR.
        # lid 3, punt a: "met uitzondering van investeringen in hernieuwbare
        # energie, energie-efficientie en breedbandinfrastructuur"
        - name: betreft_hernieuwbare_energie_energie_efficientie_of_breedband
          type: boolean
          required: false
          description: >-
            De infrastructuurinvestering betreft hernieuwbare energie,
            energie-efficientie of breedbandinfrastructuur; die komen niet in
            aanmerking (lid 3, punt a). Alleen relevant bij
            KLEINSCHALIGE_INFRASTRUCTUUR.
        # lid 4
        - name: strookt_met_ontwikkelingsplannen_en_lokale_strategieen
          type: boolean
          required: true
          description: >-
            De verrichtingen worden uitgevoerd volgens de ontwikkelingsplannen
            voor de gemeenten en dorpen in de plattelandsgebieden en hun
            basisdiensten, voor zover dergelijke plannen voorhanden zijn, en
            stroken met de toepasselijke strategieen voor lokale ontwikkeling;
            plannen zijn niet vereist bij steun in de vorm van
            financieringsinstrumenten (lid 4)
        # lid 5, slotalinea: "De steun mag niet worden verleend in de vorm van
        # exploitatiesteun."
        - name: is_exploitatiesteun
          type: boolean
          required: true
          description: De steun wordt verleend in de vorm van exploitatiesteun (lid 5, slotalinea)
        # leden 6 en 7: maximale steunintensiteit 100%
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in procenten van de in aanmerking
            komende kosten (leden 6 en 7)
        # artikel 4: aanmeldingsdrempel
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steunbedrag per investeringsproject, te toetsen aan de
            aanmeldingsdrempel van artikel 4
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (lid 1; artikel 3)
        - name: aanmeldingsdrempel_art_55
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_55
          description: Aanmeldingsdrempel van artikel 4 voor artikel 55 (10 miljoen EUR per investeringsproject)
      output:
        - name: voldoet_aan_voorwaarden_art_55
          type: boolean
          description: >-
            De voorgenomen steun voor basisdiensten en infrastructuur in
            plattelandsgebieden voldoet aan artikel 55 en aan hoofdstuk I van
            deze verordening
      actions:
        - output: voldoet_aan_voorwaarden_art_55
          value:
            operation: AND
            conditions:
              # lid 1: "voldoet aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 1: tenuitvoerlegging pas na goedkeuring GLB-plan
              - $glb_plan_goedgekeurd_voor_tenuitvoerlegging
              # lid 2, punt a
              - $steun_in_kader_strategisch_glb_plan
              # lid 2, punt b
              - $steun_identiek_aan_glb_plan_maatregel
              # lid 1: "in plattelandsgebieden"
              - $basisdiensten_en_infrastructuur_in_plattelandsgebied
              # artikel 4, lid 1: aanmeldingsdrempel
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_55
              # lid 3: de steun dekt een van de categorieen a-e; voor punt a
              # geldt de kostengrens van 2 miljoen EUR en de uitzondering voor
              # hernieuwbare energie, energie-efficientie en breedband
              - operation: OR
                conditions:
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $soort_investering_art_55
                        value: KLEINSCHALIGE_INFRASTRUCTUUR
                      - operation: LESS_THAN_OR_EQUAL
                        subject: $subsidiabele_kosten
                        value: 200000000
                      - operation: NOT
                        value: $betreft_hernieuwbare_energie_energie_efficientie_of_breedband
                  - operation: IN
                    subject: $soort_investering_art_55
                    values:
                      - LOKALE_BASISDIENSTEN
                      - RECREATIE_EN_TOERISME
                      - ERFGOED_EN_MILIEUBEWUSTZIJN
                      - VERPLAATSING_EN_VERBOUWING
              # lid 4
              - $strookt_met_ontwikkelingsplannen_en_lokale_strategieen
              # lid 5, slotalinea: geen exploitatiesteun
              - operation: NOT
                value: $is_exploitatiesteun
              # leden 6 en 7: "ten hoogste 100 % van de in aanmerking komende
              # kosten" resp. "niet meer dan 100 % van de reele kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '55'
- number: '56'
  text: |-
    **Aanloopsteun          voor        niet-agrarische     activiteiten     in plattelandsgebieden**

    1.    Aanloopsteun voor niet-agrarische activiteiten in plattelandsgebieden is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.     De steun moet aan de twee onderstaande voorwaarden voldoen:

    a) hij wordt in een van de volgende vormen verleend in het kader van een strategisch GLB-plan overeenkomstig Verordening (EU) 2021/2115:

    i) als steun die uit het Elfpo wordt gecofinancierd,

    ii) als aanvullende nationale financiering bij de in punt i) genoemde steun;

    b) hij is identiek aan de desbetreffende maatregel van het in punt a) bedoelde strategisch GLB-plan.

    3.   Er wordt steun verleend aan de volgende categorieën begunstigden:

    a) landbouwers of leden van een landbouwhuishouden in plattelandsgebieden die diversifiëren naar niet-agrarische activiteiten;

    ▼B
    b) kleine en micro-ondernemingen in plattelandsgebieden;

    c) natuurlijke personen in plattelandsgebieden.

    4.    Als het in lid 3, punt a), bedoelde lid van een landbouwhuishouden een rechtspersoon of een groep rechtspersonen is, moet dat lid op het tijdstip dat de steunaanvraag wordt ingediend, een landbouwactiviteit op het landbouwbedrijf uitoefenen.

    5.   De steun is afhankelijk van de indiening van een bedrijfsplan bij de bevoegde autoriteit van de betrokken lidstaat.

    Het bedrijfsplan bevat de volgende gegevens:

    a) de economische beginsituatie van de begunstigde;

    b) mijlpalen en streefcijfers voor de ontwikkeling van de nieuwe activiteiten van de begunstigde;

    c) nadere gegevens over de acties die vereist zijn voor de ontwikkeling van de activiteiten van de begunstigde, zoals gegevens over investeringen, opleiding en advies.

    Het bedrijfsplan heeft een looptijd van hoogstens vijf jaar.

    6.    De laatste tranche wordt slechts betaald als het in lid 5 bedoelde bedrijfsplan correct is uitgevoerd. Bij de vaststelling van het steunbedrag houden de lidstaten rekening met de sociaaleconomische toestand in het gebied waarop het strategisch GLB-plan betrekking heeft.

    7.     De steun bedraagt ten hoogste 100 000 EUR per begunstigde.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_56
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_56
    untranslatables:
      - construct: uitbetalingsvoorwaarde laatste tranche en weging sociaaleconomische toestand (lid 6)
        reason: >-
          "Correct is uitgevoerd" is een open norm over de uitvoering van het
