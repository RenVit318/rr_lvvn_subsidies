              - operation: OR
                conditions:
                  - $betreft_oprichting_plattelandsbedrijf_met_landbouwactiviteiten
                  - $betreft_diversificatie_naar_andere_landbouwactiviteiten
              # lid 3: "alleen toegekend aan jonge landbouwers van wie de
