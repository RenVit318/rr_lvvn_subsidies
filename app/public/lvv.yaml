        # lid 9: hoogstens een intermediair bij korte ketens
        - name: hoogstens_een_intermediair_tussen_landbouwer_en_consument
          type: boolean
          required: false
          description: >-
            In de toeleveringsketen is er tussen de landbouwer en de consument
            hoogstens een intermediair (lid 9). Alleen relevant bij de
            activiteiten van lid 6, punten d en e.
        # lid 10
        - name: in_overeenstemming_met_artt_206_210bis_vo_1308_2013
          type: boolean
          required: true
          description: >-
            De steun is in overeenstemming met de artikelen 206 tot en met
            210 bis van Verordening (EU) nr. 1308/2013 (lid 10)
        # lid 11
        - name: steunduur_jaren
          type: number
          required: true
          description: Voorgenomen duur van de steunverlening in jaren (lid 11)
        # lid 13
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in procenten van de in aanmerking
            komende kosten (lid 13)
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (lid 1; artikel 3)
      output:
        - name: voldoet_aan_voorwaarden_art_59
          type: boolean
          description: >-
            De voorgenomen steun voor samenwerking in plattelandsgebieden
            voldoet aan artikel 59 en aan hoofdstuk I van deze verordening
      actions:
        - output: voldoet_aan_voorwaarden_art_59
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2, punt a
              - $steun_in_kader_strategisch_glb_plan
              # lid 2, punt b
              - $steun_identiek_aan_glb_plan_maatregel
              # lid 3: "ten minste twee actoren", tenzij de uitzondering van
              # lid 8 voor individuele actoren bij proefprojecten (punt a) en
              # productontwikkeling (punt b) geldt, met verspreidingsplicht
              - operation: OR
                conditions:
                  - operation: GREATER_THAN_OR_EQUAL
                    subject: $aantal_betrokken_actoren
                    value: 2
                  - operation: AND
                    conditions:
                      - operation: IN
                        subject: $samenwerkingsactiviteit_art_59
                        values:
                          - PROEFPROJECT
                          - ONTWIKKELING_NIEUWE_PRODUCTEN_LEVENSMIDDELEN
                      - $nationaal_strategisch_plan_voorziet_steun_individuele_actoren
                      - $resultaten_worden_verspreid
              # lid 3, slot
              - $samenwerking_komt_ten_goede_aan_plattelandsgebieden
              # lid 5: niet uitsluitend onderzoeksinstellingen
              - operation: NOT
                value: $uitsluitend_onderzoeksinstellingen_betrokken
              # lid 6: activiteit uit de lijst a-k
              - operation: IN
                subject: $samenwerkingsactiviteit_art_59
                values:
                  - PROEFPROJECT
                  - ONTWIKKELING_NIEUWE_PRODUCTEN_LEVENSMIDDELEN
                  - SAMENWERKING_KLEINSCHALIGE_MARKTDEELNEMERS
                  - KORTE_KETENS_EN_LOKALE_MARKTEN
                  - AFZETBEVORDERING_LOKALE_CONTEXT
                  - COLLECTIEVE_KLIMAATACTIES
                  - GEZAMENLIJKE_MILIEUPROJECTEN
                  - DUURZAME_LEVERING_BIOMASSA
                  - ANDERE_LOKALE_ONTWIKKELINGSSTRATEGIEEN
                  - DIVERSIFICATIE_NAAR_ZORG_EN_EDUCATIE
                  - SLIMME_DORPEN_STRATEGIEEN
              # lid 7: alleen nieuwe samenwerkingsvormen of nieuwe activiteiten
              - $nieuwe_samenwerkingsvorm_of_nieuwe_activiteit
              # lid 9: bij korte ketens en lokale markten (lid 6, punten d en
              # e) hoogstens een intermediair tussen landbouwer en consument
              - operation: OR
                conditions:
                  - operation: NOT
                    value:
                      operation: IN
                      subject: $samenwerkingsactiviteit_art_59
                      values:
                        - KORTE_KETENS_EN_LOKALE_MARKTEN
                        - AFZETBEVORDERING_LOKALE_CONTEXT
                  - $hoogstens_een_intermediair_tussen_landbouwer_en_consument
              # lid 10: overeenstemming met artt. 206-210 bis Vo (EU) 1308/2013
              - $in_overeenstemming_met_artt_206_210bis_vo_1308_2013
              # lid 11: "gedurende ten hoogste zeven jaar"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunduur_jaren
                value: 7
              # lid 13: "ten hoogste 100 % van de in aanmerking komende kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '59'
- number: '60'
  text: |-
    **Steun voor CLLD-projecten**

    1.    Steun voor kosten van kmo’s die deelnemen aan in artikel 31 van Verordening (EU) 2021/1060 bedoelde CLLD-projecten, die in het kader van het Europees Landbouwfonds voor plattelandsontwikkeling Leader-projecten worden genoemd, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    Steun voor kosten van gemeenten die deelnemen aan in artikel 31 van Verordening (EU) 2021/1060 bedoelde CLLD-projecten, die in het kader van het Europees Landbouwfonds voor plattelandsontwikkeling Leader-projecten worden genoemd, en bestemd is voor projecten als bedoeld in lid 3 van dit artikel, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De volgende kosten voor CLLD-projecten komen in aanmerking:

    a) kosten van voorbereidende ondersteuning, capaciteitsopbouw, opleiding en netwerkvorming met het oog op het opzetten en uitvoeren van een CLLD-project;

    b) kosten van de uitvoering van goedgekeurde verrichtingen;

    c) kosten van de voorbereiding              en   de    uitvoering    van samenwerkingsactiviteiten;

    d) werkingskosten in verband met het beheer van de uitvoering van de CLLD-strategie;

    e) dynamisering van de CLLD-strategie om uitwisseling tussen belanghebbenden te bevorderen met het oog op informatieverstrekking en promotie van de strategie en de projecten, en om potentiële begunstigden te ondersteunen met het oog op de uitwerking van verrichtingen en de indiening van aanvragen.

    3.   De in lid 1 bedoelde kosten van gemeenten die aan CLLD-projecten deelnemen, komen voor steun op grond van dit artikel in aanmerking als zij betrekking hebben op een van de volgende gebieden:

    a) onderzoek, ontwikkeling en innovatie;

    b) milieu;

    c) werkgelegenheid en opleiding;

    d) cultuur en instandhouding van het culturele erfgoed;

    e) bosbouw;

    f) afzetbevordering van niet in bijlage I bij het Verdrag genoemde levensmiddelen;

    g) sport.

    ▼B
    4.    De steunintensiteit mag niet hoger zijn dan de maximale steunpercentages die voor elke type verrichting in Verordening (EU) 2021/2115 zijn vastgesteld.
