        legal_text_excerpt: >-
          De steun wordt jaarlijks verleend om de begunstigden geheel of
          gedeeltelijk te vergoeden voor de extra kosten en de gederfde
          inkomsten die voortvloeien uit de verbintenissen.
        accepted: false
      - construct: investeringen in primaire productie en verwerking/afzet van biologische producten volgen de artikelen 14 en 17 (lid 10)
        reason: >-
          Voor investeringssteun verklaart lid 10 de artikelen 14 en 17 van
