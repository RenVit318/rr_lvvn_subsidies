        reason: >-
          De afbakening van de in aanmerking komende kosten vergt een berekening
          over kostenposten (aankoop van grond ten hoogste 10 % van de andere
          totale in aanmerking komende uitgaven, machines en uitrusting tot
          maximaal de marktwaarde, uitsluiting van leasingcontractkosten zoals de
          marge voor de leasinggever en van werkkapitaal, behalve bij
          financieringsinstrumenten in het kader van een strategisch GLB-plan).
          Dat is aggregatie over kostenposten, niet uitdrukbaar in de
          beschikbare operaties. De voorwaardentoets gebruikt alleen de
          voorgenomen steunintensiteit tegen de plafonds van de leden 7 en 8.
        suggestion: >-
          Verdieping per kostenpost zodra de kostenopbouw als gestructureerde
          invoer beschikbaar is.
        legal_text_excerpt: >-
          de kosten van de bouw, verwerving, inclusief leasing, of verbetering
          van onroerende goederen, waarbij de aankoop van grond slechts in
          aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de
          andere totale in aanmerking komende uitgaven voor de betrokken
          verrichting ... worden de volgende kosten niet geacht in aanmerking te
          komen: a) andere dan de in lid 5, punten a) en b), bedoelde kosten in
          verband met een leasingcontract ... en b) werkkapitaal.
        accepted: false
    execution:
      parameters:
        - name: betreft_investering_infrastructuur_bosbouwsector
          type: boolean
          required: true
          description: >-
            De steun betreft een investering in infrastructuur voor de
            ontwikkeling, modernisering of aanpassing van de bosbouwsector
            (lid 1); volgens lid 4 gaat het om infrastructuurinvesteringen voor
            de ontwikkeling, modernisering of aanpassing van bossen.
        - name: milieueffectbeoordeling_vereist
          type: boolean
          required: true
          description: >-
            Voor de investering moet krachtens Richtlijn 2011/92/EU een
            milieueffectbeoordeling worden uitgevoerd (lid 2).
        - name: milieueffectbeoordeling_uitgevoerd_en_vergunning_vooraf_verleend
          type: boolean
          required: true
          description: >-
            De milieueffectbeoordeling is uitgevoerd en de vergunning voor het
            investeringsproject is verleend vóór de datum van de toekenning van
            de individuele steun (lid 2).
        - name: steun_in_vorm_van_financieringsinstrumenten
          type: boolean
          required: true
          description: >-
            De steun wordt verstrekt in de vorm van financieringsinstrumenten
            (lid 2, tweede alinea); dan geldt de MEB-voorwaarde van lid 2 niet.
        - name: informatie_uit_bosbeheerplan_overgelegd
          type: boolean
          required: true
          description: >-
            Toepasselijke informatie is overgelegd uit een bosbeheerplan of
            gelijkwaardig instrument dat in overeenstemming is met de algemene
            richtsnoeren voor het duurzame beheer van de bossen in Europa
            (lid 3). Alleen vereist voor grote ondernemingen. Gedeelde
            parameter (ook artikel 50).
        - name: is_gemeente_autonome_lokale_autoriteit
          type: boolean
          required: true
          description: >-
            De begunstigde is een gemeente die een autonome lokale autoriteit
            is (lid 3, tweede alinea).
        - name: gemeente_jaarbegroting
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Jaarlijkse begroting van de gemeente (lid 3, tweede alinea);
            de uitzondering geldt bij minder dan 10 miljoen EUR.
        - name: gemeente_aantal_inwoners
          type: number
          required: true
          description: >-
            Aantal inwoners van de gemeente (lid 3, tweede alinea); de
            uitzondering geldt bij minder dan 5 000 inwoners.
        - name: steun_in_kader_strategisch_glb_plan
          type: boolean
          required: true
          description: >-
            De steun wordt verleend in het kader van een strategisch GLB-plan
            (lid 4); alleen daarbuiten is de investeringslijst van lid 4
            limitatief.
        - name: soort_infrastructuurinvestering
          type: string
          required: true
          description: >-
            Soort infrastructuurinvestering (lid 4): ONTSLUITING_BOSGROND,
            RUILVERKAVELING_EN_BODEMVERBETERING,
            DUURZAME_ENERGIE_ENERGIE_EFFICIENTIE_WATERVOORZIENING_EN_BESPARING,
            GEBRUIK_DIEREN_IN_PLAATS_VAN_MACHINES,
            BOUW_TIJDELIJKE_OPSLAGFACILITEITEN, of ANDERS (alleen mogelijk
            binnen een strategisch GLB-plan).
        - name: investering_met_milieu_klimaatdoelstellingen_art_14_lid_3
          type: boolean
          required: true
          description: >-
            De investering houdt verband met een of meer specifieke milieu- en
            klimaatgerelateerde doelstellingen als vermeld in artikel 14,
            lid 3, punten e), f) en g) (lid 7, tweede alinea, punt a).
            Gedeelde parameter (ook artikel 50).
        - name: investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
          type: boolean
          required: true
          description: >-
            De investering vindt plaats in de ultraperifere gebieden of de
            kleinere eilanden in de Egeïsche Zee (lid 7, tweede alinea,
            punt b). Gedeelde parameter (ook artikel 50).
        - name: is_niet_productieve_investering
          type: boolean
          required: true
          description: De investering is een niet-productieve investering (lid 8).
        - name: betreft_ruilverkaveling_of_bodemverbetering
          type: boolean
          required: true
          description: De investering betreft ruilverkaveling of bodemverbetering (lid 8).
        - name: betreft_gratis_toegankelijke_multifunctionele_boswegen
          type: boolean
          required: true
          description: >-
            De investering betreft boswegen die gratis voor het publiek
            toegankelijk zijn en ten dienste staan van de multifunctionaliteit
            van het bos (lid 8).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten. Gedeelde parameter.
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun per investeringsproject, zoals artikel 4, lid 1,
            punt r), de drempel voor dit artikel meet. Gedeelde parameter.
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3).
        - name: aanmeldingsdrempel_art_49
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_49
          description: >-
            Aanmeldingsdrempel voor steun voor investeringen in infrastructuur
            voor de ontwikkeling, modernisering of aanpassing van de
            bosbouwsector: 7,5 miljoen EUR per investeringsproject (artikel 4,
            lid 1, punt r).
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: >-
            De begunstigde is een kmo (Bijlage I); lid 3 stelt de
            bosbeheerplan-voorwaarde alleen aan grote ondernemingen.
      output:
        - name: maximale_steunintensiteit_art_49_pct
          type: number
          description: >-
            Maximale steunintensiteit voor deze investering: 65 % (lid 7), te
            verhogen tot 80 % voor de investeringen van lid 7, tweede alinea,
            en tot 100 % voor de investeringen van lid 8.
        - name: voldoet_aan_voorwaarden_art_49
          type: boolean
          description: >-
            De steun voor investeringen in infrastructuur voor de ontwikkeling,
            modernisering of aanpassing van de bosbouwsector voldoet aan
            artikel 49, aan de aanmeldingsdrempel van artikel 4 en aan
            hoofdstuk I van deze verordening (lid 1).
      actions:
        - output: maximale_steunintensiteit_art_49_pct
          value:
            operation: IF
            cases:
              # lid 8: "De steunintensiteit kan worden verhoogd tot 100 % voor
              # niet-productieve investeringen, ruilverkaveling,
              # bodemverbetering en investeringen in boswegen die gratis voor
              # het publiek toegankelijk zijn en ten dienste staan van de
              # multifunctionaliteit van het bos."
              - when:
                  operation: OR
                  conditions:
                    - $is_niet_productieve_investering
                    - $betreft_ruilverkaveling_of_bodemverbetering
                    - $betreft_gratis_toegankelijke_multifunctionele_boswegen
                then: 100
              # lid 7, tweede alinea: "De steunintensiteit kan tot maximaal
              # 80 % worden verhoogd voor de volgende investeringen: a) ...
              # artikel 14, lid 3, punten e), f) en g); b) investeringen in de
              # ultraperifere gebieden of de kleinere eilanden in de Egeïsche
              # Zee."
              - when:
                  operation: OR
                  conditions:
                    - $investering_met_milieu_klimaatdoelstellingen_art_14_lid_3
                    - $investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
                then: 80
            # lid 7, eerste alinea: "De steunintensiteit bedraagt ten hoogste
            # 65 % van de in aanmerking komende kosten."
            default: 65
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '49'
        - output: voldoet_aan_voorwaarden_art_49
          value:
            operation: AND
            conditions:
              # lid 1: "Steun voor investeringen in infrastructuur voor de
              # ontwikkeling, modernisering of aanpassing van de bosbouwsector"
              - $betreft_investering_infrastructuur_bosbouwsector
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt r: "7,5 miljoen EUR per
              # investeringsproject"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_49
              # lid 2: "mag slechts worden toegekend op voorwaarde dat die
              # beoordeling is uitgevoerd en de vergunning voor het betrokken
              # investeringsproject is verleend vóór de datum van de toekenning
              # van de individuele steun"; tweede alinea: "De eerste alinea is
              # niet van toepassing op steun die wordt verstrekt in de vorm van
              # financieringsinstrumenten."
              - operation: OR
                conditions:
                  - $steun_in_vorm_van_financieringsinstrumenten
                  - operation: NOT
                    value: $milieueffectbeoordeling_vereist
                  - $milieueffectbeoordeling_uitgevoerd_en_vergunning_vooraf_verleend
              # lid 3: "Steun voor grote ondernemingen is afhankelijk van de
              # overlegging van toepasselijke informatie uit een bosbeheerplan
              # of gelijkwaardig instrument"; tweede alinea: "Deze vereiste
              # geldt niet voor gemeenten die autonome lokale autoriteiten zijn
              # met een jaarlijkse begroting van minder dan 10 miljoen EUR en
              # met minder dan 5 000 inwoners."
              - operation: OR
                conditions:
                  - $is_kmo
                  - $informatie_uit_bosbeheerplan_overgelegd
                  - operation: AND
                    conditions:
                      - $is_gemeente_autonome_lokale_autoriteit
                      - operation: LESS_THAN
                        subject: $gemeente_jaarbegroting
                        value: 1000000000
                      - operation: LESS_THAN
                        subject: $gemeente_aantal_inwoners
                        value: 5000
              # lid 4: "Indien de steun buiten het kader van een strategisch
              # GLB-plan wordt verleend, omvat hij uitsluitend het volgende:
              # a) de ontsluiting van bosgrond; b) ruilverkaveling en
              # bodemverbetering; c) de levering van duurzame energie,
              # energie-efficiëntie, watervoorziening en -besparing; d) het
              # gebruik van dieren in plaats van machines; e) de bouw van
              # tijdelijke opslagfaciliteiten."
              - operation: OR
                conditions:
                  - $steun_in_kader_strategisch_glb_plan
                  - operation: IN
                    subject: $soort_infrastructuurinvestering
                    values:
                      - ONTSLUITING_BOSGROND
                      - RUILVERKAVELING_EN_BODEMVERBETERING
                      - DUURZAME_ENERGIE_ENERGIE_EFFICIENTIE_WATERVOORZIENING_EN_BESPARING
                      - GEBRUIK_DIEREN_IN_PLAATS_VAN_MACHINES
                      - BOUW_TIJDELIJKE_OPSLAGFACILITEITEN
              # leden 7 en 8: de voorgenomen intensiteit blijft binnen het
              # toepasselijke maximum
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: $maximale_steunintensiteit_art_49_pct
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '49'
- number: '50'
  text: |-
    **Steun voor investeringen in bosbouwtechnologieën en in de verwerking, mobilisering en afzet van bosbouwproducten**

    1.    Steun voor investeringen in bosbouwtechnologieën en in de verwerking, mobilisering en afzet van bosbouwproducten is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    Steun voor investeringen waarvoor krachtens Richtlijn 2011/92/EU een milieueffectbeoordeling moet worden uitgevoerd, mag slechts worden toegekend op voorwaarde dat die beoordeling is uitgevoerd en de vergunning voor het betrokken investeringsproject is verleend vóór de datum van de toekenning van de individuele steun.

    3.   Steun voor grote ondernemingen is afhankelijk van de overlegging van toepasselijke informatie uit een bosbeheerplan of gelijkwaardig instrument dat in overeenstemming is met de algemene richtsnoeren voor het duurzame beheer van de bossen in Europa.

    4.   De steun dekt de volgende in aanmerking komende kosten:

    a) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de andere totale in aanmerking komende uitgaven voor de betrokken verrichting, met uitzondering van de aankoop van grond voor milieubehoud indien de steun wordt verleend in het kader van een strategisch GLB-plan;

    b) de kosten van de koop of huurkoop van machines en uitrusting, tot maximaal de marktwaarde van de activa;

    c) algemene kosten in verband met de in de punten a) en b) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs en voor advies over ecologische en economische duurzaamheid, met inbegrip van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer op basis van de resultaten daarvan geen uitgaven uit hoofde van de punten a) en b) worden verricht;

    d) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken;

    e) de kosten van de opstelling van bosbeheerplannen of gelijkwaardige instrumenten.

    5.   Behalve wanneer de steun in het kader van een strategisch GLB-plan in de vorm van financieringsinstrumenten wordt verleend, worden de volgende kosten niet geacht in aanmerking te komen:

    a) kosten in verband met een leasingcontract, zoals de marge voor de leasinggever, kosten van de herfinanciering van rente, overheadkosten en verzekeringspremies en

    b) werkkapitaal.

    ▼B
    6.   Investeringen om de economische waarde van bossen te vergroten moeten worden gemotiveerd op basis van de te verwachten verbeteringen in bossen op een of meer bedrijven en kunnen betrekking hebben op bodemvriendelijke, zuinige oogstmachines en -praktijken.

    7.    Investeringen met betrekking tot het gebruik van hout als grondstof of energiebron blijven beperkt tot handelingen die aan de industriële verwerking voorafgaan.

    8.   De steunintensiteit bedraagt ten hoogste 65 % van de in aanmerking komende kosten.

    9.   De steunintensiteit kan tot maximaal 80 % worden verhoogd voor de volgende investeringen:

    a) investeringen die verband houden met een of meer specifieke milieu- en klimaatgerelateerde doelstellingen als vermeld in artikel 14, lid 3, punten e), f) en g);

    b) investeringen in de ultraperifere gebieden of de kleinere eilanden in de Egeïsche Zee.
