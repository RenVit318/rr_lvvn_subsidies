              - $regeling_ingesteld_binnen_drie_jaar_na_schadedatum
              - $steun_betaald_binnen_vier_jaar_na_schadedatum
              # lid 5, eerste alinea: taxatie door openbare autoriteit, erkende
              # onafhankelijke deskundige of verzekeringsonderneming
              - $kosten_getaxeerd_door_bevoegde_taxateur
              # lid 7: minimale preventie-inspanning, behalve als redelijkerwijs
              # niet mogelijk; niet van toepassing op de eerste aanval
              - operation: OR
                conditions:
                  - $preventieve_maatregelen_getroffen
                  - $preventieve_maatregelen_redelijkerwijs_niet_mogelijk
                  - $eerste_aanval_beschermd_dier_in_gebied
              # lid 8: "blijft beperkt tot 100 % van de in aanmerking komende
              # kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $subsidiabele_kosten
              # lid 9: steun plus andere betalingen (nationale of uniale
              # maatregelen, verzekeringspolis) niet meer dan 100 % van de in
              # aanmerking komende kosten
              - operation: LESS_THAN_OR_EQUAL
                subject: $totale_compensatie_inclusief_verzekering
                value: $subsidiabele_kosten
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '29'
- number: '30'
  text: |-
    **Steun voor de instandhouding van genetische hulpbronnen in de landbouw**

    1.   Steun voor de instandhouding van genetische hulpbronnen in de landbouw in het kader van agromilieuklimaatverbintenissen is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    ▼B
    2.   Voor de toepassing van dit artikel wordt verstaan onder:

    a) “instandhouding in situ”: instandhouding van genetisch materiaal in ecosystemen en natuurlijke habitats en het behoud en herstel van levensvatbare populaties van soorten of wilde rassen in hun natuurlijke omgeving en, in het geval van gedomesticeerde dierenrassen of gekweekte plantensoorten, in het agrarische milieu waar zij hun typische kenmerken hebben ontwikkeld;

    b) “instandhouding op het landbouwbedrijf”: instandhouding in situ en ontwikkeling op het landbouwbedrijf;

    c) “instandhouding ex situ”: instandhouding van genetisch materiaal voor de landbouw buiten de natuurlijke habitat;

    d) “verzameling ex situ”: verzameling genetisch materiaal voor de landbouw die buiten de natuurlijke habitat wordt bewaard.

    3.    Verbintenissen tot het fokken van lokale rassen die voor de veehouderij verloren dreigen te gaan of tot het in stand houden van plantaardige genetische hulpbronnen die door genetische erosie worden bedreigd, betreffen:

    a) het fokken van landbouwhuisdieren van lokale, met uitsterven bedreigde rassen;

    b) het in stand houden van plantaardige genetische hulpbronnen die van nature aan de plaatselijke en regionale omstandigheden zijn aangepast en door genetische erosie worden bedreigd.

    4.   Lokale rassen worden als met uitsterven bedreigde rassen beschouwd als aan de voorwaarden van artikel 2, punt 24, van Verordening (EU) 2016/1012 is voldaan en die voorwaarden ook zijn opgenomen en toegelicht in de informatie die aan de Commissie moet worden verstrekt overeenkomstig artikel 9, lid 1, van deze verordening.

    5.   De volgende soorten landbouwhuisdieren komen voor steun in aanmerking: runderen, schapen, geiten, paardachtigen, varkens, vogels, konijnen en bijen.

    6.    Plantaardige genetische hulpbronnen worden geacht door genetische erosie te worden bedreigd als in de informatie die krachtens artikel 9, lid 1, punt b), moet worden bekendgemaakt, voldoende bewijs van die genetische erosie wordt opgenomen en toegelicht, gebaseerd op wetenschappelijke resultaten of indicatoren voor de achteruitgang van de landrassen of primitieve lokale rassen en de diversiteit van de betrokken populaties en, indien relevant, voor wijzigingen in de op plaatselijk niveau gangbare landbouwpraktijken.

    7.   De steun dekt de kosten van de volgende verrichtingen:

    a) gerichte acties: acties ter bevordering van de instandhouding, de karakterisering, de verzameling en het gebruik van genetische hulpbronnen in de landbouw in situ en ex situ, met inbegrip van de opstelling van webgebaseerde inventarissen van de genetische hulpbronnen die momenteel in situ worden bewaard, van verzamelingen ex situ en van databases;

    b) gecoördineerde acties: acties ter bevordering van de uitwisseling tussen de bevoegde organisaties van de lidstaten van gegevens ten behoeve van de instandhouding, de karakterisering, de verzameling en het gebruik van genetische hulpbronnen in de landbouw van de Unie;

    ▼B
    c) begeleidende acties: voorlichtings-, verspreidings- en adviseringsacties waarbij niet-gouvernementele organisaties en andere relevante belanghebbenden worden betrokken, opleidingen en de opstelling van technische verslagen.

    8.  De steun bedraagt ten hoogste 100 % van de in aanmerking komende kosten.
