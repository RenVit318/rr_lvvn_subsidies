- number: Bijlage III
  text: |2-

         Bepalingen betreffende de bekendmaking van informatie overeenkomstig
                                     artikel 9, lid 1
         De lidstaten moeten hun uitgebreide staatssteunwebsite, waarop de in artikel 9,
         lid 1, bedoelde informatie moet worden bekendgemaakt, zodanig opzetten dat die
         informatie gemakkelijk toegankelijk is. De informatie moet worden bekendgemaakt in een spreadsheetformaat waarmee de gegevens kunnen worden doorzocht en geëxtraheerd en gemakkelijk op het internet kunnen worden gepubliceerd, zoals in CSV- of XML-formaat. Iedere belanghebbende partij krijgt onbeperkt toegang tot de staatssteunwebsite. Gebruikers hoeven zich niet vooraf te
         registreren om toegang tot de staatssteunwebsite te krijgen.

         Over in artikel 9, lid 1, punt c), bedoelde individuele steunverleningen wordt de
         volgende informatie bekendgemaakt:

         a) referentie van het identificatienummer van de steun (1);

         b) identificator van de begunstigde (2);

         c) soort onderneming (kmo/grote onderneming) op de datum van de toekenning
            van de steun;

         d) regio waar de begunstigde is gevestigd, op NUTS 2-niveau (3) en, indien van
            toepassing, ultraperifere gebieden of kleinere eilanden in de Egeïsche Zee;

         e) activiteitensector op NACE-groepsniveau (4);

         f) steunelement, uitgedrukt in hele bedragen, in nationale valuta (5);

         g) steuninstrument (6) (subsidie/rentesubsidie, lening/terugbetaalbaar voorschot/
            terugbetaalbare subsidie, garantie, belastingvoordeel of belastingvrijstelling,
            risicofinanciering, ander (gelieve aan welk));

         h) datum van de toekenning van de steun;

         i) doel van de steun (7);

         j) steunverlenende autoriteit.

         (1) Zoals door de Commissie meegedeeld in het kader van de in de artikel 9, lid 1, van deze
             verordening bedoelde procedure.
         (2) Gelet op het rechtmatige belang van transparantie bij het verstrekken van informatie aan
             het publiek en na afweging van de transparantievereisten tegen de rechten uit hoofde van
             de gegevensbeschermingsregels concludeert de Commissie dat het gerechtvaardigd is de
             naam van de begunstigde van de steun bekend te maken wanneer de begunstigde van de
             steun een natuurlijke persoon is of een rechtspersoon met de naam van een natuurlijke
             persoon (zie C-92/09, Volker und Markus Schecke and Eifert, punt 53), rekening houdend met artikel 49, lid 1, punt g), van Verordening (EU) 2016/679. Transparantieregels
             zijn gericht op een betere naleving, meer verantwoordingsplicht, collegiale toetsing en
             uiteindelijk doeltreffendere overheidsuitgaven. Dit doel heeft voorrang op de gegevensbeschermingsrechten van natuurlijke personen die overheidssteun ontvangen.
         (3) NUTS = Nomenclatuur van territoriale eenheden voor de statistiek. Meestal wordt de
             regio op NUTS 2-niveau vermeld.
         (4) Verordening (EG) nr. 1893/2006 van het Europees Parlement en de Raad van 20 december 2006 tot vaststelling van de statistische classificatie van economische activiteiten
             NACE (PB L 393 van 30.12.2006, blz. 1).
         ( ) Brutosubsidie-equivalent.
          5

         ( ) Als de steun via meerdere steuninstrumenten wordt verleend, moet het steunbedrag per
          6

             steuninstrument worden vermeld.
         (7) Als met de steun meerdere doelstellingen worden nagestreefd, moet het steunbedrag per
             doelstelling worden vermeld.
