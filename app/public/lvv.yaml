  machine_readable:
    endpoint: is_kmo
    execution:
      parameters:
        - name: aantal_werknemers
          type: number
          required: true
          description: Aantal werkzame personen van de begunstigde onderneming, uitgedrukt in
            arbeidsjaareenheden (AJE) conform Bijlage I, artikel 5, over het laatste afgesloten
            boekjaar (Bijlage I, artikel 4).
        - name: jaaromzet
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: Jaaromzet van de begunstigde onderneming over het laatste afgesloten
            boekjaar, exclusief btw en andere indirecte rechten of heffingen (Bijlage I,
            artikel 4, lid 1).
        - name: balanstotaal
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: Jaarlijks balanstotaal van de begunstigde onderneming over het laatste
            afgesloten boekjaar (Bijlage I, artikel 4, lid 1).
      output:
        - name: is_kmo
          type: boolean
          description: De onderneming behoort tot de categorie kleine, middelgrote en
            micro-ondernemingen (kmo's) in de zin van Bijlage I, artikel 2, lid 1 (kerncriteria;
            de samentellingsregels voor partner- en verbonden ondernemingen zijn als
            untranslatables vastgelegd).
      actions:
        - output: is_kmo
          value:
            operation: AND
            conditions:
              - operation: LESS_THAN
                subject: $aantal_werknemers
                value: 250
              - operation: OR
                conditions:
                  - operation: LESS_THAN_OR_EQUAL
                    subject: $jaaromzet
                    value: 5000000000
                  - operation: LESS_THAN_OR_EQUAL
                    subject: $balanstotaal
                    value: 4300000000
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: Bijlage I
            paragraph: artikel 2, lid 1
            explanation: Tot de categorie kmo's behoren ondernemingen waar minder dan 250 personen
              werkzaam zijn en waarvan de jaaromzet 50 miljoen EUR (5000000000 eurocent) of het
              jaarlijkse balanstotaal 43 miljoen EUR (4300000000 eurocent) niet overschrijdt.
    untranslatables:
      - construct: zelfstandige, partner- en verbonden ondernemingen (Bijlage I, artikel 3)
        reason: Kwalificatie van de onderneming langs eigendoms- en zeggenschapsrelaties
          (25%-drempel voor partnerondernemingen, meerderheids- en zeggenschapsbanden voor
          verbonden ondernemingen, uitzonderingscategorieën investeerders, de 25%-regel voor
          overheidsinstanties in lid 4) vergt redeneren over een graaf van ondernemingen; niet
          uitdrukbaar met de huidige operaties.
        legal_text_excerpt: '"Partnerondernemingen" zijn alle ondernemingen die niet als verbonden
          ondernemingen in de zin van lid 3 worden aangemerkt en waartussen de volgende band
          bestaat: een onderneming (van een hoger niveau) heeft, alleen of samen met een of meer
          verbonden ondernemingen in de zin van lid 3, 25 % of meer van het kapitaal of de
          stemrechten van een andere onderneming (van een lager niveau).'
        accepted: false
      - construct: referentieperiode en hoedanigheidswissel over twee opeenvolgende boekjaren (Bijlage I, artikel 4)
        reason: De gegevens betreffen het laatste afgesloten boekjaar en de kmo-hoedanigheid
          wijzigt pas wanneer de drempels in twee opeenvolgende boekjaren worden over- of
          onderschreden; dat vergt een historie van boekjaren (aggregatie over een verzameling)
          plus een schatting te goeder trouw voor recentelijk opgerichte ondernemingen (open
          norm).
        legal_text_excerpt: ... verkrijgt of verliest zij de hoedanigheid van middelgrote, kleine
          of micro-onderneming slechts wanneer deze situatie zich in twee opeenvolgende boekjaren
          voordoet.
        accepted: false
      - construct: berekening van het aantal werkzame personen in arbeidsjaareenheden (Bijlage I, artikel 5)
        reason: Optelling in breuken van AJE's over categorieën personen (loontrekkenden,
          gelijkgestelden, eigenaren-bedrijfsleiders, vennoten) met uitsluitingen (leerlingen,
          studenten, zwangerschaps- en ouderschapsverlof); aggregatie over een verzameling
          personen. De parameter aantal_werknemers neemt de uitkomst van deze berekening als
          gegeven aan.
        legal_text_excerpt: Het aantal werkzame personen komt overeen met het aantal
          arbeidsjaareenheden (AJE), d.w.z. het aantal personen dat het hele desbetreffende
          referentiejaar voltijds in de betrokken onderneming of voor rekening van deze
          onderneming heeft gewerkt.
        accepted: false
      - construct: samentelling en consolidatie van gegevens van partner- en verbonden ondernemingen (Bijlage I, artikel 6)
        reason: Evenredige samentelling naar aandeel in kapitaal of stemrechten (het hoogste
          percentage), 100% bijtelling voor verbonden ondernemingen en het werken met
          geconsolideerde rekeningen; aggregatie over een ondernemingsstructuur. De parameters
          aantal_werknemers, jaaromzet en balanstotaal gelden daarom als gegevens ná toepassing
          van deze samentellingsregels.
        legal_text_excerpt: De in de eerste alinea bedoelde gegevens worden samengeteld met de
          gegevens van de eventuele partnerondernemingen van de betrokken onderneming die zich
          meteen boven of onder het niveau van die onderneming bevinden.
        accepted: false
