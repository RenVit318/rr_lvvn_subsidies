        - name: vrijwillige_verbintenis_biologische_landbouw
          type: boolean
          required: true
          description: >-
            De onderneming of groep ondernemingen verbindt zich op vrijwillige
            basis tot de omschakeling naar of de voortzetting van biologische
            landbouwpraktijken en -methoden als omschreven in Verordening (EU)
