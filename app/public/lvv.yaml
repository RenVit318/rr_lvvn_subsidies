      actions:
        - output: voldoet_aan_voorwaarden_art_53
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 1: "Steun voor ruilverkaveling van bosbouwgrond"
              - $betreft_ruilverkaveling_van_bosbouwgrond
              # lid 2: "De steun wordt uitsluitend toegekend voor juridische en
              # administratieve kosten, inclusief opmetingskosten."
              - $steun_uitsluitend_voor_juridische_en_administratieve_kosten
              # lid 3: "De steun bedraagt ten hoogste 100 % van de werkelijk
              # gemaakte kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
