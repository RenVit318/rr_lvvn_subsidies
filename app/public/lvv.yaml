            uitzondering)
        # lid 8: oorsprongsvermelding ondergeschikt aan hoofdboodschap
        - name: oorsprong_aangegeven
          type: boolean
          required: true
          description: De oorsprong van het levensmiddel of de katoen wordt aangegeven (lid 8)
        - name: oorsprongsvermelding_ondergeschikt_aan_hoofdboodschap
          type: boolean
          required: false
          description: De oorsprongsvermelding is ondergeschikt aan de hoofdboodschap (lid 8)
        # lid 9
        - name: betreft_specifieke_ondernemingen_of_handelsmerken
          type: boolean
          required: true
          description: >-
            De voorlichtings- en afzetbevorderingsactiviteiten houden verband
            met specifieke ondernemingen of handelsmerken (lid 9)
        # lid 10
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in procenten van de in aanmerking
            komende kosten (lid 10)
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (lid 1; artikel 3)
      output:
        - name: voldoet_aan_voorwaarden_art_58
          type: boolean
          description: >-
            De voorgenomen steun voor voorlichtings- en
            afzetbevorderingsactiviteiten voor katoen en levensmiddelen die
            onder een kwaliteitsregeling vallen voldoet aan artikel 58 en aan
            hoofdstuk I van deze verordening
      actions:
        - output: voldoet_aan_voorwaarden_art_58
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2, punt a
              - $steun_in_kader_strategisch_glb_plan
              # lid 2, punt b
              - $steun_identiek_aan_glb_plan_maatregel
              # lid 3: begunstigde is een producentengroepering
              - $begunstigde_is_producentengroepering
              # lid 4: alleen activiteiten op de interne markt
              - $activiteiten_op_interne_markt
              # lid 5: producten onder een kwaliteitsregeling met steun
              # krachtens artikel 57
              - $product_valt_onder_kwaliteitsregeling_met_steun_art_57
              # lid 7: geen aanzet tot kopen wegens oorsprong, behalve onder
              # titel II van Verordening (EU) nr. 1151/2012
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $zet_aan_tot_kopen_wegens_oorsprong
                  - $valt_onder_titel_ii_vo_1151_2012
              # lid 8: oorsprongsvermelding mag, mits ondergeschikt aan de
              # hoofdboodschap
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $oorsprong_aangegeven
                  - $oorsprongsvermelding_ondergeschikt_aan_hoofdboodschap
              # lid 9: geen activiteiten voor specifieke ondernemingen of
              # handelsmerken
              - operation: NOT
                value: $betreft_specifieke_ondernemingen_of_handelsmerken
              # lid 10: "ten hoogste 70 % van de in aanmerking komende kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 70
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '58'
- number: '59'
  text: |-
    **Steun voor samenwerking in plattelandsgebieden**

    1.    Steun voor samenwerking in plattelandsgebieden is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    ▼B
    2.     De steun moet aan de twee onderstaande voorwaarden voldoen:

    a) hij wordt in een van de volgende vormen verleend in het kader van een strategisch GLB-plan overeenkomstig Verordening (EU) 2021/2115:

    i) als steun die uit het Elfpo wordt gecofinancierd,

    ii) als aanvullende nationale financiering bij de in punt i) genoemde steun;

    b) hij is identiek aan de desbetreffende maatregel van het in punt a) bedoelde strategisch GLB-plan.

    3.    Bij de onder dit artikel vallende vormen van samenwerking zijn ten minste twee actoren betrokken, waarbij het kan gaan om ondernemingen die actief zijn in de landbouwsector, ondernemingen die actief zijn in de voedselketen en andere actoren, waaronder producentengroeperingen, coöperaties en brancheorganisaties, voor zover de samenwerking ten goede komt aan plattelandsgebieden.

    4.     De volgende vormen van samenwerking komen in aanmerking:

    a) samenwerking tussen ondernemingen en andere actoren als bedoeld in lid 3 van dit artikel;

    b) de oprichting van clusters en netwerken.

    5.    Voor samenwerking waarbij uitsluitend onderzoeksinstellingen zijn betrokken, mag geen steun worden verleend.

    6.   De steun mag worden verleend voor samenwerking bij de volgende activiteiten:

    a) proefprojecten;

    b) de ontwikkeling van nieuwe producten, praktijken, procedés en technologieën in de levensmiddelensector;

    c) samenwerking tussen kleinschalige marktdeelnemers met als doel gemeenschappelijke werkprocedés op te zetten en voorzieningen en middelen te delen, en met het oog op de ontwikkeling en/of marketing van toeristische diensten met betrekking tot plattelandstoerisme;

    d) horizontale en verticale samenwerking tussen actoren in de toeleveringsketen met het oog op de oprichting en ontwikkeling van korte ketens en lokale markten;

    e) afzetbevorderingsactiviteiten in een lokale context met het oog op de ontwikkeling van korte ketens en lokale markten;

    f) collectieve acties met het oog op klimaatmitigatie en -adaptatie;

    g) gezamenlijke benaderingen van milieuprojecten en gangbare milieupraktijken, met inbegrip van efficiënt waterbeheer, gebruik van hernieuwbare energie en de instandhouding van landbouwlandschappen;

    h) horizontale en verticale samenwerking tussen actoren in de toeleveringsketen met het oog op duurzame levering van biomassa voor gebruik in de voedsel- en energieproductie en in industriële procedés;

    i) de uitvoering, met name door andere dan de in artikel 32, lid 2, punt b), van Verordening (EU) nr. 1303/2013 omschreven groepen publieke en private partners, van andere dan de in artikel 2, punt 19, van Verordening (EU) nr. 1303/2013 omschreven strategieën voor lokale ontwikkeling waarbij een of meer prioriteiten van de Unie voor plattelandsontwikkeling worden aangepakt;

    ▼B
    j) diversificatie van landbouwactiviteiten naar activiteiten op het gebied van gezondheidszorg, maatschappelijke integratie, door de gemeenschap ondersteunde landbouw en milieu- en voedingseducatie;

    k) uitvoering van “slimme dorpen”-strategieën.

    7.   De steun mag alleen worden verleend voor nieuwe samenwerkingsvormen, met inbegrip van bestaande samenwerkingsvormen indien een nieuwe activiteit wordt opgestart.

    8.    Steun voor proefprojecten als bedoeld in lid 6, punt a), en voor de ontwikkeling van nieuwe producten, praktijken, procedés en technologieën in de levensmiddelensector als bedoeld in lid 6, punt b), mag ook aan individuele actoren worden verleend indien het nationale strategisch plan daarin voorziet. De resultaten van proefprojecten als bedoeld in lid 6, punt a), en activiteiten als bedoeld in lid 6, punt b), die door individuele actoren worden uitgevoerd, moeten worden verspreid.

    9.   Steun voor de oprichting en ontwikkeling van korte toeleveringsketens, als bedoeld in lid 6, punten d) en e), mag slechts betrekking hebben op toeleveringsketens waarbij er tussen de landbouwer en de consument hoogstens één intermediair is.

    10.   De op grond van dit artikel verstrekte steun moet in overeenstemming zijn met de artikelen 206 tot en met 210 bis van Verordening (EU) nr. 1308/2013.

    11.    De steun wordt gedurende ten hoogste zeven jaar verleend.

    12.    De volgende kosten komen in aanmerking:

    a) kosten van voorbereidende ondersteuning, capaciteitsopbouw, opleiding en netwerkvorming met het oog op het opzetten en uitvoeren van een samenwerkingsproject;

    b) kosten van studies van het betrokken gebied, kosten van haalbaarheidsstudies en kosten van het opstellen van een bedrijfsplan of een andere dan de in artikel 32 van Verordening (EU) 2021/1060 bedoelde strategie voor lokale ontwikkeling;

    c) kosten van de dynamisering van het betrokken gebied om een collectief territoriaal project haalbaar te maken; in het geval van clusters mag de dynamisering ook betrekking hebben op netwerkvorming tussen de leden en op de werving van nieuwe leden;

    d) met de samenwerking gepaard gaande werkingskosten, zoals het salaris van een coördinator;

    e) directe kosten van specifieke projecten die verband houden met de uitvoering van een bedrijfsplan, een milieuplan, een andere dan de in artikel 32 van Verordening (EU) 2021/1060 bedoelde strategie voor lokale ontwikkeling of andere op innovatie gerichte acties, waaronder het verrichten van tests;

    f) kosten van afzetbevorderingsactiviteiten.

    13.  De steun bedraagt ten hoogste 100 % van de in aanmerking komende kosten.

    14.     Directe kosten op grond van lid 12, punt e), die betrekking hebben op investeringen, zijn beperkt tot de in aanmerking komende kosten van investeringssteun en moeten voldoen aan de overeenkomstige artikelen van Verordening (EU) nr. 651/2014 en de toepasselijke artikelen van de onderhavige verordening, met inbegrip van de specifieke voorwaarden inzake aanmeldingsdrempels.

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_59
