# HOOFDSTUK IV — Overgangs- en slotbepalingen
- number: '62'
  text: |-
    **Vervanging      en    verdere    toepassing van        Verordening       (EU) nr. 702/2014**

    1.   In artikel 52 van Verordening (EU) nr. 702/2014 is bepaald dat die verordening van toepassing is tot en met 31 december 2022. Verordening (EU) nr. 702/2014 wordt na het verstrijken ervan vervangen door de onderhavige verordening.
    2.    De voorschriften van Verordening (EU) nr. 702/2014 blijven evenwel tot en met 31 december 2025 van toepassing op steun die wordt verleend op grond van Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad (33).

    (33) Verordening (EU) nr. 1305/2013 van het Europees Parlement en de Raad van 17 december 2013 inzake steun voor plattelandsontwikkeling uit het Europees Landbouwfonds voor plattelandsontwikkeling (Elfpo) en tot intrekking van Verordening (EG) nr. 1698/2005 van de Raad (PB L 347 van 20.12.2013, blz. 487).

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_62
- number: '63'
  text: |-
    **Overgangsbepalingen**

    1.    Deze verordening is van toepassing op individuele steun die vóór de inwerkingtreding van deze verordening is toegekend voor zover die individuele steun voldoet aan alle voorwaarden van deze verordening, met uitzondering van artikel 9.
    2.    Steun die niet van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag is vrijgesteld, wordt door de Commissie beoordeeld aan de hand van de richtsnoeren van 2023 en van de andere toepasselijke kaderregelingen,       richtsnoeren,  mededelingen  en bekendmakingen.
    3.    Individuele steun die vóór 1 januari 2023 is toegekend op grond van een krachtens artikel 1 van Verordening (EU) 2015/1588 vastgestelde verordening die van kracht was op de datum van de toekenning van de steun, is verenigbaar met de interne markt en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag.
    4.    Na het verstrijken van de geldigheidsduur van deze verordening blijven steunregelingen die op grond van deze verordening zijn vrijgesteld, nog gedurende een aanpassingsperiode van zes maanden vrijgesteld. In afwijking van de eerste alinea blijven steunregelingen die binnen het toepassingsgebied van Verordening (EU) 2021/2115 vallen en worden gecofinancierd uit het Elfpo of via aanvullende nationale financiering bij dergelijke gecofinancierde maatregelen, aan het einde van de geldigheidsduur van de onderhavige verordening vrijgesteld voor de duur van de programmeringsperiode overeenkomstig Verordening (EU) 2021/2115.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_63
- number: '64'
  text: |-
    Deze verordening treedt in werking op 1 januari 2023. Zij is van toepassing van 1 januari 2023 tot en met 31 december 2029. Deze verordening is verbindend in al haar onderdelen en is rechtstreeks toepasselijk in elke lidstaat.

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_64
- number: Bijlage I
  text: |2-

                  Definitie van kleine, middelgrote en micro-ondernemingen

    Artikel 1
                                           Onderneming

         Als onderneming wordt beschouwd iedere entiteit, ongeacht haar rechtsvorm, die
         een economische activiteit uitoefent. Met name worden als zodanig beschouwd
         entiteiten die individueel of in familieverband ambachtelijke of andere activiteiten
         uitoefenen, personenvennootschappen en verenigingen die regelmatig een economische activiteit uitoefenen.

    Artikel 2
         Aantal werkzame personen en financiële drempels ter bepaling van de
                              categorieën ondernemingen

         1.    Tot de categorie kleine, middelgrote en micro-ondernemingen (“kmo’s”)
         behoren ondernemingen waar minder dan 250 personen werkzaam zijn en waarvan de jaaromzet 50 miljoen EUR of het jaarlijkse balanstotaal 43 miljoen EUR
         niet overschrijdt.

         2.     Binnen de categorie kmo’s is een “kleine onderneming” een onderneming
         waar minder dan 50 personen werkzaam zijn en waarvan de jaaromzet of het
         jaarlijkse balanstotaal 10 miljoen EUR niet overschrijdt.

         3.     Binnen de categorie kmo’s is een “micro-onderneming” een onderneming
         waar minder dan 10 personen werkzaam zijn en waarvan de jaaromzet of het
         jaarlijkse balanstotaal 2 miljoen EUR niet overschrijdt.

    Artikel 3
         Soorten ondernemingen die voor de berekening van het aantal werkzame
          personen en van de financiële bedragen in aanmerking worden genomen

         1.    Een “zelfstandige onderneming” is elke onderneming die niet als partneronderneming in de zin van lid 2 of als verbonden onderneming in de zin van
         lid 3 wordt aangemerkt.

         2.    “Partnerondernemingen” zijn alle ondernemingen die niet als verbonden
         ondernemingen in de zin van lid 3 worden aangemerkt en waartussen de volgende band bestaat: een onderneming (van een hoger niveau) heeft, alleen of
         samen met een of meer verbonden ondernemingen in de zin van lid 3, 25 % of
         meer van het kapitaal of de stemrechten van een andere onderneming (van een
         lager niveau).

         Ook als de drempel van 25 % wordt bereikt of overschreden, kan een onderneming als zelfstandige onderneming en dus als onderneming zonder partnerondernemingen worden aangemerkt indien het om de volgende categorieën investeerders gaat en mits die investeerders individueel noch gezamenlijk met de
         betrokken onderneming verbonden zijn in de zin van lid 3:

         a) openbare participatiemaatschappijen, risicokapitaalmaatschappijen, natuurlijke
            personen of groepen natuurlijke personen die geregeld risicokapitaal beleggen
            en eigen vermogen in niet-beursgenoteerde ondernemingen investeren (business angels), mits de totale investering van deze business angels in eenzelfde
            onderneming 1 250 000 EUR niet overschrijdt;

         b) universiteiten of onderzoekscentra zonder winstoogmerk;

         c) institutionele beleggers, met inbegrip van regionale ontwikkelingsfondsen;

    ▼B
         d) autonome lokale autoriteiten die een jaarlijkse begroting van minder dan
            10 miljoen EUR hebben en minder dan 5 000 inwoners tellen.

         3.   “Verbonden ondernemingen” zijn ondernemingen die met elkaar een van de
         volgende banden onderhouden:

         a) een onderneming heeft de meerderheid van de stemrechten van de aandeelhouders of vennoten van een andere onderneming;

         b) een onderneming heeft het recht de meerderheid van de leden van het
            bestuurs-, leidinggevend of toezichthoudend orgaan van een andere onderneming te benoemen of te ontslaan;

         c) een onderneming heeft het recht een overheersende invloed op een andere
            onderneming uit te oefenen op grond van een met deze onderneming gesloten
            overeenkomst of een bepaling in de statuten van de laatstgenoemde
            onderneming;

         d) een onderneming die aandeelhouder of vennoot is van een andere onderneming, heeft op grond van een met andere aandeelhouders of vennoten
            van die andere onderneming gesloten overeenkomst als enige zeggenschap
            over de meerderheid van de stemrechten van de aandeelhouders of vennoten
            van de laatstgenoemde onderneming.

         Van overheersende invloed wordt geacht geen sprake te zijn indien de in lid 2,
         tweede alinea, genoemde investeerders zich niet direct of indirect met het beheer
         van de betrokken onderneming bemoeien, onverminderd de rechten die zij als
         aandeelhouders of vennoten bezitten.

         Ondernemingen worden eveneens als verbonden ondernemingen beschouwd indien zij via een of meer andere ondernemingen of via een investeerder als
         bedoeld in lid 2, een van de in de eerste alinea bedoelde banden onderhouden.

         Ondernemingen die via een natuurlijke persoon of een in gemeenschappelijk
         overleg handelende groep van natuurlijke personen een van deze banden onderhouden, worden eveneens als verbonden ondernemingen beschouwd indien zij
         hun activiteiten of een deel van hun activiteiten op dezelfde markt of op verwante markten uitoefenen.

         Als “verwante markt” wordt beschouwd de producten- of dienstenmarkt die zich
         direct boven of onder het niveau van de betrokken markt bevindt.

         4.   Behalve in de in lid 2, tweede alinea, bedoelde gevallen kan een onderneming niet als kmo worden aangemerkt indien een of meer overheidsinstanties,
         gezamenlijk of afzonderlijk, direct of indirect zeggenschap hebben over 25 % of
         meer van het kapitaal of de stemrechten.

         5.    Ondernemingen kunnen een verklaring opstellen over hun hoedanigheid
         van zelfstandige onderneming, partneronderneming of verbonden onderneming,
         met vermelding van de gegevens betreffende de in artikel 2 vermelde drempels.
         Zelfs indien het wegens de spreiding van het kapitaal onmogelijk is precies vast
         te stellen wie het in handen heeft, kan deze verklaring worden opgesteld mits de
         onderneming te goeder trouw verklaart dat zij redelijkerwijze kan aannemen niet
         voor 25 % of meer in handen te zijn van één onderneming of van verscheidene
         verbonden ondernemingen gezamenlijk. Dergelijke verklaringen doen geen afbreuk aan de controles of verificaties waarin de nationale regelgeving of de
         regelgeving van de Unie voorziet.

    Artikel 4
         Gegevens voor de berekening van het aantal werkzame personen en van de
                         financiële bedragen en referentieperiode

         1.    De gegevens voor de berekening van het aantal werkzame personen en van
         de financiële bedragen hebben betrekking op het laatste afgesloten boekjaar en
         worden jaarlijks berekend. Zij worden vanaf de datum van afsluiting van de
         rekeningen in aanmerking genomen. Het bedrag van de omzet wordt berekend
         exclusief belasting over de toegevoegde waarde (btw) en andere indirecte rechten
         of heffingen.

    ▼B
         2.    Wanneer een onderneming op de datum van afsluiting van de rekeningen
         vaststelt dat de op jaarbasis berekende gegevens boven of onder de in artikel 2
         aangegeven drempels voor het aantal werkzame personen of de financiële
         maxima liggen, verkrijgt of verliest zij de hoedanigheid van middelgrote, kleine
         of micro-onderneming slechts wanneer deze situatie zich in twee opeenvolgende
         boekjaren voordoet.

         3.    In het geval van recentelijk opgerichte ondernemingen waarvan de eerste
         jaarrekening nog niet is afgesloten, worden de in aanmerking te nemen gegevens
         bepaald door middel van een in de loop van het boekjaar te goeder trouw
         gemaakte schatting.

    Artikel 5
                                   Aantal werkzame personen

         Het aantal werkzame personen komt overeen met het aantal
         arbeidsjaareenheden (AJE), d.w.z. het aantal personen dat het hele desbetreffende
         referentiejaar voltijds in de betrokken onderneming of voor rekening van deze
         onderneming heeft gewerkt. Het werk van personen die niet het hele jaar hebben
         gewerkt, deeltijdwerk ongeacht de duur ervan en seizoenarbeid worden in breuken van AJE’s uitgedrukt. Het aantal werkzame personen bestaat uit:

         a) de loontrekkenden;

         b) de personen die voor deze onderneming werken, er een ondergeschikte verhouding mee hebben en voor het nationale recht met loontrekkenden gelijkgesteld zijn;

         c) de eigenaren-bedrijfsleiders;

         d) de vennoten die geregeld een activiteit in de onderneming uitoefenen en
            financiële voordelen van de onderneming genieten.

         Leerlingen en studenten die een beroepsopleiding volgen en een leer- of beroepsopleidingsovereenkomst hebben, worden niet meegeteld in het aantal werkzame
         personen. De duur van zwangerschaps- en ouderschapsverlof wordt niet
         meegerekend.

    Artikel 6
                       Vaststelling van de gegevens van de onderneming

         1.   In het geval van een zelfstandige onderneming worden de gegevens, met
         inbegrip van het aantal werkzame personen, uitsluitend op basis van de rekeningen van die onderneming vastgesteld.

         2.    De gegevens, met inbegrip van het aantal werkzame personen, van een
         onderneming die partnerondernemingen of verbonden ondernemingen heeft, worden vastgesteld op basis van de rekeningen en andere gegevens van de onderneming of, zo van toepassing, van de geconsolideerde rekeningen van de onderneming of van de geconsolideerde rekeningen waarin de onderneming door consolidatie is opgenomen.

         De in de eerste alinea bedoelde gegevens worden samengeteld met de gegevens
         van de eventuele partnerondernemingen van de betrokken onderneming die zich
         meteen boven of onder het niveau van die onderneming bevinden. De samentelling geschiedt in evenredigheid met het aandeel in het kapitaal of de stemrechten (het hoogste van de beide percentages). Bij wederzijdse participatie geldt
         het hoogste van deze percentages.

         De in de eerste en tweede alinea bedoelde gegevens worden samengeteld met
         alle, nog niet door consolidatie in de rekeningen opgenomen gegevens (100 %)
         van de eventuele, direct of indirect met de betrokken onderneming verbonden
         ondernemingen.

         3.    Voor de toepassing van lid 2 resulteren de gegevens van de partnerondernemingen van de betrokken onderneming uit de, indien van toepassing, geconsolideerde rekeningen en andere gegevens. Deze worden samengeteld met alle
         gegevens (100 %) van de met deze partnerondernemingen verbonden ondernemingen, tenzĳ hun gegevens reeds door consolidatie daarin zĳn opgenomen.

    ▼B
         Voor de toepassing van het genoemde lid 2 resulteren de gegevens van de met de
         betrokken onderneming verbonden ondernemingen uit hun, indien van toepassing, geconsolideerde rekeningen en andere gegevens. Deze worden evenredig
         samengeteld met de gegevens van de eventuele partnerondernemingen van deze
         verbonden ondernemingen die zich meteen boven of onder het niveau van de
         laatstgenoemde ondernemingen bevinden, mits deze gegevens in de geconsolideerde rekeningen nog niet zijn opgenomen in een verhouding die ten minste
         gelijk is aan het in de tweede alinea van lid 2 vastgestelde percentage.
         4.    Indien het aantal werkzame personen van een bepaalde onderneming niet
         uit de geconsolideerde rekeningen blijkt, wordt het berekend door de gegevens
         van haar partnerondernemingen evenredig samen te tellen en daaraan de gegevens toe te voegen van de ondernemingen waarmee zij is verbonden.

    ▼B
