      output:
        - name: voldoet_aan_voorwaarden_art_29
          type: boolean
          description: >-
            De voorgenomen steun voor het herstel van door beschermde dieren
            veroorzaakte schade voldoet aan de voorwaarden van artikel 29 en aan
            hoofdstuk I (artikel 4 kent voor artikel 29 geen aanmeldingsdrempel).
      actions:
        - output: voldoet_aan_voorwaarden_art_29
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2: rechtstreeks oorzakelijk verband, vastgesteld
              # overeenkomstig lid 5
              - $oorzakelijk_verband_vastgesteld_door_lidstaat
              # lid 3: "De steun wordt rechtstreeks betaald aan de betrokken
              # onderneming of aan een producentengroepering of -organisatie"
              - operation: IN
