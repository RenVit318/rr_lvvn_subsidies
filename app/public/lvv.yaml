      actions:
        - output: voldoet_aan_voorwaarden_art_32
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '32'
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2: "bijdraagt aan ... doelstellingen van artikel 6, leden 1
              # en 2, van Verordening (EU) 2021/2115"
              - $samenwerking_draagt_bij_aan_doelstellingen_art_6_vo_2021_2115
              # lid 3: "zijn ten minste twee actoren betrokken"
              - operation: GREATER_THAN_OR_EQUAL
                subject: $aantal_betrokken_actoren
                value: 2
              # lid 3: "moet echter vooral ten goede komen aan de landbouwsector"
              - $komt_vooral_ten_goede_aan_landbouwsector
              # lid 4: "De volgende vormen van samenwerking komen in aanmerking"
              - operation: IN
                subject: $samenwerkingsvorm
                values:
                  - SAMENWERKING_TUSSEN_ONDERNEMINGEN
                  - OPRICHTING_CLUSTERS_NETWERKEN
                  - BEDRIJFSOPVOLGING
              # lid 4, punt c: pensioenleeftijd-eis, alleen bij bedrijfsopvolging
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $samenwerkingsvorm
                      value: BEDRIJFSOPVOLGING
                    then: $landbouwer_bereikt_pensioenleeftijd_uiterlijk_einde_verrichting
                default: true
              # lid 5: "waarbij uitsluitend onderzoeksinstellingen zijn
              # betrokken, mag geen steun worden verleend"
              - operation: NOT
                value: $uitsluitend_onderzoeksinstellingen_betrokken
              # lid 6: "voor samenwerking bij de volgende activiteiten"
              - operation: IN
                subject: $samenwerkingsactiviteit
                values:
                  - PROEFPROJECT
                  - ONTWIKKELING_NIEUWE_PRODUCTEN
                  - GEZAMENLIJKE_WERKPROCEDES_KLEINSCHALIG
                  - KORTE_KETENS_LOKALE_MARKTEN
                  - AFZETBEVORDERING_LOKAAL
                  - COLLECTIEVE_KLIMAATACTIE
                  - GEZAMENLIJKE_MILIEUPROJECTEN
                  - DUURZAME_LEVERING_BIOMASSA
                  - LOKALE_ONTWIKKELINGSSTRATEGIE
              # lid 7: "alleen ... voor nieuwe samenwerkingsvormen, met inbegrip
              # van bestaande ... indien een nieuwe activiteit wordt opgestart"
              - $nieuwe_samenwerkingsvorm_of_nieuwe_activiteit
              # lid 8: korte ketens (lid 6, punten d en e): "hoogstens één
              # intermediair" tussen landbouwer en consument
              - operation: IF
                cases:
                  - when:
                      operation: IN
                      subject: $samenwerkingsactiviteit
                      values:
                        - KORTE_KETENS_LOKALE_MARKTEN
                        - AFZETBEVORDERING_LOKAAL
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $aantal_intermediairs_tussen_landbouwer_en_consument
                      value: 1
                default: true
              # lid 9: "in overeenstemming ... met de artikelen 206 tot en met
              # 210 bis van Verordening (EU) nr. 1308/2013"
              - $in_overeenstemming_met_artt_206_210bis_vo_1308_2013
              # lid 12: "gedurende ten hoogste zeven jaar"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunduur_jaren
                value: 7
              # lid 13: "ten hoogste 100 % van de in aanmerking komende kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
- number: '33'
  text: |-
    **Steun voor het opvangen van nadelen in verband met Natura 2000- gebieden**

    1.   Steun voor het opvangen van nadelen in verband met Natura 2000-landbouwgebieden is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    ▼B
    2.   De steun wordt jaarlijks per hectare landbouwgrond verleend om de begunstigden te vergoeden voor de extra kosten die zij maken en de inkomsten die zij derven als gevolg van de nadelen die zij ondervinden in de landbouwgebieden die rechtstreeks worden getroffen door de uitvoering van de Richtlijnen 92/43/EEG en 2009/147/EG.

    3.    De steun wordt slechts verleend voor nadelen die voortvloeien uit vereisten die verder gaan dan de desbetreffende goede landbouw- en milieucondities (“GLMC-normen”) krachtens titel III, hoofdstuk I, afdeling 2, van Verordening (EU) 2021/2115, en dan de voorwaarden voor de instandhouding van landbouwareaal overeenkomstig artikel 4, lid 1, punt a), van Verordening (EU) 2021/2115.

    4.   De steun wordt slechts verleend voor de volgende landbouwgebieden:

    a) Natura 2000-landbouwgebieden;

    b) andere afgebakende natuurbeschermingsgebieden met milieubeperkingen voor de landbouw waarmee wordt bijgedragen aan de uitvoering van artikel 10 van Richtlijn 92/43/EEG; deze gebieden mogen niet groter zijn dan 5 % van de aangewezen Natura 2000-gebieden die onder de territoriale reikwijdte van het betrokken strategisch GLB-plan vallen.

    5.    De steunintensiteit blijft beperkt tot 100 % van de in lid 2 bedoelde kosten en mag niet meer bedragen dan 500 EUR per hectare per jaar in de eerste periode van ten hoogste vijf jaar en 200 EUR per hectare per jaar in de daaropvolgende periode.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_33
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_33
    untranslatables:
      - construct: vaststelling van de extra kosten en gederfde inkomsten (lid 2)
        reason: >-
          De vergoedingsgrondslag — welke extra kosten en gederfde inkomsten het
          gevolg zijn van de nadelen door de uitvoering van de Richtlijnen
          92/43/EEG en 2009/147/EG — is een berekening van subsidiabele kosten;
          breedte-eerst buiten scope. Het bestaan van zulk nadeel is als
          boolean-parameter gemodelleerd.
        legal_text_excerpt: >-
          om de begunstigden te vergoeden voor de extra kosten die zij maken en
          de inkomsten die zij derven als gevolg van de nadelen die zij
          ondervinden in de landbouwgebieden die rechtstreeks worden getroffen
          door de uitvoering van de Richtlijnen 92/43/EEG en 2009/147/EG
        accepted: false
      - construct: 5%-plafond voor andere afgebakende natuurbeschermingsgebieden (lid 4, punt b)
        reason: >-
          De toets dat die gebieden samen niet groter zijn dan 5 % van de
          aangewezen Natura 2000-gebieden onder het strategisch GLB-plan is een
          aggregatie over gebiedsoppervlakten; gemodelleerd als
          boolean-tussenstand (gebied_binnen_vijf_procent_grens).
        legal_text_excerpt: >-
          deze gebieden mogen niet groter zijn dan 5 % van de aangewezen
          Natura 2000-gebieden die onder de territoriale reikwijdte van het
          betrokken strategisch GLB-plan vallen
        accepted: false
    execution:
      parameters:
        - name: steunbedrag
          type: amount
          type_spec:
            unit: eurocent
          required: true
          description: >-
            Voorgenomen steun per hectare per jaar, zoals dit artikel de steun
            meet (lid 2 jo. lid 5).
        - name: binnen_eerste_periode_van_ten_hoogste_vijf_jaar
          type: boolean
          required: true
          description: >-
            De steun valt in de eerste periode van ten hoogste vijf jaar (lid 5);
            daarna geldt het lagere maximum en de lagere aanmeldingsdrempel.
        - name: steun_jaarlijks_per_hectare
          type: boolean
          required: true
          description: De steun wordt jaarlijks per hectare landbouwgrond verleend (lid 2).
        - name: nadeel_door_uitvoering_habitat_of_vogelrichtlijn
          type: boolean
          required: true
          description: >-
            De begunstigde ondervindt nadelen in landbouwgebieden die
            rechtstreeks worden getroffen door de uitvoering van de Richtlijnen
            92/43/EEG en 2009/147/EG (lid 2).
        - name: vereisten_gaan_verder_dan_glmc_normen
          type: boolean
          required: true
          description: >-
            De nadelen vloeien voort uit vereisten die verder gaan dan de
            GLMC-normen krachtens titel III, hoofdstuk I, afdeling 2, van
            Verordening (EU) 2021/2115 en dan de voorwaarden voor de
            instandhouding van landbouwareaal overeenkomstig artikel 4, lid 1,
            punt a), van die verordening (lid 3).
        - name: gebiedstype
          type: string
          required: true
          description: >-
            Landbouwgebied waarvoor de steun wordt verleend (lid 4):
            NATURA_2000_LANDBOUWGEBIED (punt a) of
            ANDER_AFGEBAKEND_NATUURBESCHERMINGSGEBIED (punt b: met
            milieubeperkingen, bijdragend aan artikel 10 van Richtlijn 92/43/EEG).
        - name: gebied_binnen_vijf_procent_grens
          type: boolean
          required: false
          description: >-
            Alleen bij ANDER_AFGEBAKEND_NATUURBESCHERMINGSGEBIED: de gebieden
            blijven binnen het 5%-plafond van lid 4, punt b (tussenstand, zie
            untranslatable).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steun als percentage van de in lid 2 bedoelde kosten
            (lid 5).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: Aan hoofdstuk I van deze verordening is voldaan (lid 1, via artikel 3).
        - name: aanmeldingsdrempel_art_33
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_33
          description: >-
            Aanmeldingsdrempel artikel 4 voor artikel 33, eerste periode van ten
            hoogste vijf jaar (500 EUR per hectare per jaar).
        - name: aanmeldingsdrempel_art_33_na_eerste_periode
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_33_na_eerste_periode
          description: >-
            Aanmeldingsdrempel artikel 4 voor artikel 33 na de eerste periode
            (200 EUR per hectare per jaar).
      output:
        - name: voldoet_aan_voorwaarden_art_33
          type: boolean
          description: >-
            De voorgenomen steun voor het opvangen van nadelen in verband met
            Natura 2000-landbouwgebieden voldoet aan de voorwaarden van
            artikel 33, aan de aanmeldingsdrempel van artikel 4 en aan
            hoofdstuk I. De maxima van lid 5 (500/200 EUR per hectare per jaar)
            vallen numeriek samen met de drempeltoets.
      actions:
        - output: voldoet_aan_voorwaarden_art_33
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '33'
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4 jo. lid 5: drempel eerste periode / daaropvolgende
              # periode; tevens de maxima "niet meer ... dan 500 EUR ... en
              # 200 EUR per hectare per jaar" van lid 5
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value:
                  operation: IF
                  cases:
                    - when:
                        operation: EQUALS
                        subject: $binnen_eerste_periode_van_ten_hoogste_vijf_jaar
                        value: true
                      then: $aanmeldingsdrempel_art_33
                  default: $aanmeldingsdrempel_art_33_na_eerste_periode
              # lid 2: "De steun wordt jaarlijks per hectare landbouwgrond
              # verleend"
              - $steun_jaarlijks_per_hectare
              # lid 2: nadelen als gevolg van de uitvoering van de Richtlijnen
              # 92/43/EEG en 2009/147/EG
              - $nadeel_door_uitvoering_habitat_of_vogelrichtlijn
              # lid 3: "slechts ... voor nadelen die voortvloeien uit vereisten
              # die verder gaan dan de ... GLMC-normen ..."
              - $vereisten_gaan_verder_dan_glmc_normen
              # lid 4: "slechts verleend voor de volgende landbouwgebieden"
              - operation: IN
                subject: $gebiedstype
                values:
                  - NATURA_2000_LANDBOUWGEBIED
                  - ANDER_AFGEBAKEND_NATUURBESCHERMINGSGEBIED
              # lid 4, punt b: 5%-plafond, alleen voor andere afgebakende
              # natuurbeschermingsgebieden
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $gebiedstype
                      value: ANDER_AFGEBAKEND_NATUURBESCHERMINGSGEBIED
                    then: $gebied_binnen_vijf_procent_grens
                default: true
              # lid 5: "De steunintensiteit blijft beperkt tot 100 % van de in
              # lid 2 bedoelde kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
- number: '34'
  text: |-
    **Steun voor agromilieuklimaatverbintenissen**

    1.    Steun voor agromilieuklimaatverbintenissen is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun mag worden toegekend aan alle ondernemingen en groepen daarvan die zich op vrijwillige basis ertoe verbinden verrichtingen die uit een of meer van de in lid 1 bedoelde verbintenissen bestaan, uit te voeren met het oog op het behoud en de bevordering van de noodzakelijke veranderingen in de landbouwpraktijken waarmee een positieve milieu- en klimaatbijdrage wordt geleverd.

    3.   De lidstaten verlenen alleen steun voor verbintenissen die verder gaan dan:

    a) de betrokken uit de regelgeving voortvloeiende beheerseisen en de GLMC-normen krachtens titel III, hoofdstuk I, afdeling 2, van Verordening (EU) 2021/2115;

    b) de betrokken minimumvoorschriften voor het gebruik van meststoffen en gewasbeschermingsmiddelen, en andere verplichte vereisten ter zake in het nationale recht en het recht van de Unie;

    ▼B
    c) de voorwaarden voor de handhaving van landbouwareaal overeenkomstig artikel 4, lid 2, punt b), van Verordening (EU) 2021/2115.

    4.   Alle in lid 3 bedoelde verplichte normen en vereisten moeten worden omschreven en toegelicht in de nationale rechtsgrondslag.

    5.    Wanneer in de nationale wetgeving nieuwe voorschriften worden opgelegd die verder gaan dan de overeenkomstige minimumvoorschriften van het recht van de Unie, kan voor verbintenissen als bedoeld in lid 3, punt b), waarmee aan de naleving van die voorschriften wordt bijgedragen, steun worden verleend gedurende maximaal 24 maanden vanaf de datum waarop die voorschriften voor het bedrijf verplicht worden.

    6.    De lidstaten zorgen ervoor dat bedrijven die krachtens dit artikel steun ontvangen, toegang hebben tot de voor de uitvoering van de betrokken verrichtingen vereiste kennis en informatie en dat degenen die zulks nodig hebben, passende opleiding kunnen volgen en toegang tot deskundigheid krijgen, met als doel landbouwers bij te staan die zich ertoe verbinden hun productiesystemen te wijzigen.

    7.    De onder dit artikel vallende verbintenissen worden aangegaan voor een periode van vijf tot zeven jaar. Als dat nodig is om de nagestreefde milieuvoordelen te bereiken of te behouden, kunnen de lidstaten evenwel een langere periode vaststellen voor specifieke soorten verbintenissen, onder meer door te voorzien in een jaarlijkse verlenging na afloop van de eerste periode. Voor verbintenissen inzake de instandhouding, het duurzame gebruik en de ontwikkeling van genetische hulpbronnen, voor nieuwe verbintenissen die onmiddellijk aansluiten op de in de eerste periode voltooide verbintenis, of in andere, naar behoren gemotiveerde gevallen kunnen de lidstaten een kortere periode van ten minste één jaar vaststellen.

    ▼M1 __________

    ▼B
    9.   Verbintenissen tot extensivering van de veehouderij moeten minimaal voldoen aan de volgende voorwaarden:

    a) om over- en onderbegrazing te voorkomen moet het volledige beweide areaal van het bedrijf worden beheerd en in stand gehouden;

    b) bij het bepalen van de veedichtheid moet rekening worden gehouden met alle op het bedrijf grazende dieren of, bij een verbintenis tot beperking van de wegsijpeling van nutriënten, met alle voor de betrokken verbintenis relevante dieren die op het bedrijf worden gehouden.

    10.    De steun kan betrekking hebben op collectieve regelingen en resultaatgebaseerde betalingsregelingen, zoals regelingen voor koolstoflandbouw, die de landbouwers ertoe aansporen om op grotere schaal of op meetbare wijze te zorgen voor een aanzienlijke kwalitatieve verbetering van het milieu. Op resultaten gebaseerde regelingen voor koolstoflandbouw moeten ervoor zorgen dat kwaliteitscriteria met betrekking tot kwantificering, additionaliteit, langetermijnopslag en duurzaamheid worden nageleefd, waarbij ook rekening wordt gehouden met de mededeling over duurzame koolstofcycli (29) wat betreft de certificering van koolstofverwijderingen.

    (29) Mededeling van de Commissie van 15 december 2021 over duurzame koolstofcycli (COM(2021) 800 final).

    ▼B
    11.   Voor verbintenissen die op grond van dit artikel worden aangegaan, stelt de lidstaat een herzieningsclausule vast die de aanpassing ervan garandeert wanneer de desbetreffende, in de leden 3, 4 en 9 bedoelde verplichte vereisten, normen en voorwaarden worden gewijzigd.

    12.    De steun wordt jaarlijks verleend om de begunstigden geheel of gedeeltelijk te vergoeden voor de extra kosten en de gederfde inkomsten die voortvloeien uit de agromilieuklimaatverbintenissen.

    13.   Voor verbintenissen die onder artikel 35 vallen, wordt in het kader van dit artikel geen steun verleend.

    14.   De steun wordt betaald per hectare.

    15.    De steun blijft beperkt tot 100 % van de in aanmerking komende kosten en bedraagt hoogstens 600 EUR per hectare per jaar voor eenjarige teelten, 900 EUR per hectare per jaar voor gespecialiseerde blijvende teelten en 450 EUR per hectare per jaar voor andere vormen van landgebruik.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_34
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_34
    untranslatables:
      - construct: 24-maandenvenster voor nieuwe nationale voorschriften (lid 5)
        reason: >-
          De toelating om bij nieuwe nationale voorschriften die verder gaan dan
          de Unie-minimumvoorschriften maximaal 24 maanden vanaf de
          verplichtwording steun te verlenen, vergt een tijdsvenster per bedrijf
          en per voorschrift; niet uitdrukbaar als voorwaarde op het niveau van
          de steunmaatregel.
        legal_text_excerpt: >-
          kan ... steun worden verleend gedurende maximaal 24 maanden vanaf de
          datum waarop die voorschriften voor het bedrijf verplicht worden
        accepted: false
      - construct: verbintenisperiode van vijf tot zeven jaar met open verlengings- en verkortingsgronden (lid 7)
        reason: >-
          De hoofdregel (vijf tot zeven jaar) kent uitzonderingen met open
          normen: "als dat nodig is om de nagestreefde milieuvoordelen te
          bereiken of te behouden" (langer) en "in andere, naar behoren
          gemotiveerde gevallen" (korter, ten minste één jaar). Welke looptijd
          toelaatbaar is, is daarmee een beoordeling en geen rekentoets.
        legal_text_excerpt: >-
          De onder dit artikel vallende verbintenissen worden aangegaan voor een
          periode van vijf tot zeven jaar. Als dat nodig is om de nagestreefde
          milieuvoordelen te bereiken of te behouden, kunnen de lidstaten evenwel
          een langere periode vaststellen ... kunnen de lidstaten een kortere
          periode van ten minste één jaar vaststellen.
        accepted: false
      - construct: kwaliteitscriteria voor resultaatgebaseerde regelingen voor koolstoflandbouw (lid 10)
        reason: >-
          "Kwaliteitscriteria met betrekking tot kwantificering, additionaliteit,
          langetermijnopslag en duurzaamheid" — mede in het licht van de
          mededeling over duurzame koolstofcycli — is een open norm die een
          beoordeling van de regeling vergt.
        legal_text_excerpt: >-
          Op resultaten gebaseerde regelingen voor koolstoflandbouw moeten ervoor
          zorgen dat kwaliteitscriteria met betrekking tot kwantificering,
          additionaliteit, langetermijnopslag en duurzaamheid worden nageleefd
        accepted: false
      - construct: vaststelling van de extra kosten en gederfde inkomsten (lid 12)
        reason: >-
          De vergoedingsgrondslag (geheel of gedeeltelijk vergoeden van extra
          kosten en gederfde inkomsten uit de verbintenissen) is een berekening
          van subsidiabele kosten; breedte-eerst buiten scope.
        legal_text_excerpt: >-
          om de begunstigden geheel of gedeeltelijk te vergoeden voor de extra
          kosten en de gederfde inkomsten die voortvloeien uit de
          agromilieuklimaatverbintenissen
        accepted: false
    execution:
      parameters:
        - name: steunbedrag
          type: amount
          type_spec:
            unit: eurocent
          required: true
          description: >-
            Voorgenomen steun per hectare per jaar, zoals dit artikel de steun
            meet (leden 14 en 15).
        - name: teelttype
          type: string
          required: true
          description: >-
            Teelt- of landgebruikscategorie van lid 15: EENJARIG (eenjarige
            teelten), GESPECIALISEERD_BLIJVEND (gespecialiseerde blijvende
            teelten) of ANDER_LANDGEBRUIK (andere vormen van landgebruik);
            bepaalt het maximum en de aanmeldingsdrempel.
        - name: vrijwillige_agromilieuklimaatverbintenis
          type: boolean
          required: true
          description: >-
            De onderneming of groep verbindt zich op vrijwillige basis tot
            verrichtingen die uit een of meer agromilieuklimaatverbintenissen
            bestaan, met het oog op een positieve milieu- en klimaatbijdrage
            (lid 2).
        - name: verbintenis_gaat_verder_dan_verplichte_normen
          type: boolean
          required: true
          description: >-
            De verbintenissen gaan verder dan de uit de regelgeving
            voortvloeiende beheerseisen en GLMC-normen, de minimumvoorschriften
            voor meststoffen en gewasbeschermingsmiddelen en andere verplichte
            vereisten, en de voorwaarden voor de handhaving van landbouwareaal
            (lid 3, punten a-c).
        - name: verplichte_normen_omschreven_in_nationale_rechtsgrondslag
          type: boolean
          required: true
          description: >-
            Alle in lid 3 bedoelde verplichte normen en vereisten zijn omschreven
            en toegelicht in de nationale rechtsgrondslag (lid 4).
        - name: toegang_tot_kennis_en_opleiding_geborgd
          type: boolean
          required: true
          description: >-
            De lidstaat borgt toegang tot de vereiste kennis en informatie en
            tot passende opleiding en deskundigheid voor wie dat nodig heeft
            (lid 6).
        - name: betreft_extensivering_veehouderij
          type: boolean
          required: true
          description: De verbintenis is een verbintenis tot extensivering van de veehouderij (lid 9).
        - name: volledig_beweide_areaal_beheerd
          type: boolean
          required: false
          description: >-
            Alleen bij extensivering veehouderij: het volledige beweide areaal
            van het bedrijf wordt beheerd en in stand gehouden om over- en
            onderbegrazing te voorkomen (lid 9, punt a).
        - name: veedichtheid_over_alle_relevante_dieren
          type: boolean
          required: false
          description: >-
            Alleen bij extensivering veehouderij: bij het bepalen van de
            veedichtheid is rekening gehouden met alle op het bedrijf grazende
            dieren, dan wel — bij een verbintenis tot beperking van de
            wegsijpeling van nutriënten — met alle voor die verbintenis
            relevante dieren (lid 9, punt b).
        - name: herzieningsclausule_vastgesteld
          type: boolean
          required: true
          description: >-
            De lidstaat heeft voor de verbintenissen een herzieningsclausule
            vastgesteld die aanpassing garandeert bij wijziging van de in de
            leden 3, 4 en 9 bedoelde verplichte vereisten, normen en voorwaarden
            (lid 11).
        - name: steun_jaarlijks_per_hectare
          type: boolean
          required: true
          description: De steun wordt jaarlijks verleend en per hectare betaald (leden 12 en 14).
        - name: verbintenis_valt_onder_art_35
          type: boolean
          required: true
          description: >-
            De verbintenis valt onder artikel 35 (biologische landbouw); dan
            wordt onder dit artikel geen steun verleend (lid 13).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steun als percentage van de in aanmerking komende kosten
            (lid 15).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: Aan hoofdstuk I van deze verordening is voldaan (lid 1, via artikel 3).
        - name: aanmeldingsdrempel_art_34_eenjarige_teelten
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_34_eenjarige_teelten
          description: Aanmeldingsdrempel artikel 4 voor artikel 34, eenjarige teelten (600 EUR/ha/jaar).
        - name: aanmeldingsdrempel_art_34_gespecialiseerde_blijvende_teelten
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_34_gespecialiseerde_blijvende_teelten
          description: >-
            Aanmeldingsdrempel artikel 4 voor artikel 34, gespecialiseerde
            blijvende teelten (900 EUR/ha/jaar).
        - name: aanmeldingsdrempel_art_34_andere_vormen_landgebruik
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_34_andere_vormen_landgebruik
          description: >-
            Aanmeldingsdrempel artikel 4 voor artikel 34, andere vormen van
            landgebruik (450 EUR/ha/jaar).
      output:
        - name: voldoet_aan_voorwaarden_art_34
          type: boolean
          description: >-
            De voorgenomen steun voor agromilieuklimaatverbintenissen voldoet aan
            de voorwaarden van artikel 34, aan de aanmeldingsdrempel van
            artikel 4 (per teelttype) en aan hoofdstuk I. De maxima van lid 15
            (600/900/450 EUR per hectare per jaar) vallen numeriek samen met de
            drempeltoets.
      actions:
        - output: voldoet_aan_voorwaarden_art_34
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '34'
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 15: de drie teelt-/landgebruikscategorieën
              - operation: IN
                subject: $teelttype
                values:
                  - EENJARIG
                  - GESPECIALISEERD_BLIJVEND
                  - ANDER_LANDGEBRUIK
              # artikel 4 jo. lid 15: drempel per teelttype; tevens de maxima
              # "hoogstens 600 EUR ... 900 EUR ... 450 EUR per hectare per jaar"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value:
                  operation: IF
                  cases:
                    - when:
                        operation: EQUALS
                        subject: $teelttype
                        value: EENJARIG
                      then: $aanmeldingsdrempel_art_34_eenjarige_teelten
                    - when:
                        operation: EQUALS
                        subject: $teelttype
                        value: GESPECIALISEERD_BLIJVEND
                      then: $aanmeldingsdrempel_art_34_gespecialiseerde_blijvende_teelten
                  default: $aanmeldingsdrempel_art_34_andere_vormen_landgebruik
              # lid 2: vrijwillige verbintenis met positieve milieu- en
              # klimaatbijdrage
              - $vrijwillige_agromilieuklimaatverbintenis
              # lid 3: "alleen steun voor verbintenissen die verder gaan dan"
              # de punten a-c
              - $verbintenis_gaat_verder_dan_verplichte_normen
              # lid 4: omschreven en toegelicht in de nationale rechtsgrondslag
              - $verplichte_normen_omschreven_in_nationale_rechtsgrondslag
              # lid 6: toegang tot kennis, informatie, opleiding en
              # deskundigheid
              - $toegang_tot_kennis_en_opleiding_geborgd
              # lid 9: minimumvoorwaarden bij extensivering van de veehouderij
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $betreft_extensivering_veehouderij
                      value: true
                    then:
                      operation: AND
                      conditions:
                        - $volledig_beweide_areaal_beheerd
                        - $veedichtheid_over_alle_relevante_dieren
                default: true
              # lid 11: herzieningsclausule vastgesteld
              - $herzieningsclausule_vastgesteld
              # leden 12 en 14: jaarlijks verleend, betaald per hectare
              - $steun_jaarlijks_per_hectare
              # lid 13: geen steun voor verbintenissen die onder artikel 35
              # vallen
              - operation: NOT
                value: $verbintenis_valt_onder_art_35
              # lid 15: "beperkt tot 100 % van de in aanmerking komende kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
- number: '35'
  text: |-
    **Steun voor biologische landbouw**

    1.    Steun voor biologische landbouw is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun mag worden toegekend aan ondernemingen of groepen ondernemingen die zich op vrijwillige basis verbinden tot de omschakeling naar of de voortzetting van biologische landbouwpraktijken en -methoden als omschreven in Verordening (EU) 2018/848.

    3.   De lidstaten verlenen alleen steun voor verbintenissen die verder gaan dan:

    a) de betrokken uit de regelgeving voortvloeiende beheerseisen en de GLMC-normen krachtens titel III, hoofdstuk I, afdeling 2, van Verordening (EU) 2021/2115;

    b) de betrokken minimumvoorschriften voor het gebruik van meststoffen en gewasbeschermingsmiddelen en voor dierenwelzijn en andere verplichte vereisten ter zake in het nationale recht en het recht van de Unie;

    c) de voorwaarden voor de instandhouding van landbouwareaal overeenkomstig artikel 4, lid 2, van Verordening (EU) 2021/2115.

    4.   Al die verplichte normen en vereisten moeten worden omschreven en toegelicht in de nationale rechtsgrondslag.

    5.    Wanneer in de nationale wetgeving nieuwe voorschriften worden opgelegd die verder gaan dan de overeenkomstige minimumvoorschriften van het recht van de Unie, kan voor verbintenissen als bedoeld in lid 3, punt b), waarmee aan de naleving van die voorschriften wordt bijgedragen, steun worden verleend gedurende maximaal 24 maanden vanaf de datum waarop die voorschriften voor het bedrijf verplicht worden.

    ▼B
    6.    De in lid 3 bedoelde verbintenissen worden uitgevoerd in een eerste periode van vijf tot zeven jaar. Om bepaalde nagestreefde milieuvoordelen te bereiken of te behouden, mogen de lidstaten een langere periode vaststellen, onder meer door te voorzien in een jaarlijkse verlenging na afloop van de eerste periode. Als steun wordt verleend voor de omschakeling naar biologische landbouw, kunnen de lidstaten een kortere periode van ten minste één jaar vaststellen. Voor nieuwe voortzettingsverbintenissen die onmiddellijk op de in de eerste periode voltooide verbintenis aansluiten, kunnen de lidstaten een kortere periode van ten minste één jaar vaststellen.

    7.    De lidstaten zorgen ervoor dat bedrijven die in het kader van dit artikel verrichtingen uitvoeren, toegang hebben tot de voor de uitvoering daarvan vereiste kennis en informatie en dat degenen die zulks nodig hebben, passende opleidingen kunnen volgen en toegang tot deskundigheid krijgen, met als doel landbouwers bij te staan die zich ertoe verbinden hun productiesystemen te wijzigen.

    8.    Voor verbintenissen die op grond van dit artikel worden aangegaan, stelt de lidstaat een herzieningsclausule vast die de aanpassing ervan garandeert wanneer de desbetreffende, in lid 3 bedoelde verplichte vereisten, normen en voorwaarden worden gewijzigd.

    9.   De steun wordt jaarlijks verleend om de begunstigden geheel of gedeeltelijk te vergoeden voor de extra kosten en de gederfde inkomsten die voortvloeien uit de verbintenissen. Uit hoofde van dit artikel wordt geen steun verleend voor onder artikel 34 vallende verbintenissen of voor onder artikel 20 vallende kosten.

    10.    Voor steun voor investeringen in de primaire productie en de verwerking en afzet van biologische producten gelden de artikelen 14 en 17.

    11.    De steun blijft beperkt tot 100 % van de in aanmerking komende kosten en bedraagt hoogstens 600 EUR per hectare per jaar voor eenjarige teelten, 900 EUR per hectare per jaar voor gespecialiseerde blijvende teelten en 450 EUR per hectare per jaar voor andere vormen van landgebruik.

    Afdeling 3 Steun voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed
