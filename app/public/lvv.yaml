# HOOFDSTUK III — Categorieën steun
- number: '14'
  text: |-
    **Steun voor met de primaire landbouwproductie verband houdende investeringen op landbouwbedrijven**

    1.    Steun voor met de primaire landbouwproductie verband houdende investeringen op landbouwbedrijven is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De investering mag worden verricht door een of meer begunstigden of betrekking hebben op materiële of immateriële activa die door een of meer begunstigden worden gebruikt.

    3.     De investering is gericht op ten minste een van de volgende doelstellingen:

    a) verbeteren van de algehele prestatie en duurzaamheid van het landbouwbedrijf, met name door een verlaging van de productiekosten of de verbetering en omschakeling van de productie;

    b) verbeteren van het natuurlijke milieu, de hygiëneomstandigheden of de normen inzake dierenwelzijn;

    c) aanleggen en verbeteren van infrastructuur voor de ontwikkeling, aanpassing en modernisering van de landbouw, met inbegrip van ontsluiting van landbouwgrond, ruilverkaveling, bodemverbetering, energie-efficiëntie, levering van duurzame energie en water- of energiebesparing;

    d) herstellen van productiepotentieel dat schade heeft opgelopen door natuurrampen, ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, dierziekten, plantenplagen en beschermde dieren, en voorkomen van schade als gevolg van die gebeurtenissen en factoren; als de schade kan worden gelinkt aan de klimaatverandering, nemen de begunstigden bij het herstel waar passend maatregelen voor aanpassing aan de klimaatverandering;

    e) bijdragen aan de matiging van en aanpassing aan klimaatverandering, onder meer door de vermindering van de uitstoot van broeikasgassen en een betere koolstofvastlegging, en bevorderen van duurzame energie en energie-efficiëntie;

    f) bijdragen aan een duurzame circulaire bio-economie en bevorderen van de duurzame ontwikkeling en het efficiënte beheer van natuurlijke hulpbronnen zoals water, bodem en lucht, onder meer door het verminderen van de afhankelijkheid van chemische middelen;

    ▼B
    g) bijdragen tot het tot staan brengen en ombuigen van biodiversiteitsverlies, versterken van ecosysteemdiensten en in stand houden van habitats en landschappen.

    4.   De investering kan verband houden met de productie, op het landbouwbedrijf, van biobrandstoffen of van energie uit hernieuwbare bronnen mits die productie niet groter is dan het gemiddelde jaarlijkse brandstof- of energieverbruik van het betrokken bedrijf.

    Indien de investering wordt gedaan voor de productie van biobrandstoffen, mag de productiecapaciteit van de productie-installaties niet groter zijn dan de capaciteit die overeenstemt met het gemiddelde jaarlijkse brandstofverbruik van het landbouwbedrijf, en mogen de geproduceerde biobrandstoffen niet op de markt worden verkocht.

    Als wordt geïnvesteerd voor de productie, op het landbouwbedrijf, van thermische energie en elektriciteit uit hernieuwbare bronnen, mogen de productie-installaties slechts voorzien in de eigen energiebehoeften van de begunstigde en mag de productiecapaciteit van die installaties niet groter zijn dan de capaciteit die overeenstemt met het gecombineerde gemiddelde jaarlijkse energieverbruik van thermische energie en elektriciteit van het landbouwbedrijf, met inbegrip van het landbouwhuishouden. De verkoop van elektriciteit aan het net is slechts toegestaan binnen de jaarlijkse gemiddelde limiet van het eigen verbruik.

    Wanneer de investering door verschillende begunstigden wordt uitgevoerd om in hun eigen behoefte aan biobrandstof en energie te voldoen, is het gemiddelde jaarlijkse verbruik de som van het gemiddelde jaarlijkse verbruik van alle begunstigden.

    Bij investeringen in infrastructuur voor hernieuwbare energie die energie verbruikt of produceert, moet worden voldaan aan de minimumnormen voor energie-efficiëntie, indien dergelijke normen op nationaal niveau bestaan.

    Investeringen in installaties die vooral tot doel hebben elektriciteit op te wekken uit biomassa, komen niet voor steun in aanmerking tenzij een door de lidstaten te bepalen minimumpercentage aan warmte-energie wordt gebruikt.

    De lidstaten stellen overeenkomstig artikel 26 van Richtlijn (EU) 2018/2001 voor de verschillende types installaties drempelwaarden vast voor het maximale aandeel granen en andere zetmeelrijke gewassen, suikergewassen en oliehoudende gewassen dat mag worden gebruikt voor de productie van bio-energie, waaronder biobrandstoffen. De steun voor investeringen in bio-energieprojecten blijft beperkt tot bio-energie die voldoet aan de toepasselijke duurzaamheidscriteria die zijn vastgelegd in de wetgeving van de Unie.

    5.    Steun voor investeringen waarvoor krachtens Richtlijn 2011/92/EU van het Europees Parlement en de Raad (11) een milieueffectbeoordeling moet worden uitgevoerd, mag slechts worden toegekend op voorwaarde dat die beoordeling is uitgevoerd en de vergunning voor het betrokken investeringsproject is verleend vóór de datum van de toekenning van de individuele steun.

    ▼B
    6.     De steun dekt de volgende in aanmerking komende kosten:

    a) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, met inbegrip van investeringen in passieve binnenhuisbekabeling of gestructureerde bekabeling voor datanetwerken en, indien nodig, de randuitrusting van het passieve netwerk op het particuliere terrein buiten het gebouw, waarbij aangekochte grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de totale in aanmerking komende kosten van de betrokken verrichting;

    b) de kosten van de koop of huurkoop van machines en uitrusting, tot maximaal de marktwaarde van de activa;

    c) de algemene kosten in verband met de in de punten a) en b) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs en voor advies over ecologische en economische duurzaamheid, duurzame energie, energie-efficiëntie en de productie en het gebruik van hernieuwbare energie, met inbegrip van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer op basis van de resultaten daarvan geen uitgaven uit hoofde van de punten a) en b) worden verricht;

    d) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken;

    e) uitgaven voor niet-productieve investeringen die verband houden met de specifieke milieu- en klimaatgerelateerde doelstellingen als bedoeld in lid 3, punten e), f) en g);

    f) als het gaat om irrigatie: de kosten van investeringen die aan de volgende voorwaarden voldoen:

    i) de Commissie is in kennis gesteld van een stroomgebiedbeheerplan overeenkomstig Richtlijn 2000/60/EG van het Europees Parlement en de Raad (12) dat is opgesteld voor het hele gebied waarin de investering plaatsvindt en voor alle andere gebieden waar de investering gevolgen voor het milieu kan hebben; de maatregelen die in het kader van het stroomgebiedbeheerplan overeenkomstig artikel 11 van die richtlijn worden uitgevoerd en voor de landbouwsector van belang zijn, worden in het betrokken maatregelenprogramma omschreven,

    ii) er is een watermetingssysteem waarmee het waterverbruik op het niveau van de gesteunde investering kan worden gemeten, of er wordt een dergelijk systeem geplaatst als onderdeel van de investering,

    iii) een investering in een verbetering van bestaande irrigatie-installaties of irrigatie-infrastructuuronderdelen is vooraf beoordeeld om na te gaan of zij, afgaande op de technische parameters van de bestaande installatie of infrastructuur, waterbesparingen oplevert,

    ▼B
    iv) wanneer een investering een weerslag heeft op grond- of oppervlaktewaterlichamen waarvan de toestand, om met de waterhoeveelheid verband houdende redenen, in het betrokken stroomgebiedbeheerplan is aangemerkt als minder dan goed, of als uit geavanceerde beoordelingen van de klimaatkwetsbaarheid en -risico’s (13) blijkt dat de betrokken, in een goede toestand verkerende waterlichamen die toestand door de effecten van de klimaatverandering kunnen verliezen om met de waterhoeveelheid verband houdende redenen, moet overeenkomstig artikel 4, lid 1, van Richtlijn 2000/60/EG een daadwerkelijke vermindering van het watergebruik worden bewerkstelligd die bijdraagt tot het bereiken en het in stand houden van een goede toestand van die waterlichamen. De in de vorige zin vermelde voorwaarden zijn niet van toepassing op investeringen in bestaande installaties die enkel gevolgen hebben voor de energie-efficiëntie, investeringen in de aanleg van reservoirs of investeringen in het gebruik van gerecycleerd water die geen gevolgen hebben voor grond- of oppervlaktewaterlichamen,

    v) de lidstaten stellen als voorwaarde voor de steun percentages voor de potentiële waterbesparing en de daadwerkelijke vermindering van het watergebruik vast, om ervoor te zorgen dat er daadwerkelijk minder water door de installatie stroomt dan in de periode 2014-2020 en om zo een afzwakking van de milieuambities te voorkomen:

    — de potentiële waterbesparing moet ten minste 5 % bedragen wanneer de technische parameters van de bestaande installatie of infrastructuur reeds een hoge mate van efficiëntie bieden (vóór de investering), en ten minste 25 % wanneer de huidige efficiëntie laag is, en/of voor investeringen in gebieden waar waterbesparingen hard nodig zijn om een goede watertoestand te bereiken;

    — de daadwerkelijke vermindering van het waterverbruik bedraagt, voor de gehele investering, ten minste 50 % van de potentiële waterbesparing die mogelijk wordt gemaakt door de investering in de bestaande irrigatie-installatie of het bestaande infrastructuuronderdeel;

    — die waterbesparing moet afgestemd zijn op de behoeften die zijn vastgelegd in de stroomgebiedbeheerplannen in het kader van Richtlijn 2000/60/EG;

    g) steun voor investeringen in het gebruik van teruggewonnen water als alternatieve watervoorziening, voor zover de levering en het gebruik van dat water in overeenstemming zijn met Verordening (EU) 2020/741 van het Europees Parlement en de Raad (14);

    h) als het gaat om investeringen met het oog op het herstel van agrarisch productiepotentieel dat beschadigd is door natuurrampen, ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, dierziekten, plantenplagen of beschermde dieren: kosten om het agrarisch productiepotentieel te herstellen tot op het niveau van vóór de betrokken gebeurtenis;

    ▼B
    i) als het gaat om investeringen ter preventie van schade door natuurrampen, ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, dierziekten, plantenplagen of beschermde dieren: kosten van specifieke preventieve acties.
    7.    Andere dan de in lid 6, punten a) en b), bedoelde kosten in verband met een leasingcontract, zoals de marge voor de leasinggever, kosten van de herfinanciering van rente, overheadkosten en verzekeringspremies worden niet als in aanmerking komende kosten beschouwd. Werkkapitaal wordt niet beschouwd als in aanmerking komende kosten.
    8.    Wat irrigatie betreft, wordt slechts steun verleend door lidstaten die met betrekking tot het stroomgebiedsdistrict waarin de investering plaatsvindt, ervoor hebben gezorgd dat de landbouwsector bijdraagt aan de terugwinning van de kosten van waterdiensten overeenkomstig artikel 9, lid 1, tweede alinea, eerste streepje, van Richtlijn 2000/60/EG, in voorkomend geval rekening houdend met de maatschappelijke, ecologische en economische effecten van de terugwinning en met de geografische en klimatologische omstandigheden van de betrokken regio of regio’s.
    9.   Er mag geen steun worden toegekend voor:
    a) de aankoop van betalingsrechten;
    b) de aankoop en aanplant van eenjarige gewassen, met uitzondering van steun voor de financiering van in lid 6, punt h), bedoelde kosten;
    c) afwateringswerkzaamheden;
    d) de aankoop van dieren, behalve als het gaat om steun voor de financiering van in lid 6, punt h), bedoelde kosten of om de aankoop van waakhonden;
    e) bedrading of bekabeling voor datanetwerken buiten het particuliere eigendom. ▼M1
    10.    De in lid 1 bedoelde steun mag niet worden toegekend in strijd met de in Verordening (EU) nr. 1308/2013 vastgestelde verboden of beperkingen, ook niet wanneer die verboden of beperkingen uitsluitend betrekking hebben op steun van de Unie waarin die verordening voorziet. De steun mag niet worden beperkt tot specifieke landbouwproducten en moet dus ter beschikking worden gesteld van alle sectoren van de primaire landbouwproductie, van de hele sector plantaardige productie of van de hele sector dierlijke productie. De lidstaten mogen echter bepaalde producten uitsluiten wegens overcapaciteit op de interne markt of een gebrek aan afzetmogelijkheden. ▼B
    11.   De steunintensiteit bedraagt ten hoogste 65 % van de in aanmerking komende kosten.
    12.   De steunintensiteit kan tot maximaal 80 % worden verhoogd voor de volgende investeringen:
    a) investeringen die verband houden met een of meer specifieke milieu- en klimaatgerelateerde doelstellingen als vermeld in lid 3, punten e),
    f) en g), of met dierenwelzijn;
    b) investeringen door jonge landbouwers;
    c) investeringen in de ultraperifere gebieden of de kleinere eilanden in de Egeïsche Zee.
    13.    De in lid 12, punt c), bedoelde steunintensiteit kan worden verhoogd tot maximaal 85 % voor investeringen van kleine landbouwbedrijven in de zin van artikel 28 van Verordening (EU) 2021/2115.

    ▼B
    14.   De steunintensiteit kan tot maximaal 100 % worden verhoogd voor de volgende investeringen:
    a) niet-productieve investeringen die verband houden met in lid 3, punten e), f) en g), bedoelde doelstellingen;
    b) investeringen voor het herstel van het in lid 3, punt d), bedoelde productiepotentieel en investeringen in verband met de preventie van schade die kan worden aangericht door natuurrampen, buitengewone gebeurtenissen, ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld of beschermde dieren, en met de beperking van het risico van dergelijke schade.
    15.   De steunintensiteit voor irrigatie op grond van lid 6, punt f), blijft beperkt tot een of meer percentages die niet hoger zijn dan:
    a) 80 % van de in aanmerking komende kosten van investeringen in irrigatie op het landbouwbedrijf op grond van lid 6, punt f), iii);
    b) 100 % van de in aanmerking komende kosten van investeringen in landbouwinfrastructuur buiten het landbouwbedrijf ten behoeve van irrigatie;
    c) 65 % van de in aanmerking komende kosten van andere irrigatie-investeringen op landbouwbedrijven.

    (11) Richtlijn 2011/92/EU van het Europees Parlement en de Raad van 13 decem­ ber 2011 betreffende de milieueffectbeoordeling van bepaalde openbare en particuliere projecten (PB L 26 van 28.1.2012, blz. 1).
    (12) Richtlijn 2000/60/EG van het Europees Parlement en de Raad van 23 oktober 2000 tot vaststelling van een kader voor communautaire maatregelen betref­ fende het waterbeleid (PB L 327 van 22.12.2000, blz. 1).
    (13) Technische richtsnoeren voor de klimaattoetsing van infrastructuur in de periode 2021-2027 (PB C 373 van 16.9.2021, blz. 1).
    (14) Verordening (EU) 2020/741 van het Europees Parlement en de Raad van 25 mei 2020 inzake minimumeisen voor hergebruik van water (PB L 177 van 5.6.2020, blz. 32).
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_14
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_14
    untranslatables:
      - construct: afbakening en berekening van de in aanmerking komende kosten (leden 6 en 7)
        reason: >-
          De kostencategorieën van lid 6 (punten a t/m e en g t/m i) en de
          uitsluitingen van lid 7 vergen categorisering van de werkelijke
          uitgaven, het 10 %-plafond voor aangekochte grond, het
          marktwaardeplafond voor machines en uitrusting en de toets van
          teruggewonnen water aan Verordening (EU) 2020/741. Verdisconteerd in de
          parameter kosten_binnen_in_aanmerking_komende_categorieen
          (gemarkeerde tussenstand).
        suggestion: >-
          Verdieping: per kostenpost een categorisering plus het 10 %-grondplafond
          als aggregatie over de kostenposten.
        legal_text_excerpt: >-
          waarbij aangekochte grond slechts in aanmerking komt voor een bedrag
          dat niet hoger is dan 10 % van de totale in aanmerking komende kosten
          van de betrokken verrichting
        accepted: false
      - construct: voorwaarden voor irrigatie-investeringen (lid 6, punt f, i t/m v)
        reason: >-
          Stroomgebiedbeheerplan-kennisgeving, watermetingssysteem,
          ex-antebeoordeling van waterbesparingen en de door de lidstaten vast te
          stellen percentages (ten minste 5 % dan wel 25 % potentiële besparing,
          ten minste 50 % daadwerkelijke vermindering) vergen
          lidstaat-specifieke feiten en berekeningen over de installatie; niet
          uitdrukbaar als voorwaarde op de maatregel. Verdisconteerd in de
          parameter kosten_binnen_in_aanmerking_komende_categorieen.
        legal_text_excerpt: >-
          als het gaat om irrigatie: de kosten van investeringen die aan de
          volgende voorwaarden voldoen
        accepted: false
      - construct: drempelwaarden en duurzaamheidscriteria voor bio-energie (lid 4, laatste alinea)
        reason: >-
          De maximale aandelen granen, zetmeelrijke gewassen, suikergewassen en
          oliehoudende gewassen worden door de lidstaten per type installatie
          vastgesteld en de duurzaamheidscriteria staan in andere Uniewetgeving;
          beide zijn hier niet afleidbaar.
        legal_text_excerpt: >-
          De lidstaten stellen overeenkomstig artikel 26 van Richtlijn (EU)
          2018/2001 voor de verschillende types installaties drempelwaarden vast
          voor het maximale aandeel granen en andere zetmeelrijke gewassen,
          suikergewassen en oliehoudende gewassen
        accepted: false
      - construct: toegestane productuitsluiting wegens overcapaciteit of gebrek aan afzetmogelijkheden (lid 10)
        reason: >-
          Of een uitsluiting van bepaalde producten gerechtvaardigd is wegens
          overcapaciteit op de interne markt of een gebrek aan
          afzetmogelijkheden is een open norm. Verdisconteerd in de
          sectorbreedte-parameters (een toegestane uitsluiting laat die
          parameters waar).
        legal_text_excerpt: >-
          De lidstaten mogen echter bepaalde producten uitsluiten wegens
          overcapaciteit op de interne markt of een gebrek aan
          afzetmogelijkheden.
        accepted: false
      - construct: klimaatadaptatiemaatregelen bij herstel van door klimaatverandering gelinkte schade (lid 3, punt d)
        reason: >-
          "als de schade kan worden gelinkt aan de klimaatverandering, nemen de
          begunstigden bij het herstel waar passend maatregelen" — zowel de link
          met klimaatverandering als "waar passend" is een open norm.
        legal_text_excerpt: >-
          als de schade kan worden gelinkt aan de klimaatverandering, nemen de
          begunstigden bij het herstel waar passend maatregelen voor aanpassing
          aan de klimaatverandering
        accepted: false
    execution:
      input:
        # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening"
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (artikel 3)
        # artikel 4, lid 1, punt a: 600 000 EUR per onderneming per investeringsproject
        - name: aanmeldingsdrempel_art_14
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_14
          description: Aanmeldingsdrempel voor steun als bedoeld in artikel 14 (artikel 4, lid 1, punt a)
        # artikel 1, lid 1, punt a, i: alleen kmo's; handhaving van de
        # artikel-afhankelijke beperking ligt bij dit artikel (zie untranslatable
        # bij artikel 1)
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: De begunstigde is een kleine, middelgrote of micro-onderneming (Bijlage I)
      parameters:
        - name: steunbedrag
          type: amount
          type_spec:
            unit: eurocent
          required: true
          description: >-
            Voorgenomen steun (brutosubsidie-equivalent) per onderneming per
            investeringsproject
        - name: steunintensiteit_pct
          type: number
          required: true
          description: Voorgenomen steunintensiteit in procent van de in aanmerking komende kosten
        - name: actief_in_primaire_landbouwproductie
          type: boolean
          required: true
          description: >-
            Begunstigde is actief in de primaire landbouwproductie (artikel 1,
            lid 1, punt a, i: artikel 14 is alleen van toepassing op kmo's die in
            de primaire landbouwproductie actief zijn)
        - name: betreft_investering_primaire_landbouwproductie_op_landbouwbedrijf
          type: boolean
          required: true
          description: >-
            De steun betreft met de primaire landbouwproductie verband houdende
            investeringen op landbouwbedrijven (lid 1)
        # lid 3: "gericht op ten minste een van de volgende doelstellingen"
        - name: doel_verbetering_algehele_prestatie_en_duurzaamheid
          type: boolean
          required: true
          description: >-
            Doelstelling: verbeteren van de algehele prestatie en duurzaamheid
            van het landbouwbedrijf, met name door een verlaging van de
            productiekosten of de verbetering en omschakeling van de productie
            (lid 3, punt a)
        - name: doel_verbetering_milieu_hygiene_of_dierenwelzijnsnormen
          type: boolean
          required: true
          description: >-
            Doelstelling: verbeteren van het natuurlijke milieu, de
            hygiëneomstandigheden of de normen inzake dierenwelzijn (lid 3, punt b)
        - name: doel_aanleg_of_verbetering_infrastructuur_landbouwontwikkeling
          type: boolean
          required: true
          description: >-
            Doelstelling: aanleggen en verbeteren van infrastructuur voor de
            ontwikkeling, aanpassing en modernisering van de landbouw, met
            inbegrip van ontsluiting van landbouwgrond, ruilverkaveling,
            bodemverbetering, energie-efficiëntie, levering van duurzame energie
            en water- of energiebesparing (lid 3, punt c)
        - name: doel_herstel_of_preventie_productiepotentieel
          type: boolean
          required: true
          description: >-
            Doelstelling: herstellen van productiepotentieel dat schade heeft
            opgelopen door natuurrampen, ongunstige weersomstandigheden die met
            een natuurramp kunnen worden gelijkgesteld, dierziekten,
            plantenplagen en beschermde dieren, en voorkomen van schade als
            gevolg van die gebeurtenissen en factoren (lid 3, punt d)
        - name: doel_klimaatmitigatie_en_adaptatie
          type: boolean
          required: true
          description: >-
            Doelstelling: bijdragen aan de matiging van en aanpassing aan
            klimaatverandering, onder meer door de vermindering van de uitstoot
            van broeikasgassen en een betere koolstofvastlegging, en bevorderen
            van duurzame energie en energie-efficiëntie (lid 3, punt e)
        - name: doel_duurzame_bioeconomie_en_beheer_natuurlijke_hulpbronnen
          type: boolean
          required: true
          description: >-
            Doelstelling: bijdragen aan een duurzame circulaire bio-economie en
            bevorderen van de duurzame ontwikkeling en het efficiënte beheer van
            natuurlijke hulpbronnen zoals water, bodem en lucht (lid 3, punt f)
        - name: doel_biodiversiteit_ecosysteemdiensten_habitats
          type: boolean
          required: true
          description: >-
            Doelstelling: bijdragen tot het tot staan brengen en ombuigen van
            biodiversiteitsverlies, versterken van ecosysteemdiensten en in
            stand houden van habitats en landschappen (lid 3, punt g)
        # lid 4: biobrandstoffen en hernieuwbare energie op het bedrijf
        - name: betreft_productie_biobrandstoffen_of_hernieuwbare_energie_op_bedrijf
          type: boolean
          required: true
          description: >-
            De investering houdt verband met de productie, op het
            landbouwbedrijf, van biobrandstoffen of van energie uit hernieuwbare
            bronnen (lid 4, eerste alinea)
        - name: energieproductie_overschrijdt_gemiddeld_jaarlijks_verbruik_niet
          type: boolean
          required: true
          description: >-
            De productie is niet groter dan het gemiddelde jaarlijkse brandstof-
            of energieverbruik van het betrokken bedrijf (lid 4, eerste alinea);
            bij uitvoering door verschillende begunstigden voor de eigen
            behoefte is het gemiddelde jaarlijkse verbruik de som van de
            verbruiken van alle begunstigden (lid 4, vierde alinea)
        - name: betreft_productie_biobrandstoffen
          type: boolean
          required: true
          description: De investering wordt gedaan voor de productie van biobrandstoffen (lid 4, tweede alinea)
        - name: biobrandstofcapaciteit_overschrijdt_gemiddeld_brandstofverbruik_niet
          type: boolean
          required: true
          description: >-
            De productiecapaciteit van de productie-installaties is niet groter
            dan de capaciteit die overeenstemt met het gemiddelde jaarlijkse
            brandstofverbruik van het landbouwbedrijf (lid 4, tweede alinea)
        - name: biobrandstoffen_niet_op_de_markt_verkocht
          type: boolean
          required: true
          description: De geproduceerde biobrandstoffen worden niet op de markt verkocht (lid 4, tweede alinea)
        - name: betreft_productie_thermische_energie_of_elektriciteit_uit_hernieuwbare_bronnen
          type: boolean
          required: true
          description: >-
            Er wordt geïnvesteerd voor de productie, op het landbouwbedrijf, van
            thermische energie en elektriciteit uit hernieuwbare bronnen (lid 4,
            derde alinea)
        - name: installaties_voorzien_slechts_in_eigen_energiebehoefte
          type: boolean
          required: true
          description: >-
            De productie-installaties voorzien slechts in de eigen
            energiebehoeften van de begunstigde (lid 4, derde alinea)
        - name: capaciteit_overschrijdt_gecombineerd_gemiddeld_energieverbruik_niet
          type: boolean
          required: true
          description: >-
            De productiecapaciteit is niet groter dan de capaciteit die
            overeenstemt met het gecombineerde gemiddelde jaarlijkse
            energieverbruik van thermische energie en elektriciteit van het
            landbouwbedrijf, met inbegrip van het landbouwhuishouden (lid 4,
            derde alinea)
        - name: elektriciteitsverkoop_aan_net_binnen_gemiddelde_limiet_eigen_verbruik
          type: boolean
          required: true
          description: >-
            Verkoop van elektriciteit aan het net blijft binnen de jaarlijkse
            gemiddelde limiet van het eigen verbruik (lid 4, derde alinea)
        - name: betreft_investering_in_infrastructuur_voor_hernieuwbare_energie
          type: boolean
          required: true
          description: >-
            De investering betreft infrastructuur voor hernieuwbare energie die
            energie verbruikt of produceert (lid 4, vijfde alinea)
        - name: voldoet_aan_nationale_minimumnormen_energie_efficientie
          type: boolean
          required: true
          description: >-
            Er wordt voldaan aan de minimumnormen voor energie-efficiëntie;
            geldt als voldaan indien dergelijke normen op nationaal niveau niet
            bestaan (lid 4, vijfde alinea)
        - name: installatie_heeft_vooral_tot_doel_elektriciteit_uit_biomassa
          type: boolean
          required: true
          description: >-
            De investering betreft installaties die er vooral op gericht zijn
            elektriciteit op te wekken uit biomassa (lid 4, zesde alinea)
        - name: minimumpercentage_warmte_energie_wordt_gebruikt
          type: boolean
          required: true
          description: >-
            Een door de lidstaten te bepalen minimumpercentage aan
            warmte-energie wordt gebruikt (lid 4, zesde alinea)
        # lid 5: milieueffectbeoordeling
        - name: milieueffectbeoordeling_vereist
          type: boolean
          required: true
          description: >-
            Voor de investering moet krachtens Richtlijn 2011/92/EU een
            milieueffectbeoordeling worden uitgevoerd (lid 5)
        - name: milieueffectbeoordeling_uitgevoerd
          type: boolean
          required: true
          description: De milieueffectbeoordeling is uitgevoerd (lid 5)
        - name: vergunning_verleend_voor_datum_toekenning
          type: boolean
          required: true
          description: >-
            De vergunning voor het betrokken investeringsproject is verleend
            vóór de datum van de toekenning van de individuele steun (lid 5)
        # leden 6 en 7: in aanmerking komende kosten (gemarkeerde tussenstand,
        # zie untranslatables)
        - name: kosten_binnen_in_aanmerking_komende_categorieen
          type: boolean
          required: true
          description: >-
            De steun dekt uitsluitend de in lid 6 genoemde in aanmerking komende
            kosten (punten a t/m i, met inbegrip van het 10 %-grondplafond en de
            irrigatievoorwaarden van punt f), met inachtneming van de
            uitsluitingen van lid 7 (overige leasingkosten, werkkapitaal).
            Gemarkeerde tussenstand: de gedetailleerde kostentoets staat als
            untranslatable.
        # lid 8: irrigatie alleen bij kostenterugwinning waterdiensten
        - name: betreft_irrigatie_investering
          type: boolean
          required: true
          description: De investering betreft irrigatie als bedoeld in lid 6, punt f (leden 8 en 15)
        - name: lidstaat_waarborgt_kostenterugwinning_waterdiensten
          type: boolean
          required: true
          description: >-
            De lidstaat heeft met betrekking tot het stroomgebiedsdistrict
            waarin de investering plaatsvindt ervoor gezorgd dat de
            landbouwsector bijdraagt aan de terugwinning van de kosten van
            waterdiensten overeenkomstig artikel 9, lid 1, tweede alinea, eerste
            streepje, van Richtlijn 2000/60/EG, in voorkomend geval rekening
            houdend met de maatschappelijke, ecologische en economische effecten
            en de geografische en klimatologische omstandigheden (lid 8)
        # lid 9: uitgesloten steun
        - name: betreft_aankoop_betalingsrechten
          type: boolean
          required: true
          description: De steun betreft de aankoop van betalingsrechten (lid 9, punt a)
        - name: betreft_aankoop_of_aanplant_eenjarige_gewassen
          type: boolean
          required: true
          description: De steun betreft de aankoop en aanplant van eenjarige gewassen (lid 9, punt b)
        - name: betreft_herstel_van_beschadigd_agrarisch_productiepotentieel
          type: boolean
          required: true
          description: >-
            De steun betreft de financiering van kosten om het agrarisch
            productiepotentieel te herstellen tot op het niveau van vóór de
            betrokken gebeurtenis (lid 6, punt h; uitzondering in lid 9, punten
            b en d; lid 14, punt b)
        - name: betreft_afwateringswerkzaamheden
          type: boolean
          required: true
          description: De steun betreft afwateringswerkzaamheden (lid 9, punt c)
        - name: betreft_aankoop_dieren
          type: boolean
          required: true
          description: De steun betreft de aankoop van dieren (lid 9, punt d)
        - name: betreft_aankoop_waakhonden
          type: boolean
          required: true
          description: De aankoop van dieren betreft de aankoop van waakhonden (lid 9, punt d, uitzondering)
        - name: betreft_bekabeling_datanetwerken_buiten_particulier_eigendom
          type: boolean
          required: true
          description: >-
            De steun betreft bedrading of bekabeling voor datanetwerken buiten
            het particuliere eigendom (lid 9, punt e)
        # lid 10: GMO-verboden en sectorbreedte
        - name: in_strijd_met_verboden_of_beperkingen_vo_1308_2013
          type: boolean
          required: true
          description: >-
            De steun wordt toegekend in strijd met de in Verordening (EU)
            nr. 1308/2013 vastgestelde verboden of beperkingen, ook wanneer die
            uitsluitend betrekking hebben op steun van de Unie waarin die
            verordening voorziet (lid 10)
        - name: steun_beschikbaar_voor_alle_sectoren_primaire_productie
          type: boolean
          required: true
          description: >-
            De steun wordt ter beschikking gesteld van alle sectoren van de
            primaire landbouwproductie (lid 10); een door de lidstaat toegestane
            uitsluiting van bepaalde producten wegens overcapaciteit of gebrek
            aan afzetmogelijkheden laat deze parameter waar (zie untranslatable)
        - name: steun_beschikbaar_voor_hele_sector_plantaardige_productie
          type: boolean
          required: true
          description: De steun wordt ter beschikking gesteld van de hele sector plantaardige productie (lid 10)
        - name: steun_beschikbaar_voor_hele_sector_dierlijke_productie
          type: boolean
          required: true
          description: De steun wordt ter beschikking gesteld van de hele sector dierlijke productie (lid 10)
        # leden 12 t/m 15: verhogingen en plafonds van de steunintensiteit
        - name: is_niet_productieve_investering
          type: boolean
          required: true
          description: >-
            De investering is een niet-productieve investering (lid 6, punt e;
            lid 14, punt a)
        - name: betreft_preventie_van_schade_door_rampen_of_beschermde_dieren
          type: boolean
          required: true
          description: >-
            De investering houdt verband met de preventie van schade die kan
            worden aangericht door natuurrampen, buitengewone gebeurtenissen,
            ongunstige weersomstandigheden die met een natuurramp kunnen worden
            gelijkgesteld of beschermde dieren, en met de beperking van het
            risico van dergelijke schade (lid 14, punt b)
        - name: investering_houdt_verband_met_dierenwelzijn
          type: boolean
          required: true
          description: De investering houdt verband met dierenwelzijn (lid 12, punt a)
        - name: investering_door_jonge_landbouwer
          type: boolean
          required: true
          description: >-
            De investering wordt gedaan door een jonge landbouwer (lid 12, punt
            b); begrip artikel 2, punt 61 — zoals gedefinieerd door de lidstaat
            in zijn strategisch GLB-plan overeenkomstig artikel 4, lid 6, van
            Verordening (EU) 2021/2115
        - name: investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
          type: boolean
          required: true
          description: >-
            De investering vindt plaats in de ultraperifere gebieden of de
            kleinere eilanden in de Egeïsche Zee (lid 12, punt c; lid 13)
        - name: is_klein_landbouwbedrijf
          type: boolean
          required: true
          description: >-
            De investering is een investering van een klein landbouwbedrijf in
            de zin van artikel 28 van Verordening (EU) 2021/2115 (lid 13);
            gemarkeerde tussenstand — het begrip is buiten deze verordening
            gedefinieerd
        - name: betreft_irrigatie_infrastructuur_buiten_landbouwbedrijf
          type: boolean
          required: true
          description: >-
            De investering betreft landbouwinfrastructuur buiten het
            landbouwbedrijf ten behoeve van irrigatie (lid 15, punt b)
        - name: betreft_verbetering_bestaande_irrigatie_installatie
          type: boolean
          required: true
          description: >-
            De investering betreft een verbetering van bestaande
            irrigatie-installaties of irrigatie-infrastructuuronderdelen op het
            landbouwbedrijf als bedoeld in lid 6, punt f, iii (lid 15, punt a)
      output:
        - name: maximale_steunintensiteit_pct_art_14
          type: number
          description: >-
            Maximale steunintensiteit in procent van de in aanmerking komende
            kosten volgens de leden 11 t/m 15
        - name: voldoet_aan_voorwaarden_art_14
          type: boolean
          description: >-
            De voorgenomen steun voldoet aan de voorwaarden van artikel 14
            (steun voor met de primaire landbouwproductie verband houdende
            investeringen op landbouwbedrijven), met inbegrip van hoofdstuk I en
            de aanmeldingsdrempel van artikel 4
      actions:
        - output: maximale_steunintensiteit_pct_art_14
          value:
            operation: IF
            cases:
              # lid 15: "De steunintensiteit voor irrigatie op grond van lid 6,
              # punt f), blijft beperkt tot" — dit plafond gaat voor de
              # verhogingen van de leden 12 t/m 14
              - when: $betreft_irrigatie_investering
                then:
                  operation: IF
                  cases:
                    # lid 15, punt b: 100 % voor landbouwinfrastructuur buiten
                    # het landbouwbedrijf ten behoeve van irrigatie
                    - when: $betreft_irrigatie_infrastructuur_buiten_landbouwbedrijf
                      then: 100
                    # lid 15, punt a: 80 % voor investeringen in irrigatie op
                    # het landbouwbedrijf op grond van lid 6, punt f, iii
                    - when: $betreft_verbetering_bestaande_irrigatie_installatie
                      then: 80
                  # lid 15, punt c: 65 % voor andere irrigatie-investeringen op
                  # landbouwbedrijven
                  default: 65
              # lid 14: "kan tot maximaal 100 % worden verhoogd"
              - when:
                  operation: OR
                  conditions:
                    # lid 14, punt a: niet-productieve investeringen die verband
                    # houden met in lid 3, punten e), f) en g), bedoelde
                    # doelstellingen
                    - operation: AND
                      conditions:
                        - $is_niet_productieve_investering
                        - operation: OR
                          conditions:
                            - $doel_klimaatmitigatie_en_adaptatie
                            - $doel_duurzame_bioeconomie_en_beheer_natuurlijke_hulpbronnen
                            - $doel_biodiversiteit_ecosysteemdiensten_habitats
                    # lid 14, punt b: herstel van het in lid 3, punt d), bedoelde
                    # productiepotentieel
                    - $betreft_herstel_van_beschadigd_agrarisch_productiepotentieel
                    # lid 14, punt b: preventie van schade en beperking van het
                    # risico van dergelijke schade
                    - $betreft_preventie_van_schade_door_rampen_of_beschermde_dieren
                then: 100
              # lid 13: "kan worden verhoogd tot maximaal 85 % voor investeringen
              # van kleine landbouwbedrijven" in de in lid 12, punt c, bedoelde
              # gebieden
              - when:
                  operation: AND
                  conditions:
                    - $investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
                    - $is_klein_landbouwbedrijf
                then: 85
              # lid 12: "kan tot maximaal 80 % worden verhoogd"
              - when:
                  operation: OR
                  conditions:
                    # lid 12, punt a: milieu- en klimaatgerelateerde
                    # doelstellingen van lid 3, punten e), f) en g), of
                    # dierenwelzijn
                    - $doel_klimaatmitigatie_en_adaptatie
                    - $doel_duurzame_bioeconomie_en_beheer_natuurlijke_hulpbronnen
                    - $doel_biodiversiteit_ecosysteemdiensten_habitats
                    - $investering_houdt_verband_met_dierenwelzijn
                    # lid 12, punt b: investeringen door jonge landbouwers
                    - $investering_door_jonge_landbouwer
                    # lid 12, punt c: investeringen in de ultraperifere gebieden
                    # of de kleinere eilanden in de Egeïsche Zee
                    - $investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
                then: 80
            # lid 11: "De steunintensiteit bedraagt ten hoogste 65 % van de in
            # aanmerking komende kosten."
            default: 65
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '14'
            paragraph: 11-15
        - output: voldoet_aan_voorwaarden_art_14
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt a: het brutosubsidie-equivalent
              # overschrijdt 600 000 EUR per onderneming per investeringsproject
              # niet
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_14
              # artikel 1, lid 1, punt a, i: "alleen van toepassing ... op kmo's
              # die in de primaire landbouwproductie actief zijn" (handhaving
              # bij dit artikel)
              - $is_kmo
              - $actief_in_primaire_landbouwproductie
              # lid 1: "met de primaire landbouwproductie verband houdende
              # investeringen op landbouwbedrijven"
              - $betreft_investering_primaire_landbouwproductie_op_landbouwbedrijf
              # lid 3: "gericht op ten minste een van de volgende doelstellingen"
              - operation: OR
                conditions:
                  - $doel_verbetering_algehele_prestatie_en_duurzaamheid
                  - $doel_verbetering_milieu_hygiene_of_dierenwelzijnsnormen
                  - $doel_aanleg_of_verbetering_infrastructuur_landbouwontwikkeling
                  - $doel_herstel_of_preventie_productiepotentieel
                  - $doel_klimaatmitigatie_en_adaptatie
                  - $doel_duurzame_bioeconomie_en_beheer_natuurlijke_hulpbronnen
                  - $doel_biodiversiteit_ecosysteemdiensten_habitats
              # lid 4, eerste alinea: "mits die productie niet groter is dan het
              # gemiddelde jaarlijkse brandstof- of energieverbruik"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_productie_biobrandstoffen_of_hernieuwbare_energie_op_bedrijf
                  - $energieproductie_overschrijdt_gemiddeld_jaarlijks_verbruik_niet
              # lid 4, tweede alinea: capaciteitsplafond en verkoopverbod voor
              # biobrandstoffen
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_productie_biobrandstoffen
                  - operation: AND
                    conditions:
                      - $biobrandstofcapaciteit_overschrijdt_gemiddeld_brandstofverbruik_niet
                      - $biobrandstoffen_niet_op_de_markt_verkocht
              # lid 4, derde alinea: eigen behoeften, capaciteitsplafond en
              # netverkoop-limiet voor thermische energie en elektriciteit
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_productie_thermische_energie_of_elektriciteit_uit_hernieuwbare_bronnen
                  - operation: AND
                    conditions:
                      - $installaties_voorzien_slechts_in_eigen_energiebehoefte
                      - $capaciteit_overschrijdt_gecombineerd_gemiddeld_energieverbruik_niet
                      - $elektriciteitsverkoop_aan_net_binnen_gemiddelde_limiet_eigen_verbruik
              # lid 4, vijfde alinea: "moet worden voldaan aan de minimumnormen
              # voor energie-efficiëntie, indien dergelijke normen op nationaal
              # niveau bestaan"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_investering_in_infrastructuur_voor_hernieuwbare_energie
                  - $voldoet_aan_nationale_minimumnormen_energie_efficientie
              # lid 4, zesde alinea: "komen niet voor steun in aanmerking tenzij
              # een ... minimumpercentage aan warmte-energie wordt gebruikt"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $installatie_heeft_vooral_tot_doel_elektriciteit_uit_biomassa
                  - $minimumpercentage_warmte_energie_wordt_gebruikt
              # lid 5: milieueffectbeoordeling uitgevoerd en vergunning verleend
              # vóór de datum van toekenning
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $milieueffectbeoordeling_vereist
                  - operation: AND
                    conditions:
                      - $milieueffectbeoordeling_uitgevoerd
                      - $vergunning_verleend_voor_datum_toekenning
              # leden 6 en 7: "De steun dekt de volgende in aanmerking komende
              # kosten" (gemarkeerde tussenstand)
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 8: "wordt slechts steun verleend door lidstaten die ...
              # ervoor hebben gezorgd dat de landbouwsector bijdraagt aan de
              # terugwinning van de kosten van waterdiensten"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_irrigatie_investering
                  - $lidstaat_waarborgt_kostenterugwinning_waterdiensten
              # lid 9, punt a: geen steun voor de aankoop van betalingsrechten
              - operation: NOT
                value: $betreft_aankoop_betalingsrechten
              # lid 9, punt b: geen steun voor aankoop en aanplant van eenjarige
              # gewassen, met uitzondering van steun voor de financiering van in
              # lid 6, punt h, bedoelde kosten
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_aankoop_of_aanplant_eenjarige_gewassen
                  - $betreft_herstel_van_beschadigd_agrarisch_productiepotentieel
              # lid 9, punt c: geen steun voor afwateringswerkzaamheden
              - operation: NOT
                value: $betreft_afwateringswerkzaamheden
              # lid 9, punt d: geen steun voor de aankoop van dieren, behalve
              # voor lid 6, punt h, bedoelde kosten of waakhonden
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_aankoop_dieren
                  - $betreft_herstel_van_beschadigd_agrarisch_productiepotentieel
                  - $betreft_aankoop_waakhonden
              # lid 9, punt e: geen steun voor bedrading of bekabeling voor
              # datanetwerken buiten het particuliere eigendom
              - operation: NOT
                value: $betreft_bekabeling_datanetwerken_buiten_particulier_eigendom
              # lid 10: niet in strijd met de verboden of beperkingen van
              # Verordening (EU) nr. 1308/2013
              - operation: NOT
                value: $in_strijd_met_verboden_of_beperkingen_vo_1308_2013
              # lid 10: "moet dus ter beschikking worden gesteld van alle
              # sectoren van de primaire landbouwproductie, van de hele sector
              # plantaardige productie of van de hele sector dierlijke productie"
              - operation: OR
                conditions:
                  - $steun_beschikbaar_voor_alle_sectoren_primaire_productie
                  - $steun_beschikbaar_voor_hele_sector_plantaardige_productie
                  - $steun_beschikbaar_voor_hele_sector_dierlijke_productie
              # leden 11 t/m 15: de voorgenomen intensiteit blijft binnen het
              # toepasselijke maximum
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: $maximale_steunintensiteit_pct_art_14
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '14'
- number: '15'
  text: |-
    **Steun voor ruilverkaveling van landbouwgrond**

    Steun voor ruilverkaveling van landbouwgrond is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als deze voldoet aan hoofdstuk I van deze verordening en uitsluitend wordt toegekend voor juridische en administratieve kosten, inclusief opmetingskosten, ten belope van maximaal 100 % van de werkelijk gemaakte kosten.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_15
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_15
    untranslatables:
      - construct: afbakening van de werkelijk gemaakte juridische en administratieve kosten
        reason: >-
          Het 100 %-plafond is gesteld op "de werkelijk gemaakte kosten" van de
          juridische en administratieve verrichtingen (inclusief
          opmetingskosten); het vaststellen van die kostenbasis vergt
          categorisering van de werkelijke uitgaven. De intensiteitstoets is
          gemodelleerd tegen de opgegeven steunintensiteit_pct; de
          kostenafbakening zelf staat als parameter
          steun_uitsluitend_voor_juridische_en_administratieve_kosten
          (gemarkeerde tussenstand).
        legal_text_excerpt: >-
          uitsluitend wordt toegekend voor juridische en administratieve kosten,
          inclusief opmetingskosten, ten belope van maximaal 100 % van de
          werkelijk gemaakte kosten
        accepted: false
    execution:
      input:
        # "als deze voldoet aan hoofdstuk I van deze verordening"
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (artikel 3)
        # artikel 1, lid 1, punt a, i: alleen kmo's die in de primaire
        # landbouwproductie actief zijn; handhaving van die artikel-afhankelijke
        # beperking ligt bij dit artikel (zie untranslatable bij artikel 1)
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: De begunstigde is een kleine, middelgrote of micro-onderneming (Bijlage I)
      parameters:
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in procent van de werkelijk gemaakte
            juridische en administratieve kosten
        - name: actief_in_primaire_landbouwproductie
          type: boolean
          required: true
          description: >-
            Begunstigde is actief in de primaire landbouwproductie (artikel 1,
            lid 1, punt a, i: artikel 15 is alleen van toepassing op kmo's die in
            de primaire landbouwproductie actief zijn)
        - name: betreft_ruilverkaveling_van_landbouwgrond
          type: boolean
          required: true
          description: De steun betreft ruilverkaveling van landbouwgrond
        - name: steun_uitsluitend_voor_juridische_en_administratieve_kosten
          type: boolean
          required: true
          description: >-
            De steun wordt uitsluitend toegekend voor juridische en
            administratieve kosten, inclusief opmetingskosten. Gemarkeerde
            tussenstand: de afbakening van die kostenbasis staat als
            untranslatable.
      output:
        - name: voldoet_aan_voorwaarden_art_15
          type: boolean
          description: >-
            De voorgenomen steun voldoet aan de voorwaarden van artikel 15
            (steun voor ruilverkaveling van landbouwgrond), met inbegrip van
            hoofdstuk I. Artikel 4 kent voor artikel 15 geen aanmeldingsdrempel.
      actions:
        - output: voldoet_aan_voorwaarden_art_15
          value:
            operation: AND
            conditions:
              # "als deze voldoet aan hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 1, lid 1, punt a, i: "alleen van toepassing ... op kmo's
              # die in de primaire landbouwproductie actief zijn" (handhaving
              # bij dit artikel)
              - $is_kmo
              - $actief_in_primaire_landbouwproductie
              # "Steun voor ruilverkaveling van landbouwgrond"
              - $betreft_ruilverkaveling_van_landbouwgrond
              # "uitsluitend wordt toegekend voor juridische en administratieve
              # kosten, inclusief opmetingskosten"
              - $steun_uitsluitend_voor_juridische_en_administratieve_kosten
              # "ten belope van maximaal 100 % van de werkelijk gemaakte kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '15'
- number: '16'
  text: |-
    **Steun voor investeringen in verband met de verplaatsing van landbouwbedrijfsgebouwen**

    1.    Steun voor investeringen in verband met de verplaatsing van landbouwbedrijfsgebouwen die wordt toegekend aan kmo’s die actief zijn in de primaire landbouwproductie, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.
    2.   Met de verplaatsing van het landbouwbedrijfsgebouw moet een doel van algemeen belang worden nagestreefd. Het algemeen belang dat wordt aangevoerd om de steunverlening op grond van dit artikel te rechtvaardigen, wordt nader omschreven in de desbetreffende bepalingen van de betrokken lidstaat.
    3.   Als de verplaatsing van het landbouwbedrijfsgebouw bestaat uit het demonteren, verhuizen en weer opbouwen van bestaande voorzieningen, mag de steunintensiteit niet hoger zijn dan 100 % van de reële kosten van die werkzaamheden.
    4.    Wanneer de verplaatsing naast het in lid 3 bedoelde demonteren, verhuizen en weer opbouwen van bestaande voorzieningen leidt tot een modernisering van deze voorzieningen of een verhoging van de productiecapaciteit, gelden voor de kosten van de modernisering van de voorzieningen of de verhoging van de productiecapaciteit de steunintensiteiten voor investeringen als bedoeld in artikel 14, leden 12 tot en met 15.

    ▼B Voor de toepassing van dit lid wordt de loutere vervanging van een bestaand gebouw of van bestaande voorzieningen door een nieuw, modern gebouw of nieuwe, moderne voorzieningen waarbij de betrokken productie of technologie niet fundamenteel wordt gewijzigd, niet geacht met modernisering gepaard te gaan.

    5.    De maximale steunintensiteit kan oplopen tot 100 % van de in aanmerking komende kosten als het bij de verplaatsing gaat om activiteiten die dicht bij rurale woongebieden plaatsvinden, met als doel de levenskwaliteit of de milieuprestatie van die woongebieden te verbeteren.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_16
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_16
    untranslatables:
      - construct: steunintensiteiten van artikel 14, leden 12 tot en met 15, voor moderniserings- of capaciteitskosten (lid 4)
        reason: >-
          Wanneer de verplaatsing leidt tot modernisering van de voorzieningen
          of een verhoging van de productiecapaciteit, gelden voor de kosten
          daarvan de intensiteiten van artikel 14, leden 12 t/m 15, en voor het
          demonteren, verhuizen en weer opbouwen het plafond van lid 3. Dat
          vergt een splitsing van de kosten in twee delen en de
          gevalsanalyse van artikel 14 op het moderniseringsdeel. Gemodelleerd
          is alleen de in alle gevallen noodzakelijke bovengrens van 100 %.
        suggestion: >-
          Verdieping: kosten splitsen in een verplaatsings- en een
          moderniseringsdeel en het moderniseringsdeel toetsen aan de maximale
          intensiteit van artikel 14.
        legal_text_excerpt: >-
          gelden voor de kosten van de modernisering van de voorzieningen of de
          verhoging van de productiecapaciteit de steunintensiteiten voor
          investeringen als bedoeld in artikel 14, leden 12 tot en met 15
        accepted: false
      - construct: doel van algemeen belang (lid 2)
        reason: >-
          Open norm: het algemeen belang wordt nader omschreven in de
          desbetreffende bepalingen van de betrokken lidstaat en is hier niet
          afleidbaar. Verdisconteerd in de parameters
          verplaatsing_dient_doel_van_algemeen_belang en
          algemeen_belang_omschreven_in_nationale_bepalingen.
        legal_text_excerpt: >-
          Met de verplaatsing van het landbouwbedrijfsgebouw moet een doel van
          algemeen belang worden nagestreefd.
        accepted: false
    execution:
      input:
        # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van deze
        # verordening"
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (artikel 3)
        # artikel 4, lid 1, punt b: 600 000 EUR per onderneming per
        # investeringsproject, alleen voor verplaatsingssteun die leidt tot
        # modernisering of een verhoging van de productiecapaciteit (lid 4)
        - name: aanmeldingsdrempel_art_16
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_16
          description: >-
            Aanmeldingsdrempel voor investeringssteun voor de verplaatsing van
            een landbouwbedrijfsgebouw die leidt tot modernisering of een
            verhoging van de productiecapaciteit (artikel 4, lid 1, punt b)
        # lid 1: "toegekend aan kmo's die actief zijn in de primaire
        # landbouwproductie"
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: De begunstigde is een kleine, middelgrote of micro-onderneming (Bijlage I)
      parameters:
        - name: steunbedrag
          type: amount
          type_spec:
            unit: eurocent
          required: true
          description: >-
            Voorgenomen steun (brutosubsidie-equivalent) per onderneming per
            investeringsproject
        - name: steunintensiteit_pct
          type: number
          required: true
          description: Voorgenomen steunintensiteit in procent van de kosten
        - name: actief_in_primaire_landbouwproductie
          type: boolean
          required: true
          description: >-
            Begunstigde is actief in de primaire landbouwproductie (lid 1;
            tevens artikel 1, lid 1, punt a, i)
        - name: betreft_verplaatsing_landbouwbedrijfsgebouw
          type: boolean
          required: true
          description: >-
            De steun betreft investeringen in verband met de verplaatsing van
            landbouwbedrijfsgebouwen (lid 1)
        - name: verplaatsing_dient_doel_van_algemeen_belang
          type: boolean
          required: true
          description: >-
            Met de verplaatsing van het landbouwbedrijfsgebouw wordt een doel
            van algemeen belang nagestreefd (lid 2; open norm, zie
            untranslatable)
        - name: algemeen_belang_omschreven_in_nationale_bepalingen
          type: boolean
          required: true
          description: >-
            Het aangevoerde algemeen belang wordt nader omschreven in de
            desbetreffende bepalingen van de betrokken lidstaat (lid 2)
        - name: verplaatsing_leidt_tot_modernisering_of_verhoging_productiecapaciteit
          type: boolean
          required: true
          description: >-
            De verplaatsing leidt, naast het demonteren, verhuizen en weer
            opbouwen van bestaande voorzieningen, tot een modernisering van deze
            voorzieningen of een verhoging van de productiecapaciteit (lid 4);
            de loutere vervanging van een bestaand gebouw of bestaande
            voorzieningen door een nieuw, modern gebouw of nieuwe, moderne
            voorzieningen zonder fundamentele wijziging van de productie of de
            technologie geldt niet als modernisering (lid 4, tweede alinea)
      output:
        - name: voldoet_aan_voorwaarden_art_16
          type: boolean
          description: >-
            De voorgenomen steun voldoet aan de voorwaarden van artikel 16
            (steun voor investeringen in verband met de verplaatsing van
            landbouwbedrijfsgebouwen), met inbegrip van hoofdstuk I en — voor
            verplaatsing met modernisering of capaciteitsverhoging — de
            aanmeldingsdrempel van artikel 4
      actions:
        - output: voldoet_aan_voorwaarden_art_16
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze
              # verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt b: de drempel geldt voor
              # verplaatsingssteun "die leidt tot een modernisering van de
              # voorzieningen of een verhoging van de productiecapaciteit, als
              # bedoeld in artikel 16, lid 4"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $verplaatsing_leidt_tot_modernisering_of_verhoging_productiecapaciteit
                  - operation: LESS_THAN_OR_EQUAL
                    subject: $steunbedrag
                    value: $aanmeldingsdrempel_art_16
              # lid 1: "toegekend aan kmo's die actief zijn in de primaire
              # landbouwproductie"
              - $is_kmo
              - $actief_in_primaire_landbouwproductie
              # lid 1: "investeringen in verband met de verplaatsing van
              # landbouwbedrijfsgebouwen"
              - $betreft_verplaatsing_landbouwbedrijfsgebouw
              # lid 2: "moet een doel van algemeen belang worden nagestreefd"
              - $verplaatsing_dient_doel_van_algemeen_belang
              # lid 2: "wordt nader omschreven in de desbetreffende bepalingen
              # van de betrokken lidstaat"
              - $algemeen_belang_omschreven_in_nationale_bepalingen
              # leden 3 en 5: de intensiteit is in alle gevallen ten hoogste
              # 100 % (lid 3: 100 % van de reële kosten van demonteren,
              # verhuizen en weer opbouwen; lid 5: tot 100 % van de in
              # aanmerking komende kosten nabij rurale woongebieden); voor het
              # moderniseringsdeel van lid 4 gelden daarbinnen de intensiteiten
              # van artikel 14, leden 12 t/m 15 (untranslatable)
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '16'
- number: '17'
  text: |-
    **Steun voor investeringen in verband met de verwerking of de afzet van landbouwproducten**

    1.   Steun voor investeringen in verband met de verwerking of de afzet van landbouwproducten is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De investering moet betrekking hebben op materiële of immateriële activa in verband met de verwerking of de afzet van landbouwproducten.

    3.    Investeringen in de productie van biobrandstoffen op basis van voedingsgewassen komen niet in aanmerking voor steun op grond van dit artikel.

    4.    Steun voor investeringen waarvoor krachtens Richtlijn 2011/92/EU een milieueffectbeoordeling moet worden uitgevoerd, mag slechts worden toegekend op voorwaarde dat die beoordeling is uitgevoerd en de vergunning voor het betrokken investeringsproject is verleend vóór de datum van de toekenning van de individuele steun.

    5.   De steun dekt de volgende in aanmerking komende kosten:

    a) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, met inbegrip van investeringen in passieve binnenhuisbekabeling of gestructureerde bekabeling voor datanetwerken en, indien nodig, de randuitrusting van het passieve netwerk op het particuliere terrein buiten het gebouw, waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van het totaal van de in aanmerking komende kosten van de betrokken verrichting;

    b) de kosten van de koop of huurkoop van machines en uitrusting, tot maximaal de marktwaarde van de activa;

    c) algemene kosten in verband met de in de punten a) en b) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs, advies over duurzaamheid op milieu- en economisch gebied, met inbegrip van het uitvoeren van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer op basis van de resultaten daarvan geen uitgaven uit hoofde van de punten a) en b) worden verricht;

    d) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken.

    ▼B
    6.    Andere dan de in lid 5, punten a) en b), bedoelde kosten in verband met een leasingcontract, zoals de marge voor de leasinggever, kosten van de herfinanciering van rente, overheadkosten en verzekeringspremies worden niet als in aanmerking komende kosten beschouwd.

    7.   Werkkapitaal wordt niet beschouwd als in aanmerking komende kosten.

    8.   Kosten van bedrading of bekabeling voor datanetwerken buiten het particuliere eigendom worden niet beschouwd als in aanmerking komende kosten.

    ▼M1
    9.   Er mag geen steun worden toegekend voor investeringen om aan de geldende Unie- of nationale normen te voldoen.

    ▼B
    10.    De in lid 1 bedoelde steun mag niet worden toegekend in strijd met de in Verordening (EU) nr. 1308/2013 vastgestelde verboden of beperkingen, ook niet wanneer die verboden of beperkingen uitsluitend betrekking hebben op steun van de Unie waarin die verordening voorziet.

    11.    De steunintensiteit bedraagt ten hoogste 65 %, behalve in de gevallen als vermeld in lid 12.

    12.   De steunintensiteit kan tot maximaal 80 % worden verhoogd voor de volgende investeringen:

    a) investeringen die verband houden met een of meer specifieke milieu- en klimaatgerelateerde doelstellingen als vermeld in artikel 14, lid 3, punten e), f) en g), of met een verbetering van het dierenwelzijn;

    b) investeringen door jonge landbouwers;

    c) investeringen in de ultraperifere gebieden of de kleinere eilanden in de Egeïsche Zee.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_17
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_17
    untranslatables:
      - construct: afbakening en berekening van de in aanmerking komende kosten (leden 5 tot en met 8)
        reason: >-
          De kostencategorieën van lid 5 (punten a t/m d) en de uitsluitingen
          van de leden 6, 7 en 8 vergen categorisering van de werkelijke
          uitgaven, het 10 %-plafond voor de aankoop van grond en het
          marktwaardeplafond voor machines en uitrusting. Verdisconteerd in de
          parameter kosten_binnen_in_aanmerking_komende_categorieen
          (gemarkeerde tussenstand).
        suggestion: >-
          Verdieping: per kostenpost een categorisering plus het 10 %-grondplafond
          als aggregatie over de kostenposten.
        legal_text_excerpt: >-
          waarbij de aankoop van grond slechts in aanmerking komt voor een
          bedrag dat niet hoger is dan 10 % van het totaal van de in aanmerking
          komende kosten van de betrokken verrichting
        accepted: false
    execution:
      input:
        # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van deze
        # verordening"
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (artikel 3)
        # artikel 4, lid 1, punt c: 7,5 miljoen EUR per onderneming per
        # investeringsproject
        - name: aanmeldingsdrempel_art_17
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_17
          description: >-
            Aanmeldingsdrempel voor steun voor investeringen in verband met de
            verwerking en de afzet van landbouwproducten (artikel 4, lid 1,
            punt c)
        # artikel 1, lid 1, punt a, i: deze verordening geldt voor steun aan
        # kmo's die actief zijn in de landbouwsector; artikel 17 staat niet in
        # de uitzonderingslijst die tot de primaire productie beperkt, dus de
        # kring is: kmo's actief in de verwerking of de afzet van
        # landbouwproducten (handhaving bij dit artikel, zie untranslatable bij
        # artikel 1)
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: De begunstigde is een kleine, middelgrote of micro-onderneming (Bijlage I)
      parameters:
        - name: steunbedrag
          type: amount
          type_spec:
            unit: eurocent
          required: true
          description: >-
            Voorgenomen steun (brutosubsidie-equivalent) per onderneming per
            investeringsproject
        - name: steunintensiteit_pct
          type: number
          required: true
          description: Voorgenomen steunintensiteit in procent van de in aanmerking komende kosten
        - name: actief_in_verwerking_landbouwproducten
          type: boolean
          required: true
          description: >-
            Begunstigde is actief in de verwerking van landbouwproducten
            (artikel 1, lid 1, punt a, i)
        - name: actief_in_afzet_landbouwproducten
          type: boolean
          required: true
          description: >-
            Begunstigde is actief in de afzet van landbouwproducten (artikel 1,
            lid 1, punt a, i)
        - name: investering_betreft_activa_voor_verwerking_of_afzet_landbouwproducten
          type: boolean
          required: true
          description: >-
            De investering heeft betrekking op materiële of immateriële activa
            in verband met de verwerking of de afzet van landbouwproducten
            (lid 2)
        - name: betreft_productie_biobrandstoffen_op_basis_van_voedingsgewassen
          type: boolean
          required: true
          description: >-
            De investering betreft de productie van biobrandstoffen op basis van
            voedingsgewassen (lid 3)
        # lid 4: milieueffectbeoordeling
        - name: milieueffectbeoordeling_vereist
          type: boolean
          required: true
          description: >-
            Voor de investering moet krachtens Richtlijn 2011/92/EU een
            milieueffectbeoordeling worden uitgevoerd (lid 4)
        - name: milieueffectbeoordeling_uitgevoerd
          type: boolean
          required: true
          description: De milieueffectbeoordeling is uitgevoerd (lid 4)
        - name: vergunning_verleend_voor_datum_toekenning
          type: boolean
          required: true
          description: >-
            De vergunning voor het betrokken investeringsproject is verleend
            vóór de datum van de toekenning van de individuele steun (lid 4)
        # leden 5 t/m 8: in aanmerking komende kosten (gemarkeerde tussenstand,
        # zie untranslatable)
        - name: kosten_binnen_in_aanmerking_komende_categorieen
          type: boolean
          required: true
          description: >-
            De steun dekt uitsluitend de in lid 5 genoemde in aanmerking komende
            kosten (punten a t/m d, met inbegrip van het 10 %-grondplafond), met
            inachtneming van de uitsluitingen van de leden 6 (overige
            leasingkosten), 7 (werkkapitaal) en 8 (bedrading of bekabeling voor
            datanetwerken buiten het particuliere eigendom). Gemarkeerde
            tussenstand: de gedetailleerde kostentoets staat als untranslatable.
        - name: investering_om_te_voldoen_aan_geldende_unie_of_nationale_normen
          type: boolean
          required: true
          description: >-
            De investering dient om aan de geldende Unie- of nationale normen te
            voldoen (lid 9)
        - name: in_strijd_met_verboden_of_beperkingen_vo_1308_2013
          type: boolean
          required: true
          description: >-
            De steun wordt toegekend in strijd met de in Verordening (EU)
            nr. 1308/2013 vastgestelde verboden of beperkingen, ook wanneer die
            uitsluitend betrekking hebben op steun van de Unie waarin die
            verordening voorziet (lid 10)
        # lid 12: verhoging van de steunintensiteit
        - name: doel_klimaatmitigatie_en_adaptatie
          type: boolean
          required: true
          description: >-
            De investering houdt verband met de doelstelling van artikel 14,
            lid 3, punt e (matiging van en aanpassing aan klimaatverandering)
            (lid 12, punt a)
        - name: doel_duurzame_bioeconomie_en_beheer_natuurlijke_hulpbronnen
          type: boolean
          required: true
          description: >-
            De investering houdt verband met de doelstelling van artikel 14,
            lid 3, punt f (duurzame circulaire bio-economie en efficiënt beheer
            van natuurlijke hulpbronnen) (lid 12, punt a)
        - name: doel_biodiversiteit_ecosysteemdiensten_habitats
          type: boolean
          required: true
          description: >-
            De investering houdt verband met de doelstelling van artikel 14,
            lid 3, punt g (biodiversiteit, ecosysteemdiensten, habitats en
            landschappen) (lid 12, punt a)
        - name: investering_houdt_verband_met_dierenwelzijn
          type: boolean
          required: true
          description: De investering houdt verband met een verbetering van het dierenwelzijn (lid 12, punt a)
        - name: investering_door_jonge_landbouwer
          type: boolean
          required: true
          description: >-
            De investering wordt gedaan door een jonge landbouwer (lid 12, punt
            b); begrip artikel 2, punt 61 — zoals gedefinieerd door de lidstaat
            in zijn strategisch GLB-plan overeenkomstig artikel 4, lid 6, van
            Verordening (EU) 2021/2115
        - name: investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
          type: boolean
          required: true
          description: >-
            De investering vindt plaats in de ultraperifere gebieden of de
            kleinere eilanden in de Egeïsche Zee (lid 12, punt c)
      output:
        - name: maximale_steunintensiteit_pct_art_17
          type: number
          description: >-
            Maximale steunintensiteit in procent van de in aanmerking komende
            kosten volgens de leden 11 en 12
        - name: voldoet_aan_voorwaarden_art_17
          type: boolean
          description: >-
            De voorgenomen steun voldoet aan de voorwaarden van artikel 17
            (steun voor investeringen in verband met de verwerking of de afzet
            van landbouwproducten), met inbegrip van hoofdstuk I en de
            aanmeldingsdrempel van artikel 4
      actions:
        - output: maximale_steunintensiteit_pct_art_17
          value:
            operation: IF
            cases:
              # lid 12: "kan tot maximaal 80 % worden verhoogd"
              - when:
                  operation: OR
                  conditions:
                    # lid 12, punt a: milieu- en klimaatgerelateerde
                    # doelstellingen als vermeld in artikel 14, lid 3, punten
                    # e), f) en g), of een verbetering van het dierenwelzijn
                    - $doel_klimaatmitigatie_en_adaptatie
                    - $doel_duurzame_bioeconomie_en_beheer_natuurlijke_hulpbronnen
                    - $doel_biodiversiteit_ecosysteemdiensten_habitats
                    - $investering_houdt_verband_met_dierenwelzijn
                    # lid 12, punt b: investeringen door jonge landbouwers
                    - $investering_door_jonge_landbouwer
                    # lid 12, punt c: investeringen in de ultraperifere gebieden
                    # of de kleinere eilanden in de Egeïsche Zee
                    - $investering_in_ultraperifeer_gebied_of_kleinere_eilanden_egeische_zee
                then: 80
            # lid 11: "De steunintensiteit bedraagt ten hoogste 65 %, behalve in
            # de gevallen als vermeld in lid 12."
            default: 65
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '17'
            paragraph: 11-12
        - output: voldoet_aan_voorwaarden_art_17
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze
              # verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt c: het brutosubsidie-equivalent
              # overschrijdt 7,5 miljoen EUR per onderneming per
              # investeringsproject niet
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_17
              # artikel 1, lid 1, punt a, i: steun voor kmo's die actief zijn in
              # de landbouwsector — hier de verwerking of de afzet van
              # landbouwproducten (handhaving bij dit artikel)
              - $is_kmo
              - operation: OR
                conditions:
                  - $actief_in_verwerking_landbouwproducten
                  - $actief_in_afzet_landbouwproducten
              # lid 2: "materiële of immateriële activa in verband met de
              # verwerking of de afzet van landbouwproducten"
              - $investering_betreft_activa_voor_verwerking_of_afzet_landbouwproducten
              # lid 3: "Investeringen in de productie van biobrandstoffen op
              # basis van voedingsgewassen komen niet in aanmerking"
              - operation: NOT
                value: $betreft_productie_biobrandstoffen_op_basis_van_voedingsgewassen
              # lid 4: milieueffectbeoordeling uitgevoerd en vergunning verleend
              # vóór de datum van toekenning
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $milieueffectbeoordeling_vereist
                  - operation: AND
                    conditions:
                      - $milieueffectbeoordeling_uitgevoerd
                      - $vergunning_verleend_voor_datum_toekenning
              # leden 5 t/m 8: "De steun dekt de volgende in aanmerking komende
              # kosten" (gemarkeerde tussenstand)
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 9: "Er mag geen steun worden toegekend voor investeringen om
              # aan de geldende Unie- of nationale normen te voldoen."
              - operation: NOT
                value: $investering_om_te_voldoen_aan_geldende_unie_of_nationale_normen
              # lid 10: niet in strijd met de verboden of beperkingen van
              # Verordening (EU) nr. 1308/2013
              - operation: NOT
                value: $in_strijd_met_verboden_of_beperkingen_vo_1308_2013
              # leden 11 en 12: de voorgenomen intensiteit blijft binnen het
              # toepasselijke maximum
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: $maximale_steunintensiteit_pct_art_17
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '17'
- number: '18'
  text: |-
    **Aanloopsteun voor jonge landbouwers en aanloopsteun voor landbouwactiviteiten**

    1.    Aanloopsteun voor jonge landbouwers en aanloopsteun voor landbouwactiviteiten zijn verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De steun betreft de oprichting van plattelandsbedrijven waar landbouwactiviteiten worden verricht en de diversificatie van het inkomen van landbouwhuishoudens naar andere landbouwactiviteiten.

    3.   De steun wordt alleen toegekend aan jonge landbouwers van wie de onderneming een kleine of micro-onderneming is.

    ▼B
    4.    Wanneer de steun wordt verleend aan een jonge landbouwer die een bedrijf opzet in de vorm van een rechtspersoon, moet de jonge landbouwer daadwerkelijke en voortdurende zeggenschap hebben over de rechtspersoon wat betreft beslissingen op het gebied van beheer, winst en financiële risico’s. Als meerdere natuurlijke personen, onder wie personen die geen jonge landbouwer zijn, deelnemen aan het kapitaal of het beheer van de rechtspersoon, is de jonge landbouwer, hetzij alleen, hetzij samen met andere personen, in staat die daadwerkelijke en voortdurende zeggenschap uit te oefenen. Als een rechtspersoon alleen of gezamenlijk onder de zeggenschap van een andere rechtspersoon valt, gelden die voorschriften voor elke natuurlijke persoon die zeggenschap heeft over die andere rechtspersoon (15).

    5.   De steun is afhankelijk van de indiening van een bedrijfsplan bij de bevoegde autoriteit van de betrokken lidstaat.

    6.    Met betrekking tot jonge landbouwers geldt dat als de begunstigden niet voldoen aan artikel 4, lid 6, punt c), van Verordening (EU) 2021/2115, zij toch voor de steun voor jonge landbouwers in aanmerking komen op voorwaarde dat zij zich ertoe verbinden die vakbekwaamheid en deskundigheid te verwerven binnen 36 maanden na de datum waarop het besluit tot steunverlening is vastgesteld. Die verbintenis moet in het bedrijfsplan worden opgenomen.

    7.   De steun mag niet groter zijn dan 100 000 EUR per jonge landbouwer, per in de landbouw opgericht bedrijf of per landbouwhuishouden.

    (15) Wat het begrip zeggenschap betreft, is hoofdstuk II, punt 1, van de gecon­ solideerde mededeling van de Commissie over bevoegdheidskwesties op grond van Verordening (EG) nr. 139/2004 betreffende de controle op con­ centraties van ondernemingen (PB C 95 van 16.4.2008, blz. 1) van over­ eenkomstige toepassing.
