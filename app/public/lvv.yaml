  text: |-
    **Steun voor bebossing en de aanleg van beboste gronden**

    1.    Steun voor bebossing en de aanleg van beboste gronden is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   Steun voor bebossing en de aanleg van beboste gronden dekt de aanlegkosten en een jaarlijkse premie per hectare.

    De steun voor bebossing en de aanleg van beboste gronden kan betrekking hebben op investeringsverrichtingen.

    3.   Steun voor bebossing en de aanleg van beboste gronden in het kader van investeringsverrichtingen dekt de volgende in aanmerking komende kosten:

    a) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de totale in aanmerking komende kosten van de betrokken verrichting, met uitzondering van de aankoop van grond indien de steun wordt verleend in het kader van een strategisch GLB-plan;

    b) de kosten van de koop of huurkoop van machines en uitrusting, tot maximaal de marktwaarde van de activa;

    ▼B
    c) algemene kosten in verband met de in de punten a) en b) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs en voor advies over ecologische en economische duurzaamheid, met inbegrip van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer op basis van de resultaten daarvan geen uitgaven uit hoofde van de punten a) en b) worden gemaakt;

    d) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken;

    e) de kosten van de opstelling van bosbeheerplannen of gelijkwaardige instrumenten.

    Steun die wordt verleend in het kader van een strategisch GLB-plan en wordt verstrekt in de vorm van financieringsinstrumenten, mag andere in aanmerking komende kosten dekken dan de in de eerste alinea bedoelde kosten op voorwaarde dat de kosten volledig in aanmerking komen in het kader van het betrokken strategisch GLB-plan en de steun pas ten uitvoer wordt gelegd na de goedkeuring van het betrokken strategisch plan door de Commissie.

    Behalve wanneer de steun in het kader van een strategisch GLB-plan in de vorm van financieringsinstrumenten wordt verleend, wordt werkkapitaal niet beschouwd als in aanmerking komende kosten.

    4.    Steun voor investeringsverrichtingen waarvoor krachtens Richtlijn 2011/92/EU een milieueffectbeoordeling moet worden uitgevoerd, mag slechts worden toegekend op voorwaarde dat die beoordeling is uitgevoerd en de vergunning voor het betrokken investeringsproject is verleend vóór de datum van de toekenning van de individuele steun.

    5.   De volgende aanlegkosten komen in aanmerking:

    a) kosten van plant- en teeltmateriaal;

    b) aanplantkosten en kosten die rechtstreeks met de aanplanting verband houden;

    c) kosten van andere hiermee verband houdende verrichtingen, zoals de opslag en de behandeling van zaailingen met de nodige preventie- en beschermingsmaterialen;

    d) kosten van de vervanging van tijdens het eerste jaar afgestorven bomen en van de vervanging van bomen bij kleinschalige sterfte tijdens de eerste jaren na de aanplanting. Voor de kosten van de vervanging van bomen bij grootschalige sterfte kan alleen steun worden verleend in het kader van artikel 43.

    6.    De jaarlijkse premie per hectare dekt, gedurende maximaal twaalf jaar te rekenen vanaf de datum van de toekenning van de steun, de kosten van het gederfde inkomen en de kosten van onderhoudsactiviteiten, waaronder zuivering en dunning.

    7.   Er mag geen steun worden toegekend voor de aanplant van de volgende bomen:

    a) bomen voor hakhout met korte omlooptijd;

    b) kerstbomen;

    c) snelgroeiende bomen voor de energieproductie;

    d) soorten die niet inheems zijn in het gebied, behalve wanneer de steun wordt verleend in het kader van het strategisch GLB-plan;

    ▼B
    e) investeringen in bebossing die niet stroken met de klimaat- en milieudoelstellingen overeenkomstig de beginselen van duurzaam bosbeheer, zoals vastgelegd in de pan-Europese richtsnoeren voor bebossing en herbebossing (30).

    8.   De aangeplante soorten moeten aangepast zijn aan de milieu- en klimaatomstandigheden van het areaal en voldoen aan de in punt 12 bedoelde minimale milieuvereisten.

    9.   In gebieden waar de bebossing bemoeilijkt wordt door ongunstige bodem- en klimaatomstandigheden, kan steun worden toegekend voor de aanplant van meerjarige houtachtige soorten, zoals struiken die aangepast zijn aan de plaatselijke omstandigheden.

    10.    Steun voor grote ondernemingen is afhankelijk van de overlegging van toepasselijke informatie uit een bosbeheerplan of gelijkwaardig instrument dat in overeenstemming is met de algemene richtsnoeren voor het duurzame beheer van de bossen in Europa (31).

    Deze vereiste geldt niet voor gemeenten die autonome lokale autoriteiten zijn met een jaarlijkse begroting van minder dan 10 miljoen EUR en met minder dan 5 000 inwoners.

    11.   De steunintensiteit bedraagt ten hoogste 100 % van de in aanmerking komende kosten.

    12.   In de context van steun voor bebossing en de aanleg van beboste gronden zijn de volgende minimale milieuvereisten van toepassing:

    a) bij de selectie van de aan te planten soorten, van de arealen en van de te gebruiken methoden wordt het volgende vermeden: een niet-passende bebossing van kwetsbare habitats, zoals veengebieden en wetlands, en negatieve effecten op gebieden met een hoge ecologische waarde, waaronder gebieden met een op een hoge natuurwaarde gerichte landbouw. Krachtens Richtlijn 92/43/EEG en Richtlijn 2009/147/EG mag in gebieden die als Natura 2000-gebied zijn aangewezen, alleen bebossing worden toegestaan die strookt met de beheersdoelstellingen voor die gebieden en waarover overeenstemming is bereikt met de autoriteit van de lidstaat die belast is met de uitvoering van Natura 2000;

    b) bij de selectie van de soorten, rassen, ecotypen en herkomst van de bomen wordt rekening gehouden met de vereiste weerbaarheid ten aanzien van klimaatverandering en natuurrampen en met de pedologische en hydrologische gesteldheid van het betrokken areaal, alsook met het potentiële invasieve karakter van de soorten onder door de lidstaten omschreven lokale omstandigheden. De begunstigde wordt verplicht om het bos minstens gedurende de periode waarvoor de premie voor gederfde landbouwinkomsten en onderhoud wordt betaald, te beschermen en te verzorgen. Daartoe moet hij onder meer naargelang van het geval aan bosverzorging, uitdunning of beweiding doen met het oog op de toekomstige ontwikkeling van het bos, de concurrentie met kruidachtige vegetatie in goede banen leiden en voorkomen dat zich brandgevoelig ondergroeimateriaal ophoopt. De lidstaten stellen voor snelgroeiende soorten een minimum- en een maximumperiode vast voordat deze mogen worden geveld. De minimumperiode bedraagt ten minste acht jaar en de maximumperiode bedraagt ten hoogste twintig jaar;

    (30) https://foresteurope.org/wp-content/uploads/2016/08/ Pan-EuropeanAfforestationReforestationGuidelines.pdf
    (31) Algemene richtsnoeren voor het duurzame beheer van de bossen in Europa, zoals aangenomen tijdens de Tweede Ministeriële Conferentie over de bescherming van de bossen in Europa, gehouden te Helsinki op 16 en 17 juni 1993       (https://www.foresteurope.org/docs/MC/MC_helsinki_resolutionH1. pdf).

    ▼B
    c) wanneer als gevolg van moeilijke bodem-, klimatologische of milieuomstandigheden, met inbegrip van de aantasting van het milieu, niet kan worden verwacht dat de aanplant van meerjarige houtachtige planten tot de overeenkomstig de geldende nationale wetgeving omschreven bosbedekking zal leiden, mag de betrokken lidstaat de begunstigde toestaan een andere houtige vegetatiebedekking aan te leggen, zoals struiken of heesters die geschikt zijn voor de plaatselijke omstandigheden. De begunstigde moet dan zorg en bescherming bieden op het niveau dat geldt voor bossen;

    d) in het geval van bebossingsactiviteiten die leiden tot de aanleg van bossen die groter zijn dan een door de lidstaten te bepalen drempel, bestaat de verrichting uit:

    i) de aanplant van ecologisch aangepaste soorten of soorten die in het betrokken biogeografische gebied tegen klimaatverandering bestand zijn en waarvan niet in een effectbeoordeling is vastgesteld dat zij de biodiversiteit en ecosysteemdiensten in gevaar brengen of de gezondheid van de mens nadelig beïnvloeden, of

    ii) de aanplant van een mix van boomsoorten met hetzij minstens 10 % loofbomen per areaal, hetzij een minimum van drie boomsoorten of -variëteiten, waarbij de minst goed vertegenwoordigde minstens 10 % van het areaal beslaat.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_41
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_41
    untranslatables:
      - construct: kostenplafonds binnen de subsidiabele kosten (lid 3, punten a en b)
        reason: >-
          De toets dat grondaankoop niet meer dan 10 % van de totale in aanmerking
          komende kosten van de verrichting bedraagt en dat machines/uitrusting
          tot maximaal de marktwaarde meetellen, vergt aggregatie over
          kostenposten van het project; niet uitdrukbaar in de beschikbare
          operaties. Samengevat in de booleaanse toetsparameter
          kosten_binnen_in_aanmerking_komende_categorieen.
        legal_text_excerpt: >-
          waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag
          dat niet hoger is dan 10 % van de totale in aanmerking komende kosten
          van de betrokken verrichting
        accepted: false
      - construct: uitbreiding subsidiabele kosten bij GLB-financieringsinstrumenten (lid 3, tweede alinea)
        reason: >-
          Of "de kosten volledig in aanmerking komen in het kader van het
          betrokken strategisch GLB-plan" en of de steun pas na goedkeuring van
          dat plan ten uitvoer wordt gelegd, vergt een beoordeling van een extern
          plan; open norm.
        legal_text_excerpt: >-
          Steun die wordt verleend in het kader van een strategisch GLB-plan en
          wordt verstrekt in de vorm van financieringsinstrumenten, mag andere in
          aanmerking komende kosten dekken dan de in de eerste alinea bedoelde
          kosten
        accepted: false
      - construct: minimale milieuvereisten (lid 12, punten a-d)
        reason: >-
          Open normen (vermijden van niet-passende bebossing van kwetsbare
          habitats, rekening houden met weerbaarheid en pedologische
          gesteldheid), door lidstaten te bepalen drempels (lid 12, punt d) en
          min/max-velperiodes voor snelgroeiende soorten (8-20 jaar) zijn niet
          per steunmaatregel toetsbaar in de beschikbare operaties. Samengevat in
          de booleaanse toetsparameter voldoet_aan_minimale_milieuvereisten.
        legal_text_excerpt: >-
          In de context van steun voor bebossing en de aanleg van beboste gronden
          zijn de volgende minimale milieuvereisten van toepassing
        accepted: false
    execution:
      parameters:
        - name: betreft_bebossing_of_aanleg_beboste_gronden
          type: boolean
          required: true
          description: >-
            De steun betreft bebossing of de aanleg van beboste gronden (lid 1).
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun per aanlegproject (drempeltoets artikel 4, lid 1,
            punt l).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten (lid 11).
        - name: kosten_binnen_in_aanmerking_komende_categorieen
          type: boolean
          required: true
          description: >-
            De gedekte kosten vallen binnen de in dit artikel genoemde
            categorieen: aanlegkosten (lid 5, punten a-d), de jaarlijkse premie
            per hectare voor gederfd inkomen en onderhoud (lid 2 en 6) en bij
            investeringsverrichtingen de kosten van lid 3, punten a-e; vervanging
            van bomen bij grootschalige sterfte valt onder artikel 43, niet
            hieronder (lid 5, punt d); werkkapitaal telt niet mee, behalve bij
            steun in het kader van een strategisch GLB-plan in de vorm van
            financieringsinstrumenten (lid 3, derde alinea). Kostenplafonds
            binnen lid 3: zie untranslatables.
        - name: milieueffectbeoordeling_vereist
          type: boolean
          required: true
          description: >-
            Voor de investeringsverrichting moet krachtens Richtlijn 2011/92/EU
            een milieueffectbeoordeling worden uitgevoerd (lid 4); false indien
            geen investeringsverrichting of geen beoordelingsplicht.
        - name: milieueffectbeoordeling_uitgevoerd_en_vergunning_vooraf_verleend
          type: boolean
          required: false
          description: >-
            De milieueffectbeoordeling is uitgevoerd en de vergunning voor het
            investeringsproject is verleend voor de datum van de toekenning van
            de individuele steun (lid 4).
        - name: duur_jaarlijkse_premie_jaren
          type: number
          required: true
          description: >-
            Aantal jaren waarover de jaarlijkse premie per hectare wordt betaald,
            te rekenen vanaf de datum van de toekenning van de steun (lid 6);
            0 indien de steun geen jaarlijkse premie omvat.
        - name: betreft_uitgesloten_boomsoorten
          type: boolean
          required: true
          description: >-
            De steun betreft de aanplant van bomen voor hakhout met korte
            omlooptijd, kerstbomen, snelgroeiende bomen voor de energieproductie
            (lid 7, punten a-c) of investeringen in bebossing die niet stroken
            met de klimaat- en milieudoelstellingen volgens de beginselen van
            duurzaam bosbeheer (lid 7, punt e).
        - name: betreft_niet_inheemse_soorten
          type: boolean
          required: true
          description: >-
            De steun betreft de aanplant van soorten die niet inheems zijn in
            het gebied (lid 7, punt d).
        - name: steun_in_kader_strategisch_glb_plan
          type: boolean
          required: false
          description: >-
            De steun wordt verleend in het kader van het strategisch GLB-plan
            (uitzondering van lid 7, punt d).
        - name: soorten_aangepast_aan_milieu_en_klimaatomstandigheden
          type: boolean
          required: true
