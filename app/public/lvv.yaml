            voor meststoffen, gewasbeschermingsmiddelen en dierenwelzijn en
            andere verplichte vereisten, en de voorwaarden voor de
            instandhouding van landbouwareaal (lid 3, punten a-c).
        - name: verplichte_normen_omschreven_in_nationale_rechtsgrondslag
          type: boolean
          required: true
          description: >-
            Al die verplichte normen en vereisten zijn omschreven en toegelicht
            in de nationale rechtsgrondslag (lid 4).
        - name: toegang_tot_kennis_en_opleiding_geborgd
          type: boolean
          required: true
          description: >-
            De lidstaat borgt toegang tot de vereiste kennis en informatie en
            tot passende opleidingen en deskundigheid voor wie dat nodig heeft
            (lid 7).
        - name: herzieningsclausule_vastgesteld
          type: boolean
          required: true
          description: >-
            De lidstaat heeft voor de verbintenissen een herzieningsclausule
            vastgesteld die aanpassing garandeert bij wijziging van de in lid 3
            bedoelde verplichte vereisten, normen en voorwaarden (lid 8).
        - name: steun_jaarlijks_verleend
          type: boolean
          required: true
          description: De steun wordt jaarlijks verleend (lid 9).
        - name: verbintenis_valt_onder_art_34
          type: boolean
          required: true
          description: >-
            De verbintenis valt onder artikel 34
            (agromilieuklimaatverbintenissen); daarvoor wordt uit hoofde van dit
            artikel geen steun verleend (lid 9).
        - name: kosten_vallen_onder_art_20
          type: boolean
          required: true
          description: >-
            De kosten vallen onder artikel 20; daarvoor wordt uit hoofde van dit
            artikel geen steun verleend (lid 9).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steun als percentage van de in aanmerking komende kosten
            (lid 11).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: Aan hoofdstuk I van deze verordening is voldaan (lid 1, via artikel 3).
        - name: aanmeldingsdrempel_art_35_eenjarige_teelten
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_35_eenjarige_teelten
          description: Aanmeldingsdrempel artikel 4 voor artikel 35, eenjarige teelten (600 EUR/ha/jaar).
        - name: aanmeldingsdrempel_art_35_gespecialiseerde_blijvende_teelten
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_35_gespecialiseerde_blijvende_teelten
          description: >-
            Aanmeldingsdrempel artikel 4 voor artikel 35, gespecialiseerde
            blijvende teelten (900 EUR/ha/jaar).
        - name: aanmeldingsdrempel_art_35_andere_vormen_landgebruik
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_35_andere_vormen_landgebruik
          description: >-
            Aanmeldingsdrempel artikel 4 voor artikel 35, andere vormen van
            landgebruik (450 EUR/ha/jaar).
      output:
        - name: voldoet_aan_voorwaarden_art_35
          type: boolean
          description: >-
            De voorgenomen steun voor biologische landbouw voldoet aan de
            voorwaarden van artikel 35, aan de aanmeldingsdrempel van artikel 4
            (per teelttype) en aan hoofdstuk I. De maxima van lid 11
            (600/900/450 EUR per hectare per jaar) vallen numeriek samen met de
            drempeltoets.
      actions:
        - output: voldoet_aan_voorwaarden_art_35
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '35'
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 11: de drie teelt-/landgebruikscategorieën
              - operation: IN
                subject: $teelttype
                values:
                  - EENJARIG
                  - GESPECIALISEERD_BLIJVEND
                  - ANDER_LANDGEBRUIK
              # artikel 4 jo. lid 11: drempel per teelttype; tevens de maxima
              # "hoogstens 600 EUR ... 900 EUR ... 450 EUR per hectare per jaar"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value:
                  operation: IF
                  cases:
                    - when:
                        operation: EQUALS
                        subject: $teelttype
                        value: EENJARIG
                      then: $aanmeldingsdrempel_art_35_eenjarige_teelten
                    - when:
                        operation: EQUALS
                        subject: $teelttype
                        value: GESPECIALISEERD_BLIJVEND
                      then: $aanmeldingsdrempel_art_35_gespecialiseerde_blijvende_teelten
                  default: $aanmeldingsdrempel_art_35_andere_vormen_landgebruik
              # lid 2: vrijwillige verbintenis tot omschakeling naar of
              # voortzetting van biologische landbouw (Vo (EU) 2018/848)
              - $vrijwillige_verbintenis_biologische_landbouw
              # lid 3: "alleen steun voor verbintenissen die verder gaan dan"
              # de punten a-c
              - $verbintenis_gaat_verder_dan_verplichte_normen
              # lid 4: omschreven en toegelicht in de nationale rechtsgrondslag
              - $verplichte_normen_omschreven_in_nationale_rechtsgrondslag
              # lid 7: toegang tot kennis, informatie, opleidingen en
              # deskundigheid
              - $toegang_tot_kennis_en_opleiding_geborgd
              # lid 8: herzieningsclausule vastgesteld
              - $herzieningsclausule_vastgesteld
              # lid 9: "De steun wordt jaarlijks verleend"
              - $steun_jaarlijks_verleend
              # lid 9: geen steun voor onder artikel 34 vallende verbintenissen
              - operation: NOT
                value: $verbintenis_valt_onder_art_34
              # lid 9: geen steun voor onder artikel 20 vallende kosten
              - operation: NOT
                value: $kosten_vallen_onder_art_20
              # lid 11: "beperkt tot 100 % van de in aanmerking komende kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
- number: '36'
  text: |-
    **Steun voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed op landbouwbedrijven of in bossen**

    1.    Steun voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed op landbouwbedrijven of in bossen is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan de desbetreffende voorwaarden van dit artikel en aan hoofdstuk I van deze verordening.

    2.   De steun kan worden verleend voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed op landbouwbedrijven of in bossen.

    ▼B
    3.     De steun wordt verleend voor de instandhouding van uit natuurlijke landschappen en gebouwen bestaand erfgoed dat door de bevoegde overheidsinstanties van de betrokken lidstaat formeel als cultureel of natuurlijk erfgoed is erkend.

    4.    De volgende kosten voor de instandhouding van cultureel en natuurlijk erfgoed komen voor steun in aanmerking:

    a) kosten van investeringen in materiële activa;

    b) gekapitaliseerde werkzaamheden.

    5.   De steunintensiteit bedraagt ten hoogste 100 % van de in aanmerking komende kosten.

    6.    De steun voor gekapitaliseerde werkzaamheden bedraagt ten hoogste 10 000 EUR per jaar.

    Afdeling 4 Steun voor het herstel van schade als gevolg van natuurrampen in de landbouwsector
