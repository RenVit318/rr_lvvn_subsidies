            Vóór de begindatum van het gesteunde project is op een openbaar
            toegankelijke website op nationaal of regionaal niveau bekendgemaakt:
            dat het project wordt uitgevoerd, de doelstellingen, de vermoedelijke
            datum van publicatie van de verwachte resultaten, de plaats waar die
            resultaten op het internet worden bekendgemaakt, en dat de resultaten
