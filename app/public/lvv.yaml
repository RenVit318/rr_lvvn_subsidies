              - $is_jonge_landbouwer
              - $is_kleine_of_micro_onderneming
              # lid 4: zeggenschapseis, alleen "wanneer de steun wordt verleend aan
              # een jonge landbouwer die een bedrijf opzet in de vorm van een
              # rechtspersoon"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $bedrijf_opgezet_als_rechtspersoon
                  - $jonge_landbouwer_heeft_daadwerkelijke_en_voortdurende_zeggenschap
              # lid 5: "afhankelijk van de indiening van een bedrijfsplan bij de
              # bevoegde autoriteit van de betrokken lidstaat"
              - $bedrijfsplan_ingediend_bij_bevoegde_autoriteit
              # lid 6: niet voldoen aan de vakbekwaamheidseis is toegestaan "op
              # voorwaarde dat zij zich ertoe verbinden die ... te verwerven binnen
              # 36 maanden"; "Die verbintenis moet in het bedrijfsplan worden
              # opgenomen."
              - operation: OR
                conditions:
                  - $voldoet_aan_vakbekwaamheidseis_glb_plan
                  - $verbintenis_vakbekwaamheid_binnen_36_maanden_in_bedrijfsplan
              # lid 7: "De steun mag niet groter zijn dan 100 000 EUR per jonge
              # landbouwer, per in de landbouw opgericht bedrijf of per
              # landbouwhuishouden."
              - operation: LESS_THAN_OR_EQUAL
