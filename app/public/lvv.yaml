          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3). Artikel 4 kent voor artikel 37 geen aanmeldingsdrempel.
      output:
        - name: voldoet_aan_voorwaarden_art_37
          type: boolean
          description: >-
            De steunregeling voor het herstel van schade als gevolg van
            natuurrampen in de landbouwsector voldoet aan artikel 37 en aan
            hoofdstuk I van deze verordening (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_37
          value:
            operation: AND
            conditions:
              # lid 1: "als zij voldoen aan dit artikel en aan hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2, punt a: "wanneer de bevoegde autoriteit van de lidstaat de
              # gebeurtenis formeel als natuurramp heeft erkend"
              - $natuurramp_formeel_erkend
              # lid 2, punt b: "wanneer er een rechtstreeks oorzakelijk verband is
              # tussen de natuurramp en de schade die de onderneming heeft geleden"
              - $rechtstreeks_oorzakelijk_verband_natuurramp_schade
              # lid 3, eerste alinea: "rechtstreeks aan de betrokken onderneming
              # ... of aan een producentengroepering of -organisatie waarvan de
              # onderneming lid is"
              - operation: OR
                conditions:
                  - $steun_rechtstreeks_aan_onderneming_betaald
                  - $steun_betaald_aan_producentengroepering_waarvan_onderneming_lid
              # lid 3, tweede alinea: "Wanneer de steun aan een
              # producentengroepering of -organisatie wordt betaald, mag het
              # steunbedrag niet hoger zijn dan het steunbedrag waarvoor die
              # onderneming in aanmerking komt."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steun_betaald_aan_producentengroepering_waarvan_onderneming_lid
                      value: true
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $steunbedrag
                      value: $steunbedrag_waarvoor_onderneming_in_aanmerking_komt
                default: true
              # lid 4: "Steunregelingen in verband met een natuurramp worden
              # ingesteld binnen drie jaar nadat de natuurramp zich heeft
              # voorgedaan"
              - operation: LESS_THAN_OR_EQUAL
                subject: $datum_instelling_steunregeling
                value:
                  operation: DATE_ADD
                  date: $datum_natuurramp
                  years: 3
              # lid 4: "en de steun wordt binnen vier jaar na die datum betaald"
              - operation: LESS_THAN_OR_EQUAL
                subject: $datum_betaling_steun
                value:
                  operation: DATE_ADD
                  date: $datum_natuurramp
                  years: 4
              # lid 5: "zoals getaxeerd door een openbare autoriteit, een door de
              # steunverlenende autoriteit erkende onafhankelijke deskundige of
              # een verzekeringsonderneming"
              - $kosten_getaxeerd_door_bevoegde_taxateur
              # lid 10: "De steun en eventuele andere betalingen ter compensatie
              # van de verliezen, met inbegrip van betalingen in het kader van een
              # verzekeringspolis, bedragen ten hoogste 100 % van de in aanmerking
              # komende kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $totale_compensatie_inclusief_verzekering
                value: $subsidiabele_kosten
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '37'
