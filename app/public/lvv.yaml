          description: De samenwerking komt ten goede aan plattelandsgebieden (lid 3)
        # lid 5
        - name: uitsluitend_onderzoeksinstellingen_betrokken
          type: boolean
          required: true
          description: Bij de samenwerking zijn uitsluitend onderzoeksinstellingen betrokken (lid 5)
        # lid 6: activiteitenlijst a-k
        - name: samenwerkingsactiviteit_art_59
          type: string
          required: true
          description: >-
            Samenwerkingsactiviteit van lid 6: PROEFPROJECT (punt a),
            ONTWIKKELING_NIEUWE_PRODUCTEN_LEVENSMIDDELEN (punt b),
            SAMENWERKING_KLEINSCHALIGE_MARKTDEELNEMERS (punt c),
            KORTE_KETENS_EN_LOKALE_MARKTEN (punt d),
            AFZETBEVORDERING_LOKALE_CONTEXT (punt e),
            COLLECTIEVE_KLIMAATACTIES (punt f),
            GEZAMENLIJKE_MILIEUPROJECTEN (punt g),
            DUURZAME_LEVERING_BIOMASSA (punt h),
            ANDERE_LOKALE_ONTWIKKELINGSSTRATEGIEEN (punt i),
