    untranslatables:
      - construct: aanpassingsplicht bij wijziging van de GMO-verordeningen (lid 3)
        reason: >-
          Doorlopende verplichting van de lidstaat om de vrijgestelde steun aan
          te passen aan "eventuele wijzigingen" in de verordeningen houdende een
          gemeenschappelijke marktordening; geen toetsbare voorwaarde op een
          individuele voorgenomen steunmaatregel maar een open, toekomstgerichte
          norm.
        legal_text_excerpt: >-
          De lidstaten passen de op grond van dit artikel vrijgestelde steun aan
          om rekening te houden met eventuele wijzigingen in de verordeningen
          houdende een gemeenschappelijke ordening van de markten voor
          landbouwproducten.
        accepted: false
      - construct: beperking pandkosten tot huurkosten tegen markttarieven (lid 5, slotalinea)
        reason: >-
          Berekening van de subsidiabele kosten: bij aankoop van panden moeten de
          in aanmerking komende kosten worden afgetopt op de huurkosten tegen
          markttarieven; dat vergt een externe marktwaardering en een berekening
          binnen de kostenopstelling, geen toetsbare voorwaarde op het
          steunbedrag.
        legal_text_excerpt: >-
          Bij aankoop van panden zijn de in aanmerking komende kosten van de
          panden beperkt tot de huurkosten tegen markttarieven.
        accepted: false
      - construct: uitbetaling laatste tranche pas na verificatie van correcte uitvoering (lid 6, tweede alinea)
        reason: >-
          Procedurele betalingsvoorwaarde voor de lidstaat op een later
          tijdstip dan de beoordeling van de voorgenomen steun; niet toetsbaar op
          het moment van de voorgenomen maatregel.
        legal_text_excerpt: >-
          De lidstaten betalen de laatste tranche pas nadat zij hebben
          geverifieerd dat de maatregel correct is uitgevoerd.
        accepted: false
      - construct: degressiviteitsprofiel van de steun (lid 8, tweede zin)
        reason: >-
          "De steun is degressief" schrijft geen bepaald afbouwpad voor; of het
          gekozen tranchesverloop degressief is, is als boolean-parameter over
          dat feit gemodelleerd, het profiel zelf is niet uitdrukbaar zonder
          aggregatie over de jaartranches.
        legal_text_excerpt: De steun is degressief.
        accepted: false
    execution:
      parameters:
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun per producentengroepering of -organisatie per jaar
            (gedeeld vocabulaire; meeteenheid van lid 7 en lid 8: per jaar).
        - name: jaarlijkse_waarde_in_de_handel_gebrachte_productie
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Waarde van de jaarlijkse in de handel gebrachte productie van de
            producentengroepering of -organisatie (grondslag voor het
            10%-maximum van lid 7).
        - name: officieel_erkend_door_bevoegde_autoriteit
          type: boolean
          required: true
          description: >-
            De producentengroepering of -organisatie is door de bevoegde
            autoriteit van de betrokken lidstaat officieel erkend (lid 2).
        - name: is_feitelijk_een_enkele_producent
          type: boolean
          required: true
          description: >-
            De aanvrager is een productieorganisatie, -entiteit of -orgaan, zoals
            een vennootschap of coöperatie, die het beheer van een of meer
            landbouwbedrijven tot doel heeft en waarbij het dus in feite om een
            enkele producent gaat (uitsluiting van lid 4, punt a).
        - name: is_landbouwvereniging_zonder_gezamenlijke_aanbodaanpassing
          type: boolean
          required: true
          description: >-
            De aanvrager is een landbouwvereniging die op de bedrijven van de
            leden taken vervult zoals wederzijdse bijstand en
            bedrijfsvervangings- en bedrijfsbeheerdiensten, zonder betrokken te
            zijn bij de gezamenlijke aanpassing van het aanbod aan de markt
            (uitsluiting van lid 4, punt b).
        - name: doelstellingen_onverenigbaar_met_gmo_bepalingen
          type: boolean
          required: true
          description: >-
            De doelstellingen van de producentengroepering, producentenorganisatie
            of unie van producentenorganisaties zijn niet verenigbaar met artikel
            152, lid 1, punt c), artikel 152, lid 3, of artikel 156 van
            Verordening (EU) nr. 1308/2013 (uitsluiting van lid 4, punt c; feit
            uit externe regelgeving, als gegeven aangenomen).
        - name: kosten_binnen_in_aanmerking_komende_categorieen
          type: boolean
          required: true
          description: >-
            De steun dekt uitsluitend de in lid 5 genoemde in aanmerking komende
            kosten: huur van geschikte lokalen, aankoop van kantooruitrusting,
            administratief personeel, overheadkosten en vergoedingen voor
            juridische en ambtelijke handelingen, en aankoop van
            computerapparatuur en aankoop of gebruik van computersoftware,
            cloudoplossingen of soortgelijke oplossingen.
        - name: forfaitair_in_jaarlijkse_tranches_eerste_vijf_jaar_na_erkenning
          type: boolean
          required: true
          description: >-
            De steun wordt op forfaitaire basis in jaarlijkse tranches verleend
            gedurende de eerste vijf jaar na de datum van de officiële erkenning
            door de bevoegde autoriteit (lid 6, eerste alinea).
        - name: steun_is_degressief
          type: boolean
          required: true
          description: >-
            Het steunverloop is degressief (lid 8, tweede zin; feit over het
            gekozen tranchesverloop, zie untranslatable).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            "als wordt voldaan aan dit artikel en aan hoofdstuk I van deze
            verordening" (lid 1) — de gemeenschappelijke poort van artikel 3.
      output:
        - name: voldoet_aan_voorwaarden_art_19
          type: boolean
          description: >-
            De voorgenomen aanloopsteun voor producentengroeperingen en
            -organisaties in de landbouwsector voldoet aan de voorwaarden van
            artikel 19 en aan hoofdstuk I. Artikel 4 kent voor artikel 19 geen
            aanmeldingsdrempel.
      actions:
        - output: voldoet_aan_voorwaarden_art_19
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2: "Alleen producentengroeperingen of -organisaties die door de
              # bevoegde autoriteit van de betrokken lidstaat officieel zijn
              # erkend, komen voor steun in aanmerking."
              - $officieel_erkend_door_bevoegde_autoriteit
              # lid 4, punt a: "Er wordt geen steun toegekend aan:
              # productieorganisaties ... waarbij het dus in feite om een enkele
              # producent gaat"
              - operation: NOT
                value: $is_feitelijk_een_enkele_producent
              # lid 4, punt b: "landbouwverenigingen die ... zonder betrokken te
              # zijn bij de gezamenlijke aanpassing van het aanbod aan de markt"
              - operation: NOT
                value: $is_landbouwvereniging_zonder_gezamenlijke_aanbodaanpassing
              # lid 4, punt c: "waarvan de doelstellingen niet verenigbaar zijn
              # met artikel 152, lid 1, punt c), artikel 152, lid 3, of artikel
              # 156 van Verordening (EU) nr. 1308/2013"
              - operation: NOT
                value: $doelstellingen_onverenigbaar_met_gmo_bepalingen
              # lid 5: "De steun dekt de volgende in aanmerking komende kosten"
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 6: "op forfaitaire basis in jaarlijkse tranches ... gedurende
              # de eerste vijf jaar na de datum ... officieel ... erkend"
              - $forfaitair_in_jaarlijkse_tranches_eerste_vijf_jaar_na_erkenning
              # lid 7: "niet meer ... dan 10 % van de jaarlijkse in de handel
              # gebrachte productie"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value:
                  operation: DIVIDE
                  values:
                    - $jaarlijkse_waarde_in_de_handel_gebrachte_productie
                    - 10
              # lid 8: "De steun bedraagt ten hoogste 100 000 EUR per jaar."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: 10000000
              # lid 8: "De steun is degressief."
              - $steun_is_degressief
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '19'
            explanation: >-
              AND over de leden 1, 2 en 4 tot en met 8; het maximum van lid 8 is
              100 000 EUR per jaar (10000000 eurocent), het maximum van lid 7 is
              10% van de jaarlijkse in de handel gebrachte productie
              (gemodelleerd als deling door 10).
- number: '20'
  text: |-
    **Steun voor de deelname van producenten van landbouwproducten aan een kwaliteitsregeling**

    1.    De onderstaande categorieën steun aan producenten van landbouwproducten en hun groeperingen is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag:

    a) steun voor toetreding tot kwaliteitsregelingen, indien wordt voldaan aan de leden 2 tot en met 6 van dit artikel en aan hoofdstuk I;

    b) steun voor de kosten van verplichte controlemaatregelen die op het gebied van kwaliteitsregelingen door of in opdracht van de bevoegde autoriteit zijn genomen op grond van de wetgeving van de Unie of de nationale wetgeving, indien die steun voldoet aan de leden 2, 4, 6, 7 en 8 van dit artikel en aan hoofdstuk I;

    c) steun voor de kosten van marktonderzoek en productontwerp en -design en voor het opstellen van aanvragen voor de erkenning van kwaliteitsregelingen, indien die steun voldoet aan de leden 2, 6, 7 en 8 van dit artikel en aan hoofdstuk I.

    ▼B
    2.   Steun als bedoeld in lid 1 wordt toegekend voor de volgende kwaliteitsregelingen:

    a) kwaliteitsregelingen die zijn ingesteld bij:

    i) deel II, titel II, hoofdstuk I, afdeling 2, van Verordening (EU) nr. 1308/2013 wat wijn betreft,

    ii) Verordening (EU) nr. 1151/2012,

    iii) Verordening (EU) 2018/848 van het Europees Parlement en de Raad (16),

    iv) Verordening (EU) 2019/787 van het Europees Parlement en de Raad (17),

    v) Verordening (EU) nr. 251/2014 van het Europees Parlement en de Raad (18);

    b) kwaliteitsregelingen, met inbegrip van certificeringsregelingen, voor landbouwproducten die, naar de lidstaten erkennen, aan de volgende voorwaarden voldoen:

    i) de specificiteit van het eindproduct dat volgens dergelijke kwaliteitsregelingen wordt gemaakt, moet voortvloeien uit duidelijke verplichtingen die een van het volgende garanderen:

    — specifieke productkenmerken;

    — specifieke landbouw- of productiemethoden;

    — de kwaliteit van het eindproduct die uit het oogpunt van de gezondheid van mens, dier of plant, het dierenwelzijn of de milieubescherming veel verder gaat dan de voor het handelsproduct geldende normen;

    ii) de kwaliteitsregeling moet openstaan voor alle producenten,

    iii) de kwaliteitsregeling moet het opstellen van een bindend productdossier voor eindproducten behelzen en de naleving daarvan moet worden geverifieerd door openbare autoriteiten of door een onafhankelijke inspectie-instantie,

    iv) de kwaliteitsregeling moet transparant zijn en de volledige traceerbaarheid van de landbouwproducten garanderen;

    ▼B
    c) vrijwillige certificeringsregelingen voor landbouwproducten die, naar de betrokken lidstaat erkent, voldoen aan de eisen van de mededeling van de Commissie “EU-richtsnoeren betreffende de beste praktijken voor vrijwillige certificeringsregelingen voor landbouwproducten en levensmiddelen” (19).

    3.   De in lid 1, punt a), bedoelde steun wordt aan producenten van landbouwproducten toegekend in de vorm van een jaarlijkse financiële stimulans waarvan het niveau wordt bepaald op basis van de hoogte van de vaste kosten die met de deelname aan de kwaliteitsregelingen gepaard gaan.

    4.    De in lid 1, punten a) en b), bedoelde steun wordt niet toegekend voor de financiering van de kosten van controles die de begunstigden zelf verrichten of wanneer in de wetgeving van de Unie is bepaald dat de kosten van de controles door de producenten van landbouwproducten en hun groeperingen moeten worden gedragen, zonder dat daarbij de daadwerkelijke hoogte van die kosten is vermeld.

    5.   De in lid 1, punt a), bedoelde steun wordt gedurende ten hoogste zeven jaar verleend.

    6.   De steun is onder objectief vastgestelde voorwaarden toegankelijk voor alle ondernemingen die daarvoor in het betrokken gebied in aanmerking komen.

    7.   De in lid 1, punten b) en c), bedoelde steun wordt niet toegekend in de vorm van rechtstreekse betalingen aan de begunstigden.

    Hij wordt betaald aan de voor de controlemaatregelen verantwoordelijke instantie, de aanbieder van onderzoeksdiensten of de adviesverstrekker.

    8.  De in lid 1, punten b) en c), bedoelde steun bedraagt ten hoogste 100 % van de werkelijk gemaakte kosten.

    (16) Verordening (EU) 2018/848 van het Europees Parlement en de Raad van 30 mei 2018 inzake de biologische productie en de etikettering van bio­ logische producten en tot intrekking van Verordening (EG) nr. 834/2007 van de Raad (PB L 150 van 14.6.2018, blz. 1).
    (17) Verordening (EU) 2019/787 van het Europees Parlement en de Raad van 17 april 2019 betreffende de definitie, omschrijving, presentatie en etikette­ ring van gedistilleerde dranken, het gebruik van de namen van gedistilleerde dranken in de presentatie en etikettering van andere levensmiddelen en de bescherming van geografische aanduidingen van gedistilleerde dranken, het gebruik van ethylalcohol en distillaten uit landbouwproducten in alcoholhou­ dende dranken, en tot intrekking van Verordening (EG) nr. 110/2008 (PB L 130 van 17.5.2019, blz. 1).
    (18) Verordening (EU) nr. 251/2014 van het Europees Parlement en de Raad van 26 februari 2014 inzake de definitie, de aanduiding, de aanbiedingsvorm, de etikettering en de bescherming van geografische aanduidingen van gearoma­ tiseerde wijnbouwproducten en houdende intrekking van Verordening (EEG) nr. 1601/91 van de Raad (PB L 84 van 20.3.2014, blz. 14).
    (19) Mededeling van de Commissie — EU-richtsnoeren betreffende de beste praktijken voor vrijwillige certificeringsregelingen voor landbouwproducten en levensmiddelen (PB C 341 van 16.12.2010, blz. 5).
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_20
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_20
    untranslatables:
      - construct: erkenningsvoorwaarden voor nationale kwaliteitsregelingen (lid 2, punt b, i tot en met iv)
        reason: >-
          Of de specificiteit van het eindproduct voortvloeit uit duidelijke
          verplichtingen, de regeling openstaat voor alle producenten, een
          bindend productdossier met onafhankelijke verificatie behelst en
          transparant is met volledige traceerbaarheid, zijn open normen die de
          lidstaat beoordeelt ("naar de lidstaten erkennen"); de parameter
          regeling_door_lidstaat_erkend_conform_lid_2b neemt die erkenning als
          gegeven.
        legal_text_excerpt: >-
          kwaliteitsregelingen, met inbegrip van certificeringsregelingen, voor
          landbouwproducten die, naar de lidstaten erkennen, aan de volgende
          voorwaarden voldoen
        accepted: false
      - construct: niveaubepaling van de jaarlijkse financiële stimulans op basis van de vaste kosten (lid 3)
        reason: >-
          Het niveau van de stimulans wordt bepaald "op basis van de hoogte van
          de vaste kosten die met de deelname aan de kwaliteitsregelingen gepaard
          gaan" (begrip artikel 2, punt 27); dat is een berekening over een
          kostenverzameling, geen toetsbare voorwaarde op het steunbedrag. Alleen
          de vormeis (jaarlijkse financiële stimulans) is als boolean
          gemodelleerd.
        legal_text_excerpt: >-
          in de vorm van een jaarlijkse financiële stimulans waarvan het niveau
          wordt bepaald op basis van de hoogte van de vaste kosten die met de
          deelname aan de kwaliteitsregelingen gepaard gaan
        accepted: false
    execution:
      parameters:
        - name: steuncategorie
          type: string
          required: true
          description: >-
            Categorie steun uit lid 1. Waarden: TOETREDING_KWALITEITSREGELING
            (punt a: steun voor toetreding tot kwaliteitsregelingen),
            VERPLICHTE_CONTROLEMAATREGELEN (punt b: kosten van verplichte
            controlemaatregelen door of in opdracht van de bevoegde autoriteit),
            MARKTONDERZOEK_PRODUCTONTWERP_ERKENNINGSAANVRAAG (punt c: kosten van
            marktonderzoek, productontwerp en -design en het opstellen van
            erkenningsaanvragen).
        - name: regeling_ingesteld_bij_unieregelgeving
          type: boolean
          required: true
          description: >-
            De kwaliteitsregeling is ingesteld bij een van de in lid 2, punt a),
            genoemde Unie-handelingen (Verordening (EU) nr. 1308/2013 wat wijn
            betreft, Verordening (EU) nr. 1151/2012, Verordening (EU) 2018/848,
            Verordening (EU) 2019/787 of Verordening (EU) nr. 251/2014).
        - name: regeling_door_lidstaat_erkend_conform_lid_2b
          type: boolean
          required: true
          description: >-
            De kwaliteitsregeling (met inbegrip van certificeringsregelingen) is
            er een waarvan de lidstaat erkent dat zij voldoet aan de voorwaarden
            van lid 2, punt b), i) tot en met iv) (zie untranslatable).
        - name: vrijwillige_certificeringsregeling_conform_eu_richtsnoeren
          type: boolean
          required: true
          description: >-
            Vrijwillige certificeringsregeling voor landbouwproducten waarvan de
            betrokken lidstaat erkent dat zij voldoet aan de eisen van de
            mededeling "EU-richtsnoeren betreffende de beste praktijken voor
            vrijwillige certificeringsregelingen voor landbouwproducten en
            levensmiddelen" (lid 2, punt c).
        - name: steun_als_jaarlijkse_financiele_stimulans
          type: boolean
          required: false
          description: >-
            Alleen bij categorie TOETREDING_KWALITEITSREGELING: de steun wordt
            toegekend in de vorm van een jaarlijkse financiële stimulans (lid 3;
            de niveaubepaling op basis van de vaste kosten is een
            untranslatable).
        - name: betreft_kosten_van_eigen_controles
          type: boolean
          required: false
          description: >-
            Alleen bij de categorieën TOETREDING_KWALITEITSREGELING en
            VERPLICHTE_CONTROLEMAATREGELEN: de steun financiert kosten van
            controles die de begunstigden zelf verrichten (uitsluiting van lid
            4, eerste grond).
        - name: controlekosten_krachtens_uniewetgeving_voor_rekening_producenten_zonder_hoogte
          type: boolean
          required: false
          description: >-
            Alleen bij de categorieën TOETREDING_KWALITEITSREGELING en
            VERPLICHTE_CONTROLEMAATREGELEN: in de wetgeving van de Unie is
            bepaald dat de kosten van de controles door de producenten van
            landbouwproducten en hun groeperingen moeten worden gedragen, zonder
            dat daarbij de daadwerkelijke hoogte van die kosten is vermeld
            (uitsluiting van lid 4, tweede grond).
        - name: steunduur_jaren
          type: number
          required: false
          description: >-
            Alleen bij categorie TOETREDING_KWALITEITSREGELING: aantal jaren
            waarover de steun wordt verleend (lid 5: ten hoogste zeven jaar).
        - name: toegankelijk_onder_objectieve_voorwaarden
          type: boolean
          required: true
          description: >-
            De steun is onder objectief vastgestelde voorwaarden toegankelijk
            voor alle ondernemingen die daarvoor in het betrokken gebied in
            aanmerking komen (lid 6).
        - name: steun_betaald_aan_instantie_onderzoeker_of_adviesverstrekker
          type: boolean
          required: false
          description: >-
            Alleen bij de categorieën VERPLICHTE_CONTROLEMAATREGELEN en
            MARKTONDERZOEK_PRODUCTONTWERP_ERKENNINGSAANVRAAG: de steun wordt niet
            toegekend in de vorm van rechtstreekse betalingen aan de
            begunstigden, maar betaald aan de voor de controlemaatregelen
            verantwoordelijke instantie, de aanbieder van onderzoeksdiensten of
            de adviesverstrekker (lid 7).
        - name: steunintensiteit_pct
          type: number
          required: false
          description: >-
            Alleen bij de categorieën VERPLICHTE_CONTROLEMAATREGELEN en
            MARKTONDERZOEK_PRODUCTONTWERP_ERKENNINGSAANVRAAG: voorgenomen
            steunintensiteit in % van de werkelijk gemaakte kosten (gedeeld
            vocabulaire; lid 8: ten hoogste 100%).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            Elk van de punten a), b) en c) van lid 1 eist dat "aan hoofdstuk I"
            wordt voldaan — de gemeenschappelijke poort van artikel 3.
      output:
        - name: voldoet_aan_voorwaarden_art_20
          type: boolean
          description: >-
            De voorgenomen steun voor de deelname van producenten van
            landbouwproducten aan een kwaliteitsregeling voldoet aan de voor de
            betrokken steuncategorie geldende leden van artikel 20 en aan
            hoofdstuk I. Artikel 4 kent voor artikel 20 geen aanmeldingsdrempel.
      actions:
        - output: voldoet_aan_voorwaarden_art_20
          value:
            operation: AND
            conditions:
              # lid 1, punten a-c: telkens "en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2 (geldt voor alle drie categorieën): "Steun als bedoeld in
              # lid 1 wordt toegekend voor de volgende kwaliteitsregelingen"
              - operation: OR
                conditions:
                  - $regeling_ingesteld_bij_unieregelgeving
                  - $regeling_door_lidstaat_erkend_conform_lid_2b
                  - $vrijwillige_certificeringsregeling_conform_eu_richtsnoeren
              # lid 6 (geldt voor alle drie categorieën): "onder objectief
              # vastgestelde voorwaarden toegankelijk voor alle ondernemingen"
              - $toegankelijk_onder_objectieve_voorwaarden
              # per categorie de leden die lid 1 aanwijst:
              # punt a: leden 2 t/m 6; punt b: leden 2, 4, 6, 7 en 8;
              # punt c: leden 2, 6, 7 en 8
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steuncategorie
                      value: TOETREDING_KWALITEITSREGELING
                    then:
                      operation: AND
                      conditions:
                        # lid 3: "in de vorm van een jaarlijkse financiële stimulans"
                        - $steun_als_jaarlijkse_financiele_stimulans
                        # lid 4: "niet toegekend voor de financiering van de kosten
                        # van controles die de begunstigden zelf verrichten"
                        - operation: NOT
                          value: $betreft_kosten_van_eigen_controles
                        # lid 4: "of wanneer in de wetgeving van de Unie is bepaald
                        # dat de kosten ... moeten worden gedragen, zonder dat
                        # daarbij de daadwerkelijke hoogte ... is vermeld"
                        - operation: NOT
                          value: $controlekosten_krachtens_uniewetgeving_voor_rekening_producenten_zonder_hoogte
                        # lid 5: "gedurende ten hoogste zeven jaar verleend"
                        - operation: LESS_THAN_OR_EQUAL
                          subject: $steunduur_jaren
                          value: 7
                  - when:
                      operation: EQUALS
                      subject: $steuncategorie
                      value: VERPLICHTE_CONTROLEMAATREGELEN
                    then:
                      operation: AND
                      conditions:
                        # lid 4 (beide gronden, zie boven)
                        - operation: NOT
                          value: $betreft_kosten_van_eigen_controles
                        - operation: NOT
                          value: $controlekosten_krachtens_uniewetgeving_voor_rekening_producenten_zonder_hoogte
                        # lid 7: "niet toegekend in de vorm van rechtstreekse
                        # betalingen aan de begunstigden. Hij wordt betaald aan de
                        # voor de controlemaatregelen verantwoordelijke instantie
                        # ..."
                        - $steun_betaald_aan_instantie_onderzoeker_of_adviesverstrekker
                        # lid 8: "ten hoogste 100 % van de werkelijk gemaakte kosten"
                        - operation: LESS_THAN_OR_EQUAL
                          subject: $steunintensiteit_pct
                          value: 100
                  - when:
                      operation: EQUALS
                      subject: $steuncategorie
                      value: MARKTONDERZOEK_PRODUCTONTWERP_ERKENNINGSAANVRAAG
                    then:
                      operation: AND
                      conditions:
                        # lid 7 en lid 8, als hierboven
                        - $steun_betaald_aan_instantie_onderzoeker_of_adviesverstrekker
                        - operation: LESS_THAN_OR_EQUAL
                          subject: $steunintensiteit_pct
                          value: 100
                default: false
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '20'
            explanation: >-
              Lid 1 wijst per steuncategorie de toepasselijke leden aan (punt a:
              leden 2-6; punt b: leden 2, 4, 6, 7 en 8; punt c: leden 2, 6, 7 en
              8); de leden 2 en 6 gelden voor alle categorieën en staan buiten de
              IF.
- number: '21'
  text: |-
    **Steun voor kennisuitwisselings- en voorlichtingsacties**

    1.   Steun voor kennisuitwisselings- en voorlichtingsacties is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun dient voor de financiering van acties op het gebied van beroepsopleiding en verwerving van vaardigheden, waaronder opleidingscursussen, workshops, conferenties, coaching, demonstratieactiviteiten, voorlichtingsacties en de bevordering van innovatie.

    ▼B De steun kan ook worden toegekend voor korte uitwisselingen inzake landbouwbedrijfsbeheer en voor bezoeken aan landbouwbedrijven.

    De lidstaten zien erop toe dat de krachtens dit artikel gesteunde acties consistent zijn met de in hun strategisch GLB-plan opgenomen beschrijving van de kennis- en innovatiesystemen voor de landbouw (AKIS).

    Voor demonstratieactiviteiten mag steun worden verleend ter dekking van de betrokken investeringskosten.

    3.     De steun dekt de volgende in aanmerking komende kosten:

    a) de kosten van de organisatie van beroepsopleiding en van acties voor de verwerving van vaardigheden, waaronder opleidingscursussen, workshops, conferenties, coaching, demonstratieactiviteiten en voorlichtingsacties;

    b) de kosten in verband met de reis-, verblijfs- en dagvergoedingen van de deelnemers;

    c) de kosten van vervangingsdiensten tijdens de afwezigheid van de deelnemers;

    d) als het gaat om demonstratieprojecten in verband met investeringen:

    i) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de totale in aanmerking komende kosten van de betrokken verrichting,

    ii) de kosten van de koop of huurkoop van machines en uitrusting, tot maximaal de marktwaarde van de activa,

    iii) algemene kosten in verband met de in de punten i) en ii) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs en voor advies over ecologische en economische duurzaamheid, met inbegrip van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer op basis van de resultaten daarvan geen uitgaven uit hoofde van de punten i) en ii) worden gedaan,

    iv) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken.

    4.   De in lid 3, punt d), bedoelde kosten komen slechts in aanmerking voor zover en zolang zij voor het demonstratieproject worden gemaakt.

    Alleen de afschrijvingskosten die met de looptijd van het demonstratieproject overeenstemmen, als berekend volgens algemeen erkende boekhoudkundige beginselen, worden als in aanmerking komende kosten beschouwd.

    5.   De in lid 3, punten a) en c), bedoelde steun wordt niet toegekend in de vorm van rechtstreekse betalingen aan de begunstigden.

    Steun voor de kosten van vervangingsdiensten als bedoeld in lid 3, punt c), mag rechtstreeks worden betaald aan de aanbieder van de vervangingsdiensten.

    ▼B
    6.   De organisaties die kennisuitwisselings- en voorlichtingsacties aanbieden, beschikken over hiertoe gekwalificeerd en geregeld opgeleid personeel.

    De in de lid 2 bedoelde activiteiten mogen worden verricht door producentengroeperingen of andere organisaties, ongeacht hun omvang.

    7.   De steun is onder objectief vastgestelde voorwaarden toegankelijk voor alle ondernemingen die daarvoor in het betrokken gebied in aanmerking komen.

    Als de in lid 2 bedoelde activiteiten door producentengroeperingen en -organisaties worden verricht, mag lidmaatschap van die groeperingen of organisaties geen voorwaarde zijn om toegang tot die activiteiten te krijgen.

    Eventuele bijdragen van niet-leden in de administratieve kosten van de betrokken producentengroepering of -organisatie zijn beperkt tot de kosten van de in lid 2 bedoelde activiteiten.

    8.   De steunintensiteit bedraagt ten hoogste 100 % van de in aanmerking komende kosten.

    Voor de in lid 3, punt d), bedoelde demonstratieprojecten blijft het maximale steunbedrag beperkt tot 100 000 EUR over een periode van drie belastingjaren.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_21
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_21
    untranslatables:
      - construct: grondaankoop maximaal 10% van de totale in aanmerking komende kosten (lid 3, punt d, i)
        reason: >-
          Berekening binnen de kostenopstelling van een demonstratieproject: het
          aandeel van de grondaankoop in de totale in aanmerking komende kosten
          vergt een uitsplitsing van de kostenverzameling; geen toetsbare
          voorwaarde op het steunbedrag in dit breedte-eerst-model.
        legal_text_excerpt: >-
          waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag
          dat niet hoger is dan 10 % van de totale in aanmerking komende kosten
          van de betrokken verrichting
        accepted: false
      - construct: koppeling van demonstratie-investeringskosten aan de projectduur en afschrijving volgens boekhoudkundige beginselen (lid 4)
        reason: >-
          De kosten komen slechts in aanmerking "voor zover en zolang zij voor
          het demonstratieproject worden gemaakt" en alleen de
          afschrijvingskosten die met de looptijd van het project overeenstemmen
          tellen mee, berekend volgens algemeen erkende boekhoudkundige
          beginselen; dat is een berekening over de kostenverzameling met een
          open (boekhoudkundige) norm.
        legal_text_excerpt: >-
          Alleen de afschrijvingskosten die met de looptijd van het
          demonstratieproject overeenstemmen, als berekend volgens algemeen
          erkende boekhoudkundige beginselen, worden als in aanmerking komende
          kosten beschouwd.
        accepted: false
    execution:
      parameters:
        - name: actie_betreft_kennisuitwisseling_of_voorlichting
          type: boolean
          required: true
          description: >-
            De actie valt onder lid 2: beroepsopleiding en verwerving van
            vaardigheden (waaronder opleidingscursussen, workshops, conferenties,
            coaching, demonstratieactiviteiten, voorlichtingsacties en de
            bevordering van innovatie), dan wel korte uitwisselingen inzake
            landbouwbedrijfsbeheer of bezoeken aan landbouwbedrijven.
        - name: consistent_met_akis_beschrijving_glb_plan
          type: boolean
          required: true
          description: >-
            De gesteunde acties zijn consistent met de in het strategisch
            GLB-plan van de lidstaat opgenomen beschrijving van de kennis- en
            innovatiesystemen voor de landbouw (AKIS) (lid 2, derde alinea).
        - name: kosten_binnen_in_aanmerking_komende_categorieen
          type: boolean
          required: true
          description: >-
            De steun dekt uitsluitend de in lid 3 genoemde in aanmerking komende
            kosten: organisatiekosten van de acties (punt a), reis-, verblijfs-
            en dagvergoedingen van deelnemers (punt b), kosten van
            vervangingsdiensten tijdens afwezigheid van de deelnemers (punt c)
            en, bij demonstratieprojecten in verband met investeringen, de
            investeringskosten van punt d (onroerende goederen, machines en
            uitrusting tot marktwaarde, algemene kosten, software/cloud en
            octrooien/licenties).
        - name: betreft_demonstratieproject_met_investeringen
          type: boolean
          required: true
          description: >-
            De steun betreft een demonstratieproject in verband met investeringen
            (lid 3, punt d; bepaalt of het maximum van lid 8, tweede alinea, van
            toepassing is).
        - name: opleidings_en_vervangingskosten_niet_rechtstreeks_aan_begunstigden
          type: boolean
          required: true
          description: >-
            De steun voor de kosten van lid 3, punten a) en c), wordt niet
            toegekend in de vorm van rechtstreekse betalingen aan de
            begunstigden; steun voor vervangingsdiensten mag rechtstreeks aan de
            aanbieder van die diensten worden betaald (lid 5). Waar geen
            a)/c)-kosten aan de orde zijn: true.
        - name: aanbieder_beschikt_over_gekwalificeerd_en_geregeld_opgeleid_personeel
          type: boolean
          required: true
          description: >-
            De organisaties die kennisuitwisselings- en voorlichtingsacties
            aanbieden, beschikken over hiertoe gekwalificeerd en geregeld
            opgeleid personeel (lid 6, eerste alinea).
        - name: toegankelijk_onder_objectieve_voorwaarden
          type: boolean
          required: true
          description: >-
            De steun is onder objectief vastgestelde voorwaarden toegankelijk
            voor alle ondernemingen die daarvoor in het betrokken gebied in
            aanmerking komen (lid 7, eerste alinea).
        - name: verricht_door_producentengroepering_of_organisatie
          type: boolean
          required: true
          description: >-
            De activiteiten van lid 2 worden verricht door
            producentengroeperingen of -organisaties (lid 6, tweede alinea staat
            dat toe ongeacht omvang; bepaalt of de eisen van lid 7, tweede en
            derde alinea, van toepassing zijn).
        - name: lidmaatschap_is_toegangsvoorwaarde
          type: boolean
          required: false
          description: >-
            Alleen als de activiteiten door producentengroeperingen of
            -organisaties worden verricht: is lidmaatschap van die groeperingen
            of organisaties een voorwaarde om toegang tot de activiteiten te
            krijgen? Lid 7, tweede alinea, eist dat dit NIET zo is (de logica
            toetst de ontkenning). Canonieke positieve feit-parameter, gedeeld
            met de artikelen 22, 23 en 24.
        - name: bijdragen_niet_leden_beperkt_tot_activiteitskosten
          type: boolean
          required: false
          description: >-
            Alleen als de activiteiten door producentengroeperingen of
            -organisaties worden verricht: eventuele bijdragen van niet-leden in
            de administratieve kosten van de groepering of organisatie zijn
            beperkt tot de kosten van de activiteiten van lid 2 (lid 7, derde
            alinea).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten (gedeeld vocabulaire; lid 8, eerste alinea: ten hoogste
            100%).
        - name: steunbedrag
          type: amount
          required: false
          type_spec:
            unit: eurocent
          description: >-
            Alleen bij demonstratieprojecten van lid 3, punt d): voorgenomen
            steunbedrag over een periode van drie belastingjaren (gedeeld
            vocabulaire; meeteenheid van lid 8, tweede alinea).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            "als wordt voldaan aan dit artikel en aan hoofdstuk I van deze
            verordening" (lid 1) — de gemeenschappelijke poort van artikel 3.
      output:
        - name: voldoet_aan_voorwaarden_art_21
          type: boolean
          description: >-
            De voorgenomen steun voor kennisuitwisselings- en voorlichtingsacties
            voldoet aan de voorwaarden van artikel 21 en aan hoofdstuk I.
            Artikel 4 kent voor artikel 21 geen aanmeldingsdrempel.
      actions:
        - output: voldoet_aan_voorwaarden_art_21
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2: "De steun dient voor de financiering van acties op het
              # gebied van beroepsopleiding en verwerving van vaardigheden ...
              # korte uitwisselingen ... en ... bezoeken aan landbouwbedrijven."
              - $actie_betreft_kennisuitwisseling_of_voorlichting
              # lid 2, derde alinea: "consistent ... met de in hun strategisch
              # GLB-plan opgenomen beschrijving van de kennis- en
              # innovatiesystemen voor de landbouw (AKIS)"
              - $consistent_met_akis_beschrijving_glb_plan
              # lid 3: "De steun dekt de volgende in aanmerking komende kosten"
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 5: "De in lid 3, punten a) en c), bedoelde steun wordt niet
              # toegekend in de vorm van rechtstreekse betalingen aan de
              # begunstigden."
              - $opleidings_en_vervangingskosten_niet_rechtstreeks_aan_begunstigden
              # lid 6: "beschikken over hiertoe gekwalificeerd en geregeld
              # opgeleid personeel"
              - $aanbieder_beschikt_over_gekwalificeerd_en_geregeld_opgeleid_personeel
              # lid 7, eerste alinea: "onder objectief vastgestelde voorwaarden
              # toegankelijk voor alle ondernemingen"
              - $toegankelijk_onder_objectieve_voorwaarden
              # lid 7, tweede en derde alinea: eisen die alleen gelden "als de in
              # lid 2 bedoelde activiteiten door producentengroeperingen en
              # -organisaties worden verricht"
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $verricht_door_producentengroepering_of_organisatie
                  - operation: AND
                    conditions:
                      # lid 7, tweede alinea: lidmaatschap mag geen voorwaarde
                      # zijn — ontkenning van de canonieke feit-parameter
                      - operation: NOT
                        value: $lidmaatschap_is_toegangsvoorwaarde
                      - $bijdragen_niet_leden_beperkt_tot_activiteitskosten
              # lid 8, eerste alinea: "De steunintensiteit bedraagt ten hoogste
              # 100 % van de in aanmerking komende kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
              # lid 8, tweede alinea: "Voor de in lid 3, punt d), bedoelde
              # demonstratieprojecten blijft het maximale steunbedrag beperkt tot
              # 100 000 EUR over een periode van drie belastingjaren."
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_demonstratieproject_met_investeringen
                  - operation: LESS_THAN_OR_EQUAL
                    subject: $steunbedrag
                    value: 10000000
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '21'
            explanation: >-
              AND over de leden 1 tot en met 3 en 5 tot en met 8; het maximum van
              lid 8, tweede alinea, is 100 000 EUR (10000000 eurocent) over drie
              belastingjaren en geldt alleen voor demonstratieprojecten.
- number: '22'
  text: |-
    **Steun voor adviesdiensten**

    1.    Steun voor adviesdiensten is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun is bedoeld om ondernemingen die in de landbouwsector actief zijn en jonge landbouwers te helpen profiteren van adviesdiensten.

    De lidstaten zien erop toe dat de krachtens dit artikel gesteunde acties consistent zijn met de in hun strategisch GLB-plan opgenomen beschrijving van de kennis- en innovatiesystemen voor de landbouw (AKIS).

    3.    Het advies moet verband houden met ten minste één specifieke doelstelling van artikel 6 van Verordening (EU) 2021/2115 en betrekking hebben op ten minste één van de volgende elementen:

    a) verplichtingen ten gevolge van de uit de regelgeving voortvloeiende beheerseisen en de GLMC-normen krachtens titel III, hoofdstuk I, afdeling 2, van Verordening (EU) 2021/2115;

    ▼B
    b) de door de lidstaten vastgestelde vereisten voor de uitvoering van Richtlijn 2000/60/EG, Richtlijn 92/43/EEG, Richtlijn 2009/147/EG, Richtlijn 2008/50/EG van het Europees Parlement en de Raad (20), Richtlijn (EU) 2016/2284 van het Europees Parlement en de Raad (21), Verordening (EU) 2016/2031, Verordening (EU) 2016/429 van het Europees Parlement en de Raad (22), artikel 55 van Verordening (EG) nr. 1107/2009 van het Europees Parlement en de Raad (23) en Richtlijn 2009/128/EG van het Europees Parlement en de Raad (24);

    c) landbouwpraktijken ter voorkoming van de ontwikkeling van antimicrobiële resistentie als bedoeld in de mededeling “Een Europees “één gezondheid”-actieplan tegen antimicrobiële resistentie (25)”;

    d) risicopreventie en risicobeheer;

    e) modernisering, versterking van het concurrentievermogen, sectorintegratie, marktgerichtheid en bevordering van ondernemerschap en innovatie, met name voor de voorbereiding en uitvoering van projecten van operationele groepen in het kader van het EIP;

    f) digitale technologieën in de landbouw als bedoeld in artikel 114, punt b), van Verordening (EU) 2021/2115;

    g) duurzaam nutriëntenbeheer, met inbegrip van uiterlijk vanaf 2024 het gebruik van een bedrijfsduurzaamheidsinstrument voor nutriënten, als bedoeld in artikel 15, lid 4, van Verordening (EU) 2021/2115;

    h) arbeidsvoorwaarden, werkgeversverplichtingen, gezondheid en veiligheid op het werk en sociale bijstand in landbouwgemeenschappen;

    i) duurzame productie van voeder, beoordeling van voeder wat nutriëntengehalte en voederwaarden betreft, documentatie, planning en controle van het voederen van landbouwhuisdieren op basis van behoeften.

    4.    Het advies kan ook betrekking hebben op andere dan de in lid 3 bedoelde kwesties die verband houden met de economische en ecologische prestaties van het landbouwbedrijf, waaronder mededingingsaspecten. Dit advies kan onder meer betrekking hebben op het opzetten van korte toeleveringsketens, biologische landbouw, het besparen van duurzame energie, energie-efficiëntie en de productie en het gebruik van hernieuwbare energie voor de landbouw, het vergroten van de biodiversiteit of biodiversiteitsprestaties en gezondheidsaspecten van de veehouderij.

    ▼B
    5.    De steun wordt verleend in de vorm van een gesubsidieerde dienst.

    6.    De organisaties die worden geselecteerd om adviesdiensten te verstrekken, beschikken over daartoe gekwalificeerd en geregeld opgeleid personeel, alsmede over ervaring op het gebied van adviesverstrekking, en zijn betrouwbaar gebleken op de gebieden waarover zij advies verstrekken.

    De adviesdiensten mogen worden verstrekt door producentengroeperingen of andere organisaties, ongeacht hun omvang.

    De lidstaten zien erop toe dat de verstrekker van de adviesdiensten onpartijdig is en geen belangenconflict heeft.

    7.   De steun is onder objectief vastgestelde voorwaarden toegankelijk voor alle ondernemingen die daarvoor in het betrokken gebied in aanmerking komen.

    Als de adviesdiensten door producentengroeperingen en -organisaties worden verleend, mag lidmaatschap van die groeperingen of organisaties geen voorwaarde zijn om toegang tot die diensten te krijgen.

    Eventuele bijdragen van niet-leden in de administratieve kosten van de betrokken groepering of organisatie zijn beperkt tot de kosten van de adviesverstrekking.

    8.   Voor advies dat door dienstverleners wordt verstrekt aan een enkele begunstigde die actief is in de primaire landbouwproductie, is het steunbedrag beperkt tot 100 % van de in aanmerking komende kosten, met een maximumbedrag van 25 000 EUR per drie jaar (behalve voor kosten op grond van lid 4).

    9.   Voor advies dat door dienstverleners wordt verstrekt aan een enkele begunstigde die actief is in de verwerking en de afzet van landbouwproducten, is het steunbedrag beperkt tot 100 % van de in aanmerking komende kosten, met een maximumbedrag van 200 000 EUR per drie jaar (behalve voor kosten op grond van lid 4).

    (20) Richtlijn 2008/50/EG van het Europees Parlement en de Raad van 21 mei 2008 betreffende de luchtkwaliteit en schonere lucht voor Europa (PB L 152 van 11.6.2008, blz. 1).
    (21) Richtlijn (EU) 2016/2284 van het Europees Parlement en de Raad van 14 december 2016 betreffende de vermindering van de nationale emissies van bepaalde luchtverontreinigende stoffen, tot wijziging van Richtlijn 2003/35/EG en tot intrekking van Richtlijn 2001/81/EG (PB L 344 van 17.12.2016, blz. 1).
    (22) Verordening (EU) 2016/429 van het Europees Parlement en de Raad van 9 maart 2016 betreffende overdraagbare dierziekten en tot wijziging en intrekking van bepaalde handelingen op het gebied van diergezondheid (“diergezondheidswetgeving”) (PB L 84 van 31.3.2016, blz. 1).
    (23) Verordening (EG) nr. 1107/2009 van het Europees Parlement en de Raad van 21 oktober 2009 betreffende het op de markt brengen van gewasbe­ schermingsmiddelen en tot intrekking van de Richtlijnen 79/117/EEG en 91/414/EEG van de Raad (PB L 309 van 24.11.2009, blz. 1).
    (24) Richtlijn 2009/128/EG van het Europees Parlement en de Raad van 21 ok­ tober 2009 tot vaststelling van een kader voor communautaire actie ter ver­ wezenlijking van een duurzaam gebruik van pesticiden (PB L 309 van 24.11.2009, blz. 71). ( ) Een Europees 25                       “één gezondheid”-actieplan tegen antimicrobiële resistentie (AMR) (COM(2017) 339 final).
