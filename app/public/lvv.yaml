          vallen. Gemodelleerd is alleen dát de kosten door een bevoegde taxateur
          zijn getaxeerd; het bedrag komt binnen als parameter
          subsidiabele_kosten.
        legal_text_excerpt: >-
          De in aanmerking komende kosten komen overeen met de kosten die een
          rechtstreeks gevolg van de schadeveroorzakende gebeurtenis zijn, zoals
          getaxeerd door een openbare autoriteit, een door de steunverlenende
          autoriteit erkende onafhankelijke deskundige of een
          verzekeringsonderneming. ... Op het bedrag moeten de kosten in
          mindering worden gebracht die als gevolg van de schadeveroorzakende
          gebeurtenis niet zijn gemaakt en anders wel door de begunstigde zouden
          zijn gemaakt.
        accepted: false
      - construct: evenredigheid van de gevraagde preventieve maatregelen (lid 7)
        reason: >-
          Open norm: of de preventieve maatregelen "in verhouding staan tot het
          risico op schade die de beschermde dieren in het betrokken gebied
          kunnen veroorzaken" en of zij "redelijkerwijs niet mogelijk" zijn,
          vergt een beoordeling per gebied en geval. De uitkomst is als
          boolean-parameters gemodelleerd.
        legal_text_excerpt: >-
          welke maatregelen in verhouding moeten staan tot het risico op schade
          die de beschermde dieren in het betrokken gebied kunnen veroorzaken,
          behalve als dergelijke maatregelen redelijkerwijs niet mogelijk zijn
        accepted: false
    execution:
      parameters:
        - name: oorzakelijk_verband_vastgesteld_door_lidstaat
          type: boolean
          required: true
          description: >-
            De lidstaat heeft overeenkomstig lid 5 een rechtstreeks oorzakelijk
