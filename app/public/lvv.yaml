        accepted: false
      - construct: cumulatietoets bij herstel van bosbouwpotentieel (lid 9, tweede alinea)
        reason: >-
          De toets dat de steun voor herstelkosten samen met alle andere door de
          begunstigde ontvangen betalingen (andere nationale of uniale
          maatregelen, verzekeringsuitkeringen) niet meer dan 100 % van de in
          aanmerking komende kosten bedraagt, vergt aggregatie over betalingen
          van derden; samengevat in de booleaanse toetsparameter
          totale_vergoeding_ten_hoogste_100_pct_kosten.
        legal_text_excerpt: >-
          De steun voor de in lid 2, punt d), bedoelde in aanmerking komende
          kosten en eventuele andere door de begunstigde ontvangen betalingen
          ... mogen niet meer bedragen dan 100 % van de in aanmerking komende
          kosten.
        accepted: false
    execution:
      parameters:
        - name: betreft_preventie_of_herstel_bosschade
          type: boolean
          required: true
          description: >-
            De steun betreft de preventie of het herstel van schade aan bossen
            als gevolg van bosbranden, natuurrampen, ongunstige
            weersomstandigheden die met een natuurramp kunnen worden
            gelijkgesteld, andere ongunstige weersomstandigheden, plantenplagen,
            rampzalige gebeurtenissen of met de klimaatverandering verband
            houdende gebeurtenissen (lid 1).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten (lid 9, eerste alinea).
        - name: kosten_binnen_in_aanmerking_komende_categorieen
          type: boolean
          required: true
          description: >-
            De gedekte kosten vallen binnen lid 2, punten a-d: beschermende
            infrastructuur (inclusief onderhoud van brandstroken), plaatselijke
            kleinschalige preventieactiviteiten, monitoring- en
            communicatievoorzieningen, en herstel van beschadigd
            bosbouwpotentieel.
        - name: betreft_landbouwactiviteiten_op_areaal_met_art_34_verbintenissen
          type: boolean
          required: true
          description: >-
            De steun betreft landbouwgerelateerde activiteiten op areaal
            waarvoor verbintenissen gelden als vermeld in artikel 34 (lid 3:
            daarvoor wordt geen steun toegekend).
        - name: betreft_brandpreventie
          type: boolean
          required: true
          description: De steun betreft brandpreventie (lid 4).
        - name: bosgebied_opgenomen_in_bosbeschermingsplan
          type: boolean
          required: false
          description: >-
            Het bosgebied is opgenomen in het door de betrokken lidstaat
            opgestelde bosbeschermingsplan (lid 4; alleen vereist voor
            brandpreventiesteun).
        - name: betreft_herstel_bosbouwpotentieel
          type: boolean
          required: true
          description: >-
            De steun betreft herstel van bosbouwpotentieel als bedoeld in lid 2,
            punt d (lid 5, lid 7 tweede alinea, lid 9 tweede alinea).
        - name: formele_erkenning_van_de_schadegebeurtenis
          type: boolean
          required: false
          description: >-
            De bevoegde autoriteiten van de betrokken lidstaat hebben formeel
            erkend dat de schadeveroorzakende gebeurtenis zich heeft voorgedaan
            (lid 5, punt a).
        - name: bewijs_passende_risicobeheersinstrumenten
          type: boolean
          required: false
          description: >-
            De begunstigde heeft bewijzen overgelegd dat hij over passende
            risicobeheersinstrumenten beschikt om waar nodig een mogelijke
            schadeveroorzakende gebeurtenis in de toekomst tegen te gaan
            (lid 5, punt a).
        - name: betreft_plantenplaag
          type: boolean
          required: false
          description: >-
            De schade of het risico betreft een plantenplaag (lid 5, punt b;
            lid 6).
        - name: erkenning_uitvoering_plaagbestrijdingsmaatregelen
          type: boolean
          required: false
          description: >-
            De bevoegde autoriteiten hebben formeel erkend dat de overeenkomstig
            Verordening (EU) 2016/2031 genomen maatregelen om de plantenplaag te
            bestrijden, uit te roeien of in te dammen, zijn uitgevoerd (lid 5,
            punt b; zie untranslatables voor de reikwijdte).
        - name: steun_op_grond_van_artikel_107_lid_3_punt_c
          type: boolean
          required: false
          description: >-
            De herstelsteun wordt verleend op grond van artikel 107, lid 3,
            punt c, van het Verdrag (lid 1; lid 5, punt c geldt alleen dan).
        - name: bewijs_klimaatadaptatiemaatregelen_bij_herstel
          type: boolean
          required: false
          description: >-
            De begunstigde heeft bewijs overgelegd dat het herstel maatregelen
            voor de aanpassing aan de klimaatverandering zal omvatten (lid 5,
            punt c).
        - name: aanpassingsmaatregelen_integraal_deel_van_regeling
          type: boolean
          required: false
          description: >-
            De aanpassingsmaatregelen maken integraal deel uit van de regeling
            en gelden voor alle begunstigden (uitzondering van lid 5, punt c).
        - name: betreft_preventie_plantenplaag
          type: boolean
          required: true
          description: >-
            De steun dient om schade aan bossen door plantenplagen te voorkomen
            (lid 6).
        - name: plaagrisico_wetenschappelijk_aangetoond_en_erkend
          type: boolean
          required: false
          description: >-
            Het risico op een plantenplaag is aangetoond aan de hand van
            wetenschappelijke gegevens en erkend door een wetenschappelijke
            overheidsinstantie (lid 6, eerste alinea).
        - name: plaagsoorten_opgenomen_in_steunregeling
          type: boolean
          required: false
          description: >-
            De lijst van de soorten plantenplagen die schade veroorzaken of
            kunnen veroorzaken, is opgenomen in de door de betrokken lidstaat
            ingediende steunregeling of ad-hocsteun (lid 6, tweede alinea).
        - name: strookt_met_bosbeschermingsplan
          type: boolean
          required: true
          description: >-
            De gesteunde activiteiten of projecten stroken met het door de
            lidstaat opgestelde bosbeschermingsplan (lid 7, eerste alinea).
        - name: informatie_uit_bosbeheerplan_overgelegd
          type: boolean
          required: false
          description: >-
            Toepasselijke informatie uit een bosbeheerplan of gelijkwaardig
            instrument, in overeenstemming met de algemene richtsnoeren voor het
            duurzame beheer van de bossen in Europa, is overgelegd (lid 7,
            tweede alinea; alleen vereist voor grote ondernemingen bij herstel
            van bosbouwpotentieel).
        - name: is_gemeente_autonome_lokale_autoriteit
          type: boolean
          required: false
          description: >-
            De begunstigde is een gemeente die een autonome lokale autoriteit is
            (lid 7, tweede alinea).
        - name: gemeente_jaarbegroting
          type: amount
          required: false
          type_spec:
            unit: eurocent
          description: >-
            Jaarlijkse begroting van de gemeente (lid 7, tweede alinea:
            uitzondering bij minder dan 10 miljoen EUR).
        - name: gemeente_aantal_inwoners
          type: number
          required: false
          description: >-
            Aantal inwoners van de gemeente (lid 7, tweede alinea: uitzondering
            bij minder dan 5 000 inwoners).
        - name: betreft_steun_voor_inkomensverlies
          type: boolean
          required: true
          description: >-
            De steun betreft inkomensverlies als gevolg van de in lid 8 genoemde
            gebeurtenissen (lid 8: daarvoor wordt geen steun verleend).
        - name: totale_vergoeding_ten_hoogste_100_pct_kosten
          type: boolean
          required: false
          description: >-
            De herstelsteun en eventuele andere door de begunstigde ontvangen
            betalingen voor dezelfde in aanmerking komende kosten bedragen samen
            niet meer dan 100 % van die kosten (lid 9, tweede alinea; alleen bij
            herstel van bosbouwpotentieel; zie untranslatables).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            "als wordt voldaan aan ... hoofdstuk I van deze verordening"
            (lid 1; artikel 3).
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: >-
            Kmo-criteria van Bijlage I; lid 7, tweede alinea, stelt de
            bosbeheerplan-eis alleen aan grote ondernemingen.
      output:
        - name: voldoet_aan_voorwaarden_art_43
          type: boolean
          description: >-
            De voorgenomen steun voor de preventie en het herstel van schade aan
            bossen voldoet aan artikel 43 en aan hoofdstuk I van deze
            verordening (lid 1). Artikel 4 kent voor artikel 43 geen
            aanmeldingsdrempel.
      actions:
        - output: voldoet_aan_voorwaarden_art_43
          value:
            operation: AND
            conditions:
              # lid 1: steun voor preventie/herstel van schade aan bossen
              - $betreft_preventie_of_herstel_bosschade
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2: gedekte kostencategorieen
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 3: geen steun voor landbouwgerelateerde activiteiten op
              # areaal met artikel-34-verbintenissen
              - operation: NOT
                value: $betreft_landbouwactiviteiten_op_areaal_met_art_34_verbintenissen
              # lid 4: brandpreventie alleen voor bosgebieden in het
              # bosbeschermingsplan
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_brandpreventie
                  - $bosgebied_opgenomen_in_bosbeschermingsplan
              # lid 5, punt a: erkenning gebeurtenis + risicobeheersinstrumenten
              # (alleen bij herstel van bosbouwpotentieel)
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_herstel_bosbouwpotentieel
                  - operation: AND
                    conditions:
                      - $formele_erkenning_van_de_schadegebeurtenis
                      - $bewijs_passende_risicobeheersinstrumenten
              # lid 5, punt b: erkenning uitvoering plaagbestrijdingsmaatregelen
              # (bij herstel na een plantenplaag; zie untranslatables)
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_herstel_bosbouwpotentieel
                  - operation: NOT
                    value: $betreft_plantenplaag
                  - $erkenning_uitvoering_plaagbestrijdingsmaatregelen
              # lid 5, punt c: bewijs klimaatadaptatie bij herstel op grond van
              # artikel 107, lid 3, punt c, behalve als de aanpassings-
              # maatregelen integraal deel uitmaken van de regeling
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_herstel_bosbouwpotentieel
                  - operation: NOT
                    value: $steun_op_grond_van_artikel_107_lid_3_punt_c
                  - $bewijs_klimaatadaptatiemaatregelen_bij_herstel
                  - $aanpassingsmaatregelen_integraal_deel_van_regeling
              # lid 6: bij preventie van plaagschade is het risico
              # wetenschappelijk aangetoond en erkend, en staan de plaagsoorten
              # in de steunregeling of ad-hocsteun
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_preventie_plantenplaag
                  - operation: AND
                    conditions:
                      - $plaagrisico_wetenschappelijk_aangetoond_en_erkend
                      - $plaagsoorten_opgenomen_in_steunregeling
              # lid 7, eerste alinea: stroken met het bosbeschermingsplan
              - $strookt_met_bosbeschermingsplan
              # lid 7, tweede alinea: bosbeheerplan-eis voor grote ondernemingen
              # bij herstel, met uitzondering voor kleine autonome gemeenten
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_herstel_bosbouwpotentieel
                  - $is_kmo
                  - $informatie_uit_bosbeheerplan_overgelegd
                  - operation: AND
                    conditions:
                      - $is_gemeente_autonome_lokale_autoriteit
                      - operation: LESS_THAN
                        subject: $gemeente_jaarbegroting
                        value: 1000000000
                      - operation: LESS_THAN
                        subject: $gemeente_aantal_inwoners
                        value: 5000
              # lid 8: geen steun voor inkomensverlies
              - operation: NOT
                value: $betreft_steun_voor_inkomensverlies
              # lid 9, eerste alinea: steunintensiteit ten hoogste 100 %
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
              # lid 9, tweede alinea: cumulatie bij herstel ten hoogste 100 %
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_herstel_bosbouwpotentieel
                  - $totale_vergoeding_ten_hoogste_100_pct_kosten
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '43'
- number: '44'
  text: |-
    **Steun voor investeringen ter verbetering van de veerkracht en de milieuwaarde van bosecosystemen**

    1.    Steun voor investeringen ter verbetering van de veerkracht en de milieuwaarde van bosecosystemen is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De investeringen moeten betrekking hebben op het nakomen van verbintenissen inzake milieudoelstellingen, de verlening van ecosysteemdiensten, de verhoging van de maatschappelijke belevingswaarde van bossen en beboste gronden in het betrokken gebied of de verbetering van het potentieel van ecosystemen tot matiging van en aanpassing aan de klimaatverandering, zonder dat economische baten op lange termijn worden uitgesloten. Soorten die niet inheems zijn in het gebied, zijn uitgesloten, behalve wanneer de steun wordt verleend in het kader van het strategisch GLB-plan.

    ▼B
    3.    Steun voor investeringen waarvoor krachtens Richtlijn 2011/92/EU een milieueffectbeoordeling moet worden uitgevoerd, mag slechts worden toegekend op voorwaarde dat die beoordeling is uitgevoerd en de vergunning voor het betrokken investeringsproject is verleend vóór de datum van de toekenning van de individuele steun. Steun die in de vorm van financieringsinstrumenten wordt verleend, is van die voorwaarde vrijgesteld.

    4.   Behalve wanneer de steun in de vorm van financieringsinstrumenten wordt verstrekt, dekt hij de volgende in aanmerking komende kosten:

    a) de kosten van de bouw, verwerving, inclusief leasing, of verbetering van onroerende goederen, waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag dat niet hoger is dan 10 % van de totale in aanmerking komende kosten van de betrokken verrichting, met uitzondering van de aankoop van grond indien de steun wordt verleend in het kader van een strategisch GLB-plan;

    b) de kosten van de koop of huurkoop van machines en uitrusting, tot maximaal de marktwaarde van de activa;

    c) algemene kosten in verband met de in de punten a) en b) bedoelde uitgaven, zoals voor het inschakelen van architecten, ingenieurs en adviseurs, advies over duurzaamheid op milieu- en economisch gebied, met inbegrip van het uitvoeren van haalbaarheidsstudies; haalbaarheidsstudies blijven in aanmerking komen, zelfs wanneer op basis van de resultaten daarvan geen uitgaven uit hoofde van de punten a) en b) worden verricht;

    d) de kosten van aankoop, ontwikkeling of gebruik van computersoftware, cloudoplossingen of soortgelijke oplossingen en van de verwerving van octrooien, licenties, auteursrechten en handelsmerken;

    e) de kosten van de opstelling van bosbeheerplannen of gelijkwaardige instrumenten;

    f) de kosten van plant- en teeltmateriaal;

    g) aanplantkosten en kosten die rechtstreeks met de aanplanting verband houden;

    h) kosten van andere hiermee verband houdende verrichtingen, zoals de opslag en de behandeling van zaailingen met de nodige preventie- en beschermingsmaterialen;

    i) kosten van de vervanging van tijdens het eerste jaar afgestorven bomen en van de vervanging van bomen bij kleinschalige sterfte tijdens de eerste jaren na de aanplanting. Voor de kosten van de vervanging van bomen bij grootschalige sterfte kan alleen steun worden verleend in het kader van artikel 43.

    5.   Behalve wanneer de steun in de vorm van financieringsinstrumenten wordt verstrekt, worden andere dan de in lid 4, punten a) en b), bedoelde kosten in verband met een leasingcontract, zoals de marge voor de leasinggever, kosten van de herfinanciering van rente, overheadkosten en verzekeringspremies niet als in aanmerking komende kosten beschouwd.

    Behalve wanneer de steun in het kader van een strategisch GLB-plan in de vorm van financieringsinstrumenten wordt verleend, wordt werkkapitaal niet beschouwd als in aanmerking komende kosten.

    6.   De steunintensiteit bedraagt ten hoogste 100 % van de in aanmerking komende kosten.

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_44
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_44
    untranslatables:
      - construct: kostenplafonds binnen de subsidiabele kosten (lid 4, punten a en b)
        reason: >-
          De toets dat grondaankoop niet meer dan 10 % van de totale in
          aanmerking komende kosten bedraagt en dat machines/uitrusting tot
          maximaal de marktwaarde meetellen, vergt aggregatie over kostenposten;
          niet uitdrukbaar in de beschikbare operaties. Samengevat in de
          booleaanse toetsparameter kosten_binnen_in_aanmerking_komende_categorieen.
        legal_text_excerpt: >-
          waarbij de aankoop van grond slechts in aanmerking komt voor een bedrag
          dat niet hoger is dan 10 % van de totale in aanmerking komende kosten
          van de betrokken verrichting
        accepted: false
      - construct: uitsluiting van leasingkosten en werkkapitaal (lid 5)
        reason: >-
          Welke kostenposten in een leasingcontract de marge voor de
          leasinggever, herfinanciering van rente, overheadkosten of
          verzekeringspremies vormen, en of werkkapitaal is meegeteld, vergt
          analyse van de kostenopbouw; samengevat in de booleaanse
          toetsparameter kosten_binnen_in_aanmerking_komende_categorieen.
        legal_text_excerpt: >-
          worden andere dan de in lid 4, punten a) en b), bedoelde kosten in
          verband met een leasingcontract ... niet als in aanmerking komende
          kosten beschouwd
        accepted: false
    execution:
      parameters:
        - name: betreft_investering_veerkracht_of_milieuwaarde_bosecosystemen
          type: boolean
          required: true
          description: >-
            De steun betreft investeringen ter verbetering van de veerkracht en
            de milieuwaarde van bosecosystemen (lid 1).
        - name: investering_gericht_op_doelstellingen_lid_2
          type: boolean
          required: true
          description: >-
            De investering heeft betrekking op het nakomen van verbintenissen
            inzake milieudoelstellingen, de verlening van ecosysteemdiensten, de
            verhoging van de maatschappelijke belevingswaarde van bossen en
            beboste gronden in het betrokken gebied of de verbetering van het
            potentieel van ecosystemen tot matiging van en aanpassing aan de
            klimaatverandering (lid 2, eerste zin).
        - name: betreft_niet_inheemse_soorten
          type: boolean
          required: true
          description: >-
            De investering betreft soorten die niet inheems zijn in het gebied
            (lid 2, tweede zin: uitgesloten, behalve in het kader van het
            strategisch GLB-plan).
        - name: steun_in_kader_strategisch_glb_plan
          type: boolean
          required: false
          description: >-
            De steun wordt verleend in het kader van het strategisch GLB-plan
            (uitzondering van lid 2, tweede zin).
        - name: steun_in_vorm_van_financieringsinstrumenten
          type: boolean
          required: false
          description: >-
            De steun wordt verstrekt in de vorm van financieringsinstrumenten
            (lid 3, laatste zin; lid 4 en 5, aanhef).
        - name: milieueffectbeoordeling_vereist
          type: boolean
          required: true
          description: >-
            Voor de investering moet krachtens Richtlijn 2011/92/EU een
            milieueffectbeoordeling worden uitgevoerd (lid 3); false indien geen
            beoordelingsplicht.
        - name: milieueffectbeoordeling_uitgevoerd_en_vergunning_vooraf_verleend
          type: boolean
          required: false
          description: >-
            De milieueffectbeoordeling is uitgevoerd en de vergunning voor het
            investeringsproject is verleend voor de datum van de toekenning van
            de individuele steun (lid 3).
        - name: kosten_binnen_in_aanmerking_komende_categorieen
          type: boolean
          required: true
          description: >-
            De gedekte kosten vallen binnen lid 4, punten a-i (onroerende
            goederen, machines en uitrusting, algemene kosten, software en
            octrooien, bosbeheerplannen, plant- en teeltmateriaal, aanplant en
            daarmee verband houdende verrichtingen, vervanging bij
            kleinschalige sterfte); overige leasingkosten en werkkapitaal
            tellen niet mee (lid 5); vervanging van bomen bij grootschalige
            sterfte valt onder artikel 43 (lid 4, punt i). Kostenplafonds: zie
            untranslatables.
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun per investeringsproject (drempeltoets artikel 4,
            lid 1, punt n).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in aanmerking komende
            kosten (lid 6).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            "als wordt voldaan aan ... hoofdstuk I van deze verordening"
            (lid 1; artikel 3).
        - name: aanmeldingsdrempel_art_44
          type: amount
          type_spec:
            unit: eurocent
          source:
            output: aanmeldingsdrempel_art_44
          description: >-
            Aanmeldingsdrempel van artikel 4, lid 1, punt n (7,5 miljoen EUR per
            investeringsproject).
      output:
        - name: voldoet_aan_voorwaarden_art_44
          type: boolean
          description: >-
            De voorgenomen steun voor investeringen ter verbetering van de
            veerkracht en de milieuwaarde van bosecosystemen voldoet aan
            artikel 44 en aan hoofdstuk I van deze verordening (lid 1), binnen
            de aanmeldingsdrempel van artikel 4.
      actions:
        - output: voldoet_aan_voorwaarden_art_44
          value:
            operation: AND
            conditions:
              # lid 1: investeringen veerkracht/milieuwaarde bosecosystemen
              - $betreft_investering_veerkracht_of_milieuwaarde_bosecosystemen
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt n: drempel per investeringsproject
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_44
              # lid 2, eerste zin: gerichtheid van de investering
              - $investering_gericht_op_doelstellingen_lid_2
              # lid 2, tweede zin: niet-inheemse soorten uitgesloten, behalve in
              # het kader van het strategisch GLB-plan
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_niet_inheemse_soorten
                  - $steun_in_kader_strategisch_glb_plan
              # lid 3: milieueffectbeoordeling uitgevoerd en vergunning vooraf;
              # financieringsinstrumenten zijn van die voorwaarde vrijgesteld
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $milieueffectbeoordeling_vereist
                  - $steun_in_vorm_van_financieringsinstrumenten
                  - $milieueffectbeoordeling_uitgevoerd_en_vergunning_vooraf_verleend
              # lid 4/5: gedekte kostencategorieen
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 6: steunintensiteit ten hoogste 100 %
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '44'
- number: '45'
  text: |-
    **Steun voor het opvangen van gebiedsspecifieke nadelen die het gevolg zijn van bepaalde verplichte vereisten**

    1.    Steun die aan bosbezitters, bosbeheerders en hun verenigingen wordt verleend voor het opvangen van gebiedsspecifieke nadelen die het gevolg zijn van uit de uitvoering van Richtlijn 92/43/EEG of Richtlijn 2009/147/EG voortvloeiende vereisten, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.    De steun wordt jaarlijks per hectare bosareaal toegekend om de begunstigden te vergoeden voor de extra kosten die zij maken en de inkomsten die zij derven als gevolg van de nadelen die zij in de in lid 3 genoemde bosgebieden ondervinden door de uitvoering van de Richtlijnen 92/43/EEG en 2009/147/EG.

    3.    De steun wordt enkel betaald voor de volgende bosgebieden:

    a) Natura 2000-bosgebieden;

    b) landschapselementen waarmee wordt bijgedragen aan de uitvoering van artikel 10 van Richtlijn 92/43/EEG en die niet groter zijn dan 5 % van de gebieden die zijn opgenomen in het Natura 2000-netwerk dat onder de territoriale reikwijdte van het betrokken strategisch plan valt.

    4.   Er kan steun worden verleend aan bosbezitters, bosbeheerders en hun verenigingen.

    5.    De steunintensiteit blijft beperkt tot 100 % van de in lid 2 bedoelde kosten en mag niet meer bedragen dan 500 EUR per hectare per jaar in de eerste periode van ten hoogste vijf jaar en 200 EUR per hectare per jaar in de daaropvolgende periode.
