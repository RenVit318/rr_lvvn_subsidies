          type: boolean
          required: true
          description: >-
            De adviesdiensten verstrekken actuele technologische en
            wetenschappelijke informatie die tot stand is gekomen in het kader
            van onderzoek en innovatie (lid 2, tweede zin).
        - name: consistent_met_akis_beschrijving_glb_plan
          type: boolean
          required: true
          description: >-
            De gesteunde acties zijn consistent met de in het strategisch
            GLB-plan van de lidstaat opgenomen beschrijving van AKIS (lid 2,
