          description: >-
            Kmo-criteria van Bijlage I; lid 10 stelt de bosbeheerplan-eis alleen
            aan grote ondernemingen.
      output:
        - name: voldoet_aan_voorwaarden_art_41
          type: boolean
          description: >-
            De voorgenomen steun voor bebossing en de aanleg van beboste gronden
            voldoet aan artikel 41 en aan hoofdstuk I van deze verordening
            (lid 1), binnen de aanmeldingsdrempel van artikel 4.
      actions:
        - output: voldoet_aan_voorwaarden_art_41
          value:
            operation: AND
            conditions:
              # lid 1: steun voor bebossing en de aanleg van beboste gronden
              - $betreft_bebossing_of_aanleg_beboste_gronden
              # lid 1: "als wordt voldaan aan ... hoofdstuk I van deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt l: drempel per aanlegproject
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_41
              # lid 2/3/5: gedekte kostencategorieen
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 4: milieueffectbeoordeling uitgevoerd en vergunning vooraf
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $milieueffectbeoordeling_vereist
                  - $milieueffectbeoordeling_uitgevoerd_en_vergunning_vooraf_verleend
              # lid 6: jaarlijkse premie gedurende maximaal twaalf jaar
              - operation: LESS_THAN_OR_EQUAL
                subject: $duur_jaarlijkse_premie_jaren
                value: 12
              # lid 7, punten a-c en e: geen steun voor deze aanplant
              - operation: NOT
                value: $betreft_uitgesloten_boomsoorten
              # lid 7, punt d: niet-inheemse soorten, behalve in het kader van
              # het strategisch GLB-plan
              - operation: OR
                conditions:
                  - operation: NOT
                    value: $betreft_niet_inheemse_soorten
                  - $steun_in_kader_strategisch_glb_plan
              # lid 8: soorten aangepast aan milieu- en klimaatomstandigheden
              - $soorten_aangepast_aan_milieu_en_klimaatomstandigheden
              # lid 8 juncto lid 12: minimale milieuvereisten
              - $voldoet_aan_minimale_milieuvereisten
              # lid 10: bosbeheerplan-eis voor grote ondernemingen, met
              # uitzondering voor kleine autonome gemeenten
              - operation: OR
                conditions:
                  - $is_kmo
                  - $informatie_uit_bosbeheerplan_overgelegd
                  - operation: AND
                    conditions:
                      - $is_gemeente_autonome_lokale_autoriteit
                      - operation: LESS_THAN
                        subject: $gemeente_jaarbegroting
                        value: 1000000000
                      - operation: LESS_THAN
                        subject: $gemeente_aantal_inwoners
                        value: 5000
              # lid 11: steunintensiteit ten hoogste 100 %
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '41'
