        - name: steun_rechtstreeks_aan_onderzoeksorganisatie_toegekend
          type: boolean
          required: true
          description: >-
            De steun wordt rechtstreeks aan de organisatie voor onderzoek en/of
            kennisverspreiding toegekend (lid 5).
        - name: steun_in_vorm_van_prijsgebaseerde_betalingen
          type: boolean
          required: true
          description: >-
            De steun wordt toegekend in de vorm van op de prijs van de land- of
            bosbouwproducten gebaseerde betalingen aan ondernemingen die actief
            zijn in de landbouw- of de bosbouwsector (lid 6; dit is verboden).
        - name: organisatie_oefent_economische_activiteiten_uit
