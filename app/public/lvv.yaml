          required: false
          description: >-
            De lidstaat heeft voor dit specifieke soort verbintenissen een
            langere periode vastgesteld omdat dat nodig is om bepaalde voordelen
            op het gebied van dierenwelzijn te bereiken of te behouden (lid 8,
            tweede zin).
        - name: herzieningsclausule_vastgesteld
          type: boolean
          required: true
          description: >-
            De lidstaat heeft voor de verbintenis een herzieningsclausule
            vastgesteld die de aanpassing ervan garandeert wanneer de
            desbetreffende, in de leden 3 tot en met 7 bedoelde verplichte
            vereisten en normen worden gewijzigd (lid 11).
        - name: steun_jaarlijks_verleend
          type: boolean
          required: true
          description: >-
            De steun wordt jaarlijks verleend ter gehele of gedeeltelijke
            vergoeding van de extra kosten en de gederfde inkomsten die
            voortvloeien uit de dierenwelzijnsverbintenissen (lid 12; berekening
            zelf: zie untranslatable).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in % van de in lid 12 bedoelde kosten
            (lid 13; gedeeld vocabulaire).
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun per grootvee-eenheid per jaar, zoals artikel 4,
            lid 1, punt d en artikel 31, lid 13 de steun meten (gedeeld
            vocabulaire).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            Hoofdstuk I is nageleefd (artikel 3); lid 1 eist "als wordt voldaan
            aan dit artikel en aan hoofdstuk I van deze verordening".
        - name: aanmeldingsdrempel_art_31
          type: amount
          source:
            output: aanmeldingsdrempel_art_31
          type_spec:
            unit: eurocent
          description: >-
            Aanmeldingsdrempel van artikel 4, lid 1, punt d: 500 EUR per
            grootvee-eenheid per jaar.
      output:
        - name: voldoet_aan_voorwaarden_art_31
          type: boolean
          description: >-
            De voorgenomen steun voor dierenwelzijnsverbintenissen voldoet aan de
            voorwaarden van artikel 31, blijft onder de aanmeldingsdrempel van
            artikel 4, lid 1, punt d, en voldoet aan hoofdstuk I.
      actions:
        - output: voldoet_aan_voorwaarden_art_31
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 4, lid 1, punt d: drempel 500 EUR per grootvee-eenheid
              # per jaar
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: $aanmeldingsdrempel_art_31
              # lid 2: "ondernemingen die zich vrijwillig verbinden"
              - $verbintenis_vrijwillig_aangegaan
              # lid 3: "verder gaan dan de desbetreffende verplichte normen"
              - $verbintenis_gaat_verder_dan_verplichte_normen
              # lid 4: "verschillend ... van verbintenissen waarvoor betalingen
              # worden toegekend op grond van artikel 31 van Verordening (EU)
              # 2021/2115"
              - $verschilt_van_verbintenissen_art_31_vo_2021_2115
              # lid 5: "omschreven en toegelicht in de nationale rechtsgrondslag"
              - $verplichte_normen_omschreven_in_nationale_rechtsgrondslag
              # lid 6: bij nieuwe nationale voorschriften steun gedurende
              # maximaal 24 maanden vanaf de verplichtstelling
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $draagt_bij_aan_nieuwe_nationale_voorschriften
                      value: true
                    then: $steunduur_binnen_24_maanden_na_verplichtstelling
                default: true
              # lid 7: strengere normen op ten minste een van de gebieden a-g
              - operation: IN
                subject: $verbintenisgebied
                values:
                  - WATER_VOER_DIERENVERZORGING
                  - HUISVESTINGSOMSTANDIGHEDEN
                  - NATUURLIJK_GEDRAG
                  - BUITENUITLOOP_EN_GRAZEN
                  - ROBUUSTHEID_EN_LEVENSDUUR
                  - VERMIJDEN_VERMINKING_CASTRATIE
                  - SANITAIRE_MAATREGELEN
              # lid 7, punt f, tweede zin: bij toch nodig geachte verminking of
              # castratie moeten verdovingsmiddelen, pijnstillers en
              # ontstekingsremmers of immunocastratie worden gebruikt
              - operation: IF
                cases:
                  - when:
                      operation: AND
                      conditions:
                        - operation: EQUALS
                          subject: $verbintenisgebied
                          value: VERMIJDEN_VERMINKING_CASTRATIE
                        - operation: EQUALS
                          subject: $verminking_of_castratie_toch_nodig_geacht
                          value: true
                    then: $verdoving_pijnstilling_of_immunocastratie_gebruikt
                default: true
              # lid 8: "voor een periode van één tot zeven jaar"; de lidstaat kan
              # voor specifieke soorten verbintenissen een langere periode
              # vaststellen
              - operation: GREATER_THAN_OR_EQUAL
                subject: $verbintenisduur_jaren
                value: 1
              - operation: OR
                conditions:
                  - operation: LESS_THAN_OR_EQUAL
                    subject: $verbintenisduur_jaren
                    value: 7
                  - $lidstaat_heeft_langere_periode_vastgesteld
              # lid 11: herzieningsclausule
              - $herzieningsclausule_vastgesteld
              # lid 12: "De steun wordt jaarlijks verleend"
              - $steun_jaarlijks_verleend
              # lid 13: "De steunintensiteit blijft beperkt tot 100 % van de in
              # lid 12 bedoelde kosten"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
              # lid 13: "en mag niet meer bedragen dan 500 EUR per
              # grootvee-eenheid" (50000 eurocent)
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: 50000
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '31'
- number: '32'
  text: |-
    **Steun voor samenwerking in de landbouwsector**

    1.    Steun voor samenwerking in de landbouwsector is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.   De steun mag alleen worden toegekend ter bevordering van samenwerking die bijdraagt aan de verwezenlijking van een of meer van de doelstellingen van artikel 6, leden 1 en 2, van Verordening (EU) 2021/2115.

    ▼B
    3.   Bij de onder dit artikel vallende vormen van samenwerking zijn ten minste twee actoren betrokken, die niet noodzakelijk in de landbouwsector actief hoeven te zijn; de samenwerking moet echter vooral ten goede komen aan de landbouwsector.

    4.    De volgende vormen van samenwerking komen in aanmerking:

    a) samenwerking tussen verschillende ondernemingen in de landbouwsector, de voedselketen en andere actoren die actief zijn in de landbouwsector, met inbegrip van producentengroeperingen, coöperaties en brancheorganisaties, die bijdragen tot de verwezenlijking van de doelstellingen en prioriteiten van het plattelandsontwikkelingsbeleid;

    b) de oprichting van clusters en netwerken;

    c) bedrijfsopvolging, met name met het oog op generatievernieuwing op het landbouwbedrijf (er mag alleen steun worden verstrekt aan landbouwers die de pensioenleeftijd, zoals die door de betrokken lidstaat volgens zijn nationale wetgeving is bepaald, hebben bereikt of uiterlijk aan het einde van de verrichting zullen bereiken).

    5.    Voor samenwerking waarbij uitsluitend onderzoeksinstellingen zijn betrokken, mag geen steun worden verleend.

    6.   De steun mag worden verleend voor samenwerking bij de volgende activiteiten:

    a) proefprojecten;

    b) de ontwikkeling van nieuwe producten, praktijken, procedés en technologieën in de landbouwsector en de levensmiddelensector, voor zover het daarbij om landbouwproducten gaat;

    c) samenwerking tussen kleinschalige marktdeelnemers in de landbouwsector met als doel gezamenlijke werkprocedés op te zetten en voorzieningen en middelen te delen;

    d) horizontale en verticale samenwerking tussen actoren in de toeleveringsketen met het oog op de oprichting en ontwikkeling van korte ketens en lokale markten;

    e) afzetbevorderingsactiviteiten in een lokale context met het oog op de ontwikkeling van korte ketens en lokale markten;

    f) collectieve actie met het oog op klimaatmitigatie en -adaptatie;

    g) gezamenlijke benaderingen van milieuprojecten en gangbare milieupraktijken, met inbegrip van efficiënt waterbeheer, het gebruik van hernieuwbare energie (28) en de instandhouding van agrarische landschappen;

    h) horizontale en verticale samenwerking tussen actoren in de toeleveringsketen met het oog op duurzame levering van biomassa voor gebruik in de voedselproductie, mits het resultaat een landbouwproduct is, en in de productie van energie voor eigen gebruik;

    i) de uitvoering, met name door andere dan de in artikel 31, lid 2, punt b), van Verordening (EU) 2021/1060 bedoelde groepen publieke en private partners, van andere dan de in artikel 32 van Verordening (EU) 2021/1060 bedoelde strategieën voor lokale ontwikkeling.

    (28) Dit betreft samenwerking op het gebied van de productie, op het landbouwbedrijf, van energie uit hernieuwbare bronnen of van biobrandstoffen, mits wordt voldaan aan artikel 14.

    ▼B
    7.   De steun mag alleen worden verleend voor nieuwe samenwerkingsvormen, met inbegrip van bestaande samenwerkingsvormen indien een nieuwe activiteit wordt opgestart.

    8.   Steun voor de oprichting en ontwikkeling van korte toeleveringsketens, als bedoeld in lid 6, punten d) en e), mag slechts betrekking hebben op toeleveringsketens waarbij er tussen de landbouwer en de consument hoogstens één intermediair is.

    9.    De op grond van dit artikel verstrekte steun moet in overeenstemming zijn met de artikelen 206 tot en met 210 bis van Verordening (EU) nr. 1308/2013.

    10.    Bij uit investeringen bestaande verrichtingen moet worden voldaan aan de regels en vereisten van het toepasselijke artikel inzake investeringssteun van deze verordening en aan artikel 4 inzake aanmeldingsdrempels.

    11.   De volgende kosten komen in aanmerking voor zover zij betrekking hebben op landbouwactiviteiten:

    a) kosten van voorbereidende ondersteuning, capaciteitsopbouw, opleiding en netwerkvorming met het oog op het opzetten en uitvoeren van een samenwerkingsproject;

    b) kosten van studies van het betrokken gebied, kosten van haalbaarheidsstudies en kosten van het opstellen van een bedrijfsplan of een andere dan de in artikel 32 van Verordening (EU) 2021/1060 bedoelde strategie voor lokale ontwikkeling;

    c) met de samenwerking gepaard gaan werkingskosten;

    d) kosten van uit te voeren verrichtingen, waaronder kosten van dynamisering;

    e) kosten van afzetbevorderingsactiviteiten.

    12.   De steun wordt gedurende ten hoogste zeven jaar verleend.

    13.  De steun bedraagt ten hoogste 100 % van de in aanmerking komende kosten.

    14.    Bij in lid 11, punt d), bedoelde verrichtingen die uit investeringen bestaan, blijft de steun beperkt tot de maximale steunintensiteit voor investeringssteun, als vastgesteld in het desbetreffende artikel inzake investeringssteun.

    Afdeling 2 Steun voor milieubescherming in de landbouw
