          de steunmaatregel.
        legal_text_excerpt: >-
          kan ... steun worden verleend gedurende maximaal 24 maanden vanaf de
          datum waarop die voorschriften voor het bedrijf verplicht worden
        accepted: false
      - construct: eerste periode van vijf tot zeven jaar met verlengings- en verkortingsgronden (lid 6)
