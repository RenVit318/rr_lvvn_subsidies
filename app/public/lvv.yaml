        # lid 2, punt b
        - name: steun_identiek_aan_glb_plan_maatregel
          type: boolean
          required: true
          description: >-
            De steun is identiek aan de desbetreffende maatregel van het
            strategisch GLB-plan (lid 2, punt b)
        # lid 3: categorieen begunstigden
        - name: begunstigde_categorie_art_56
          type: string
          required: true
          description: >-
            Categorie begunstigde van lid 3: LANDBOUWER_OF_LID_LANDBOUWHUISHOUDEN
            (punt a, diversifierend naar niet-agrarische activiteiten),
            KLEINE_OF_MICRO_ONDERNEMING (punt b), NATUURLIJK_PERSOON (punt c)
        # lid 3: alle drie de categorieen zijn "in plattelandsgebieden"
        - name: in_plattelandsgebied
          type: boolean
          required: true
          description: De begunstigde bevindt zich in een plattelandsgebied (lid 3)
        # lid 3, punt a: "die diversifieren naar niet-agrarische activiteiten"
        - name: diversifieert_naar_niet_agrarische_activiteiten
          type: boolean
          required: false
          description: >-
            De landbouwer of het lid van het landbouwhuishouden diversifieert
            naar niet-agrarische activiteiten (lid 3, punt a). Alleen relevant
            bij categorie LANDBOUWER_OF_LID_LANDBOUWHUISHOUDEN.
        # lid 4: voorwaarde als het lid van het landbouwhuishouden een
        # rechtspersoon of groep rechtspersonen is
        - name: lid_landbouwhuishouden_is_rechtspersoon
          type: boolean
          required: false
          description: >-
            Het in lid 3, punt a, bedoelde lid van een landbouwhuishouden is
            een rechtspersoon of een groep rechtspersonen (lid 4). Alleen
            relevant bij categorie LANDBOUWER_OF_LID_LANDBOUWHUISHOUDEN.
        - name: oefent_landbouwactiviteit_uit_bij_aanvraag
          type: boolean
          required: false
          description: >-
            Het lid oefent op het tijdstip dat de steunaanvraag wordt ingediend
            een landbouwactiviteit op het landbouwbedrijf uit (lid 4)
        # lid 5: bedrijfsplan
        - name: bedrijfsplan_ingediend
          type: boolean
          required: true
          description: >-
            Bij de bevoegde autoriteit van de betrokken lidstaat is een
            bedrijfsplan ingediend met de economische beginsituatie, mijlpalen
            en streefcijfers, en nadere gegevens over de vereiste acties
            (lid 5)
        - name: looptijd_bedrijfsplan_jaren
          type: number
          required: true
          description: Looptijd van het bedrijfsplan in jaren; hoogstens vijf jaar (lid 5, slotalinea)
        # lid 7: maximumbedrag
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: Voorgenomen steunbedrag per begunstigde (lid 7)
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: De steun voldoet aan hoofdstuk I van deze verordening (lid 1; artikel 3)
      output:
        - name: voldoet_aan_voorwaarden_art_56
          type: boolean
          description: >-
            De voorgenomen aanloopsteun voor niet-agrarische activiteiten in
            plattelandsgebieden voldoet aan artikel 56 en aan hoofdstuk I van
            deze verordening
      actions:
        - output: voldoet_aan_voorwaarden_art_56
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2, punt a
              - $steun_in_kader_strategisch_glb_plan
              # lid 2, punt b
              - $steun_identiek_aan_glb_plan_maatregel
              # lid 3: een van de drie categorieen begunstigden
              - operation: IN
                subject: $begunstigde_categorie_art_56
                values:
                  - LANDBOUWER_OF_LID_LANDBOUWHUISHOUDEN
                  - KLEINE_OF_MICRO_ONDERNEMING
                  - NATUURLIJK_PERSOON
              # lid 3: "in plattelandsgebieden" (alle categorieen)
              - $in_plattelandsgebied
              # lid 3, punt a: diversificatie-eis, alleen voor categorie a
              - operation: OR
                conditions:
                  - operation: NOT
                    value:
                      operation: EQUALS
                      subject: $begunstigde_categorie_art_56
                      value: LANDBOUWER_OF_LID_LANDBOUWHUISHOUDEN
                  - $diversifieert_naar_niet_agrarische_activiteiten
              # lid 4: is het lid een rechtspersoon (of groep), dan moet het bij
              # de aanvraag een landbouwactiviteit op het landbouwbedrijf
              # uitoefenen
              - operation: OR
                conditions:
                  - operation: NOT
                    value:
                      operation: AND
                      conditions:
                        - operation: EQUALS
                          subject: $begunstigde_categorie_art_56
                          value: LANDBOUWER_OF_LID_LANDBOUWHUISHOUDEN
                        - $lid_landbouwhuishouden_is_rechtspersoon
                  - $oefent_landbouwactiviteit_uit_bij_aanvraag
              # lid 5: "De steun is afhankelijk van de indiening van een
              # bedrijfsplan"
              - $bedrijfsplan_ingediend
              # lid 5, slotalinea: "een looptijd van hoogstens vijf jaar"
              - operation: LESS_THAN_OR_EQUAL
                subject: $looptijd_bedrijfsplan_jaren
                value: 5
              # lid 7: "ten hoogste 100 000 EUR per begunstigde"
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunbedrag
                value: 10000000
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '56'
- number: '57'
  text: |-
    **Steun voor landbouwers die tot een kwaliteitsregeling voor katoen of levensmiddelen toetreden**

    1.    Steun voor landbouwers die toetreden, of in de voorgaande vijf jaar zijn toegetreden, tot een kwaliteitsregeling voor katoen of levensmiddelen, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    2.     De steun moet aan de twee onderstaande voorwaarden voldoen:

    a) hij wordt in een van de volgende vormen verleend in het kader van een strategisch GLB-plan overeenkomstig Verordening (EU) 2021/2115:

    i) als steun die uit het Elfpo wordt gecofinancierd,

    ii) als aanvullende nationale financiering bij de in punt i) genoemde steun;

    b) hij is identiek aan de desbetreffende interventie van het in punt a) bedoelde strategisch GLB-plan.

    3.    Er wordt steun verleend voor toetreding tot een van de volgende soorten kwaliteitsregelingen:

    ▼B
    a) op grond van Verordening (EU) nr. 1151/2012 vastgestelde kwaliteitsregelingen voor katoen en levensmiddelen;

    b) kwaliteitsregelingen, met inbegrip van certificeringsregelingen, voor katoen en levensmiddelen waarvan de lidstaten erkennen dat ze aan de volgende criteria voldoen:

    i) de specificiteit van het eindproduct dat volgens dergelijke kwaliteitsregelingen wordt gemaakt, vloeit voort uit duidelijke verplichtingen die een of meer van de volgende eigenschappen garanderen:

    — specifieke productkenmerken;

    — specifieke landbouw- of productiemethoden;

    — een kwaliteit van het eindproduct die uit het oogpunt van de gezondheid van mens, dier of plant, het dierenwelzijn of milieubescherming veel verder gaat dan de voor het handelsproduct geldende normen;

    ii) de regeling staat open voor alle producenten,

    iii) de regeling behelst het opstellen van een bindend productdossier voor eindproducten en de naleving daarvan wordt geverifieerd door overheidsinstanties of door een onafhankelijke inspectie-instantie,

    iv) de regeling is transparant en garandeert de volledige traceerbaarheid van de landbouwproducten;

    c) vrijwillige certificeringsregelingen voor levensmiddelen die, naar de betrokken lidstaat erkent, voldoen aan de eisen van de mededeling van de Commissie “EU-richtsnoeren betreffende de beste praktijken voor vrijwillige certificeringsregelingen voor landbouwproducten en levensmiddelen” (32).

    4.   De steun wordt verleend in de vorm van een jaarlijkse financiële stimulans waarvan het niveau wordt bepaald op basis van de hoogte van de vaste kosten die voortvloeien uit de deelname aan kwaliteitsregelingen.

    5.     De steun wordt gedurende ten hoogste zeven jaar verleend.

    6.     Als de eerste deelname aan de kwaliteitsregeling vóór de steunaanvraag is gestart, wordt de maximale duur van zeven jaar verminderd met het aantal jaren dat is verlopen tussen die eerste deelname en het tijdstip van de steunaanvraag.

    7.    De steun bedraagt ten hoogste 3 000 EUR per begunstigde per jaar.
