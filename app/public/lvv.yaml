          Open norm; of het brutosubsidie-equivalent "vooraf precies kan worden
          berekend zonder dat een risicoanalyse hoeft te worden uitgevoerd" is
          niet uitdrukbaar in de beschikbare operaties. Het model steunt op de
          limitatieve vormenlijst van lid 3 en de uitsluitingen van lid 4; een
          vorm buiten die lijsten wordt hier als niet-transparant behandeld.
        legal_text_excerpt: >-
          Steun wordt geacht transparant te zijn als het brutosubsidie-equivalent
          vooraf precies kan worden berekend zonder dat een risicoanalyse hoeft te
          worden uitgevoerd.
        accepted: false
      - construct: berekening van het brutosubsidie-equivalent van een lening met het referentiepercentage (lid 3, punt b)
        reason: >-
          De berekening zelf (contantmaking tegen het op het tijdstip van de
          steunverlening geldende referentiepercentage) vergt een externe
          rentevoet-opzoeking en een financiële berekening; alleen de
          vormvoorwaarde (dát die methode is gebruikt) is als boolean-parameter
          gemodelleerd.
        legal_text_excerpt: >-
          steun in de vorm van leningen indien voor het berekenen van het
          brutosubsidie-equivalent het op het tijdstip van de steunverlening
          geldende referentiepercentage is gebruikt
        accepted: false
      - construct: safe-harbour-premies en aanvaarde berekeningsmethodes voor garanties en terugbetaalbare voorschotten (lid 3, punten c en e)
        reason: >-
          Of het brutosubsidie-equivalent op basis van de safe-harbour-premies is
          berekend dan wel de methode vooraf door de Commissie is aanvaard, vergt
          een opzoeking in mededelingen/besluiten van de Commissie; gemodelleerd
          als boolean-parameters over dat feit.
        legal_text_excerpt: >-
          het brutosubsidie-equivalent is berekend op basis van de
          safe-harbour-premies die in een mededeling van de Commissie zijn
          vastgesteld
        accepted: false
    execution:
      parameters:
        - name: steunvorm
          type: string
          required: true
          description: >-
            Vorm waarin de steun wordt verleend. Waarden: SUBSIDIE, RENTESUBSIDIE,
            GESUBSIDIEERDE_DIENST, LENING, GARANTIE, FISCAAL_VOORDEEL,
            TERUGBETAALBAAR_VOORSCHOT, VERKOOP_VERHUUR_ACTIVA, KAPITAALINJECTIE,
            RISICOKAPITAAL, ANDERS. (Gedeeld vocabulaire; de waarden
            GESUBSIDIEERDE_DIENST, TERUGBETAALBAAR_VOORSCHOT,
            VERKOOP_VERHUUR_ACTIVA en KAPITAALINJECTIE zijn toegevoegd voor de
            vormen die artikel 5, leden 3 en 4 onderscheidt.)
        - name: lening_bse_berekend_met_referentiepercentage
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm LENING: voor het berekenen van het
            brutosubsidie-equivalent is het op het tijdstip van de steunverlening
            geldende referentiepercentage gebruikt (lid 3, punt b).
        - name: garantie_bse_op_basis_van_safe_harbour_premies
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm GARANTIE: het brutosubsidie-equivalent is
            berekend op basis van de safe-harbour-premies die in een mededeling
            van de Commissie zijn vastgesteld (lid 3, punt c, i).
        - name: garantie_bse_methode_vooraf_aanvaard
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm GARANTIE: de methode voor het berekenen van het
            brutosubsidie-equivalent is voorafgaand aan de uitvoering van de
            steunmaatregel aanvaard op grond van de mededeling over garanties, na
            aanmelding bij de Commissie, en is uitdrukkelijk toegespitst op het
            soort garanties en het soort onderliggende transacties in het geding
            (lid 3, punt c, ii).
        - name: fiscaal_voordeel_maximum_garandeert_drempel
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm FISCAAL_VOORDEEL: de maatregel voorziet in een
            maximum dat garandeert dat de toepasselijke drempel niet wordt
            overschreden (lid 3, punt d).
        - name: voorschot_nominaal_bedrag_binnen_drempels
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm TERUGBETAALBAAR_VOORSCHOT: het totale nominale
            bedrag van het terugbetaalbare voorschot is niet groter dan de
            krachtens deze verordening toepasselijke drempels (lid 3, punt e;
            gemarkeerde tussenstand — de toepasselijke drempel per artikel staat
            in artikel 4).
        - name: voorschot_bse_methode_vooraf_aanvaard
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm TERUGBETAALBAAR_VOORSCHOT: vóór de uitvoering van
            de maatregel is de methode voor het berekenen van het
            brutosubsidie-equivalent van het terugbetaalbare voorschot na
            aanmelding bij de Commissie aanvaard (lid 3, punt e).
        - name: activa_waarde_door_onafhankelijke_taxatie_vooraf
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm VERKOOP_VERHUUR_ACTIVA: de waarde is vastgesteld
            door een taxatie van een onafhankelijke deskundige vóór de transactie
            (lid 3, punt f).
        - name: activa_waarde_via_publieke_benchmark
          type: boolean
          required: false
          description: >-
            Alleen bij steunvorm VERKOOP_VERHUUR_ACTIVA: de waarde is vastgesteld
            aan de hand van een publiek beschikbare, regelmatig bijgewerkte en
            algemeen aanvaarde benchmark (lid 3, punt f).
      output:
        - name: is_transparante_steun
          type: boolean
          description: >-
            De steun wordt op grond van artikel 5, lid 3 geacht transparant te
            zijn (en valt niet onder de uitsluitingen van lid 4). Deze verordening
            is uitsluitend van toepassing op transparante steun (lid 1).
      actions:
        - output: is_transparante_steun
          value:
            operation: AND
            conditions:
              # Lid 4: kapitaalinjecties en risicofinancieringsmaatregelen zijn
              # nooit transparant.
              - operation: NOT
                value:
                  operation: IN
                  subject: $steunvorm
                  values:
                    - KAPITAALINJECTIE
                    - RISICOKAPITAAL
              # Lid 3: limitatieve lijst van vormen die transparant worden geacht.
              - operation: OR
                conditions:
                  # a) subsidies, rentesubsidies en gesubsidieerde diensten
                  - operation: IN
                    subject: $steunvorm
                    values:
                      - SUBSIDIE
                      - RENTESUBSIDIE
                      - GESUBSIDIEERDE_DIENST
                  # b) leningen, mits BSE berekend met het referentiepercentage
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $steunvorm
                        value: LENING
                      - operation: EQUALS
                        subject: $lening_bse_berekend_met_referentiepercentage
                        value: true
                  # c) garanties, in een van de twee genoemde situaties
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $steunvorm
                        value: GARANTIE
                      - operation: OR
                        conditions:
                          - operation: EQUALS
                            subject: $garantie_bse_op_basis_van_safe_harbour_premies
                            value: true
                          - operation: EQUALS
                            subject: $garantie_bse_methode_vooraf_aanvaard
                            value: true
                  # d) belastingvoordelen met een maximum dat de drempel garandeert
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $steunvorm
                        value: FISCAAL_VOORDEEL
                      - operation: EQUALS
                        subject: $fiscaal_voordeel_maximum_garandeert_drempel
                        value: true
                  # e) terugbetaalbare voorschotten
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $steunvorm
                        value: TERUGBETAALBAAR_VOORSCHOT
                      - operation: OR
                        conditions:
                          - operation: EQUALS
                            subject: $voorschot_nominaal_bedrag_binnen_drempels
                            value: true
                          - operation: EQUALS
                            subject: $voorschot_bse_methode_vooraf_aanvaard
                            value: true
                  # f) verkoop of verhuring/leasing van materiële activa onder
                  #    het markttarief
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $steunvorm
                        value: VERKOOP_VERHUUR_ACTIVA
                      - operation: OR
                        conditions:
                          - operation: EQUALS
                            subject: $activa_waarde_door_onafhankelijke_taxatie_vooraf
                            value: true
                          - operation: EQUALS
                            subject: $activa_waarde_via_publieke_benchmark
                            value: true
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '5'
            paragraph: '3'
- number: '6'
  text: |-
    **Stimulerend effect**

    1.   Deze verordening is uitsluitend van toepassing op steun die een stimulerend effect heeft.

    2.    Steun wordt geacht een stimulerend effect te hebben als de begunstigde ervan, voordat de werkzaamheden in het kader van het project of de activiteit zijn gestart, bij de betrokken lidstaat een schriftelijke steunaanvraag heeft ingediend. De steunaanvraag moet ten minste de volgende gegevens bevatten:

    a) de naam en de omvang van de onderneming;

    ▼B
    b) een beschrijving van het project of de activiteit, met inbegrip van de start- en einddatum;

    c) de plaats van het project of de activiteit;

    d) een lijst van de in aanmerking komende kosten;

    e) soort overheidsfinanciering (subsidie, lening, garantie, terugbetaalbaar voorschot of een andere vorm) en bedrag daarvan die nodig zijn voor het project of de activiteit.

    3.   Ad-hocsteun voor grote ondernemingen wordt geacht een stimulerend effect te hebben als de lidstaat er niet alleen op heeft toegezien dat aan de in lid 2 vastgestelde voorwaarde is voldaan, maar zich er ook, voordat hij de betrokken ad-hocsteun heeft toegekend, van heeft vergewist dat uit door de begunstigde opgestelde documentatie blijkt dat de steun zal leiden tot een of meer van het onderstaande:

    a) een wezenlijke toename van de reikwijdte van het project of de activiteit als gevolg van de steun;

    b) een wezenlijke toename, als gevolg van de steun, van het totale bedrag dat de begunstigde aan het project of de activiteit besteedt;

    c) een wezenlijke toename van de snelheid waarmee het betrokken project of de betrokken activiteit wordt voltooid;

    d) in het geval van ad-hocinvesteringssteun, dat, zonder de steun, het project of de activiteit niet als dusdanig in het betrokken plattelandsgebied zou zijn uitgevoerd of voor de begunstigde in het betrokken plattelandsgebied onvoldoende winstgevend zou zijn geweest.

    Deze vereisten gelden niet voor gemeenten die autonome lokale autoriteiten zijn met een jaarlijkse begroting van minder dan 10 miljoen EUR en met minder dan 5 000 inwoners.

    4.   In afwijking van de leden 2 en 3 worden maatregelen in de vorm van belastingvoordelen geacht een stimulerend effect te hebben als de volgende twee voorwaarden zijn vervuld:

    a) de maatregel geeft overeenkomstig objectieve criteria recht op steun zonder dat de lidstaat nog een beoordelingsbevoegdheid uitoefent;

    b) de maatregel is goedgekeurd en is in werking getreden voordat de werkzaamheden in het kader van het gesteunde project of de gesteunde activiteit zijn gestart, behalve in het geval van fiscale vervolgregelingen, wanneer de activiteit al onder de vroegere regelingen in de vorm van belastingvoordelen viel.

    5.    Voorts hoeven, in afwijking van de leden 2, 3 en 4, de volgende categorieën steun geen stimulerend effect te hebben of wordt ervan uitgegaan dat zij een stimulerend effect hebben:

    a) steunregelingen voor ruilverkaveling voor zover aan de voorwaarden van artikel 15 of artikel 53 is voldaan en:

    ▼B
    i) de steunregeling overeenkomstig objectieve criteria recht geeft op steun zonder dat de lidstaat nog een beoordelingsbevoegdheid uitoefent, en

    ii) de steunregeling goedgekeurd is en in werking is getreden voordat de begunstigde de in aanmerking komende kosten op grond van artikel 15 of artikel 53 heeft gemaakt;

    b) steun voor voorlichtingsacties in de landbouwsector overeenkomstig de artikelen 21 en 22 waarbij informatie ter beschikking wordt gesteld aan een onbepaald aantal begunstigden;

    c) steun voor afzetbevorderingsmaatregelen in de vorm van publicaties om landbouwproducten beter bekend te maken bij het brede publiek, mits aan artikel 24, lid 2, punt b), is voldaan;

    d) steun voor het herstel van schade als gevolg van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, mits aan artikel 25 is voldaan;

    e) steun voor de kosten van preventie, bestrijding en uitroeiing van dierziekten of plantenplagen en voor het herstel van schade als gevolg van die dierziekten of plantenplagen, mits aan artikel 26 is voldaan;

    ▼M1
    f) steun voor de kosten van het afvoeren en vernietigen van gestorven dieren, mits aan de voorwaarden van artikel 27, lid 2, punten c), d),
    e) en f), en artikel 28, lid 3, punt d), is voldaan;

    ▼B
    g) steun voor het herstel van door beschermde dieren veroorzaakte schade, mits aan artikel 29 is voldaan;

    h) steun voor het opvangen van nadelen in verband met Natura 2000- gebieden, als bedoeld in artikel 33;

    i) steun voor investeringen voor de instandhouding van cultureel en natuurlijk erfgoed op landbouwbedrijven of in bossen, mits aan artikel 36 is voldaan;

    j) steun voor het herstel van schade als gevolg van natuurrampen in de landbouwsector, mits aan artikel 37 is voldaan;

    k) steun voor onderzoek, ontwikkeling en innovatie in de landbouw- en de bosbouwsector, mits aan artikel 38 is voldaan;

    l) steun voor het herstel van schade aan bossen overeenkomstig artikel 43, lid 2, punt d), mits aan artikel 43 is voldaan;

    m) steun voor voorlichtingsacties in de bosbouwsector overeenkomstig de artikelen 47 en 48 waarbij informatie ter beschikking wordt gesteld aan een onbepaald aantal begunstigden;

    n) steun voor de instandhouding van genetische hulpbronnen in de bosbouw, mits aan artikel 51 is voldaan;

    ▼B
    o) steun voor landbouwers die aan een kwaliteitsregeling voor katoen of levensmiddelen deelnemen, mits aan artikel 58 is voldaan;

    p) steun voor ondernemingen die deelnemen aan of profiteren van CLLD-projecten of projecten van operationele groepen in het kader van het EIP, mits aan de toepasselijke voorwaarden van de artikelen 39, 40, 60 en 61 is voldaan.
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_6
  machine_readable:
    endpoint: heeft_stimulerend_effect
    untranslatables:
      - construct: wezenlijkheids-toets van lid 3, punten a-d (ad-hocsteun voor grote ondernemingen)
        reason: >-
          "Een wezenlijke toename" van reikwijdte, bestede bedrag of snelheid, en
          het contrafeitische "zonder de steun ... niet als dusdanig ... zou zijn
          uitgevoerd" zijn open normen die een beoordeling van documentatie
          vergen. Gemodelleerd als één boolean-parameter
          (lidstaat_vergewist_documentatie_stimulerend_effect) over de uitkomst
          van die beoordeling.
        legal_text_excerpt: >-
          ... zich er ook, voordat hij de betrokken ad-hocsteun heeft toegekend,
          van heeft vergewist dat uit door de begunstigde opgestelde documentatie
          blijkt dat de steun zal leiden tot een of meer van het onderstaande ...
        accepted: false
      - construct: verwijzingen "mits aan artikel X is voldaan" in lid 5
        reason: >-
          De per-categorie voorwaarde dat aan het genoemde hoofdstuk-III-artikel
          is voldaan kan niet als binding worden gemodelleerd: de endpoints
          voldoet_aan_voorwaarden_art_<N> binden zelf (via artikel 3) weer aan dit
          artikel, wat een cirkel oplevert. Gemodelleerd als de
          boolean-tussenstand voldoet_aan_voorwaarden_steunartikel. Voor lid 5,
          punt f geldt bovendien dat de voorwaarde alleen specifieke onderdelen
          betreft (artikel 27, lid 2, punten c-f en artikel 28, lid 3, punt d),
          en voor punt c alleen artikel 24, lid 2, punt b; die verfijning zit in
          de parameter-description, niet in de logica.
        legal_text_excerpt: >-
          steun voor het herstel van schade als gevolg van ongunstige
          weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld,
          mits aan artikel 25 is voldaan
        accepted: false
    execution:
      parameters:
        - name: aanvraag_voor_aanvang_werkzaamheden
          type: boolean
          required: true
          description: >-
            De begunstigde heeft, voordat de werkzaamheden in het kader van het
            project of de activiteit zijn gestart, bij de betrokken lidstaat een
            steunaanvraag ingediend (lid 2).
        - name: aanvraag_is_schriftelijk
          type: boolean
          required: false
          description: De steunaanvraag is schriftelijk ingediend (lid 2).
        - name: aanvraag_bevat_naam_en_omvang_onderneming
          type: boolean
          required: false
          description: >-
            De steunaanvraag bevat de naam en de omvang van de onderneming
            (lid 2, punt a).
        - name: aanvraag_bevat_beschrijving_project_met_start_en_einddatum
          type: boolean
          required: false
          description: >-
            De steunaanvraag bevat een beschrijving van het project of de
            activiteit, met inbegrip van de start- en einddatum (lid 2, punt b).
        - name: aanvraag_bevat_plaats_project
          type: boolean
          required: false
          description: >-
            De steunaanvraag bevat de plaats van het project of de activiteit
            (lid 2, punt c).
        - name: aanvraag_bevat_lijst_in_aanmerking_komende_kosten
          type: boolean
          required: false
          description: >-
            De steunaanvraag bevat een lijst van de in aanmerking komende kosten
            (lid 2, punt d).
        - name: aanvraag_bevat_soort_en_bedrag_overheidsfinanciering
          type: boolean
          required: false
          description: >-
            De steunaanvraag bevat het soort overheidsfinanciering (subsidie,
            lening, garantie, terugbetaalbaar voorschot of een andere vorm) en het
            bedrag daarvan die nodig zijn voor het project of de activiteit
            (lid 2, punt e).
        - name: is_adhocsteun
          type: boolean
          required: false
          description: >-
            De steun is ad-hocsteun (niet op grond van een steunregeling
            toegekend); relevant voor de aanvullende eis van lid 3 aan grote
            ondernemingen.
        - name: lidstaat_vergewist_documentatie_stimulerend_effect
          type: boolean
          required: false
          description: >-
            Alleen bij ad-hocsteun voor grote ondernemingen: de lidstaat heeft
            zich er vóór toekenning van vergewist dat uit door de begunstigde
            opgestelde documentatie blijkt dat de steun leidt tot een of meer van
            lid 3, punten a-d (wezenlijke toename van reikwijdte, besteed bedrag
            of snelheid, dan wel dat het project zonder de steun niet of
