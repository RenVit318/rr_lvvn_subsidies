        accepted: false
    execution:
      parameters:
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun voor het onderzoeks- en ontwikkelingsproject, per
            project (zoals artikel 4, lid 1, punt i, de drempel meet).
        - name: steunintensiteit_pct
          type: number
          required: true
          description: >-
            Voorgenomen steunintensiteit in procenten van de in aanmerking
            komende kosten (lid 10).
        - name: project_van_algemeen_belang_voor_sector
          type: boolean
          required: true
          description: >-
            Het gesteunde project is van algemeen belang voor alle ondernemingen
