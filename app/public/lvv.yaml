            artikel 3). Artikel 4 kent voor artikel 24 geen aanmeldingsdrempel.
      output:
        - name: voldoet_aan_voorwaarden_art_24
          type: boolean
          description: >-
            De steun voor afzetbevorderingsmaatregelen voor landbouwproducten
            voldoet aan artikel 24 en aan hoofdstuk I van deze verordening
            (lid 1).
      actions:
        - output: voldoet_aan_voorwaarden_art_24
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 2: "De steun dient voor de financiering van de kosten van:
              # a) het organiseren van en deelnemen aan wedstrijden,
              # handelsbeurzen en tentoonstellingen; b) publicaties om
              # landbouwproducten beter bekend te maken bij het brede publiek."
              - operation: OR
                conditions:
                  - $betreft_wedstrijden_beurzen_tentoonstellingen
                  - $betreft_publicaties_brede_publiek
              # lid 3: "In de in lid 2, punt b), bedoelde publicaties mag niet
              # worden verwezen naar een specifieke onderneming, merknaam of
              # oorsprong. De eerste alinea is evenwel niet van toepassing op
              # een verwijzing naar de oorsprong van landbouwproducten die
              # vallen onder [kwaliteitsregelingen]"
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $betreft_publicaties_brede_publiek
                      value: true
                    then:
                      operation: OR
                      conditions:
                        - operation: NOT
                          value: $publicatie_verwijst_naar_onderneming_merknaam_of_oorsprong
                        - operation: EQUALS
                          subject: $oorsprongsverwijzing_valt_onder_toegestane_uitzondering
                          value: true
                default: true
              # leden 4 en 5: "De steun dekt de volgende in aanmerking komende
              # kosten ..." / "De steun geldt voor de volgende in aanmerking
              # komende kosten ..." (tussenstand, zie untranslatable)
              - $kosten_binnen_in_aanmerking_komende_categorieen
              # lid 4, punt e): "symbolische prijzen tot een waarde van
              # 3 000 EUR per prijs en per winnaar van een wedstrijd"
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $omvat_symbolische_prijzen
                      value: true
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $hoogste_waarde_symbolische_prijs
                      value: 300000
                default: true
              # lid 6, eerste alinea: "De steun wordt verleend in een van de
              # hierna genoemde vormen: a) in natura; b) als vergoeding van de
              # kosten die de begunstigde werkelijk heeft gemaakt; c) met
              # betrekking tot steun voor symbolische prijzen, ook in cash."
              - operation: OR
                conditions:
                  - $steun_in_natura
                  - $steun_als_vergoeding_werkelijke_kosten
                  - operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $steun_in_cash_voor_symbolische_prijzen
                        value: true
                      - $omvat_symbolische_prijzen
              # lid 6, tweede alinea: "Wanneer de steun in natura wordt
              # verleend, gebeurt dat in de vorm van een gesubsidieerde dienst."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steun_in_natura
                      value: true
                    then:
                      operation: EQUALS
                      subject: $steunvorm
                      value: GESUBSIDIEERDE_DIENST
                default: true
              # lid 6, vierde alinea: "De steun voor symbolische prijzen ...
              # wordt slechts aan de aanbieder van de afzetbevorderingsmaatregelen
              # betaald als de prijs werkelijk is uitgereikt en na voorlegging
              # van een bewijs van die uitreiking."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $omvat_symbolische_prijzen
                      value: true
                    then:
                      operation: EQUALS
                      subject: $symbolische_prijs_uitgereikt_met_bewijs
                      value: true
                default: true
              # lid 7, eerste alinea: "De steun voor afzetbevorderingsmaatregelen
              # is onder objectief vastgestelde voorwaarden toegankelijk voor
              # alle ondernemingen die daarvoor in het betrokken gebied in
              # aanmerking komen."
              - $toegankelijk_onder_objectieve_voorwaarden
              # lid 7, tweede alinea: "mag lidmaatschap van die groeperingen of
              # organisaties geen voorwaarde voor deelname zijn. Eventuele
              # bijdragen van niet-leden in de administratiekosten ... zijn
              # beperkt tot de kosten van de uitvoering van de
              # afzetbevorderingsmaatregelen."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $verricht_door_producentengroepering_of_organisatie
                      value: true
                    then:
                      operation: AND
                      conditions:
                        - operation: NOT
                          value: $lidmaatschap_is_toegangsvoorwaarde
                        - operation: EQUALS
                          subject: $bijdragen_niet_leden_beperkt_tot_uitvoeringskosten
                          value: true
                default: true
              # lid 8: "De steunintensiteit bedraagt ten hoogste 100 % van de in
              # aanmerking komende kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '24'
- number: '25'
  text: |-
    Steun voor het herstel van schade als gevolg van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld

    1.    Steun voor het herstel van schade als gevolg van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, is verenigbaar met de interne markt in de zin van artikel 107, lid 3, punt c), van het Verdrag en vrijgesteld van de aanmeldingsverplichting van artikel 108, lid 3, van het Verdrag als wordt voldaan aan dit artikel en aan hoofdstuk I van deze verordening.

    ▼B
    2.    Voor steun voor het herstel van schade als gevolg van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, gelden de volgende cumulatieve voorwaarden:

    a) de bevoegde autoriteit van de lidstaat heeft de gebeurtenis formeel erkend als ongunstige weersomstandigheid die met een natuurramp kan worden gelijkgesteld;

    b) er is een rechtstreeks oorzakelijk verband tussen de ongunstige weersomstandigheid die met een natuurramp kan worden gelijkgesteld, en de schade die de onderneming heeft geleden.

    3.    Zo nodig kunnen de lidstaten vooraf criteria vaststellen op basis waarvan de in lid 2, punt a), bedoelde formele erkenning wordt geacht te zijn verleend.

    4.    De steun moet rechtstreeks aan de betrokken onderneming worden betaald of aan een producentengroepering of -organisatie waarvan de onderneming lid is.

    Wanneer de steun aan een producentengroepering of -organisatie wordt betaald, mag het steunbedrag niet hoger zijn dan het steunbedrag waarvoor die onderneming in aanmerking komt.

    5.   Steunregelingen in verband met ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, worden ingesteld binnen drie jaar na de datum waarop die ongunstige weersomstandigheden zich hebben voorgedaan, en de steun wordt binnen vier jaar na die datum betaald.

    6.    In aanmerking komen de kosten van schade die een rechtstreeks gevolg is van de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, zoals getaxeerd door een openbare autoriteit, een door de steunverlenende autoriteit erkende onafhankelijke deskundige of een verzekeringsonderneming.

    7.   De schade als gevolg van ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, wordt berekend op het niveau van de individuele begunstigde. De steun kan betrekking hebben op:

    a) het in lid 8 bedoelde inkomensverlies als gevolg van de volledige of gedeeltelijke vernietiging van de landbouwproductie en de productiemiddelen;

    b) de in lid 9 bedoelde materiële schade.

    8.     Het inkomensverlies wordt berekend door:

    a) de hoeveelheid landbouwproducten die is geproduceerd in het jaar waarin de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, zich hebben voorgedaan, of die is geproduceerd in elk volgend jaar waarin de weerslag van de volledige of gedeeltelijke vernietiging van de productiemiddelen voelbaar was, vermenigvuldigd met de in dat jaar verkregen gemiddelde verkoopprijs,

    af te trekken van:

    b) de gemiddelde jaarlijkse hoeveelheid landbouwproducten die is geproduceerd in de drie jaren voorafgaand aan de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, of het gemiddelde van drie van de vijf jaren voorafgaand aan de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, de hoogste en de laagste productie niet meegerekend, vermenigvuldigd met de gemiddelde verkregen verkoopprijs.

    ▼B Wanneer een kmo minder dan drie jaar vóór de datum van de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, is opgericht, moet de verwijzing naar de periode van drie jaar in lid 8, punt b), worden begrepen als een verwijzing naar de hoeveelheid die wordt geproduceerd en verkocht door een gemiddelde onderneming van dezelfde omvang als de aanvrager, namelijk een micro-onderneming, een kleine onderneming of een middelgrote onderneming, in de nationale of regionale sector die getroffen is door de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld.

    Het inkomensverlies kan worden berekend hetzij op het niveau van de jaarlijkse landbouwproductie, hetzij op het niveau van de gewassen of de veestapel.

    Het inkomensverlies kan worden verhoogd met andere kosten die de begunstigde heeft gemaakt wegens de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld.

    Het inkomensverlies wordt verlaagd met de kosten die als gevolg van de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, niet zijn gemaakt.

    Voor de berekening van de landbouwproductie van de begunstigde mogen indexen worden gebruikt op voorwaarde dat de toegepaste berekeningsmethode het mogelijk maakt het reële verlies van de begunstigde in het betrokken jaar te bepalen.

    9.    De materiële schade aan activa zoals landbouwbedrijfsgebouwen, uitrusting en machines, voorraden en productiemiddelen die is veroorzaakt door ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld, wordt berekend op basis van de reparatiekosten of de economische waarde van de betrokken activa vóór de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld.

    Dat schadebedrag mag niet groter zijn dan de reparatiekosten of de daling van de billijke marktwaarde als gevolg van de ramp, dat wil zeggen het verschil tussen de waarde van de activa onmiddellijk vóór en onmiddellijk na de ongunstige weersomstandigheden die met een natuurramp kunnen worden gelijkgesteld.

    Als het in lid 8 bedoelde inkomensverlies van de begunstigde wordt berekend op het niveau van de gewassen of de veestapel, wordt alleen rekening gehouden met de materiële schade bij dat gewas of dat vee.

    10.     De steun wordt met minstens 50 % verminderd als hij wordt toegekend aan begunstigden die geen verzekering hebben afgesloten voor ten minste 50 % van hun gemiddelde jaarlijkse productie of van hun gemiddelde jaarlijkse productiegerelateerde inkomen en voor de verzekerbare klimaatrisico’s die statistisch het vaakst in de betrokken lidstaat of regio voorkomen.

    11.    De steun en eventuele andere betalingen ter compensatie van de verliezen, waaronder betalingen op grond van andere nationale of uniale maatregelen of in het kader van een verzekeringspolis, bedragen niet meer dan 80 % van de in aanmerking komende kosten.

    In gebieden met natuurlijke beperkingen mag de steunintensiteit tot hoogstens 90 % worden verhoogd.

    ▼B
  url: https://eur-lex.europa.eu/legal-content/NL/TXT/?uri=CELEX:02022R2472-20231213#art_25
  machine_readable:
    endpoint: voldoet_aan_voorwaarden_art_25
    untranslatables:
      - construct: berekening van het inkomensverlies en de materiële schade (leden 7 t/m 9)
        reason: >-
          De schadeberekening op het niveau van de individuele begunstigde
          (lid 7) vergt meerjarige gemiddelden waarbij de hoogste en de laagste
          productie buiten beschouwing kunnen blijven, een
          referentieonderneming voor kmo's die minder dan drie jaar vóór de
          gebeurtenis zijn opgericht, verhogingen en verlagingen met
          samenhangende kosten, indexen (lid 8) en waardering van materiële
          schade op reparatiekosten dan wel economische waarde vóór de
          gebeurtenis, begrensd door de daling van de billijke marktwaarde
          (lid 9). Dat is aggregatie over verzamelingen en open beoordeling,
          niet uitdrukbaar in de beschikbare operaties. De voorwaardentoets
          gebruikt de uitkomsten als parameters (subsidiabele_kosten,
          steunbedrag_waarvoor_onderneming_in_aanmerking_komt).
        suggestion: >-
          Verdieping per schadecomponent (inkomensverlies lid 8, materiële
          schade lid 9) zodra taxatiegegevens als gestructureerde invoer
          beschikbaar zijn.
        legal_text_excerpt: >-
          Het inkomensverlies wordt berekend door: a) de hoeveelheid
          landbouwproducten die is geproduceerd in het jaar waarin de ongunstige
          weersomstandigheden ... zich hebben voorgedaan ... af te trekken van:
          b) de gemiddelde jaarlijkse hoeveelheid landbouwproducten die is
          geproduceerd in de drie jaren voorafgaand aan de ongunstige
          weersomstandigheden ... de hoogste en de laagste productie niet
          meegerekend ...
        accepted: false
    execution:
      parameters:
        - name: weersomstandigheid_formeel_erkend
          type: boolean
          required: true
          description: >-
            De bevoegde autoriteit van de lidstaat heeft de gebeurtenis formeel
            erkend als ongunstige weersomstandigheid die met een natuurramp kan
            worden gelijkgesteld (lid 2, punt a). De erkenning kan ingevolge
            lid 3 ook geacht zijn te zijn verleend op basis van vooraf door de
            lidstaat vastgestelde criteria.
        - name: rechtstreeks_oorzakelijk_verband_weersomstandigheid_schade
          type: boolean
          required: true
          description: >-
            Er is een rechtstreeks oorzakelijk verband tussen de ongunstige
            weersomstandigheid die met een natuurramp kan worden gelijkgesteld,
            en de schade die de onderneming heeft geleden (lid 2, punt b).
        - name: steun_rechtstreeks_aan_onderneming_betaald
          type: boolean
          required: true
          description: >-
            De steun wordt rechtstreeks aan de betrokken onderneming betaald
            (lid 4, eerste alinea).
        - name: steun_betaald_aan_producentengroepering_waarvan_onderneming_lid
          type: boolean
          required: true
          description: >-
            De steun wordt betaald aan een producentengroepering of -organisatie
            waarvan de onderneming lid is (lid 4, eerste alinea).
        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steunbedrag voor de onderneming ter zake van de
            ongunstige weersomstandigheid.
        - name: steunbedrag_waarvoor_onderneming_in_aanmerking_komt
          type: amount
          required: false
          type_spec:
            unit: eurocent
          description: >-
            Het steunbedrag waarvoor de betrokken onderneming in aanmerking komt
            (lid 4, tweede alinea); volgt uit de schadeberekening van de leden
            7 t/m 9 — verdieping gepland. Alleen relevant wanneer de steun aan
            een producentengroepering of -organisatie wordt betaald.
        - name: datum_weersomstandigheid
          type: date
          required: true
          description: >-
            De datum waarop de ongunstige weersomstandigheden die met een
            natuurramp kunnen worden gelijkgesteld, zich hebben voorgedaan
            (lid 5).
        - name: datum_instelling_steunregeling
          type: date
          required: true
          description: De datum waarop de steunregeling wordt ingesteld (lid 5).
        - name: datum_betaling_steun
          type: date
          required: true
          description: >-
            De (voorgenomen) datum waarop de steun wordt betaald (lid 5).
        - name: schade_getaxeerd_door_bevoegde_taxateur
          type: boolean
          required: true
          description: >-
            De kosten van de schade zijn getaxeerd door een openbare autoriteit,
            een door de steunverlenende autoriteit erkende onafhankelijke
            deskundige of een verzekeringsonderneming (lid 6).
        - name: subsidiabele_kosten
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            De kosten van schade die een rechtstreeks gevolg is van de
            ongunstige weersomstandigheden, zoals getaxeerd (lid 6); de
            berekening zelf (leden 7 t/m 9) is untranslatable.
        - name: verzekering_dekt_minstens_50_pct
          type: boolean
          required: true
          description: >-
            De begunstigde heeft een verzekering afgesloten voor ten minste 50 %
            van zijn gemiddelde jaarlijkse productie of van zijn gemiddelde
            jaarlijkse productiegerelateerde inkomen en voor de verzekerbare
            klimaatrisico's die statistisch het vaakst in de betrokken lidstaat
            of regio voorkomen (lid 10).
        - name: steun_met_minstens_50_pct_verminderd
          type: boolean
          required: false
          description: >-
            De steun wordt met minstens 50 % verminderd (lid 10). Alleen
            relevant wanneer de begunstigde niet de in lid 10 bedoelde
            verzekering heeft afgesloten.
        - name: totale_compensatie_inclusief_verzekering
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            De steun en eventuele andere betalingen ter compensatie van de
            verliezen, waaronder betalingen op grond van andere nationale of
            uniale maatregelen of in het kader van een verzekeringspolis,
            tezamen (lid 11).
        - name: in_gebied_met_natuurlijke_beperkingen
          type: boolean
          required: true
          description: >-
            De steun betreft een gebied met natuurlijke beperkingen (lid 11,
            tweede alinea).
        - name: actief_in_primaire_landbouwproductie
          type: boolean
          required: true
          description: >-
            Begunstigde is actief in de primaire landbouwproductie (artikel 1,
            lid 1, punt a, i: artikel 25 is alleen van toepassing op kmo's die in
            de primaire landbouwproductie actief zijn; handhaving van die
            artikel-afhankelijke beperking ligt bij dit artikel, zie
            untranslatable bij artikel 1)
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
            artikel 3). Artikel 4 kent voor artikel 25 geen aanmeldingsdrempel.
        # artikel 1, lid 1, punt a, i: alleen kmo's die in de primaire
        # landbouwproductie actief zijn; handhaving van die artikel-afhankelijke
        # beperking ligt bij dit artikel (zie untranslatable bij artikel 1)
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: De begunstigde is een kleine, middelgrote of micro-onderneming (Bijlage I)
      output:
        - name: totale_compensatie_maal_honderd
          type: number
          description: >-
            Rekentussenstap voor lid 11: de totale compensatie vermenigvuldigd
            met 100, zodat de procentuele grens in gehele getallen kan worden
            getoetst.
        - name: voldoet_aan_voorwaarden_art_25
          type: boolean
          description: >-
            De steun voor het herstel van schade als gevolg van ongunstige
            weersomstandigheden die met een natuurramp kunnen worden
            gelijkgesteld, voldoet aan artikel 25 en aan hoofdstuk I van deze
            verordening (lid 1).
      actions:
        # Rekentussenstap voor lid 11 (compensatie x 100 <= kosten x maximumpct)
        - output: totale_compensatie_maal_honderd
          value:
            operation: MULTIPLY
            values:
              - $totale_compensatie_inclusief_verzekering
              - 100
        - output: voldoet_aan_voorwaarden_art_25
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I van
              # deze verordening"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # artikel 1, lid 1, punt a, i: "alleen van toepassing ... op kmo's
              # die in de primaire landbouwproductie actief zijn" (handhaving
              # bij dit artikel)
              - $is_kmo
              - $actief_in_primaire_landbouwproductie
              # lid 2, punt a: "de bevoegde autoriteit van de lidstaat heeft de
              # gebeurtenis formeel erkend als ongunstige weersomstandigheid die
              # met een natuurramp kan worden gelijkgesteld"
              - $weersomstandigheid_formeel_erkend
              # lid 2, punt b: "er is een rechtstreeks oorzakelijk verband
              # tussen de ongunstige weersomstandigheid ... en de schade die de
              # onderneming heeft geleden"
              - $rechtstreeks_oorzakelijk_verband_weersomstandigheid_schade
              # lid 4, eerste alinea: "De steun moet rechtstreeks aan de
              # betrokken onderneming worden betaald of aan een
              # producentengroepering of -organisatie waarvan de onderneming
              # lid is."
              - operation: OR
                conditions:
                  - $steun_rechtstreeks_aan_onderneming_betaald
                  - $steun_betaald_aan_producentengroepering_waarvan_onderneming_lid
              # lid 4, tweede alinea: "Wanneer de steun aan een
              # producentengroepering of -organisatie wordt betaald, mag het
              # steunbedrag niet hoger zijn dan het steunbedrag waarvoor die
              # onderneming in aanmerking komt."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $steun_betaald_aan_producentengroepering_waarvan_onderneming_lid
                      value: true
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $steunbedrag
                      value: $steunbedrag_waarvoor_onderneming_in_aanmerking_komt
                default: true
              # lid 5: "Steunregelingen ... worden ingesteld binnen drie jaar na
              # de datum waarop die ongunstige weersomstandigheden zich hebben
              # voorgedaan"
              - operation: LESS_THAN_OR_EQUAL
                subject: $datum_instelling_steunregeling
                value:
                  operation: DATE_ADD
                  date: $datum_weersomstandigheid
                  years: 3
              # lid 5: "en de steun wordt binnen vier jaar na die datum betaald"
              - operation: LESS_THAN_OR_EQUAL
                subject: $datum_betaling_steun
                value:
                  operation: DATE_ADD
                  date: $datum_weersomstandigheid
                  years: 4
              # lid 6: "In aanmerking komen de kosten van schade ... zoals
              # getaxeerd door een openbare autoriteit, een door de
              # steunverlenende autoriteit erkende onafhankelijke deskundige of
              # een verzekeringsonderneming."
              - $schade_getaxeerd_door_bevoegde_taxateur
              # lid 10: "De steun wordt met minstens 50 % verminderd als hij
              # wordt toegekend aan begunstigden die geen verzekering hebben
              # afgesloten voor ten minste 50 % van hun gemiddelde jaarlijkse
              # productie ..."
              - operation: OR
                conditions:
                  - $verzekering_dekt_minstens_50_pct
                  - operation: EQUALS
                    subject: $steun_met_minstens_50_pct_verminderd
                    value: true
              # lid 11: "De steun en eventuele andere betalingen ter compensatie
              # van de verliezen ... bedragen niet meer dan 80 % van de in
              # aanmerking komende kosten. In gebieden met natuurlijke
              # beperkingen mag de steunintensiteit tot hoogstens 90 % worden
