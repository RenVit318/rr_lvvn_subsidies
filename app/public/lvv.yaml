        - name: steunbedrag
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            Voorgenomen steun (gedeeld vocabulaire; lid 8 beperkt de steun tot
            ten hoogste 100 % van de in aanmerking komende kosten).
        - name: subsidiabele_kosten
          type: amount
          required: true
          type_spec:
            unit: eurocent
          description: >-
            De in aanmerking komende kosten van de verrichtingen van lid 7
            (gedeeld vocabulaire).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            Hoofdstuk I is nageleefd (artikel 3); lid 1 eist "als wordt voldaan
            aan dit artikel en aan hoofdstuk I van deze verordening".
      output:
        - name: voldoet_aan_voorwaarden_art_30
          type: boolean
          description: >-
            De voorgenomen steun voor de instandhouding van genetische
            hulpbronnen in de landbouw voldoet aan de voorwaarden van artikel 30
            en aan hoofdstuk I (artikel 4 kent voor artikel 30 geen
            aanmeldingsdrempel).
      actions:
        - output: voldoet_aan_voorwaarden_art_30
          value:
            operation: AND
            conditions:
              # lid 1: "als wordt voldaan aan dit artikel en aan hoofdstuk I"
              - $voldoet_aan_gemeenschappelijke_voorwaarden
              # lid 1: "in het kader van agromilieuklimaatverbintenissen"
