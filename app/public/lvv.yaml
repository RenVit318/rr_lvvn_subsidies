        - name: invloedhebbende_ondernemingen_hebben_preferente_toegang
          type: boolean
          required: true
          description: >-
            Ondernemingen die invloed op de organisatie voor onderzoek en/of
            kennisverspreiding kunnen uitoefenen, bijvoorbeeld als aandeelhouders
            of leden, genieten preferente toegang tot de onderzoekscapaciteit van
            de organisatie of tot de door haar gegenereerde onderzoeksresultaten
            (lid 9; dit is verboden).
      input:
        - name: voldoet_aan_gemeenschappelijke_voorwaarden
          type: boolean
          source:
            output: voldoet_aan_gemeenschappelijke_voorwaarden
          description: >-
            De steun voldoet aan hoofdstuk I van deze verordening (lid 1, via
