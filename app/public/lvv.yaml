          De hoofdregel (eerste periode van vijf tot zeven jaar) kent
          uitzonderingen die een beoordeling vergen: langer "om bepaalde
          nagestreefde milieuvoordelen te bereiken of te behouden", korter (ten
          minste één jaar) bij omschakeling of bij nieuwe
          voortzettingsverbintenissen die onmiddellijk aansluiten.
        legal_text_excerpt: >-
          De in lid 3 bedoelde verbintenissen worden uitgevoerd in een eerste
