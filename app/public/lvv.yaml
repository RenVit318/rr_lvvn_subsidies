        legal_text_excerpt: >-
          b) de formele erkenning door de bevoegde autoriteiten van de betrokken
          lidstaat dat de overeenkomstig Verordening (EU) 2016/2031 genomen
          maatregelen om een plantenplaag te bestrijden, uit te roeien of in te
