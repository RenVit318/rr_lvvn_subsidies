        accepted: false
    execution:
      parameters:
        # lid 2, punt a
        - name: steun_in_kader_strategisch_glb_plan
          type: boolean
          required: true
          description: >-
            De steun wordt in het kader van een strategisch GLB-plan
            overeenkomstig Verordening (EU) 2021/2115 verleend als uit het
            Elfpo gecofinancierde steun of als aanvullende nationale
            financiering daarbij (lid 2, punt a)
        # lid 2, punt b
        - name: steun_identiek_aan_glb_plan_maatregel
          type: boolean
          required: true
          description: >-
            De steun is identiek aan de desbetreffende maatregel van het
            strategisch GLB-plan (lid 2, punt b)
        # lid 3: "ten minste twee actoren"
        - name: aantal_betrokken_actoren
          type: number
