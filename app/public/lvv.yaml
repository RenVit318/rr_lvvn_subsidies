              - $samenwerking_draagt_bij_aan_doelstellingen_art_6_vo_2021_2115
              # lid 3: "Bij de onder dit artikel vallende vormen van
              # samenwerking zijn ten minste twee actoren betrokken"
              - operation: GREATER_THAN_OR_EQUAL
                subject: $aantal_betrokken_actoren
                value: 2
              # lid 3, tweede zin: "De samenwerking moet echter vooral ten goede
              # komen aan de bosbouwsector of de bosbouw- en landbouwsector."
              - $samenwerking_komt_vooral_ten_goede_aan_bosbouwsector
              # lid 4: "De volgende vormen van samenwerking komen in aanmerking:
              # a) samenwerking tussen verschillende ondernemingen in de
              # bosbouwsector en andere in de landbouw- en bosbouwsector actieve
              # actoren ... b) de oprichting van clusters en netwerken."
              - operation: IN
                subject: $vorm_van_samenwerking
                values:
                  - SAMENWERKING_TUSSEN_ONDERNEMINGEN_EN_ACTOREN
                  - OPRICHTING_CLUSTERS_EN_NETWERKEN
              # lid 5: "Voor samenwerking waarbij uitsluitend
              # onderzoeksinstellingen zijn betrokken, mag geen steun worden
              # verleend."
              - operation: NOT
                value: $uitsluitend_onderzoeksinstellingen_betrokken
              # lid 7: "De steun mag alleen worden verleend voor nieuwe
              # samenwerkingsvormen, met inbegrip van bestaande
              # samenwerkingsvormen indien een nieuwe activiteit wordt
              # opgestart."
              - $nieuwe_samenwerkingsvorm_of_nieuwe_activiteit
              # lid 8: "Steun voor de oprichting en ontwikkeling van korte
              # toeleveringsketens, als bedoeld in lid 6, punten d) en e), mag
              # slechts betrekking hebben op toeleveringsketens waarbij er
              # tussen de bosbezitter of bosbeheerder en de consument hoogstens
              # één intermediair is."
              - operation: IF
                cases:
                  - when:
                      operation: EQUALS
                      subject: $betreft_korte_toeleveringsketen
                      value: true
                    then:
                      operation: LESS_THAN_OR_EQUAL
                      subject: $aantal_intermediairs_tussen_bosbezitter_en_consument
                      value: 1
                default: true
              # lid 11: "De steun wordt gedurende ten hoogste zeven jaar
              # verleend."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunduur_jaren
                value: 7
              # lid 12: "De steun bedraagt ten hoogste 100 % van de in
              # aanmerking komende kosten."
              - operation: LESS_THAN_OR_EQUAL
                subject: $steunintensiteit_pct
                value: 100
