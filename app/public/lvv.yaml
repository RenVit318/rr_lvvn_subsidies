        - name: gemeente_jaarbegroting
          type: amount
          required: false
          type_spec:
            unit: eurocent
          description: >-
            Jaarlijkse begroting van de gemeente (lid 3, slotalinea: de
            lid-3-vereisten gelden niet bij een begroting van minder dan
            10 miljoen EUR en minder dan 5 000 inwoners).
        - name: gemeente_aantal_inwoners
          type: number
          required: false
          description: Aantal inwoners van de gemeente (lid 3, slotalinea).
        - name: steunvorm
          type: string
          required: false
          description: >-
            Vorm waarin de steun wordt verleend (gedeeld vocabulaire, zie
            artikel 5); hier relevant voor de afwijking van lid 4 voor
            maatregelen in de vorm van belastingvoordelen (FISCAAL_VOORDEEL).
        - name: recht_op_steun_volgens_objectieve_criteria_zonder_beoordelingsbevoegdheid
          type: boolean
          required: false
          description: >-
            De maatregel of steunregeling geeft overeenkomstig objectieve
            criteria recht op steun zonder dat de lidstaat nog een
            beoordelingsbevoegdheid uitoefent (lid 4, punt a en lid 5, punt a, i).
        - name: maatregel_goedgekeurd_en_in_werking_voor_aanvang_werkzaamheden
          type: boolean
          required: false
          description: >-
            De maatregel is goedgekeurd en in werking getreden voordat de
            werkzaamheden in het kader van het gesteunde project of de gesteunde
            activiteit zijn gestart (lid 4, punt b).
        - name: is_fiscale_vervolgregeling_activiteit_viel_onder_vroegere_regeling
          type: boolean
          required: false
          description: >-
            De maatregel is een fiscale vervolgregeling en de activiteit viel al
            onder de vroegere regelingen in de vorm van belastingvoordelen
            (uitzondering op lid 4, punt b).
        - name: steun_artikel
          type: string
          required: false
          description: >-
            Nummer van het LVV-artikel (hoofdstuk III) waarop de voorgenomen
            steun is gebaseerd, als string (bijv. '25'); bepaalt of een van de
            categorieën van lid 5 van toepassing is.
        - name: voldoet_aan_voorwaarden_steunartikel
          type: boolean
          required: false
          description: >-
            Gemarkeerde tussenstand: aan de voorwaarden van het in steun_artikel
            bedoelde artikel is voldaan ("mits aan artikel X is voldaan", lid 5).
            Overeenkomt met het endpoint voldoet_aan_voorwaarden_art_<N> van dat
            artikel; niet als binding gemodelleerd wegens circulariteit met de
            gemeenschappelijke poort. Voor lid 5, punt f betreft het alleen
            artikel 27, lid 2, punten c-f en artikel 28, lid 3, punt d; voor
            punt c alleen artikel 24, lid 2, punt b.
        - name: regeling_goedgekeurd_en_in_werking_voor_kosten_gemaakt
          type: boolean
          required: false
          description: >-
            De steunregeling is goedgekeurd en in werking getreden voordat de
            begunstigde de in aanmerking komende kosten op grond van artikel 15
            of artikel 53 heeft gemaakt (lid 5, punt a, ii).
        - name: informatie_beschikbaar_voor_onbepaald_aantal_begunstigden
          type: boolean
          required: false
          description: >-
            Bij voorlichtingsacties (artikelen 21, 22, 47 en 48): de informatie
            wordt ter beschikking gesteld aan een onbepaald aantal begunstigden
            (lid 5, punten b en m).
        - name: is_publicatie_om_producten_bekend_te_maken_bij_breed_publiek
          type: boolean
          required: false
          description: >-
            Bij afzetbevorderingsmaatregelen (artikel 24): de steun betreft
            publicaties om landbouwproducten beter bekend te maken bij het brede
            publiek (lid 5, punt c).
      input:
        - name: is_kmo
          type: boolean
          source:
            output: is_kmo
          description: >-
            De begunstigde onderneming is een kmo (Bijlage I); lid 3 stelt zijn
            aanvullende eis alleen aan ad-hocsteun voor grote ondernemingen.
      output:
        - name: heeft_stimulerend_effect
          type: boolean
          description: >-
            De steun heeft een stimulerend effect in de zin van artikel 6, dan wel
            wordt geacht dat te hebben of hoeft dat niet te hebben (leden 2-5).
            Deze verordening is uitsluitend van toepassing op steun die een
            stimulerend effect heeft (lid 1).
      actions:
        # Lid 2: schriftelijke aanvraag vóór aanvang van de werkzaamheden, met de
        # minimaal vereiste inhoud (punten a-e).
        - output: voldoet_aan_lid_2
          value:
            operation: AND
            conditions:
              - operation: EQUALS
                subject: $aanvraag_voor_aanvang_werkzaamheden
                value: true
              - operation: EQUALS
                subject: $aanvraag_is_schriftelijk
                value: true
              - operation: EQUALS
                subject: $aanvraag_bevat_naam_en_omvang_onderneming
                value: true
              - operation: EQUALS
                subject: $aanvraag_bevat_beschrijving_project_met_start_en_einddatum
                value: true
              - operation: EQUALS
                subject: $aanvraag_bevat_plaats_project
                value: true
              - operation: EQUALS
                subject: $aanvraag_bevat_lijst_in_aanmerking_komende_kosten
                value: true
              - operation: EQUALS
                subject: $aanvraag_bevat_soort_en_bedrag_overheidsfinanciering
                value: true
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '6'
            paragraph: '2'
        # Lid 3: bij ad-hocsteun voor grote ondernemingen geldt bovenop lid 2 de
        # vergewisplicht, behalve voor kleine autonome gemeenten.
        - output: voldoet_aan_lid_3_voor_zover_van_toepassing
          value:
            operation: OR
            conditions:
              - operation: NOT
                value:
                  operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $is_adhocsteun
                      value: true
                    - operation: NOT
                      value: $is_kmo
              - operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $is_gemeente_autonome_lokale_autoriteit
                    value: true
                  - operation: LESS_THAN
                    subject: $gemeente_jaarbegroting
                    value: 1000000000
                  - operation: LESS_THAN
                    subject: $gemeente_aantal_inwoners
                    value: 5000
              - operation: EQUALS
                subject: $lidstaat_vergewist_documentatie_stimulerend_effect
                value: true
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '6'
            paragraph: '3'
        # Lid 4: belastingvoordelen — beide voorwaarden a en b, waarbij b niet
        # geldt voor fiscale vervolgregelingen.
        - output: voldoet_aan_lid_4
          value:
            operation: AND
            conditions:
              - operation: EQUALS
                subject: $recht_op_steun_volgens_objectieve_criteria_zonder_beoordelingsbevoegdheid
                value: true
              - operation: OR
                conditions:
                  - operation: EQUALS
                    subject: $maatregel_goedgekeurd_en_in_werking_voor_aanvang_werkzaamheden
                    value: true
                  - operation: EQUALS
                    subject: $is_fiscale_vervolgregeling_activiteit_viel_onder_vroegere_regeling
                    value: true
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '6'
            paragraph: '4'
        # Lid 5: categorieën die geen stimulerend effect hoeven te hebben of
        # geacht worden dat te hebben — OR-takken zoals de tekst ze geeft.
        - output: valt_onder_lid_5
          value:
            operation: OR
            conditions:
              # a) ruilverkaveling (artikelen 15 en 53), onder i en ii
              - operation: AND
                conditions:
                  - operation: IN
                    subject: $steun_artikel
                    values: ['15', '53']
                  - operation: EQUALS
                    subject: $voldoet_aan_voorwaarden_steunartikel
                    value: true
                  - operation: EQUALS
                    subject: $recht_op_steun_volgens_objectieve_criteria_zonder_beoordelingsbevoegdheid
                    value: true
                  - operation: EQUALS
                    subject: $regeling_goedgekeurd_en_in_werking_voor_kosten_gemaakt
                    value: true
              # b) en m) voorlichtingsacties in de landbouw- (artikelen 21 en 22)
              #    en bosbouwsector (artikelen 47 en 48), informatie aan een
              #    onbepaald aantal begunstigden
              - operation: AND
                conditions:
                  - operation: IN
                    subject: $steun_artikel
                    values: ['21', '22', '47', '48']
                  - operation: EQUALS
                    subject: $voldoet_aan_voorwaarden_steunartikel
                    value: true
                  - operation: EQUALS
                    subject: $informatie_beschikbaar_voor_onbepaald_aantal_begunstigden
                    value: true
              # c) afzetbevordering via publicaties voor het brede publiek
              #    (artikel 24, lid 2, punt b)
              - operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $steun_artikel
                    value: '24'
                  - operation: EQUALS
                    subject: $voldoet_aan_voorwaarden_steunartikel
                    value: true
                  - operation: EQUALS
                    subject: $is_publicatie_om_producten_bekend_te_maken_bij_breed_publiek
                    value: true
              # h) Natura 2000 (artikel 33) — zonder "mits"-voorwaarde
              - operation: EQUALS
                subject: $steun_artikel
                value: '33'
              # d, e, f, g, i, j, k, l, n, o, p) categorieën met alleen een
              # "mits aan artikel X is voldaan"-voorwaarde:
              # 25 (weerschade), 26 (dierziekten/plantenplagen), 27 en 28
              # (gestorven dieren; punt f noemt artikel 27, lid 2, punten c-f,
              # én artikel 28, lid 3, punt d), 29 (beschermde dieren),
              # 36 (erfgoed), 37 (natuurrampen), 38 (O&O&I), 43 (herstel
              # bosschade), 51 (genetische hulpbronnen bosbouw), 58
              # (kwaliteitsregeling katoen/levensmiddelen), 39/40/60/61
              # (EIP- en CLLD-projecten)
              - operation: AND
                conditions:
                  - operation: IN
                    subject: $steun_artikel
                    values: ['25', '26', '27', '28', '29', '36', '37', '38',
                             '39', '40', '43', '51', '58', '60', '61']
                  - operation: EQUALS
                    subject: $voldoet_aan_voorwaarden_steunartikel
                    value: true
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '6'
            paragraph: '5'
        # Voorrangsorde: lid 5 wijkt af van de leden 2, 3 en 4; lid 4 wijkt af
        # van de leden 2 en 3 voor belastingvoordelen; anders gelden lid 2 en
        # (voor zover van toepassing) lid 3.
        - output: heeft_stimulerend_effect
          value:
            operation: IF
            cases:
              - when:
                  operation: EQUALS
                  subject: $valt_onder_lid_5
                  value: true
                then: true
              - when:
                  operation: EQUALS
                  subject: $steunvorm
                  value: FISCAAL_VOORDEEL
                then: $voldoet_aan_lid_4
            default:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $voldoet_aan_lid_2
                  value: true
                - operation: EQUALS
                  subject: $voldoet_aan_lid_3_voor_zover_van_toepassing
                  value: true
          legal_basis:
            law: landbouwvrijstellingsverordening
            article: '6'
- number: '7'
  text: |-
    **Steunintensiteit en in aanmerking komende kosten**

    1.    Alle bedragen die voor de berekening van de steunintensiteit en de in aanmerking komende kosten worden gebruikt, zijn bedragen vóór aftrek van belastingen of andere heffingen. De in aanmerking komende kosten worden gestaafd met bewijsstukken die duidelijk, specifiek en actueel zijn. De bedragen van de in aanmerking komende kosten kunnen worden berekend overeenkomstig de vereenvoudigde kostenopties die zijn vastgesteld in Verordening (EU) 2021/1060 en Verordening (EU) 2021/2115, mits de verrichting ten minste gedeeltelijk uit het Elfpo wordt gefinancierd en de kostencategorie in aanmerking komt overeenkomstig de desbetreffende vrijstellingsbepaling.

    2.    De steunbedragen voor de in de artikelen 31, 33, 34, 35, 41, 45 en 46 bedoelde maatregelen of soorten verrichtingen kunnen worden vastgesteld op basis van standaardveronderstellingen van extra kosten en gederfde inkomsten. In die gevallen zorgen de lidstaten ervoor dat de berekeningen en de overeenkomstige steun alleen verifieerbare elementen bevatten, gebaseerd zijn op met passende expertise vastgestelde bedragen, een duidelijke vermelding bevatten van de bron van de gebruikte bedragen, indien van toepassing gedifferentieerd zijn om rekening te houden met de regionale of lokale locatie en het feitelijke landgebruik, en geen elementen bevatten die verband houden met investeringskosten.

    3.    De belasting over de toegevoegde waarde (btw) komt niet voor steun in aanmerking, behalve wanneer zij niet terugvorderbaar is krachtens de nationale btw-wetgeving.

    4.   Wanneer steun in een andere vorm dan een subsidie wordt toegekend, is het steunbedrag het brutosubsidie-equivalent van de steun.

    5.   In de toekomst te betalen steun, met inbegrip van steun die in verschillende tranches wordt uitgekeerd, wordt gedisconteerd tot de waarde ervan op het tijdstip van de toekenning van de steun. De in aanmerking komende kosten worden gedisconteerd tot de waarde ervan op de datum van de toekenning van de steun. De rentevoet die voor de discontering wordt gehanteerd, is de disconteringsvoet die op de datum van de toekenning van de steun van toepassing is.

    6.   Wanneer steun wordt toegekend in de vorm van belastingvoordelen, worden de steuntranches gedisconteerd aan de hand van de disconteringspercentages die gelden op de verschillende tijdstippen waarop de belastingvoordelen beginnen te spelen.

    7.    Wanneer de steun wordt verleend in de vorm van terugbetaalbare voorschotten die, bij gebrek aan een geaccepteerde methode voor de berekening van het brutosubsidie-equivalent, worden uitgedrukt als een percentage van de in aanmerking komende kosten en wanneer de maatregel erin voorziet dat, in geval van een succesvolle uitkomst van het project als omschreven op basis van een redelijke en prudente hypothese, de voorschotten worden terugbetaald vermeerderd met een rente die ten minste gelijk is aan de op de datum van de toekenning van de steun toepasselijke disconteringsvoet, kunnen de in hoofdstuk III vastgestelde maximale steunintensiteiten worden verhoogd met tien procentpunten.

    ▼B
